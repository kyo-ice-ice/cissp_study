<style>
/* ============================================================
   CISSP 演習帳 — styles
   Palette: 藍 (indigo) = brand, 朱 (vermilion) = "mark this",
            松葉 (green) = mastered, 金 (gold) = milestone.
   Type: Mincho for display, system sans for UI, mono for data.
   ============================================================ */

:root{
  --ai:#5B8DEF; --ai-d:#3F6FD0; --ai-w:rgba(91,141,239,.14);
  --shu:#E8614C; --shu-w:rgba(232,97,76,.14);
  --matsu:#35B981; --matsu-w:rgba(53,185,129,.14);
  --kin:#E0A93F; --kin-w:rgba(224,169,63,.14);
  --on-matsu:#062016;

  --bg:#0D131B; --panel:#151E2A; --panel2:#1D2938; --panel3:#26364a;
  --line:#2A3B4F; --line2:#38506B;
  --text:#E9EFF6; --muted:#93A5BB; --dim:#6B7E95;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --ring:0 0 0 3px rgba(91,141,239,.35);

  --disp:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --r:14px; --r-s:10px; --r-l:20px;
  --tabh:60px;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);

  /* aliases consumed by imported textbook markup + svg.css */
  --surface:var(--panel); --surface-2:var(--panel2); --brand:var(--ai);
  --brand-weak:var(--ai-w); --accent:var(--matsu);
  --ok:var(--matsu); --ok-bg:var(--matsu-w); --ng:var(--shu); --ng-bg:var(--shu-w);
  --warn:var(--kin); --warn-bg:var(--kin-w); --radius:var(--r); --maxw:720px;
}
html[data-theme="light"]{
  --ai:#2C5FC4; --ai-d:#1E4AA5; --ai-w:rgba(44,95,196,.10);
  --shu:#C4402B; --shu-w:rgba(196,64,43,.10);
  --matsu:#177A52; --matsu-w:rgba(23,122,82,.11);
  --kin:#9C7014; --kin-w:rgba(156,112,20,.12);
  --on-matsu:#ffffff;

  --bg:#F1ECE2; --panel:#FFFCF7; --panel2:#F6F1E7; --panel3:#EAE3D5;
  --line:#DED5C4; --line2:#C9BEA8;
  --text:#1A2331; --muted:#5F6E82; --dim:#8494A6;
  --shadow:0 1px 2px rgba(60,50,35,.07), 0 6px 20px rgba(60,50,35,.08);
  --ring:0 0 0 3px rgba(44,95,196,.25);
}

*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  background:var(--bg);
  height:100%;
}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans);
  font-size:16px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  overflow-wrap:break-word;
  min-height:100%;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; touch-action:manipulation; color:inherit}
a{color:var(--ai); text-underline-offset:3px}
:focus-visible{outline:none; box-shadow:var(--ring); border-radius:8px}
::selection{background:var(--ai); color:#fff}

/* ---------------- shell ---------------- */
#app{min-height:100dvh}
@supports not (min-height:100dvh){ #app{min-height:100vh} }

.appbar{
  position:sticky; top:0; z-index:40;
  padding-top:var(--top);
  background:rgba(13,19,27,.86);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
html[data-theme="light"] .appbar{background:rgba(241,236,226,.88)}
.appbar-in{
  max-width:var(--maxw); margin:0 auto;
  height:52px; padding:0 12px;
  display:flex; align-items:center; gap:8px;
}
.appbar h1{
  font:600 17px/1.3 var(--sans); margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  letter-spacing:.01em;
}
.appbar .sub{font:500 11px/1 var(--sans); color:var(--muted); display:block; margin-top:3px; letter-spacing:.04em}
.iconbtn{
  width:40px; height:40px; flex:0 0 auto; display:grid; place-items:center;
  border-radius:11px; color:var(--muted); font-size:19px;
}
.iconbtn svg{width:22px; height:22px; display:block}
.iconbtn:active{background:var(--panel2)}
.iconbtn.wide{width:auto; padding:0 12px; font-size:14px; font-weight:600; gap:5px; display:flex; align-items:center}

main{max-width:var(--maxw); margin:0 auto; padding:0 14px calc(var(--tabh) + var(--bot) + 26px)}
main.full{padding-bottom:calc(var(--bot) + 26px)}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  padding-bottom:var(--bot);
  background:rgba(13,19,27,.92);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);
  backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);
  display:flex;
}
html[data-theme="light"] .tabbar{background:rgba(255,252,247,.94)}
.tabbar.hide{display:none}
.tabbar button{
  flex:1; height:var(--tabh); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;
  color:var(--dim); font-size:10px; font-weight:600; letter-spacing:.05em;
  position:relative;
}
.tabbar button .ti{line-height:0; transition:transform .18s}
.tabbar button .ti svg{width:23px; height:23px; display:block}
.tabbar button.on{color:var(--ai)}
.tabbar button.on .ti{transform:translateY(-1px)}
.tabbar button.on::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:2.5px; border-radius:0 0 3px 3px; background:var(--ai);
}
.tabbar .dot{
  position:absolute; top:8px; right:calc(50% - 20px);
  min-width:16px; height:16px; padding:0 4px; border-radius:9px;
  background:var(--shu); color:#fff; font:700 10px/16px var(--mono);
}

/* ---------------- primitives ---------------- */
.card{
  background:var(--panel); border:1px solid var(--line);
  border-radius:var(--r); padding:16px; margin:12px 0;
}
.card.tight{padding:13px}
h2.sec{
  font:600 13px/1 var(--sans); letter-spacing:.12em; color:var(--dim);
  margin:26px 2px 10px; text-transform:uppercase;
}
h2.sec:first-child{margin-top:18px}
.disp{font-family:var(--disp); font-weight:600; letter-spacing:.02em}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.mut{color:var(--muted)}
.dimt{color:var(--dim)}
.tiny{font-size:12.5px; line-height:1.6}
.center{text-align:center}
.row{display:flex; align-items:center; gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.stack{display:flex; flex-direction:column; gap:8px}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; padding:12px 18px; border-radius:var(--r);
  background:var(--ai); color:#fff; font-weight:700; font-size:16px;
  border:1px solid transparent; width:100%;
  transition:transform .1s, filter .15s;
}
.btn:active{transform:scale(.985); filter:brightness(.92)}
.btn.ghost{background:var(--panel); color:var(--text); border-color:var(--line)}
.btn.ghost:active{background:var(--panel2)}
.btn.quiet{background:transparent; color:var(--muted); border-color:var(--line); min-height:44px; font-size:14.5px}
.btn.danger{background:transparent; color:var(--shu); border-color:var(--shu)}
.btn.sm{min-height:40px; font-size:14px; padding:8px 14px; width:auto; border-radius:11px}
.btn[disabled]{opacity:.42; pointer-events:none}

.chips{display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:2px 14px 2px; margin:0 -14px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px; min-height:38px;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
  font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px;
}
.chip.on{background:var(--ai); border-color:var(--ai); color:#fff}
.chip.on .num{color:rgba(255,255,255,.82)}

.bar{height:7px; border-radius:5px; background:var(--panel3); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:5px; background:var(--ai);
  transition:width .5s cubic-bezier(.22,1,.36,1)}

.tagpill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font:700 11px/1.6 var(--sans); letter-spacing:.03em;
  background:var(--ai-w); color:var(--ai); border:1px solid transparent;
}
.tagpill.s{background:var(--shu-w); color:var(--shu)}
.tagpill.m{background:var(--matsu-w); color:var(--matsu)}
.tagpill.k{background:var(--kin-w); color:var(--kin)}
.tagpill.n{background:var(--panel2); color:var(--muted)}

.empty{padding:40px 20px; text-align:center; color:var(--dim)}
.empty .big{font-size:34px; margin-bottom:10px; opacity:.6}
.empty b{display:block; color:var(--muted); font-weight:600; margin-bottom:6px; font-size:15px}

/* list rows */
.list{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:12px 0}
.li{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:14px 15px; min-height:60px; text-align:left;
  border-bottom:1px solid var(--line); position:relative;
}
.li:last-child{border-bottom:0}
.li:active{background:var(--panel2)}
.li .lead{flex:1; min-width:0}
.li .t{font-weight:600; font-size:15.5px; line-height:1.45; display:block}
.li .s{font-size:12.5px; color:var(--dim); margin-top:2px; display:block; line-height:1.5}
.li .arw{color:var(--dim); font-size:16px; flex:0 0 auto}
.li .mk{
  flex:0 0 auto; width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  font:700 13px/1 var(--mono); background:var(--panel2); color:var(--muted);
}
.li .mk svg{width:18px; height:18px; display:block}
.qfoot .btn.icon svg{width:20px; height:20px}

/* ---------------- domain octagon (signature) ---------------- */
.octa-wrap{position:relative; display:grid; place-items:center; padding:2px 0 0}
.octa{width:min(178px,48vw); height:min(178px,48vw); display:block; overflow:visible}
.octa .seg{transition:opacity .15s}
.octa .fill{transform-origin:center}
.octa text{font-family:var(--mono); font-variant-numeric:tabular-nums}
.octa-c{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  pointer-events:none;
}
.octa-c .big{
  font:700 33px/1 var(--mono); letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.octa-c .cap{font:600 9.5px/1 var(--sans); letter-spacing:.14em; color:var(--dim); margin-top:8px}
.octa-c .cap2{font:500 12px/1.5 var(--sans); color:var(--muted); margin-top:7px}

.ringhint{font:500 10.5px/1.5 var(--sans); color:var(--dim); text-align:center; margin-top:8px}
.legend{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 10px; margin-top:14px}
.legend button{
  display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:9px;
  text-align:left; font-size:12.5px; min-height:40px; min-width:0;
}
.legend button:active{background:var(--panel2)}
.legend .swatch{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
.legend .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted)}
.legend .pc{font:700 12.5px var(--mono); font-variant-numeric:tabular-nums}

/* ---------------- today ---------------- */
.hero{
  background:linear-gradient(168deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid var(--line); border-radius:var(--r-l);
  padding:16px 16px 14px; margin:12px 0;
  display:flex; align-items:center; gap:14px;
}
.hero .info{flex:1; min-width:0}
.hero .top{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px}
.hero .top .ttl{flex:1; min-width:0}
.hero .top .ttl .d1{font:600 12px/1 var(--sans); letter-spacing:.14em; color:var(--dim)}
.hero .top .ttl .d2{font-family:var(--disp); font-size:18px; font-weight:600; margin-top:6px; display:block; line-height:1.45}
.countdown{
  text-align:right; flex:0 0 auto; padding:6px 10px; border-radius:11px;
  background:var(--panel3); border:1px solid var(--line);
}
.countdown .n{font:700 21px/1 var(--mono); font-variant-numeric:tabular-nums; display:block}
.countdown .l{font:600 9.5px/1 var(--sans); letter-spacing:.1em; color:var(--dim); margin-top:5px; display:block}

.plan{display:flex; flex-direction:column; gap:9px; margin:12px 0}
.plan .p{
  display:flex; align-items:center; gap:13px; padding:14px 15px; min-height:66px;
  border-radius:var(--r); border:1px solid var(--line); background:var(--panel);
  text-align:left; width:100%; position:relative; overflow:hidden;
}
.plan .p:active{background:var(--panel2)}
.plan .p::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--ai))}
.plan .p .ic{
  width:40px; height:40px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center;
  background:var(--cw,var(--ai-w)); color:var(--c,var(--ai));
}
.plan .p .ic svg{width:21px; height:21px; display:block}
.plan .p .tx{flex:1; min-width:0}
.plan .p .tx b{display:block; font-size:15.5px; font-weight:700; line-height:1.4}
.plan .p .tx span{display:block; font-size:12.5px; color:var(--dim); margin-top:2px; line-height:1.5}
.plan .p .cnt{font:700 15px var(--mono); color:var(--c,var(--ai)); flex:0 0 auto}
.plan .p.done .ic{background:var(--matsu-w)}
.plan .p.done .tx b{color:var(--muted)}

.streak{
  display:flex; align-items:center; gap:14px; padding:14px 16px; margin:12px 0;
  border-radius:var(--r); border:1px solid var(--line); background:var(--panel);
}
.streak .fl{font-size:26px; flex:0 0 auto}
.streak .n{font:700 24px/1 var(--mono)}
.streak .l{font-size:12px; color:var(--dim); margin-top:4px}
.week{display:flex; gap:5px; margin-left:auto; flex:0 0 auto}
.week i{
  width:22px; height:28px; border-radius:6px; background:var(--panel3);
  display:grid; place-items:center; font:600 9px/1 var(--sans); color:var(--dim);
  font-style:normal;
}
.week i.on{background:var(--matsu); color:var(--on-matsu)}
.week i.today{box-shadow:inset 0 0 0 1.5px var(--ai)}

.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin:12px 0}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:13px 8px; text-align:center; min-width:0; overflow:hidden}
.kpi .n{font:700 21px/1 var(--mono); font-variant-numeric:tabular-nums; display:block}
.kpi .l{font-size:10.5px; color:var(--dim); margin-top:7px; display:block; letter-spacing:.03em}

/* ---------------- quiz ---------------- */
.qprog{position:sticky; top:calc(var(--top) + 52px); z-index:30; background:var(--bg); padding:0 0 2px;
  margin:0 -14px; padding-left:14px; padding-right:14px}
.qbar{height:3px; background:var(--panel3)}
.qbar > i{display:block; height:100%; background:var(--ai); transition:width .35s cubic-bezier(.22,1,.36,1)}
.qmeta{display:flex; align-items:center; gap:8px; padding:9px 2px 4px; font-size:12.5px; color:var(--dim); flex-wrap:wrap}
.qmeta .num{font-weight:700; color:var(--muted)}
.qmeta .timer{font-family:var(--mono); font-weight:700}
.qmeta .timer.warn{color:var(--kin)}
.qmeta .timer.crit{color:var(--shu)}

.qstem{
  font-size:17.5px; line-height:1.8; font-weight:500; margin:8px 0 16px;
  letter-spacing:.005em;
}
.qtags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}

.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
  padding:14px 14px; min-height:56px; border-radius:var(--r);
  border:1.5px solid var(--line); background:var(--panel);
  font-size:15.5px; line-height:1.65; transition:border-color .15s, background .15s;
}
.opt:active{background:var(--panel2)}
.opt .k{
  flex:0 0 auto; width:26px; height:26px; border-radius:8px; margin-top:1px;
  display:grid; place-items:center; background:var(--panel3); color:var(--muted);
  font:700 13px/1 var(--mono);
}
.opt .tx{flex:1; min-width:0}
.opt .mark{flex:0 0 auto; font-size:17px; opacity:0; margin-top:1px}
.opt.pick{border-color:var(--ai); background:var(--ai-w)}
.opt.pick .k{background:var(--ai); color:#fff}
.opt.ok{border-color:var(--matsu); background:var(--matsu-w)}
.opt.ok .k{background:var(--matsu); color:var(--on-matsu)}
.opt.ok .mark{opacity:1; color:var(--matsu)}
.opt.ng{border-color:var(--shu); background:var(--shu-w)}
.opt.ng .k{background:var(--shu); color:#fff}
.opt.ng .mark{opacity:1; color:var(--shu)}
.opt.mute{opacity:.5}
.opts.locked .opt{pointer-events:none}

.verdict{
  display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:var(--r);
  margin:16px 0 0; font-weight:700; font-size:15.5px;
  animation:pop .28s cubic-bezier(.22,1,.36,1);
}
.verdict.ok{background:var(--matsu-w); color:var(--matsu)}
.verdict.ng{background:var(--shu-w); color:var(--shu)}
.verdict .ic{font-size:19px}
@keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

.expl{
  margin-top:10px; padding:15px; border-radius:var(--r);
  background:var(--panel); border:1px solid var(--line);
  font-size:14.8px; line-height:1.85;
  animation:pop .3s .04s backwards cubic-bezier(.22,1,.36,1);
}
.expl .lab{
  display:block; font:700 10.5px/1 var(--sans); letter-spacing:.14em;
  color:var(--dim); margin-bottom:10px;
}
.expl b,.expl strong{color:var(--text); font-weight:700}

.qfoot{
  position:sticky; bottom:0; z-index:20;
  padding:12px 0 calc(12px + var(--bot));
  background:linear-gradient(to top,var(--bg) 62%,rgba(0,0,0,0));
  display:flex; gap:9px;
}
.qfoot .btn{flex:1}
.qfoot .btn.icon{flex:0 0 52px; width:52px; padding:0}

/* result */
.result-ring{display:grid; place-items:center; padding:16px 0 4px; position:relative}
.result-ring svg{width:170px; height:170px}
.result-ring .mid{position:absolute; text-align:center}
.result-ring .mid .n{font:700 42px/1 var(--mono)}
.result-ring .mid .l{font-size:11.5px; color:var(--dim); margin-top:6px; letter-spacing:.08em}

.rev{border-left:3px solid var(--shu); padding:2px 0 2px 13px; margin:14px 0}
.rev.ok{border-color:var(--matsu)}
.rev .q{font-size:14.8px; font-weight:600; line-height:1.7}
.rev .a{font-size:13.5px; color:var(--muted); margin-top:7px; line-height:1.7}
.rev .a em{font-style:normal; color:var(--matsu); font-weight:700}
.rev .a s{color:var(--shu); text-decoration-color:var(--shu); opacity:.8}

/* ---------------- flashcards ---------------- */
.fcard{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:26px 20px; min-height:38dvh; display:flex; flex-direction:column;
  justify-content:center; text-align:center; margin:14px 0;
  box-shadow:var(--shadow); position:relative;
}
@supports not (min-height:38dvh){ .fcard{min-height:38vh} }
.fcard .side{font:700 10px/1 var(--sans); letter-spacing:.16em; color:var(--dim);
  position:absolute; top:14px; left:0; right:0; text-align:center}
.fcard .front{font-family:var(--disp); font-size:23px; line-height:1.65; font-weight:600}
.fcard .front.en{font-family:var(--sans); font-weight:700; letter-spacing:.01em}
.fcard .hint{margin-top:16px; font-size:13px; color:var(--dim)}
.fcard .back{
  margin-top:20px; padding-top:18px; border-top:1px dashed var(--line2);
  font-size:16px; line-height:1.85; text-align:left;
  animation:pop .26s cubic-bezier(.22,1,.36,1);
}
.grades{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px}
.grades button{
  min-width:0; padding:12px 4px; border-radius:var(--r); border:1.5px solid var(--line);
  background:var(--panel); min-height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.grades button:active{transform:scale(.97)}
.grades button b{font-size:13.5px; font-weight:700}
.grades button span{font:600 10px var(--mono); color:var(--dim)}
.grades button.g0{border-color:var(--shu); color:var(--shu)}
.grades button.g1{border-color:var(--kin); color:var(--kin)}
.grades button.g2{border-color:var(--ai); color:var(--ai)}
.grades button.g3{border-color:var(--matsu); color:var(--matsu)}

/* ---------------- reading / cheat sheets ---------------- */
.doc{font-size:16px; line-height:1.92; padding-top:12px; -webkit-user-select:text; user-select:text}
.doc > *:first-child{margin-top:0}
.doc p{margin:0 0 1.1em}
.doc h3{
  font-family:var(--disp); font-size:19px; font-weight:600; line-height:1.5;
  margin:1.9em 0 .7em; padding-left:11px; border-left:3px solid var(--ai);
  letter-spacing:.01em;
}
.doc h4{font-size:15.5px; font-weight:700; margin:1.4em 0 .5em}
.doc ul,.doc ol{margin:0 0 1.1em; padding-left:1.35em}
.doc li{margin:.4em 0}
.doc strong{font-weight:700}
.doc strong.k{color:var(--ai); font-weight:700}
html[data-theme="light"] .doc strong.k{color:var(--ai-d)}
.doc em{font-style:normal; color:var(--muted)}
.doc a{color:var(--ai)}

.doc .card{background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin:1.2em 0}
.doc .card h3{margin-top:.2em}
.doc .callout{
  border-radius:var(--r); padding:14px 15px; margin:1.2em 0; font-size:15px; line-height:1.85;
  background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--muted);
}
.doc .callout .lab{
  display:block; font:700 11px/1 var(--sans); letter-spacing:.1em;
  margin-bottom:9px; color:var(--muted);
}
.doc .callout.exam{background:var(--shu-w); border-color:transparent; border-left-color:var(--shu)}
.doc .callout.exam .lab{color:var(--shu)}
.doc .callout.tip{background:var(--matsu-w); border-color:transparent; border-left-color:var(--matsu)}
.doc .callout.tip .lab{color:var(--matsu)}
.doc .callout.vocab{background:var(--ai-w); border-color:transparent; border-left-color:var(--ai)}
.doc .callout.vocab .lab{color:var(--ai)}
.doc .callout.warn{background:var(--kin-w); border-color:transparent; border-left-color:var(--kin)}
.doc .callout.warn .lab{color:var(--kin)}

.doc dl{margin:.3em 0 0}
.doc dt{font-weight:700; margin-top:.85em; font-size:15px}
.doc dt:first-child{margin-top:0}
.doc dd{margin:.2em 0 0; color:var(--muted); font-size:14.5px; line-height:1.75}
.doc .ipa{font-family:var(--mono); font-size:12.5px; color:var(--dim); font-weight:400; margin-left:5px}
.doc .en-term{font-family:var(--mono); font-size:13px; color:var(--muted); line-height:1.6; display:inline-block; margin-top:3px}

.doc .pill{
  display:inline-block; margin:3px 5px 3px 0; padding:4px 11px; border-radius:999px;
  background:var(--panel3); border:1px solid var(--line); font-size:12.5px; font-weight:600;
}
.doc .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:1.2em -14px; padding:0 14px}
.doc table{border-collapse:collapse; width:100%; min-width:540px; font-size:13.8px; line-height:1.7}
.doc th,.doc td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top}
.doc th{background:var(--panel2); font-weight:700; font-size:12.8px; white-space:nowrap; color:var(--muted)}
.doc tbody tr:nth-child(even) td{background:rgba(127,127,127,.045)}

.doc .info-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin:1.2em 0}
.doc .topic{
  display:block; padding:13px; border-radius:var(--r); text-decoration:none;
  background:var(--panel2); border:1px solid var(--line); border-top:2.5px solid var(--c,var(--ai));
  color:var(--text);
}
.doc .topic .ic{font-size:20px; margin-bottom:6px}
.doc .topic h4{margin:0 0 3px; font-size:14.5px; font-weight:700}
.doc .topic small{color:var(--dim); font-size:11.5px; line-height:1.5; display:block}

.doc figure{margin:1.3em 0; text-align:center}
.doc figure svg{max-width:100%; height:auto; display:block; margin:0 auto}
.doc figcaption{font-size:12.5px; color:var(--dim); margin-top:9px; line-height:1.6}
.doc .diagram{overflow-x:auto; -webkit-overflow-scrolling:touch}
.doc .backtop,.doc footer{display:none}

/* ---------------- stats ---------------- */
.dbar{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
.dbar:last-child{border-bottom:0}
.dbar .n{width:22px; font:700 12px var(--mono); color:var(--dim); flex:0 0 auto}
.dbar .nm{flex:0 0 auto; width:96px; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dbar .bar{flex:1}
.dbar .pc{width:42px; text-align:right; font:700 13px var(--mono); flex:0 0 auto}
.dbar .wt{width:30px; text-align:right; font:600 10.5px var(--mono); color:var(--dim); flex:0 0 auto}

.spark{width:100%; height:64px; display:block; overflow:visible}
.heat{display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr)); gap:3px; margin-top:4px}
.heat i{aspect-ratio:1; border-radius:3px; background:var(--panel3); display:block}
@supports not (aspect-ratio:1){ .heat i{height:13px} }
.heat i.l1{background:rgba(53,185,129,.3)} .heat i.l2{background:rgba(53,185,129,.55)}
.heat i.l3{background:rgba(53,185,129,.78)} .heat i.l4{background:var(--matsu)}

/* settings */
.field{display:flex; align-items:center; gap:12px; padding:13px 15px; border-bottom:1px solid var(--line); min-height:58px}
.field:last-child{border-bottom:0}
.field .lb{flex:1; min-width:0}
.field .lb b{display:block; font-size:15px; font-weight:600}
.field .lb span{display:block; font-size:12.5px; color:var(--dim); margin-top:2px; line-height:1.5}
.field input[type=date],.field input[type=number],.field select{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:9px 11px; font-size:16px; color:var(--text); min-height:44px;
  -webkit-appearance:none; appearance:none; max-width:170px;
}
.seg{display:flex; background:var(--panel2); border-radius:11px; padding:3px; gap:2px; border:1px solid var(--line)}
.seg button{padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); min-height:38px}
.seg button.on{background:var(--ai); color:#fff}


/* search */
.searchbox{
  display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:0 13px; margin:12px 0; min-height:48px;
}
.searchbox input{
  flex:1; border:0; background:none; font-size:16px; padding:12px 0; min-width:0;
  -webkit-appearance:none; appearance:none; outline:none;
}
.searchbox input::placeholder{color:var(--dim)}
mark{background:var(--kin-w); color:var(--kin); padding:0 2px; border-radius:3px; font-weight:700}

/* toast */
#toast{
  position:fixed; left:50%; bottom:calc(var(--tabh) + var(--bot) + 18px);
  transform:translate(-50%,14px); z-index:80; opacity:0; pointer-events:none;
  background:var(--panel3); color:var(--text); border:1px solid var(--line2);
  padding:11px 18px; border-radius:999px; font-size:14px; font-weight:600;
  box-shadow:var(--shadow); transition:opacity .22s, transform .22s; max-width:86vw; text-align:center;
}
#toast.on{opacity:1; transform:translate(-50%,0)}

/* modal */
#modal{
  position:fixed; inset:0; z-index:90; display:none;
  background:rgba(0,0,0,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  align-items:flex-end; justify-content:center;
}
#modal.on{display:flex}
#modal .box{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l) var(--r-l) 0 0;
  width:100%; max-width:var(--maxw); padding:22px 18px calc(20px + var(--bot));
  animation:up .26s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(18px); opacity:.4} to{transform:none; opacity:1}}
#modal h3{margin:0 0 8px; font-size:18px; font-family:var(--disp); font-weight:600}
#modal p{margin:0 0 18px; color:var(--muted); font-size:14.5px; line-height:1.75}

.fade{animation:fade .22s cubic-bezier(.22,1,.36,1)}
@keyframes fade{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
@media (min-width:600px){
  .octa{width:240px; height:240px}
  .legend{grid-template-columns:repeat(4,minmax(0,1fr))}
}

選べ（best answer）」というマネージャ視点で問われるのが特徴です。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 1 は公式 Outline（2024年4月15日版）で 1.1〜1.13 の項目に分かれます。下のカードが主要トピックです（タップで該当節へ）。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#ethics\" style=\"--c:#7c3aed\"><div class=\"ic\">⚖️<\/div><h4>専門職倫理<\/h4><small>ISC2 Code of Ethics / 組織倫理<\/small><\/a> <a class=\"topic\" href=\"#concepts\" style=\"--c:#1f6feb\"><div class=\"ic\">🛡️<\/div><h4>セキュリティ概念<\/h4><small>CIA＋真正性・否認防止 / AAA<\/small><\/a> <a class=\"topic\" href=\"#governance\" style=\"--c:#0e9f6e\"><div class=\"ic\">🏛️<\/div><h4>ガバナンス<\/h4><small>戦略整合 / 役割 / フレームワーク<\/small><\/a> <a class=\"topic\" href=\"#compliance\" style=\"--c:#b54708\"><div class=\"ic\">📜<\/div><h4>法規制・プライバシー<\/h4><small>GDPR / 知財 / 越境データ<\/small><\/a> <a class=\"topic\" href=\"#investigation\" style=\"--c:#475467\"><div class=\"ic\">🔎<\/div><h4>調査の種別<\/h4><small>行政 / 刑事 / 民事 / 規制<\/small><\/a> <a class=\"topic\" href=\"#docs\" style=\"--c:#1f6feb\"><div class=\"ic\">🗂️<\/div><h4>文書体系<\/h4><small>方針→標準→手順→ガイドライン<\/small><\/a> <a class=\"topic\" href=\"#bcp\" style=\"--c:#0e9f6e\"><div class=\"ic\">♻️<\/div><h4>事業継続<\/h4><small>BIA / RTO / RPO / MTD<\/small><\/a> <a class=\"topic\" href=\"#personnel\" style=\"--c:#7c3aed\"><div class=\"ic\">👤<\/div><h4>人的セキュリティ<\/h4><small>採用〜退職 / 委託先<\/small><\/a> <a class=\"topic\" href=\"#risk\" style=\"--c:#b42318\"><div class=\"ic\">📊<\/div><h4>リスクマネジメント<\/h4><small>定量/定性 / 対応 / コントロール<\/small><\/a> <a class=\"topic\" href=\"#threatmodel\" style=\"--c:#b54708\"><div class=\"ic\">🎯<\/div><h4>脅威モデリング<\/h4><small>STRIDE / PASTA<\/small><\/a> <a class=\"topic\" href=\"#scrm\" style=\"--c:#475467\"><div class=\"ic\">🔗<\/div><h4>サプライチェーン<\/h4><small>第三者リスク / SBOM<\/small><\/a> <a class=\"topic\" href=\"#awareness\" style=\"--c:#0e9f6e\"><div class=\"ic\">🎓<\/div><h4>意識向上・教育<\/h4><small>Awareness/Training/Education<\/small><\/a> <\/div> <figure> <svg id=\"dg-d1-1\" class=\"diagram\" viewBox=\"0 0 800 300\" role=\"img\" aria-label=\"Domain 1 の4本柱（ガバナンス・リスク・コンプライアンス・人）が CIA を支える構造図\"> <!-- connectors (drawn first, behind boxes) --> <g stroke=\"var(--line)\" stroke-width=\"2\"> <line x1=\"400\" y1=\"66\" x2=\"115\" y2=\"118\"/><line x1=\"400\" y1=\"66\" x2=\"307\" y2=\"118\"/> <line x1=\"400\" y1=\"66\" x2=\"499\" y2=\"118\"/><line x1=\"400\" y1=\"66\" x2=\"691\" y2=\"118\"/> <line x1=\"115\" y1=\"190\" x2=\"115\" y2=\"234\"/><line x1=\"307\" y1=\"190\" x2=\"307\" y2=\"234\"/> <line x1=\"499\" y1=\"190\" x2=\"499\" y2=\"234\"/><line x1=\"691\" y1=\"190\" x2=\"691\" y2=\"234\"/> <\/g> <!-- top: goal --> <rect x=\"250\" y=\"18\" width=\"300\" height=\"48\" rx=\"10\" fill=\"var(--brand)\"/> <text x=\"400\" y=\"40\" text-anchor=\"middle\" class=\"cap\">情報の CIA を維持し<\/text> <text x=\"400\" y=\"58\" text-anchor=\"middle\" class=\"cap\">事業目標を支える<\/text> <!-- 4 pillars (even spacing: w=170, centers 115/307/499/691) --> <g> <rect x=\"30\" y=\"118\" width=\"170\" height=\"72\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"#0e9f6e\" stroke-width=\"2\"/> <text x=\"115\" y=\"150\" text-anchor=\"middle\" class=\"lbl\">ガバナンス<\/text> <text x=\"115\" y=\"172\" text-anchor=\"middle\" class=\"sub\">方針・役割・整合<\/text> <rect x=\"222\" y=\"118\" width=\"170\" height=\"72\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"#b42318\" stroke-width=\"2\"/> <text x=\"307\" y=\"150\" text-anchor=\"middle\" class=\"lbl\">リスク管理<\/text> <text x=\"307\" y=\"172\" text-anchor=\"middle\" class=\"sub\">識別・評価・対応<\/text> <rect x=\"414\" y=\"118\" width=\"170\" height=\"72\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"#b54708\" stroke-width=\"2\"/> <text x=\"499\" y=\"150\" text-anchor=\"middle\" class=\"lbl\">コンプライアンス<\/text> <text x=\"499\" y=\"172\" text-anchor=\"middle\" class=\"sub\">法・規制・契約<\/text> <rect x=\"606\" y=\"118\" width=\"170\" height=\"72\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"#7c3aed\" stroke-width=\"2\"/> <text x=\"691\" y=\"150\" text-anchor=\"middle\" class=\"lbl\">人・組織<\/text> <text x=\"691\" y=\"172\" text-anchor=\"middle\" class=\"sub\">教育・人的管理<\/text> <\/g> <!-- base --> <rect x=\"30\" y=\"234\" width=\"746\" height=\"46\" rx=\"10\" fill=\"var(--accent)\"/> <text x=\"403\" y=\"263\" text-anchor=\"middle\" class=\"cap\">継続的改善（PDCA / モニタリング）が全体を回す<\/text> <\/svg> <figcaption>図1：Domain 1 の構造（自作）。4本柱が情報のCIAと事業目標を支え、継続的改善が全体を回す、という関係を整理したもの。 構成項目は ISC2 CISSP Exam Outline (Apr 2024) に基づく。<\/figcaption> <\/figure>"},{"id":"ethics","n":"1","t":"専門職倫理","en":"Professional Ethics","h":"<p>CISSP 保持者は <strong class=\"k\">ISC2 Code of Ethics<\/strong>（倫理綱領）の遵守が認定の条件です。違反は資格剥奪の対象になり得ます。 綱領は「前文（Preamble）」と「4つのカノン（Canons）」から成り、<strong class=\"k\">カノンは記載順に優先順位を持つ<\/strong>のが最重要ポイントです。 上位のカノンが下位より優先され、利害が衝突したら上の番号を優先して解決します。<\/p> <div class=\"card\"> <h3 style=\"margin-top:0\">ISC2 Code of Ethics — 4つのカノン（優先順位順）<\/h3> <ol> <li><strong class=\"k\">社会・公共を守る<\/strong><br><span class=\"en-term\">Protect society, the common good, necessary public trust and confidence, and the infrastructure.<\/span><\/li> <li><strong class=\"k\">名誉・誠実・公正・責任・合法に行動する<\/strong><br><span class=\"en-term\">Act honorably, honestly, justly, responsibly, and legally.<\/span><\/li> <li><strong class=\"k\">依頼者に勤勉かつ有能なサービスを提供する<\/strong><br><span class=\"en-term\">Provide diligent and competent service to principals.<\/span><\/li> <li><strong class=\"k\">職業（プロフェッション）を発展させ守る<\/strong><br><span class=\"en-term\">Advance and protect the profession.<\/span><\/li> <\/ol> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 「依頼者の利益（カノン3）と社会の安全（カノン1）が衝突したらどうする？」→ <strong>上位のカノン1（社会）を優先<\/strong>。 順番そのものを並べ替えさせる問題も頻出。<em>Protect society → Act honorably → Provide service → Advance profession<\/em> の順を暗記。 <\/div>"},{"id":"concepts","n":"2","t":"セキュリティの基本概念","en":"Security Concepts","h":"<p>情報セキュリティの目標は古典的に <strong class=\"k\">CIA トライアド<\/strong>で表されます。2024年版 Outline では、これに <strong class=\"k\">真正性（Authenticity）<\/strong>と<strong class=\"k\">否認防止（Nonrepudiation）<\/strong>を加えた「5本柱」として整理されています。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>要素<\/th><th>意味<\/th><th>守るもの／例<\/th><th>脅かす例<\/th><\/tr><\/thead> <tbody> <tr><td><strong>機密性<\/strong><br><span class=\"en-term\">Confidentiality<\/span><\/td><td>許可された者だけがアクセスできる<\/td><td>暗号化・アクセス制御<\/td><td>盗聴・情報漏えい<\/td><\/tr> <tr><td><strong>完全性<\/strong><br><span class=\"en-term\">Integrity<\/span><\/td><td>データが正確で改ざんされていない<\/td><td>ハッシュ・電子署名<\/td><td>改ざん・誤入力<\/td><\/tr> <tr><td><strong>可用性<\/strong><br><span class=\"en-term\">Availability<\/span><\/td><td>必要なときに使える<\/td><td>冗長化・バックアップ<\/td><td>DoS・障害<\/td><\/tr> <tr><td><strong>真正性<\/strong><br><span class=\"en-term\">Authenticity<\/span><\/td><td>主体やデータが「本物」だと確認できる<\/td><td>認証・デジタル署名<\/td><td>なりすまし<\/td><\/tr> <tr><td><strong>否認防止<\/strong><br><span class=\"en-term\">Nonrepudiation<\/span><\/td><td>「やっていない」と否認させない<\/td><td>署名・ログ・監査証跡<\/td><td>否認・ログ改ざん<\/td><\/tr> <\/tbody> <\/table> <\/div> <h3>AAA とアカウンタビリティ<\/h3> <p><strong class=\"k\">AAA<\/strong> は <span class=\"en-term\">Authentication（認証）/ Authorization（認可）/ Accounting（アカウンティング、記録）<\/span>。 「誰か」を確認し、「何ができるか」を決め、「何をしたか」を記録する一連の流れです。これに <strong class=\"k\">Identification（識別）<\/strong>を加えて IAAA とも呼びます。記録があるからこそ <strong class=\"k\">アカウンタビリティ（説明責任）<\/strong>と否認防止が成立します。<\/p> <div class=\"callout tip\"><span class=\"lab\">補足（事実と用語）<\/span> CIA の反対概念として <strong>DAD<\/strong>（Disclosure 漏えい / Alteration 改ざん / Destruction 破壊）も問われる。 また機密性に関連して <strong>プライバシー<\/strong>、完全性に関連して <strong>真正性・否認防止<\/strong>が紐づくと整理すると覚えやすい。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>5 Pillars of Information Security<\/dt><dd>「情報セキュリティの5本柱」。2024年版 Outline の公式表現で、CIA＋ Authenticity ＋ Nonrepudiation を指す。<\/dd> <dt>Confidentiality <span class=\"ipa\">/ˌkɒnfɪdenʃiˈæləti/<\/span><\/dt><dd>機密性。\"confidential（秘密の）\" の名詞形。<\/dd> <dt>Integrity <span class=\"ipa\">/ɪnˈteɡrəti/<\/span><\/dt><dd>完全性。「正しく改ざんされていない」状態。<\/dd> <dt>Nonrepudiation <span class=\"ipa\">/ˌnɒnrɪˌpjuːdiˈeɪʃn/<\/span><\/dt><dd>否認防止。\"repudiate（否認する）\" の否定形。CISSP 最頻出単語のひとつ。<\/dd> <dt>Accountability<\/dt><dd>説明責任。「誰が何をしたか」を追跡でき、責任を問えること。<\/dd> <\/dl> <\/div>"},{"id":"governance","n":"3","t":"セキュリティガバナンス","en":"Security Governance","h":"<p><strong class=\"k\">ガバナンス<\/strong>とは、セキュリティを<strong class=\"k\">事業戦略・目標（ミッション/ゴール/オブジェクティブ）に整合<\/strong>させ、 経営層の責任で方向付け・監督する仕組みです。CISSP では「セキュリティは技術部門のものではなく、<strong class=\"k\">経営の問題（トップダウン）<\/strong>」という立場が一貫します。<\/p> <h3>Due Care と Due Diligence（頻出の対比）<\/h3> <div class=\"tablewrap\"> <table> <thead><tr><th>用語<\/th><th>意味<\/th><th>覚え方<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Due Care<\/strong><br>（相当の注意）<\/td><td>合理的な人が払うべき注意を払い、<strong>実際に対策を実行する<\/strong>こと<\/td><td>\"do\" care＝<strong>やる<\/strong>（実行）<\/td><\/tr> <tr><td><strong>Due Diligence<\/strong><br>（相当の勤勉さ）<\/td><td>リスクを<strong>調査・理解し継続的に評価・管理<\/strong>すること<\/td><td>diligence＝<strong>調べる・継続<\/strong><\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">一言整理<\/span>Due Diligence で「調べて分かった」ことに対し、Due Care で「実際に手を打つ」。両方を尽くすことが経営者の <em>prudent person rule（思慮深い人の原則）<\/em>に基づく責任。<\/div> <h3>主なコントロール・フレームワーク<\/h3> <ul> <li><strong class=\"k\">ISO/IEC 27001<\/strong>：ISMS（情報セキュリティマネジメントシステム）の<strong>要求事項<\/strong>（認証規格）。<strong>27002<\/strong>は管理策の実践ガイド。<\/li> <li><strong class=\"k\">NIST CSF（Cybersecurity Framework）2.0<\/strong>：Govern / Identify / Protect / Detect / Respond / Recover の6機能。<\/li> <li><strong class=\"k\">NIST SP 800-53<\/strong>：米国連邦向けの詳細な管理策カタログ。<\/li> <li><strong class=\"k\">COBIT<\/strong>：IT ガバナンス全般（ISACA）。<strong class=\"k\">SABSA<\/strong>：セキュリティアーキテクチャ。<strong class=\"k\">COSO<\/strong>：内部統制（不正対策・財務報告）。<\/li> <li><strong class=\"k\">PCI DSS<\/strong>：クレジットカード業界の<strong>業界標準<\/strong>（法律ではなく契約上の義務）。<\/li> <\/ul> <h3>役割と責任（Roles）<\/h3> <div class=\"tablewrap\"> <table> <thead><tr><th>役割<\/th><th>主な責任<\/th><\/tr><\/thead> <tbody> <tr><td>Data Owner（データオーナー）<\/td><td>データの分類・保護責任を負う（多くは事業部門の管理職）。説明責任は委任できない。<\/td><\/tr> <tr><td>Data Custodian（カストディアン）<\/td><td>オーナーの指示に従いデータを実際に保守・運用（バックアップ等）。<\/td><\/tr> <tr><td>Data Controller / Processor<\/td><td>（GDPR等）処理目的を決める者／委託されて処理する者。<\/td><\/tr> <tr><td>System Owner / Business Owner<\/td><td>システム／業務の責任者。<\/td><\/tr> <tr><td>Senior Management（経営層）<\/td><td>最終的な説明責任（accountability）を負う。セキュリティ方針を承認。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Due Care<\/dt><dd>相当の注意。リスクに対し合理的な対策を「実際に実行する」こと。<\/dd> <dt>Due Diligence<\/dt><dd>相当の勤勉さ。リスクを「調査・継続的に把握する」こと。care と対で頻出。<\/dd> <dt>Prudent Person Rule<\/dt><dd>思慮深い人の原則。経営者が「分別ある人なら払うはずの注意」を尽くす義務。<\/dd> <dt>Governance <span class=\"ipa\">/ˈɡʌvərnəns/<\/span><\/dt><dd>統治・ガバナンス。方向付けと監督。\"govern（統治する）\" の名詞形。<\/dd> <dt>Alignment<\/dt><dd>整合。セキュリティを事業戦略に「合わせる」こと（align to business strategy）。<\/dd> <\/dl> <\/div>"},{"id":"compliance","n":"4","t":"コンプライアンス・法規制・プライバシー","en":"","h":"<p>準拠すべき要件には <strong class=\"k\">法令・規制（regulatory）<\/strong>、<strong class=\"k\">契約（contractual）<\/strong>、 <strong class=\"k\">業界標準（industry standards）<\/strong>があります。違反の結果も区別して理解します。<\/p> <h3>法の種類とプライバシー規制<\/h3> <ul> <li><strong class=\"k\">GDPR<\/strong>（EU 一般データ保護規則, 2018施行）：EU 域内の個人データを扱うすべての組織に適用（域外適用あり）。 制裁金は<strong>2段階<\/strong>。重大な違反（基本原則・同意・データ主体の権利・越境移転など）は <strong>2,000万ユーロ または 全世界年間売上高の4% のいずれか高い方<\/strong>、 手続的な違反（記録義務など）は<strong>1,000万ユーロ または 2%<\/strong>が上限。<\/li> <li><strong class=\"k\">CCPA / CPRA<\/strong>：米カリフォルニア州の消費者プライバシー法。<\/li> <li><strong class=\"k\">HIPAA<\/strong>（米・医療情報）、<strong class=\"k\">GLBA<\/strong>（米・金融）、日本の<strong class=\"k\">個人情報保護法（APPI）<\/strong>。<\/li> <li><strong class=\"k\">知的財産（IP）<\/strong>：特許（Patent）・著作権（Copyright）・商標（Trademark）・営業秘密（Trade Secret）。 営業秘密は登録不要だが秘密管理が要件。<\/li> <li><strong class=\"k\">越境データ移転（transborder data flow）<\/strong>と<strong class=\"k\">輸出規制（import/export controls、例：暗号技術）<\/strong>。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> GDPR の役割語：<strong>Data Controller<\/strong>（処理目的・手段を決める）と <strong>Data Processor<\/strong>（委託されて処理）、 <strong>Data Subject<\/strong>（本人）。制裁金「4% または 2,000万ユーロの高い方」は数字ごと問われやすい。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Compliance <span class=\"ipa\">/kəmˈplaɪəns/<\/span><\/dt><dd>遵守・コンプライアンス。法・規制・契約・標準に従うこと。<\/dd> <dt>Regulatory<\/dt><dd>規制（当局）の。法令・監督官庁に関わる要件を指す形容詞。<\/dd> <dt>Data Controller / Processor / Subject<\/dt><dd>（GDPR）処理目的を決める者／委託で処理する者／本人。<\/dd> <dt>Transborder Data Flow<\/dt><dd>越境データ移転。国境を越える個人データの移動。<\/dd> <dt>Intellectual Property (IP)<\/dt><dd>知的財産。Patent / Copyright / Trademark / Trade Secret。<\/dd> <\/dl> <\/div>"},{"id":"investigation","n":"5","t":"調査の種別","en":"Investigation Types","h":"<p>インシデント対応で重要なのが「どの種類の調査か」で<strong class=\"k\">証拠基準（立証の程度）<\/strong>が変わる点です。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>種別<\/th><th>目的<\/th><th>立証の程度（証拠基準）<\/th><\/tr><\/thead> <tbody> <tr><td><strong>刑事<\/strong> Criminal<\/td><td>国家による処罰<\/td><td>合理的疑いを超える <span class=\"en-term\">beyond a reasonable doubt<\/span>（最も厳格）<\/td><\/tr> <tr><td><strong>民事<\/strong> Civil<\/td><td>当事者間の損害賠償等<\/td><td>証拠の優越 <span class=\"en-term\">preponderance of the evidence<\/span><\/td><\/tr> <tr><td><strong>行政/規制<\/strong> Administrative / Regulatory<\/td><td>組織内処分・規制当局対応<\/td><td>多くは <span class=\"en-term\">more likely than not<\/span>（比較的緩い）<\/td><\/tr> <tr><td><strong>業界標準<\/strong> Industry standards<\/td><td>標準への適合確認<\/td><td>標準が定める基準<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">関連<\/span>証拠は <strong>admissible（採用可能）<\/strong>であるために、関連性・信頼性・適法な取得が必要。 <strong>chain of custody（証拠保全の連鎖）<\/strong>を維持することが鍵（誰が・いつ・どう扱ったか）。<\/div>"},{"id":"docs","n":"6","t":"セキュリティ文書体系","en":"","h":"<p>方針文書には階層があり、上位ほど抽象的・安定的、下位ほど具体的です。<strong class=\"k\">強制力の有無<\/strong>がよく問われます。<\/p> <figure> <svg id=\"dg-d1-2\" class=\"diagram\" viewBox=\"0 0 760 312\" role=\"img\" aria-label=\"セキュリティ文書の階層：ポリシー・標準・ベースライン・手順は必須、ガイドラインのみ推奨\"> <!-- uniform stack, centered at x=400, boxes x=210..590 --> <rect x=\"210\" y=\"16\" width=\"380\" height=\"46\" rx=\"8\" fill=\"#1f6feb\"/> <text x=\"400\" y=\"38\" text-anchor=\"middle\" class=\"t\" fill=\"#fff\">ポリシー Policy<\/text> <text x=\"400\" y=\"54\" text-anchor=\"middle\" class=\"d\" fill=\"#dce8ff\">経営の意思・目的（最上位・最も抽象的）<\/text> <rect x=\"210\" y=\"68\" width=\"380\" height=\"46\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"#1f6feb\"/> <text x=\"400\" y=\"90\" text-anchor=\"middle\" class=\"t\">標準 Standards<\/text> <text x=\"400\" y=\"106\" text-anchor=\"middle\" class=\"d\">必須の具体要件（例：暗号方式の指定）<\/text> <rect x=\"210\" y=\"120\" width=\"380\" height=\"46\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"#1f6feb\"/> <text x=\"400\" y=\"142\" text-anchor=\"middle\" class=\"t\">ベースライン Baselines<\/text> <text x=\"400\" y=\"158\" text-anchor=\"middle\" class=\"d\">最低限満たすべき設定水準<\/text> <rect x=\"210\" y=\"172\" width=\"380\" height=\"46\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"#1f6feb\"/> <text x=\"400\" y=\"194\" text-anchor=\"middle\" class=\"t\">手順 Procedures<\/text> <text x=\"400\" y=\"210\" text-anchor=\"middle\" class=\"d\">手順書（ステップ・バイ・ステップ）<\/text> <rect x=\"210\" y=\"240\" width=\"380\" height=\"48\" rx=\"8\" fill=\"var(--warn-bg)\" stroke=\"#b54708\" stroke-width=\"2\"/> <text x=\"400\" y=\"263\" text-anchor=\"middle\" class=\"t\">ガイドライン Guidelines<\/text> <text x=\"400\" y=\"280\" text-anchor=\"middle\" class=\"d\" fill=\"#b54708\">推奨（任意・強制ではない）<\/text> <!-- left bracket: 必須 spanning policy..procedures --> <path d=\"M150 20 H140 V214 H150\" fill=\"none\" stroke=\"#0e9f6e\" stroke-width=\"2.5\"/> <text x=\"120\" y=\"121\" text-anchor=\"middle\" class=\"side\" fill=\"#0e9f6e\" transform=\"rotate(-90 120 121)\">必須 Mandatory<\/text> <!-- left marker: 推奨 for guidelines --> <path d=\"M150 244 H140 V284 H150\" fill=\"none\" stroke=\"#b54708\" stroke-width=\"2.5\"/> <text x=\"118\" y=\"264\" text-anchor=\"middle\" class=\"side\" fill=\"#b54708\" transform=\"rotate(-90 118 264)\">推奨<\/text> <!-- right arrow: abstract -> concrete --> <line x1=\"640\" y1=\"24\" x2=\"640\" y2=\"214\" stroke=\"var(--muted)\" stroke-width=\"2\"/> <polygon points=\"640,220 634,208 646,208\" fill=\"var(--muted)\"/> <text x=\"662\" y=\"119\" text-anchor=\"middle\" class=\"d\" transform=\"rotate(90 662 119)\">抽象的 → 具体的<\/text> <\/svg> <figcaption>図2：文書階層（自作）。ポリシー・標準・ベースライン・手順は<strong>必須<\/strong>、ガイドラインのみ<strong>推奨（任意）<\/strong>。<\/figcaption> <\/figure>"},{"id":"bcp","n":"7","t":"事業継続（BC）と BIA","en":"","h":"<p>Domain 1 では事業継続の<strong class=\"k\">計画づくりの入り口（要件定義）<\/strong>、特に <strong class=\"k\">BIA（Business Impact Analysis、事業影響度分析）<\/strong>と各種時間指標を扱います （詳細な災害復旧の実装は Domain 7）。<\/p> <h3>主要な時間指標<\/h3> <div class=\"tablewrap\"> <table> <thead><tr><th>指標<\/th><th>意味<\/th><\/tr><\/thead> <tbody> <tr><td><strong>RTO<\/strong><br><span class=\"en-term\">Recovery Time Objective<\/span><\/td><td>復旧までに許容できる<strong>目標時間<\/strong>（いつまでに業務を戻すか）<\/td><\/tr> <tr><td><strong>RPO<\/strong><br><span class=\"en-term\">Recovery Point Objective<\/span><\/td><td>許容できる<strong>データ損失量（時間）<\/strong>（どこまで遡ってデータを戻せればよいか）<\/td><\/tr> <tr><td><strong>MTD / MTPD<\/strong><br><span class=\"en-term\">Maximum Tolerable Downtime<\/span><\/td><td>これを超えると事業が致命傷を負う<strong>最大許容停止時間<\/strong><\/td><\/tr> <tr><td><strong>WRT<\/strong><br><span class=\"en-term\">Work Recovery Time<\/span><\/td><td>システム復旧後、業務を通常稼働に戻すまでの時間。<strong>MTD ≒ RTO + WRT<\/strong><\/td><\/tr> <tr><td><strong>MTBF / MTTR<\/strong><\/td><td>平均故障間隔／平均修復時間（信頼性・保守性の指標）<\/td><\/tr> <\/tbody> <\/table> <\/div> <figure> <svg id=\"dg-d1-3\" class=\"diagram\" viewBox=\"0 0 760 248\" role=\"img\" aria-label=\"障害発生を起点に、RPOは過去側のデータ損失幅、RTO+WRTがMTD以内に収まる時間軸の図\"> <!-- time axis --> <line x1=\"40\" y1=\"138\" x2=\"724\" y2=\"138\" class=\"ax\"/> <polygon points=\"726,138 712,131 712,145\" fill=\"var(--muted)\"/> <!-- vertical markers --> <line x1=\"220\" y1=\"72\" x2=\"220\" y2=\"158\" stroke=\"#b54708\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/> <line x1=\"330\" y1=\"66\" x2=\"330\" y2=\"168\" stroke=\"#b42318\" stroke-width=\"2\"/> <line x1=\"520\" y1=\"72\" x2=\"520\" y2=\"158\" stroke=\"#1f6feb\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/> <line x1=\"640\" y1=\"72\" x2=\"640\" y2=\"158\" stroke=\"#0e9f6e\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/> <!-- incident label --> <text x=\"330\" y=\"54\" text-anchor=\"middle\" class=\"lb\" fill=\"#b42318\">障害発生<\/text> <!-- RPO segment (past side) --> <line x1=\"220\" y1=\"110\" x2=\"330\" y2=\"110\" stroke=\"#b54708\" stroke-width=\"6\" opacity=\".55\"/> <text x=\"275\" y=\"100\" text-anchor=\"middle\" class=\"sm\">RPO（データ損失幅）<\/text> <text x=\"220\" y=\"184\" text-anchor=\"middle\" class=\"sm\">最後のバックアップ<\/text> <!-- RTO segment --> <line x1=\"330\" y1=\"138\" x2=\"520\" y2=\"138\" stroke=\"#1f6feb\" stroke-width=\"6\" opacity=\".6\"/> <text x=\"425\" y=\"128\" text-anchor=\"middle\" class=\"sm\">RTO（システム復旧）<\/text> <!-- WRT segment --> <line x1=\"520\" y1=\"138\" x2=\"640\" y2=\"138\" stroke=\"#0e9f6e\" stroke-width=\"6\" opacity=\".6\"/> <text x=\"580\" y=\"128\" text-anchor=\"middle\" class=\"sm\">WRT（業務復帰）<\/text> <!-- MTD bracket --> <path d=\"M330 206 V214 H640 V206\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2\"/> <text x=\"485\" y=\"236\" text-anchor=\"middle\" class=\"lb\">MTD ＝ RTO ＋ WRT（この幅を超えてはならない）<\/text> <\/svg> <figcaption>図3：BCP の時間指標（自作）。考え方は NIST SP 800-34 Rev.1（Contingency Planning）に基づく。<\/figcaption> <\/figure> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Business Impact Analysis (BIA)<\/dt><dd>事業影響度分析。重要業務と停止の影響・優先度を特定する BCP の起点。<\/dd> <dt>Recovery Time Objective (RTO)<\/dt><dd>復旧目標時間。「いつまでに」戻すか。<\/dd> <dt>Recovery Point Objective (RPO)<\/dt><dd>復旧時点目標。許容できるデータ損失量（時間）。<\/dd> <dt>Maximum Tolerable Downtime (MTD)<\/dt><dd>最大許容停止時間。これを超えると致命的。MTD = RTO + WRT。<\/dd> <dt>Resilience <span class=\"ipa\">/rɪˈzɪliəns/<\/span><\/dt><dd>レジリエンス（回復力）。障害から立ち直る能力。<\/dd> <\/dl> <\/div>"},{"id":"personnel","n":"8","t":"人的セキュリティ","en":"Personnel Security","h":"<p>人は最大の資産であり最大の脆弱性でもあります。雇用ライフサイクル全体で対策します。<\/p> <ul> <li><strong class=\"k\">採用時<\/strong>：候補者スクリーニング（背景調査）、雇用契約、NDA、適切な合意。<\/li> <li><strong class=\"k\">在職中<\/strong>：職務分掌（SoD）、最小権限、職務ローテーション、強制休暇（不正検知）。<\/li> <li><strong class=\"k\">異動・退職時<\/strong>：アクセス権の速やかな見直し・剥奪、資産返却、退職面談。<\/li> <li><strong class=\"k\">委託先・契約<\/strong>：ベンダー・コンサル・委託先との合意、SLA、コンプライアンス要件。<\/li> <\/ul> <div class=\"callout tip\"><span class=\"lab\">関連キーワード<\/span> <span class=\"pill\">Separation of Duties（職務分掌）<\/span><span class=\"pill\">Least Privilege（最小権限）<\/span> <span class=\"pill\">Job Rotation（職務ローテーション）<\/span><span class=\"pill\">Mandatory Vacation（強制休暇）<\/span> <span class=\"pill\">Collusion（共謀）対策<\/span> — いずれも内部不正のリスク低減策。<\/div>"},{"id":"risk","n":"9","t":"リスクマネジメント","en":"Risk Management","h":"<p>Domain 1 の中核。<strong class=\"k\">リスク＝脅威（Threat）が脆弱性（Vulnerability）を突いて、資産に影響（Impact）を与える可能性<\/strong>。 リスクを識別・評価し、対応を決め、継続的に監視します（NIST SP 800-30 の考え方）。<\/p> <h3>定量評価の式（必ず暗記）<\/h3> <div class=\"card\"> <p style=\"margin:.2em 0\"><strong>SLE<\/strong>（Single Loss Expectancy・単一損失予測）＝ <strong>AV<\/strong>（資産価値）× <strong>EF<\/strong>（暴露係数）<\/p> <p style=\"margin:.2em 0\"><strong>ALE<\/strong>（Annualized Loss Expectancy・年間損失予測）＝ <strong>SLE<\/strong> × <strong>ARO<\/strong>（年間発生率）<\/p> <p style=\"margin:.6em 0 .2em\" class=\"lead\">コントロール導入の価値 ≒（導入前ALE − 導入後ALE）− コントロールの年間コスト<\/p> <\/div> <div class=\"callout tip\"><span class=\"lab\">計算例<\/span> 資産価値 1,000万円、被害時に40%損失（EF=0.4）→ SLE = 400万円。2年に1回発生（ARO=0.5）→ ALE = 400万 × 0.5 = <strong>200万円/年<\/strong>。 年100万円の対策で発生率を0.5→0.1にできるなら、導入後ALE=40万円。価値＝(200−40)−100＝<strong>+60万円/年<\/strong>で導入が妥当。<\/div> <h3>定性 vs 定量<\/h3> <div class=\"tablewrap\"> <table> <thead><tr><th><\/th><th>定量（Quantitative）<\/th><th>定性（Qualitative）<\/th><\/tr><\/thead> <tbody> <tr><td>表現<\/td><td>金額・数値（SLE/ALE等）<\/td><td>高/中/低・スコア<\/td><\/tr> <tr><td>長所<\/td><td>費用対効果を計算しやすい<\/td><td>迅速・主観的価値も扱える<\/td><\/tr> <tr><td>短所<\/td><td>正確な数値取得が困難<\/td><td>客観性・比較性に欠ける<\/td><\/tr> <\/tbody> <\/table> <\/div> <h3>リスク対応（Risk Treatment / Response）<\/h3> <ul> <li><strong class=\"k\">回避 Avoid<\/strong>：リスクのある活動自体をやめる。<\/li> <li><strong class=\"k\">移転 Transfer（Share）<\/strong>：保険・アウトソースで第三者に移す。<\/li> <li><strong class=\"k\">低減 Mitigate（Reduce）<\/strong>：コントロールで発生確率・影響を下げる。<\/li> <li><strong class=\"k\">受容 Accept<\/strong>：残留リスクを承知のうえ受け入れる（経営判断・正式承認が必要）。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 対策後に残るのが<strong>残留リスク（residual risk）<\/strong>。「すべてのコントロールを入れても残るリスクをどうする？」→ 最終的に<strong>受容（accept）するのは経営層<\/strong>。\"Reject／Ignore\" は正式な対応ではない（ひっかけ）。<\/div> <h3>リスクフレームワーク：NIST RMF（SP 800-37 Rev.2）の7ステップ<\/h3> <figure> <svg id=\"dg-d1-4\" class=\"diagram\" viewBox=\"0 0 800 150\" role=\"img\" aria-label=\"NIST RMF 7ステップ：Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor\"> <g> <rect x=\"10\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#475467\"/><text x=\"59\" y=\"74\" text-anchor=\"middle\" class=\"st\">Prepare<\/text><text x=\"59\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">準備<\/text> <rect x=\"123\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#1f6feb\"/><text x=\"172\" y=\"74\" text-anchor=\"middle\" class=\"st\">Categorize<\/text><text x=\"172\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">分類<\/text> <rect x=\"236\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#1f6feb\"/><text x=\"285\" y=\"74\" text-anchor=\"middle\" class=\"st\">Select<\/text><text x=\"285\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">管理策選定<\/text> <rect x=\"349\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#0e9f6e\"/><text x=\"398\" y=\"74\" text-anchor=\"middle\" class=\"st\">Implement<\/text><text x=\"398\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">導入<\/text> <rect x=\"462\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#0e9f6e\"/><text x=\"511\" y=\"74\" text-anchor=\"middle\" class=\"st\">Assess<\/text><text x=\"511\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">評価<\/text> <rect x=\"575\" y=\"50\" width=\"98\" height=\"50\" rx=\"8\" fill=\"#b54708\"/><text x=\"624\" y=\"74\" text-anchor=\"middle\" class=\"st\">Authorize<\/text><text x=\"624\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">認可<\/text> <rect x=\"688\" y=\"50\" width=\"102\" height=\"50\" rx=\"8\" fill=\"#b42318\"/><text x=\"739\" y=\"74\" text-anchor=\"middle\" class=\"st\">Monitor<\/text><text x=\"739\" y=\"90\" text-anchor=\"middle\" class=\"st\" style=\"font-size:10px\">継続監視<\/text> <\/g> <g fill=\"var(--muted)\"> <polygon points=\"108,75 123,75 116,69 116,81\"/><polygon points=\"221,75 236,75 229,69 229,81\"/> <polygon points=\"334,75 349,75 342,69 342,81\"/><polygon points=\"447,75 462,75 455,69 455,81\"/> <polygon points=\"560,75 575,75 568,69 568,81\"/><polygon points=\"673,75 688,75 681,69 681,81\"/> <\/g> <text x=\"400\" y=\"130\" text-anchor=\"middle\" class=\"n\">※ Monitor の結果は各ステップへフィードバックされ、継続的に回る<\/text> <\/svg> <figcaption>図4：NIST RMF 7ステップ（自作）。出典：NIST SP 800-37 Rev.2（米国政府著作物＝パブリックドメイン）。<\/figcaption> <\/figure> <h3>コントロールの分類<\/h3> <div class=\"tablewrap\"> <table> <thead><tr><th>分類軸<\/th><th>種類<\/th><\/tr><\/thead> <tbody> <tr><td>性質（type）<\/td><td>管理的 Administrative（方針・教育）／技術的 Technical(Logical)（暗号・ACL）／物理的 Physical（施錠・柵）<\/td><\/tr> <tr><td>機能（function）<\/td><td>抑止 Deterrent／予防 Preventive／検知 Detective／是正 Corrective／復旧 Recovery／代替 Compensating／指示 Directive<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Threat / Vulnerability<\/dt><dd>脅威／脆弱性。脅威が脆弱性を突くとリスクが顕在化する。<\/dd> <dt>Exposure Factor (EF)<\/dt><dd>暴露係数。1回の事象で失われる資産価値の割合（0〜1）。<\/dd> <dt>Annualized Rate of Occurrence (ARO)<\/dt><dd>年間発生率。1年あたり何回起きると見込むか。<\/dd> <dt>Residual Risk<\/dt><dd>残留リスク。対策後にも残るリスク。受容は経営層が判断。<\/dd> <dt>Risk Appetite / Tolerance<\/dt><dd>リスク選好／許容度。組織が受け入れてよいリスクの量・幅。<\/dd> <dt>Mitigate <span class=\"ipa\">/ˈmɪtɪɡeɪt/<\/span><\/dt><dd>（リスクを）低減する。対応4分類は avoid / transfer / mitigate / accept。<\/dd> <dt>Compensating Control<\/dt><dd>代替的コントロール。本来の管理策が使えないときの代わり。<\/dd> <\/dl> <\/div>"},{"id":"threatmodel","n":"10","t":"脅威モデリング","en":"Threat Modeling","h":"<p>システムに対する脅威を体系的に洗い出す手法。代表例を押さえます。<\/p> <ul> <li><strong class=\"k\">STRIDE<\/strong>（Microsoft）：脅威を6分類。<span class=\"en-term\">Spoofing（なりすまし）/ Tampering（改ざん）/ Repudiation（否認）/ Information Disclosure（情報漏えい）/ Denial of Service（DoS）/ Elevation of Privilege（権限昇格）<\/span>。各分類が CIA 等の特性に対応。<\/li> <li><strong class=\"k\">PASTA<\/strong>：<span class=\"en-term\">Process for Attack Simulation and Threat Analysis<\/span>。7段階の<strong>リスク中心<\/strong>手法。<\/li> <li><strong class=\"k\">DREAD<\/strong>：脅威の深刻度を評点（Damage/Reproducibility/Exploitability/Affected users/Discoverability）。<\/li> <li>その他：<strong>Attack Tree（攻撃ツリー）<\/strong>、<strong>Trike<\/strong>。<\/li> <\/ul> <div class=\"callout tip\"><span class=\"lab\">対応関係（覚え方）<\/span> STRIDE の各脅威は防ぐべき特性と裏返し：Spoofing↔真正性、Tampering↔完全性、Repudiation↔否認防止、 Information Disclosure↔機密性、DoS↔可用性、Elevation of Privilege↔認可。<\/div>"},{"id":"scrm","n":"11","t":"サプライチェーンリスク管理","en":"Supply Chain Risk Management (SCRM)","h":"<p>ハードウェア・ソフトウェア・サービスの調達経路に潜むリスクを管理します。第三者（third party）が新たな攻撃経路になります。<\/p> <ul> <li><strong class=\"k\">第三者リスク評価・継続監視<\/strong>（third-party assessment & monitoring）。<\/li> <li><strong class=\"k\">最低限のセキュリティ要件・SLA<\/strong>を契約で課す。<\/li> <li><strong class=\"k\">SBOM（Software Bill of Materials）<\/strong>：ソフトウェア部品表。使用 OSS・依存関係を可視化し、脆弱性追跡を可能にする。<\/li> <li>関連語：<strong>fourth-party risk<\/strong>（委託先のさらに先）、<strong>right to audit（監査権）<\/strong>の契約明記。<\/li> <\/ul>"},{"id":"awareness","n":"12","t":"セキュリティ意識向上・教育","en":"Awareness, Training, Education","h":"<p>「人」を強くする取り組み。3段階の違いが問われます。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>段階<\/th><th>目的<\/th><th>例<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Awareness（意識向上）<\/strong><\/td><td>注意を促す・行動変容（What）<\/td><td>ポスター、フィッシング訓練、注意喚起メール<\/td><\/tr> <tr><td><strong>Training（訓練）<\/strong><\/td><td>業務に必要なスキル習得（How）<\/td><td>役割別の操作研修<\/td><\/tr> <tr><td><strong>Education（教育）<\/strong><\/td><td>体系的・概念的理解（Why）<\/td><td>学位・専門資格の学習<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">運用ポイント<\/span> 内容は<strong>定期的に見直し<\/strong>（脅威の変化に追従）、<strong>有効性を測定<\/strong>（訓練クリック率の推移など）。 役割に応じた内容（role-based）にする。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 1 の超要点<\/h3> <ul> <li>倫理4カノンは<strong>順番＝優先順位<\/strong>（社会→名誉→依頼者→職業）。衝突は上位優先。<\/li> <li>セキュリティ目標は CIA ＋ <strong>真正性・否認防止<\/strong>。反対概念は DAD。<\/li> <li>ガバナンスは<strong>事業整合・トップダウン<\/strong>。Due Diligence（調べる）と Due Care（実行する）を区別。<\/li> <li>リスク：<strong>SLE=AV×EF<\/strong>、<strong>ALE=SLE×ARO<\/strong>。対応は回避/移転/低減/受容、残留リスクの受容は<strong>経営層<\/strong>。<\/li> <li>BCP：<strong>BIA<\/strong>が起点、<strong>MTD=RTO+WRT<\/strong>、RPO はデータ損失量。<\/li> <li>文書は<strong>ガイドラインのみ任意<\/strong>、他は必須。脅威モデリングは STRIDE / PASTA。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>ISC2, <em>Code of Ethics<\/em>（4カノンの正式順序・優先順位）— <a href=\"https://www.isc2.org/ethics\" target=\"_blank\" rel=\"noopener\">isc2.org/ethics<\/a><\/li> <li>NIST, <em>SP 800-37 Rev.2 Risk Management Framework<\/em>（RMF 7ステップ）— <a href=\"https://csrc.nist.gov/pubs/sp/800/37/r2/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-30 Rev.1 Guide for Conducting Risk Assessments<\/em> — <a href=\"https://csrc.nist.gov/pubs/sp/800/30/r1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-34 Rev.1 Contingency Planning<\/em>（BIA, RTO/RPO/MTD/WRT）— <a href=\"https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>Cybersecurity Framework 2.0<\/em> — <a href=\"https://www.nist.gov/cyberframework\" target=\"_blank\" rel=\"noopener\">nist.gov/cyberframework<\/a><\/li> <li>Microsoft, <em>STRIDE Threat Modeling<\/em> — <a href=\"https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats\" target=\"_blank\" rel=\"noopener\">learn.microsoft.com<\/a><\/li> <li>EU, <em>GDPR (Regulation 2016/679)<\/em> — <a href=\"https://eur-lex.europa.eu/eli/reg/2016/679/oj\" target=\"_blank\" rel=\"noopener\">eur-lex.europa.eu<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報の構造を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。 ISO/IEC 規格は本文を転載せず概念の要約のみ記載。SLE/ALE 等の定量式・due care/diligence の区別は CISSP CBK で標準的に扱われる内容。<\/p> <p class=\"lead\">※本テキストは学習用にまとめた二次資料です。正確な出題範囲・最新情報は必ず ISC2 公式の Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d2","n":2,"t":"資産のセキュリティ","en":"Asset Security","w":10,"lead":"Domain 2 は「データ（情報資産）を、その重要度に応じて、ライフサイクル全体で守る」章です。 データの分類から始まり、誰が責任を持つか（データのロール）、生成〜廃棄までの扱い、 そしてat rest / in transit / in useという3つの状態ごとの保護を学びます。 D1 で決めた方針を「データという具体物」に当てはめる、橋渡しの章です。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 2 の主要トピック（公式 Outline 2.1〜2.6 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#classify\" style=\"--c:#1f6feb\"><div class=\"ic\">🏷️<\/div><h4>分類<\/h4><small>情報・資産のラベリング<\/small><\/a> <a class=\"topic\" href=\"#roles\" style=\"--c:#7c3aed\"><div class=\"ic\">👥<\/div><h4>データのロール<\/h4><small>owner/custodian/processor…<\/small><\/a> <a class=\"topic\" href=\"#lifecycle\" style=\"--c:#0e9f6e\"><div class=\"ic\">🔄<\/div><h4>ライフサイクル<\/h4><small>生成→廃棄まで<\/small><\/a> <a class=\"topic\" href=\"#states\" style=\"--c:#b54708\"><div class=\"ic\">📦<\/div><h4>3つの状態<\/h4><small>at rest/in transit/in use<\/small><\/a> <a class=\"topic\" href=\"#remanence\" style=\"--c:#b42318\"><div class=\"ic\">🧨<\/div><h4>残存・破棄<\/h4><small>NIST 800-88 clear/purge/destroy<\/small><\/a> <a class=\"topic\" href=\"#protect\" style=\"--c:#0e9f6e\"><div class=\"ic\">🛡️<\/div><h4>保護の仕組み<\/h4><small>DLP / DRM / CASB<\/small><\/a> <\/div> <p class=\"lead\">このドメインを貫く縦串が「データのライフサイクル」です（次の各節で詳説）。各段階で<strong class=\"k\">分類に応じた保護<\/strong>を適用し、 役割（ロール）を明確にし、不要になったら確実に破棄する——という一連の流れを押さえましょう。<\/p>"},{"id":"classify","n":"1","t":"情報・資産の分類","en":"Classification","h":"<p>すべてのデータを同じレベルで守るのは非効率です。<strong class=\"k\">分類（classification）<\/strong>でデータに重要度ラベルを付け、 ラベルに応じた保護を割り当てます。分類は<strong class=\"k\">データオーナー<\/strong>が決め、価値・機密性・法的要件・漏えい時の影響を基準にします。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th><\/th><th>政府・軍（例）<\/th><th>民間（例）<\/th><\/tr><\/thead> <tbody> <tr><td>最高位<\/td><td>Top Secret（機密性最高）<\/td><td>Confidential / Proprietary<\/td><\/tr> <tr><td> <\/td><td>Secret<\/td><td>Private（個人情報など）<\/td><\/tr> <tr><td> <\/td><td>Confidential<\/td><td>Sensitive<\/td><\/tr> <tr><td>最下位<\/td><td>Unclassified<\/td><td>Public（公開可）<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> ラベルは厳しすぎても緩すぎてもコスト/リスクの問題になる。分類後は<strong>ラベリング（marking）<\/strong>・取り扱い手順（handling）・ 保存・廃棄まで一貫させる。資産（ハードウェア等）にも所有者と分類を割り当て、<strong>資産目録（asset inventory）<\/strong>で管理する。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Classification<\/dt><dd>分類。重要度に応じた区分。対義の作業は declassification（分類解除）。<\/dd> <dt>Labeling / Marking<\/dt><dd>ラベリング。分類結果を媒体や文書に表示すること。<\/dd> <dt>Asset Inventory<\/dt><dd>資産目録。守るべき資産を漏れなく把握する一覧。<\/dd> <dt>Data Classification Policy<\/dt><dd>データ分類方針。レベル定義と取り扱い基準を定める。<\/dd> <\/dl> <\/div>"},{"id":"roles","n":"2","t":"データのロール（役割と責任）","en":"","h":"<p>「誰が何の責任を負うか」を明確にすることが資産保護の前提です。CISSP では次のロールが頻出します。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>ロール<\/th><th>責任<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Data Owner<\/strong>（データオーナー）<\/td><td>分類・保護方針の決定。最終責任（accountability）。通常は事業部門の管理職。<\/td><\/tr> <tr><td><strong>Data Controller<\/strong>（管理者）<\/td><td>個人データの「処理の目的・手段」を決める者（GDPR）。<\/td><\/tr> <tr><td><strong>Data Processor<\/strong>（処理者）<\/td><td>Controller の委託でデータを処理する者（クラウド事業者など）。<\/td><\/tr> <tr><td><strong>Data Custodian<\/strong>（カストディアン）<\/td><td>オーナー指示でデータを実際に保守・運用（バックアップ・パッチ等）。<\/td><\/tr> <tr><td><strong>Data Subject<\/strong>（データ主体）<\/td><td>個人データの本人。<\/td><\/tr> <tr><td><strong>User<\/strong>（利用者）<\/td><td>業務でデータを使う者。最小権限・利用規定に従う。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> Owner（決める・責任）と Custodian（守る・運用）の区別は鉄板。<strong>責任（accountability）は委任できない<\/strong>＝オーナー/経営層に残る。 GDPR 文脈では Controller / Processor の違いが問われる。<\/div>"},{"id":"lifecycle","n":"3","t":"データライフサイクル","en":"Data Lifecycle","h":"<p>データは<strong class=\"k\">生成 → 保存 → 利用 → 共有 → 保管 → 破棄<\/strong>という流れをたどります（図1）。各段階で分類に応じた保護を適用し、 不要になったら確実に破棄します。重要な考え方が2つあります。<\/p> <figure> <svg id=\"dg-d2-5\" class=\"diagram\" viewBox=\"0 0 760 230\" role=\"img\" aria-label=\"データライフサイクル：生成→保存→利用→共有→保管→破棄が循環する図\"> <g> <rect x=\"14\" y=\"40\" width=\"110\" height=\"56\" rx=\"10\" fill=\"#1f6feb\"/><text x=\"69\" y=\"74\" text-anchor=\"middle\" class=\"t\">生成 Create<\/text> <rect x=\"138\" y=\"40\" width=\"110\" height=\"56\" rx=\"10\" fill=\"#2a7de1\"/><text x=\"193\" y=\"74\" text-anchor=\"middle\" class=\"t\">保存 Store<\/text> <rect x=\"262\" y=\"40\" width=\"110\" height=\"56\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"317\" y=\"74\" text-anchor=\"middle\" class=\"t\">利用 Use<\/text> <rect x=\"386\" y=\"40\" width=\"110\" height=\"56\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"441\" y=\"74\" text-anchor=\"middle\" class=\"t\">共有 Share<\/text> <rect x=\"510\" y=\"40\" width=\"110\" height=\"56\" rx=\"10\" fill=\"#b54708\"/><text x=\"565\" y=\"74\" text-anchor=\"middle\" class=\"t\">保管 Archive<\/text> <rect x=\"634\" y=\"40\" width=\"112\" height=\"56\" rx=\"10\" fill=\"#b42318\"/><text x=\"690\" y=\"74\" text-anchor=\"middle\" class=\"t\">破棄 Destroy<\/text> <\/g> <g fill=\"var(--muted)\"> <polygon points=\"124,68 138,68 131,62 131,74\"/><polygon points=\"248,68 262,68 255,62 255,74\"/> <polygon points=\"372,68 386,68 379,62 379,74\"/><polygon points=\"496,68 510,68 503,62 503,74\"/> <polygon points=\"620,68 634,68 627,62 627,74\"/> <\/g> <path d=\"M690 96 V150 H69 V96\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/> <polygon points=\"69,96 63,108 75,108\" fill=\"var(--line)\"/> <text x=\"380\" y=\"170\" text-anchor=\"middle\" class=\"c\">各段階で「分類に応じた保護」を適用する（保持期間を過ぎたら確実に破棄）<\/text> <\/svg> <figcaption>図1：データライフサイクル（自作）。段階名は資料により多少異なるが、生成〜破棄まで一貫して保護する考え方は共通。<\/figcaption> <\/figure> <ul> <li><strong class=\"k\">データ最小化（data minimization）<\/strong>：必要なデータだけを収集・保持する。持たないデータは漏れない。<\/li> <li><strong class=\"k\">保持と破棄（retention & disposal）<\/strong>：法令・業務上の保持期間を定め、過ぎたら破棄する。「過剰保持」は法的リスク。<\/li> <\/ul> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> データの<strong>保存場所（data location）<\/strong>も重要。クラウドや海外リージョンでは越境データ移転・データ主権（data sovereignty）の問題が絡む。<\/div>"},{"id":"states","n":"4","t":"データの3つの状態","en":"States of Data","h":"<p>データ保護を考えるとき、データの<strong class=\"k\">3つの状態<\/strong>ごとに対策が異なります。これは暗号の使いどころを理解する鍵です。<\/p> <figure> <svg id=\"dg-d2-6\" class=\"diagram\" viewBox=\"0 0 760 200\" role=\"img\" aria-label=\"データの3状態：保存中・転送中・処理中とそれぞれの保護策\"> <rect x=\"20\" y=\"30\" width=\"220\" height=\"64\" rx=\"12\" fill=\"#1f6feb\"/><text x=\"130\" y=\"58\" text-anchor=\"middle\" class=\"t\">保存中 At Rest<\/text><text x=\"130\" y=\"78\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">ディスク・DB・バックアップ<\/text> <rect x=\"270\" y=\"30\" width=\"220\" height=\"64\" rx=\"12\" fill=\"#0e9f6e\"/><text x=\"380\" y=\"58\" text-anchor=\"middle\" class=\"t\">転送中 In Transit<\/text><text x=\"380\" y=\"78\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">ネットワーク通信<\/text> <rect x=\"520\" y=\"30\" width=\"220\" height=\"64\" rx=\"12\" fill=\"#b54708\"/><text x=\"630\" y=\"58\" text-anchor=\"middle\" class=\"t\">処理中 In Use<\/text><text x=\"630\" y=\"78\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">メモリ・CPU で処理<\/text> <text x=\"130\" y=\"130\" text-anchor=\"middle\" class=\"h\">保護策<\/text><text x=\"130\" y=\"150\" text-anchor=\"middle\" class=\"s\">ディスク/DB 暗号化・アクセス制御<\/text> <text x=\"380\" y=\"130\" text-anchor=\"middle\" class=\"h\">保護策<\/text><text x=\"380\" y=\"150\" text-anchor=\"middle\" class=\"s\">TLS・IPsec・VPN<\/text> <text x=\"630\" y=\"130\" text-anchor=\"middle\" class=\"h\">保護策<\/text><text x=\"630\" y=\"150\" text-anchor=\"middle\" class=\"s\">メモリ保護・機密コンピューティング<\/text> <text x=\"380\" y=\"182\" text-anchor=\"middle\" class=\"s\">※「処理中」の保護は最も難しい（復号して使うため）。近年は confidential computing が注目。<\/text> <\/svg> <figcaption>図2：データの3状態と保護策（自作）。<\/figcaption> <\/figure> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Data at Rest<\/dt><dd>保存中データ。ディスクやDBに保管された状態。ディスク/DB暗号化で守る。<\/dd> <dt>Data in Transit<\/dt><dd>転送中データ。通信中の状態。TLS/IPsec で守る。in motion とも。<\/dd> <dt>Data in Use<\/dt><dd>処理中データ。メモリ上で使用中。保護が最も難しい。<\/dd> <dt>Confidential Computing<\/dt><dd>機密コンピューティング。処理中も暗号化領域（TEE）で守る技術。<\/dd> <\/dl> <\/div>"},{"id":"remanence","n":"5","t":"データ残存とサニタイズ","en":"Data Remanence & Sanitization","h":"<p>ファイルを「削除」しても、媒体には<strong class=\"k\">データ残存（data remanence）<\/strong>が残ります。再利用・廃棄の前には、 機密度に応じた<strong class=\"k\">サニタイズ（消去）<\/strong>が必要です。NIST SP 800-88 は3段階を定義します。<\/p> <figure> <svg id=\"dg-d2-7\" class=\"diagram\" viewBox=\"0 0 760 180\" role=\"img\" aria-label=\"サニタイズの3段階：Clear, Purge, Destroy と強度の関係\"> <rect x=\"20\" y=\"40\" width=\"220\" height=\"60\" rx=\"10\" fill=\"#2a7de1\"/><text x=\"130\" y=\"66\" text-anchor=\"middle\" class=\"t\">Clear（クリア）<\/text><text x=\"130\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">上書き。通常ツールで復元不可<\/text> <rect x=\"270\" y=\"40\" width=\"220\" height=\"60\" rx=\"10\" fill=\"#b54708\"/><text x=\"380\" y=\"66\" text-anchor=\"middle\" class=\"t\">Purge（パージ）<\/text><text x=\"380\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">消磁/暗号消去。高度復元も困難<\/text> <rect x=\"520\" y=\"40\" width=\"220\" height=\"60\" rx=\"10\" fill=\"#b42318\"/><text x=\"630\" y=\"66\" text-anchor=\"middle\" class=\"t\">Destroy（破壊）<\/text><text x=\"630\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:11px\">物理破壊・焼却・粉砕<\/text> <line x1=\"20\" y1=\"125\" x2=\"740\" y2=\"125\" stroke=\"var(--muted)\" stroke-width=\"2\"/><polygon points=\"742,125 728,118 728,132\" fill=\"var(--muted)\"/> <text x=\"40\" y=\"148\" class=\"s\">弱い<\/text><text x=\"740\" y=\"148\" text-anchor=\"end\" class=\"s\">強い（媒体は再利用不可に）<\/text> <\/svg> <figcaption>図3：サニタイズ強度（自作）。出典：NIST SP 800-88 Rev.1（米国政府著作物＝パブリックドメイン）。<\/figcaption> <\/figure> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 用語の対応：<strong>Clear<\/strong>＝上書き（媒体再利用可）、<strong>Purge<\/strong>＝消磁(degaussing)/暗号消去（より強力）、 <strong>Destroy<\/strong>＝物理破壊。SSD は構造上、消磁が効かず上書きも不確実なので<strong>暗号消去（crypto-erase）や物理破壊<\/strong>が推奨される点に注意。<\/div>"},{"id":"protect","n":"6","t":"データ保護の仕組み（管理策の選定）","en":"","h":"<p>標準的な管理策（NIST SP 800-53 等のベースライン）を出発点に、自組織に合わせて<strong class=\"k\">スコーピング<\/strong>と <strong class=\"k\">テーラリング<\/strong>を行います。データ漏えい対策の代表的な技術も押さえます。<\/p> <ul> <li><strong class=\"k\">Scoping（スコーピング）<\/strong>：ベースライン管理策のうち<strong>自分に該当するものを選ぶ<\/strong>（不要なものを除外）。<\/li> <li><strong class=\"k\">Tailoring（テーラリング）<\/strong>：選んだ管理策を組織の実情に<strong>合わせて調整<\/strong>する。<\/li> <li><strong class=\"k\">DLP（Data Loss Prevention）<\/strong>：機密データの外部流出を検知・ブロック。<\/li> <li><strong class=\"k\">DRM（Digital Rights Management）<\/strong>：文書・コンテンツの利用（閲覧/印刷/コピー）を制御。<\/li> <li><strong class=\"k\">CASB（Cloud Access Security Broker）<\/strong>：クラウド利用を可視化・制御する仲介点。<\/li> <\/ul> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Scoping <span class=\"ipa\">/ˈskoʊpɪŋ/<\/span><\/dt><dd>適用対象の絞り込み。「該当する管理策を選ぶ」。<\/dd> <dt>Tailoring<\/dt><dd>調整。選んだ管理策を実情に合わせて手直しする。<\/dd> <dt>Data Loss Prevention (DLP)<\/dt><dd>データ漏えい防止。機密データの流出を検知・遮断。<\/dd> <dt>Digital Rights Management (DRM)<\/dt><dd>デジタル著作権管理。コンテンツ利用を制御。<\/dd> <dt>CASB<\/dt><dd>クラウドアクセスセキュリティブローカー。クラウド利用の可視化・制御。<\/dd> <\/dl> <\/div>"},{"id":"retention","n":"7","t":"保持と EOL / EOS","en":"","h":"<p>データだけでなく、ハードウェア・ソフトウェアにも寿命があります。<\/p> <ul> <li><strong class=\"k\">Retention（保持）<\/strong>：法令・業務に基づき保持期間を定める。期間内は確実に保持、期間後は確実に破棄。<\/li> <li><strong class=\"k\">EOL（End of Life）<\/strong>：製品の販売・提供終了。<\/li> <li><strong class=\"k\">EOS（End of Support / Service）<\/strong>：サポート（パッチ提供）終了。EOS 後の利用は<strong>脆弱性が放置される<\/strong>ため重大リスク。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> EOS を過ぎた OS/機器の使用は「パッチが出ない＝既知の脆弱性が残る」ため、リスク受容の判断や代替コントロール（隔離等）が問われる。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 2 の超要点<\/h3> <ul> <li>分類は<strong>データオーナー<\/strong>が決定。Owner（決定・責任）と Custodian（運用）を区別。<\/li> <li>データは<strong>生成〜破棄<\/strong>のライフサイクルで一貫保護。最小化と保持/破棄が鍵。<\/li> <li>3状態：<strong>at rest（ディスク暗号化）/ in transit（TLS）/ in use（最難・機密コンピューティング）<\/strong>。<\/li> <li>サニタイズ：<strong>Clear &lt; Purge &lt; Destroy<\/strong>。SSD に消磁は無効、暗号消去/物理破壊。<\/li> <li>管理策は <strong>Scoping → Tailoring<\/strong>。漏えい対策に DLP/DRM/CASB。EOS は重大リスク。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>NIST, <em>SP 800-88 Rev.1 Guidelines for Media Sanitization<\/em>（Clear/Purge/Destroy）— <a href=\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-53 Rev.5 Security and Privacy Controls<\/em>（baseline / scoping / tailoring）— <a href=\"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-60 / 800-122<\/em>（情報分類・PII 保護の考え方）— <a href=\"https://csrc.nist.gov/\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報の構造を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。 分類レベルの具体名は組織により異なるため代表例を提示。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d3","n":3,"t":"セキュリティアーキテクチャとエンジニアリング","en":"Security Architecture and Engineering","w":13,"lead":"Domain 3 は「安全な設計をどう作り込むか」の章で、CISSP の中でも最も技術的・理論的です。 セキュア設計原則、古典的セキュリティモデル（Bell-LaPadula / Biba 等）、製品評価（Common Criteria）、 そして暗号と物理セキュリティまで幅広く扱います。暗号とモデルは確実に得点源にしたい範囲です。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 3 の主要トピック（公式 Outline 3.1〜3.9 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#principles\" style=\"--c:#1f6feb\"><div class=\"ic\">📐<\/div><h4>設計原則<\/h4><small>最小権限/多層防御/ゼロトラスト<\/small><\/a> <a class=\"topic\" href=\"#models\" style=\"--c:#7c3aed\"><div class=\"ic\">🧩<\/div><h4>モデル<\/h4><small>BLP/Biba/Clark-Wilson<\/small><\/a> <a class=\"topic\" href=\"#eval\" style=\"--c:#475467\"><div class=\"ic\">🏅<\/div><h4>評価基準<\/h4><small>Common Criteria/EAL<\/small><\/a> <a class=\"topic\" href=\"#crypto\" style=\"--c:#0e9f6e\"><div class=\"ic\">🔐<\/div><h4>暗号<\/h4><small>対称/非対称/ハッシュ<\/small><\/a> <a class=\"topic\" href=\"#pki\" style=\"--c:#0e9f6e\"><div class=\"ic\">📜<\/div><h4>PKI・署名<\/h4><small>CA/証明書/電子署名<\/small><\/a> <a class=\"topic\" href=\"#attacks\" style=\"--c:#b42318\"><div class=\"ic\">💥<\/div><h4>暗号攻撃<\/h4><small>総当たり/誕生日/サイドチャネル<\/small><\/a> <a class=\"topic\" href=\"#archvuln\" style=\"--c:#b54708\"><div class=\"ic\">⚠️<\/div><h4>脆弱性<\/h4><small>クラウド/IoT/ICS/コンテナ<\/small><\/a> <a class=\"topic\" href=\"#physical\" style=\"--c:#475467\"><div class=\"ic\">🏢<\/div><h4>物理<\/h4><small>消火/電源/施設設計<\/small><\/a> <\/div>"},{"id":"principles","n":"1","t":"セキュア設計原則","en":"Secure Design Principles","h":"<p>安全なシステムは「後付け」ではなく<strong class=\"k\">設計段階から組み込む（security/privacy by design）<\/strong>のが原則です。主要な原則：<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>原則<\/th><th>意味<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Least Privilege<\/strong>（最小権限）<\/td><td>必要最小限の権限のみ付与。<\/td><\/tr> <tr><td><strong>Defense in Depth<\/strong>（多層防御）<\/td><td>複数の防御層を重ねる。1つ破られても次が守る。<\/td><\/tr> <tr><td><strong>Fail Securely / Fail-safe<\/strong><\/td><td>障害時は安全側（既定で拒否）に倒れる。<\/td><\/tr> <tr><td><strong>Secure Defaults<\/strong><\/td><td>初期設定を安全にする（既定で機能オフ等）。<\/td><\/tr> <tr><td><strong>Separation of Duties<\/strong>（職務分掌）<\/td><td>1人で完結させない。<\/td><\/tr> <tr><td><strong>Keep It Simple (KISS)<\/strong><\/td><td>複雑さは脆弱性の温床。単純に保つ。<\/td><\/tr> <tr><td><strong>Zero Trust<\/strong>（ゼロトラスト）<\/td><td>「決して信頼せず、常に検証」。境界の内外を問わず検証。<\/td><\/tr> <tr><td><strong>Privacy by Design<\/strong><\/td><td>設計段階からプライバシーを組み込む。<\/td><\/tr> <tr><td><strong>Shared Responsibility<\/strong><\/td><td>クラウドで責任を事業者と利用者で分担。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>Zero Trust<\/strong>は \"never trust, always verify\"。境界防御（信頼できる内部 LAN）の前提を捨て、 アクセスのたびに本人・端末・コンテキストを検証する。マイクロセグメンテーションや最小権限と組み合わせて問われる。<\/div>"},{"id":"models","n":"2","t":"セキュリティモデル","en":"Security Models","h":"<p>アクセス制御を数学的・形式的に表したモデル。CISSP では<strong class=\"k\">「何を守るモデルか（機密性 or 完全性）」<\/strong>と <strong class=\"k\">読み書きのルール<\/strong>がセットで問われます。<\/p> <figure> <svg id=\"dg-d3-8\" class=\"diagram\" viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"Bell-LaPadula（機密性：no read up / no write down）と Biba（完全性：no read down / no write up）の対比\"> <!-- BLP left --> <text x=\"190\" y=\"24\" text-anchor=\"middle\" class=\"t\">Bell-LaPadula（機密性）<\/text> <rect x=\"120\" y=\"40\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#1f6feb\"/><text x=\"190\" y=\"62\" text-anchor=\"middle\" class=\"lv\">High（機密）<\/text> <rect x=\"120\" y=\"92\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#2a7de1\"/><text x=\"190\" y=\"114\" text-anchor=\"middle\" class=\"lv\">Mid<\/text> <rect x=\"120\" y=\"144\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#5b9bf0\"/><text x=\"190\" y=\"166\" text-anchor=\"middle\" class=\"lv\">Low（公開）<\/text> <text x=\"40\" y=\"100\" class=\"s\" fill=\"#b42318\">読↑✗<\/text><text x=\"40\" y=\"120\" class=\"s\">no read up<\/text> <text x=\"270\" y=\"150\" class=\"s\" fill=\"#b42318\">書↓✗<\/text><text x=\"270\" y=\"170\" class=\"s\">no write down<\/text> <text x=\"190\" y=\"208\" text-anchor=\"middle\" class=\"s\">読み上げ禁止・書き下げ禁止<\/text> <text x=\"190\" y=\"226\" text-anchor=\"middle\" class=\"s\">\"no read up, no write down\"<\/text> <!-- Biba right --> <text x=\"570\" y=\"24\" text-anchor=\"middle\" class=\"t\">Biba（完全性）<\/text> <rect x=\"500\" y=\"40\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#0e9f6e\"/><text x=\"570\" y=\"62\" text-anchor=\"middle\" class=\"lv\">High（高信頼）<\/text> <rect x=\"500\" y=\"92\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#19b07d\"/><text x=\"570\" y=\"114\" text-anchor=\"middle\" class=\"lv\">Mid<\/text> <rect x=\"500\" y=\"144\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#52c79e\"/><text x=\"570\" y=\"166\" text-anchor=\"middle\" class=\"lv\">Low（低信頼）<\/text> <text x=\"650\" y=\"166\" class=\"s\" fill=\"#b42318\">読↓✗<\/text><text x=\"648\" y=\"186\" class=\"s\">no read down<\/text> <text x=\"420\" y=\"60\" class=\"s\" fill=\"#b42318\">書↑✗<\/text><text x=\"418\" y=\"80\" class=\"s\">no write up<\/text> <text x=\"570\" y=\"226\" text-anchor=\"middle\" class=\"s\">\"no read down, no write up\"（BLP の逆）<\/text> <\/svg> <figcaption>図1：Bell-LaPadula と Biba（自作）。BLP は機密性、Biba は完全性を守り、読み書きルールが逆になる。<\/figcaption> <\/figure> <div class=\"tablewrap\"> <table> <thead><tr><th>モデル<\/th><th>守るもの<\/th><th>要点<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Bell-LaPadula<\/strong><\/td><td>機密性<\/td><td>Simple: no read up／*(star): no write down。軍事の多層機密向け。<\/td><\/tr> <tr><td><strong>Biba<\/strong><\/td><td>完全性<\/td><td>Simple: no read down／*: no write up。BLP の逆。<\/td><\/tr> <tr><td><strong>Clark-Wilson<\/strong><\/td><td>完全性<\/td><td>「整形式トランザクション」と職務分掌。subject-program-object のアクセストリプル。<\/td><\/tr> <tr><td><strong>Brewer-Nash<\/strong>（Chinese Wall）<\/td><td>利益相反防止<\/td><td>過去アクセスに応じて動的にアクセスを制限。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">覚え方<\/span> <strong>B<\/strong>ell-<strong>L<\/strong>aPadula＝機密(<strong>C<\/strong>onfidentiality)、<strong>Bi<\/strong>ba＝完全性(<strong>I<\/strong>ntegrity)。 「読み上げ禁止＝上の秘密を読めない（機密性）」「書き上げ禁止＝下から上の完全性を汚せない（Biba）」と意味で覚えると混同しない。 参照モニタ(<strong>reference monitor<\/strong>)／セキュリティカーネル／TCB（信頼できる計算基盤）もこのセクションの頻出語。<\/div>"},{"id":"eval","n":"3","t":"評価基準","en":"Common Criteria","h":"<p>製品やシステムのセキュリティを第三者が客観評価する国際標準が<strong class=\"k\">Common Criteria（ISO/IEC 15408）<\/strong>です。<\/p> <ul> <li><strong class=\"k\">TOE<\/strong>（Target of Evaluation）：評価対象の製品。<\/li> <li><strong class=\"k\">PP<\/strong>（Protection Profile）：利用者側が求めるセキュリティ要件のひな型。<\/li> <li><strong class=\"k\">ST<\/strong>（Security Target）：ベンダーが示す、その製品の対応内容。<\/li> <li><strong class=\"k\">EAL1〜EAL7<\/strong>：評価保証レベル。数字が大きいほど厳格に検証（EAL1=機能テスト、EAL7=形式的検証）。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> EAL は「<strong>信頼の度合い（どれだけ厳しく検証したか）<\/strong>」を表し、機能の多さではない点に注意。旧基準の TCSEC（オレンジブック）・ITSEC は Common Criteria に統合された歴史も問われることがある。<\/div>"},{"id":"crypto","n":"4","t":"暗号の基礎","en":"Cryptography","h":"<p>暗号は3種類を区別するのが出発点です。<strong class=\"k\">対称鍵・非対称鍵・ハッシュ<\/strong>。<\/p> <figure> <svg id=\"dg-d3-9\" class=\"diagram\" viewBox=\"0 0 760 220\" role=\"img\" aria-label=\"対称鍵暗号は同じ鍵、非対称鍵暗号は公開鍵で暗号化し秘密鍵で復号\"> <text x=\"190\" y=\"22\" text-anchor=\"middle\" class=\"t\">対称鍵（Symmetric）<\/text> <rect x=\"40\" y=\"40\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\"/><text x=\"85\" y=\"65\" text-anchor=\"middle\" class=\"s\">平文<\/text> <rect x=\"250\" y=\"40\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\"/><text x=\"295\" y=\"65\" text-anchor=\"middle\" class=\"s\">暗号文<\/text> <line x1=\"130\" y1=\"60\" x2=\"250\" y2=\"60\" stroke=\"var(--muted)\"
