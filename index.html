,"q":"パスワードポリシーに関する現在の NIST SP 800-63B の考え方に最も近いものはどれか。","o":["90日ごとの強制変更と複雑性要件を必須にする","長さを重視し、根拠のない定期変更は求めない","パスワードのヒントを推奨する","知識ベース認証を推奨する"],"a":1,"e":"定期変更の強制は、予測可能な小変更（Password1→Password2）を誘発するため推奨されない。侵害の兆候がある場合に変更する。長さ・漏えいリストとの照合・MFA が現在の主流。","src":"fill","i":"q0381"},{"d":"d5","s":"models","l":3,"q":"アクセス制御の実装で「デフォルト拒否（Implicit Deny）」が重要な理由はどれか。","o":["ルール評価が短縮され、処理性能が向上するため","設定漏れがそのまま権限過剰につながるのを防ぐため","拒否ログが減り、監視の負荷が下がるため","必要なルール数が減り、設定が簡潔になるため"],"a":1,"e":"ファイアウォールでも ACL でも、最後の暗黙のルールは deny all であるべき。許可を列挙する設計（allow-list）は、未知のケースで安全側に倒れる。","src":"fill","i":"q0382"},{"d":"d5","s":"biometric","l":3,"q":"生体認証システムの登録（enrollment）段階で最も重要な統制はどれか。","o":["登録時間を短縮すること","登録時に本人性を確実に確認すること","テンプレートを平文で保存すること","複数人で同じテンプレートを共有すること"],"a":1,"e":"登録時の本人確認が甘いと、以後どれだけ精度が高くても「他人が正当な利用者として登録されている」状態になる。テンプレートは暗号化して保護し、原本画像は保持しないのが原則。","src":"fill","i":"q0383"},{"d":"d5","s":"sso","l":3,"q":"Just-In-Time（JIT）プロビジョニングの説明として正しいものはどれか。","o":["事前に全ユーザーのアカウントを作成しておく","初回ログイン時にアカウントを自動生成する","アカウントを一切作成しない","パスワードを即時発行する"],"a":1,"e":"事前の一括プロビジョニング不要で管理が軽くなるが、退職時のデプロビジョニングは別途 SCIM などで確実に行う必要がある（JIT だけでは残存アカウントが生じる）。","src":"fill","i":"q0384"},{"d":"d5","s":"lifecycle","l":2,"q":"「最小権限」を運用で実現するための実務的なアプローチはどれか。","o":["全員に管理者権限を与えて必要に応じて剥奪する","標準権限を定め、追加は期限付きで承認する","権限を固定して見直さない","権限管理を各部門に任せる"],"a":1,"e":"追加権限に期限（time-bound）を設けることで、権限クリープを構造的に抑える。定期レビューと組み合わせるのが標準的な設計。","src":"fill","i":"q0385"},{"d":"d3","s":"crypto","l":2,"q":"HMAC が提供するものはどれか。","o":["通信内容の機密性のみ","完全性と真正性","第三者に対する否認防止","障害時の可用性の確保"],"a":1,"e":"HMAC は鍵付きハッシュで、鍵を知る者だけが生成・検証できる。ただし送受信双方が同じ鍵を持つため、第三者に対する否認防止は提供しない（それにはデジタル署名が必要）。","src":"fill","i":"q0386"},{"d":"d3","s":"crypto","l":3,"q":"鍵管理のライフサイクルにおいて、最も侵害リスクが高く厳格な統制が必要な工程はどれか。","o":["鍵の生成・保管・配送の各工程","使い終えた鍵の廃棄工程のみ","鍵を用いた暗号化の実行時のみ","鍵の識別子の命名規則の設計"],"a":0,"e":"生成（十分なエントロピー）、保管（HSM）、配送（安全な経路）が要。加えてローテーション、エスクロー、鍵の分割（split knowledge / dual control）も鍵管理の要素。","src":"fill","i":"q0387"},{"d":"d3","s":"principles","l":3,"q":"「攻撃対象面の最小化（Attack Surface Reduction）」の具体例として最も適切なものはどれか。","o":["取得するログの種類と量を増やす","不要なサービスやポートを無効化する","監視カメラと入退室装置を増設する","バックアップの取得頻度を上げる"],"a":1,"e":"ハードニング（要塞化）の中心概念。デフォルトで有効な不要機能はそのまま攻撃経路になる。CIS Benchmarks 等のベースラインに沿って構成を絞る。","src":"fill","i":"q0388"},{"d":"d3","s":"archvuln","l":3,"q":"仮想化環境における「VM エスケープ」とは何か。","o":["VM が別のホストへ移動すること","ゲスト VM からハイパーバイザへ到達する攻撃","VM のバックアップを取得すること","VM のスナップショットを削除すること"],"a":1,"e":"ハイパーバイザの脆弱性を突く。対策はハイパーバイザのパッチ適用、機密度の異なるワークロードの物理分離、最小限のホスト機能。VM スプロール（管理外 VM の増殖）も別のリスク。","src":"fill","i":"q0389"},{"d":"d3","s":"physical","l":2,"q":"データセンターの電源で、瞬断や電圧変動から機器を守り、発電機起動までの橋渡しをする設備はどれか。","o":["UPS","PDU","ATS","サージプロテクタ"],"a":0,"e":"UPS は短時間の電力供給と電源品質の安定化を担い、長時間の停電には発電機（generator）へ引き継ぐ。用語として brownout（電圧低下の継続）、blackout（停電）、sag/spike（瞬間的な低下／上昇）も押さえる。","src":"fill","i":"q0390"},{"d":"d1","s":"concepts","l":3,"q":"「セキュリティ統制が業務効率を著しく損なう」場合、CISSP の考え方として最も適切なものはどれか。","o":["セキュリティを常に優先し業務を犠牲にする","リスクに見合う統制とし、代替統制も検討する","業務を常に優先し統制を外す","判断を現場に任せる"],"a":1,"e":"統制のコスト（金銭・生産性）が守る資産の価値やリスクを上回るなら、その統制は合理的でない。セキュリティは事業を可能にするための機能であり、目的ではない。","src":"fill","i":"q0391"},{"d":"d1","s":"docs","l":3,"q":"Policy（方針）に含めるべきでない内容はどれか。","o":["目的と適用範囲","違反時の措置と役割・責任","特定製品の設定手順やバージョン番号","経営層の承認"],"a":2,"e":"製品固有の手順は Procedure、設定値は Standard/Baseline に置く。方針に技術詳細を書くと、機器更新のたびに経営層承認の改訂が必要になり形骸化する。","src":"fill","i":"q0392"},{"d":"d1","s":"governance","l":2,"q":"AUP（Acceptable Use Policy）の目的はどれか。","o":["システムの技術仕様を定義する","資産の許容される利用範囲を示すこと","インシデント対応手順を定める","ベンダーとの契約条件を定める"],"a":1,"e":"AUP は利用者との合意文書で、監視の実施やプライバシーの期待水準についても明示することで、後の懲戒や調査の正当性を担保する。","src":"fill","i":"q0393"},{"d":"d1","s":"investigation","l":3,"q":"eDiscovery（電子証拠開示）に備えて組織が平時から行うべきことはどれか。","o":["すべてのデータを削除する","所在と保持期間を把握しておく","データを暗号化して鍵を破棄する","ログを取得しない"],"a":1,"e":"所在が分からないデータは開示要求に応えられず、制裁を受けうる。情報ガバナンス（分類・保持・可視化）が eDiscovery 対応能力の前提になる。","src":"fill","i":"q0394"},{"d":"d1","s":"threatmodel","l":2,"q":"攻撃者の行動を偵察から目的達成まで段階に分けて整理したモデルはどれか。","o":["STRIDE 脅威分類","Cyber Kill Chain","CMMI 成熟度モデル","COBIT ガバナンス"],"a":1,"e":"Kill Chain は段階（偵察→武器化→配送→エクスプロイト→インストール→C2→目的の実行）、ATT&CK は実際に観測された戦術・技術のナレッジベース。防御側は各段階に検知・遮断点を配置する。","src":"fill","i":"q0395"},{"d":"d4","s":"osi","l":2,"q":"TCP スリーウェイハンドシェイクの正しい順序はどれか。","o":["SYN → ACK → SYN/ACK","SYN → SYN/ACK → ACK","ACK → SYN → SYN/ACK","SYN/ACK → SYN → ACK"],"a":1,"e":"クライアントが SYN、サーバが SYN/ACK、クライアントが ACK。この途中で止めて資源を消費させるのが SYN Flood（半オープン接続）で、対策は SYN Cookie。","src":"x1","i":"q0396"},{"d":"d4","s":"osi","l":2,"q":"UDP を TCP より優先すべき状況はどれか。","o":["確実な配送が必須の金融取引","遅延に敏感な VoIP や動画配信","欠損の許されない大容量転送","再送が前提の電子メール配送"],"a":1,"e":"UDP はコネクションレスでハンドシェイク・再送がないため低遅延。音声・映像は多少のパケット欠損より遅延の方が致命的なので UDP を選ぶ。信頼性が要る用途は TCP。","src":"x1","i":"q0397"},{"d":"d4","s":"osi","l":1,"q":"OSI 第2層で動作し、MAC アドレステーブルに基づきフレームを転送する機器はどれか。","o":["リピータ","スイッチ","ルータ","ゲートウェイ"],"a":1,"e":"L1=リピータ／ハブ、L2=スイッチ／ブリッジ、L3=ルータ、L7=ゲートウェイ（プロトコル変換）。層と機器の対応は頻出。","src":"x1","i":"q0398"},{"d":"d4","s":"osi","l":3,"q":"ある拠点でブロードキャストストームが発生し、L2 スイッチ間でフレームが無限循環している。根本的な対策はどれか。","o":["スイッチのポートを増設する","STP を有効化する","VLAN の設定を削除する","MTU のサイズを拡大する"],"a":1,"e":"L2 にはループを検出する TTL がないため、冗長配線があるとフレームが永久に回る。STP（および RSTP）が論理的にループを遮断する。L3 は IP ヘッダの TTL があるので同じ問題は起きない。","src":"x1","i":"q0399"},{"d":"d4","s":"ip","l":2,"q":"ICMP を利用した攻撃で、偽装した送信元へ大量の応答を集中させるものはどれか。","o":["Teardrop","Smurf","Fraggle","LAND"],"a":1,"e":"Smurf は ICMP Echo をブロードキャストへ送り、送信元を被害者に偽装して増幅応答を集中させる。Fraggle は同じ手口を UDP で行う。Teardrop は断片化オフセットの改ざん、LAND は送信元と宛先を同一にする攻撃。","src":"x1","i":"q0400"},{"d":"d4","s":"ip","l":2,"q":"IPv6 が IPv4 に対して標準で備える、セキュリティ上の主要な改善点はどれか。","o":["NAT が必須になった","IPsec が仕様に組み込まれている","ブロードキャストが強化された","アドレス長が 64 ビットになった"],"a":1,"e":"IPv6 は IPsec を前提に設計されている（実装必須から推奨に緩和された経緯はあるが、試験上は「IPsec 組み込み」）。IPv6 はブロードキャストを廃止しマルチキャスト／エニーキャストを使い、アドレスは 128 ビット。","src":"x1","i":"q0401"},{"d":"d4","s":"ip","l":1,"q":"LDAP over SSL（LDAPS）が使用する既定ポートはどれか。","o":["389","636","1812","3389"],"a":1,"e":"LDAP=389、LDAPS=636。1812 は RADIUS 認証、3389 は RDP。平文／暗号のポート対応（HTTP80/HTTPS443、FTP21/FTPS990、SMTP25/SMTPS465・587、IMAP143/993、POP110/995）は暗記事項。","src":"x1","i":"q0402"},{"d":"d4","s":"secure-proto","l":2,"q":"S/MIME と TLS の役割の違いとして最も正確なものはどれか。","o":["両者とも通信路のみを保護する","S/MIME は端点間、TLS は経路","S/MIME は対称鍵のみを使う","TLS はメールにしか使えない"],"a":1,"e":"TLS はサーバ間の区間暗号なので、経由するメールサーバ上では平文になる。S/MIME はメッセージそのものを署名・暗号化するため、保存時も含めて送信者から受信者まで保護される。","src":"x1","i":"q0403"},{"d":"d4","s":"secure-proto","l":2,"q":"DNSSEC が提供するセキュリティ機能はどれか。","o":["DNS クエリの機密性（暗号化）","DNS 応答の完全性と出所の認証","DNS サーバの可用性向上","名前解決の高速化"],"a":1,"e":"DNSSEC は電子署名により「改ざんされていない・正しい権威サーバ由来である」ことを保証する。機密性は提供しない（暗号化したいなら DoH／DoT）。キャッシュポイズニング対策として問われる。","src":"x1","i":"q0404"},{"d":"d4","s":"devices","l":2,"q":"ステートフルインスペクションファイアウォールがステートレスなパケットフィルタより優れている点はどれか。","o":["処理が高速である","確立済みセッションの戻りのみ許可できる","アプリケーション層のコンテンツを検査できる","暗号化通信を復号できる"],"a":1,"e":"ステートフルは接続の文脈を保持するため、「内部から出た通信の戻りだけ通す」という制御ができる。コンテンツ検査はアプリケーション層 FW／プロキシ、復号は TLS インスペクション機能。速度は逆にステートレスの方が速い。","src":"x1","i":"q0405"},{"d":"d4","s":"devices","l":3,"q":"外部からの Web 攻撃を防ぎつつ、内部利用者の Web 閲覧も制御したい。多層防御として最も適切な組み合わせはどれか。","o":["境界ルータの ACL のみ","受信側に WAF、送信側にプロキシを置く","内部にホスト型 IDS のみ","すべての通信を VPN 化する"],"a":1,"e":"方向で役割が違う。外→内の Web アプリ防御は WAF（リバースプロキシ）、内→外の閲覧制御・マルウェア防止はフォワードプロキシ／SWG。CISSP は「どの位置に何を置くか」を問う。","src":"x1","i":"q0406"},{"d":"d4","s":"devices","l":2,"q":"IDS と IPS の本質的な違いはどれか。","o":["IDS は署名ベース、IPS は異常ベースである","IDS は検知のみ、IPS はインラインで遮断する","IDS はネットワーク型のみ存在する","IPS はログを残さない"],"a":1,"e":"違いは配置と権限。IDS はミラーポートで受動的に監視、IPS はインラインで能動的に遮断する。ただし IPS は誤検知が即業務停止につながるため、導入初期は検知モードで運用しチューニングするのが定石。","src":"x1","i":"q0407"},{"d":"d4","s":"segmentation","l":2,"q":"VLAN によるセグメンテーションが提供するものはどれか。","o":["物理的なケーブル単位の分離","ブロードキャストドメインの論理分離","経路上で暗号化された通信路","障害時に自動で切り替わる冗長経路"],"a":1,"e":"VLAN は論理分離であり、物理的には同じスイッチを共有する。したがって VLAN ホッピング（ダブルタギング、スイッチスプーフィング）のリスクがあり、未使用ポートの無効化・ネイティブ VLAN の変更・DTP 無効化が対策。","src":"x1","i":"q0408"},{"d":"d4","s":"segmentation","l":3,"q":"工場の制御システム（OT）を IT ネットワークから守る設計として最も適切なものはどれか。","o":["OT を IT と同じ VLAN に収容し監視を強化する","データダイオードや DMZ による階層分離","OT 機器に最新の EDR を必ず導入する","OT を直接インターネットに接続し、クラウド監視に任せる"],"a":1,"e":"OT は可用性最優先でパッチ適用が困難な機器が多い。したがってホスト側対策に頼らず、ネットワーク階層分離（Purdue/ISA-95）と、外向き一方向のみ許す仕組みで守るのが基本。","src":"x1","i":"q0409"},{"d":"d4","s":"segmentation","l":2,"q":"802.1X による NAC で、認証を行う 3 つの構成要素の組み合わせとして正しいものはどれか。","o":["サプリカント／オーセンティケータ／認証サーバ","クライアント／プロキシ／ファイアウォール","ユーザ／管理者／監査人","エージェント／マネージャ／コレクタ"],"a":0,"e":"サプリカント（端末）→ オーセンティケータ（スイッチ／AP）→ 認証サーバ（RADIUS）。認証成功まではポートが遮断され、成功後に適切な VLAN が割り当てられる。EAP がその上で使われる。","src":"x1","i":"q0410"},{"d":"d4","s":"wireless","l":2,"q":"WPA3-Personal が WPA2-Personal に対して解決した主要な弱点はどれか。","o":["電波の到達距離が短く実用性を欠く点","事前共有鍵へのオフライン辞書攻撃","端末の電力消費が大きくなる点","SSID を隠蔽できない仕様上の制約"],"a":1,"e":"WPA2-PSK はハンドシェイクを捕捉すればオフラインで総当たりできた。WPA3 は SAE（Dragonfly）で相互認証と前方秘匿性を導入し、オフライン攻撃を成立させない。","src":"x1","i":"q0411"},{"d":"d4","s":"wireless","l":1,"q":"公衆無線 LAN で最も現実的かつ効果的な利用者側の対策はどれか。","o":["SSID を隠す","MAC アドレスフィルタリングを使う","VPN を使ってエンドツーエンドで暗号化する","WEP を有効にする"],"a":2,"e":"利用者はアクセスポイントを制御できないため、上位層で自衛する。SSID 隠蔽と MAC フィルタは容易に回避され、WEP は既に破られている。","src":"x1","i":"q0412"},{"d":"d4","s":"wireless","l":2,"q":"Evil Twin 攻撃の説明として最も適切なものはどれか。","o":["同じ SSID の偽 AP で通信を傍受する","AP の電源を落として可用性を奪う","無線チャネルを妨害電波で埋める","AP のファームウェアを改ざんする"],"a":0,"e":"Evil Twin は中間者攻撃の一種。対策は相互認証を伴う 802.1X（EAP-TLS）、証明書検証の強制、および VPN。単なる電波妨害は Jamming。","src":"x1","i":"q0413"},{"d":"d4","s":"channels","l":2,"q":"IPsec のトンネルモードとトランスポートモードの違いとして正しいものはどれか。","o":["元の IP ヘッダごと暗号化し再カプセル化する","トランスポートモードの方が常に安全である","トンネルモードは認証を行わない","トランスポートモードは必ずゲートウェイ間で使う"],"a":0,"e":"トンネルモードは元パケット全体をカプセル化するため、内部アドレスを隠せる＝サイト間 VPN 向き。トランスポートモードはペイロードのみ暗号化し、ホスト間通信向き。","src":"x1","i":"q0414"},{"d":"d4","s":"channels","l":2,"q":"IPsec で機密性（暗号化）を提供するプロトコルはどれか。","o":["AH","ESP","IKE","ISAKMP"],"a":1,"e":"AH は完全性・認証・リプレイ防止のみで暗号化しない。ESP は暗号化＋完全性を提供する。IKE/ISAKMP は鍵交換とセキュリティアソシエーション（SA）確立を担う。","src":"x1","i":"q0415"},{"d":"d4","s":"channels","l":3,"q":"リモートワーカーが社内システムにアクセスする際、端末の一部トラフィックだけを VPN 経由にする「スプリットトンネリング」の主なリスクはどれか。","o":["VPN 装置の処理性能が不足し速度が落ちる","感染端末が社内への踏み台になり得る","割り当てる IP アドレスが枯渇する","認証が二重になり利便性を損なう"],"a":1,"e":"スプリットトンネルは帯域を節約できるが、境界防御をバイパスした経路が生まれる。高セキュリティ環境ではフルトンネル（全通信を社内経由で検査）が原則。","src":"x1","i":"q0416"},{"d":"d4","s":"channels","l":2,"q":"多層防御の観点から、テレフォニー／VoIP 環境で優先すべき対策はどれか。","o":["音声 VLAN の分離と SRTP の適用","内線番号を非公開にする","電話機のファームウェア更新を停止する","すべての通話を録音する"],"a":0,"e":"VoIP はデータ網に乗るためデータ側の脅威をそのまま受ける。分離（VLAN）＋暗号（SRTP/TLS）が基本。ヴィッシングやトールフラウド対策として認証も重要。","src":"x1","i":"q0417"},{"d":"d5","s":"iaaa","l":2,"q":"「Identification」と「Authentication」の違いとして最も正確なものはどれか。","o":["Identification は本人性の証明、Authentication は主張である","Identification は「私は誰か」の主張、Authentication はその主張の検証である","両者は同義である","Authentication の後に Identification を行う"],"a":1,"e":"順序は Identification（主張）→ Authentication（検証）→ Authorization（権限付与）→ Accountability（追跡）。ID は一意でなければならず、共有アカウントは Accountability を破壊する。","src":"x1","i":"q0418"},{"d":"d5","s":"iaaa","l":2,"q":"監査ログによる Accountability を成立させるために必須の前提はどれか。","o":["すべてのユーザが同一の管理者アカウントを使うこと","一意の ID と、ログの完全性保護","ログを 24 時間以内に削除すること","ログをローカルディスクにのみ保存すること"],"a":1,"e":"誰がやったかを後から証明するには、ID の一意性とログの信頼性の両方が要る。特権ユーザが自分のログを消せる状態では Accountability は成立しないため、ログの集中管理・WORM・職務分掌が必要。","src":"x1","i":"q0419"},{"d":"d5","s":"factors","l":2,"q":"次のうち「Type 2（something you have）」に分類されるものはどれか。","o":["パスフレーズ","ハードウェアトークン","静脈パターン","タイピングの癖"],"a":1,"e":"Type1=知識（パスワード・PIN）、Type2=所持（トークン・スマートカード・スマホ）、Type3=生体（指紋・虹彩・静脈）。タイピングリズムは行動的生体認証で Type3 に含まれる。","src":"x1","i":"q0420"},{"d":"d5","s":"factors","l":3,"q":"パスワード＋PIN の組み合わせは多要素認証（MFA）と言えるか。最も適切な説明はどれか。","o":["言える。2つの異なる情報を使うため","言えない。両方とも知識要素である","言える。PIN は所持要素だから","状況によって変わる"],"a":1,"e":"MFA は「異なるカテゴリ」の要素を組み合わせることが要件。同一カテゴリを2つ重ねるのは多要素ではなく多段階。同じ攻撃手法（フィッシング・キーロガー）で両方奪われる点が本質的な弱点。","src":"x1","i":"q0421"},{"d":"d5","s":"biometric","l":2,"q":"バイオメトリクスシステムのチューニングで、FAR と FRR が等しくなる点を何と呼ぶか。","o":["Type I Error Rate","Crossover Error Rate","Throughput Rate","Enrollment Rate"],"a":1,"e":"CER は装置間の精度を比較する共通指標で、低いほど高精度。FRR＝Type I（本人拒否）、FAR＝Type II（他人受入）。高セキュリティ用途では FAR を下げる（＝FRR が上がるのを許容する）方向に閾値を設定する。","src":"x1","i":"q0422"},{"d":"d5","s":"biometric","l":3,"q":"核施設の入退室にバイオメトリクスを導入する。閾値設定の方針として最も適切なものはどれか。","o":["FRR を最小化して利用者の利便性を優先する","FAR を最小化し、本人拒否が増えることを許容する","CER をそのまま採用する","登録時間を最短にする"],"a":1,"e":"誤って他人を通す（FAR＝Type II）ことが致命的な環境では、本人が弾かれる不便（FRR）を受け入れる。逆に一般オフィスの利便性重視なら FRR を下げる。「守る資産の価値で決まる」という考え方が問われる。","src":"x1","i":"q0423"},{"d":"d5","s":"sso","l":3,"q":"Kerberos において、リプレイ攻撃を防ぐために使われる仕組みはどれか。","o":["チケットそのものの暗号化のみ","タイムスタンプと有効期間による検証","送信元 IP アドレスによる制限","パスワードの定期的な変更"],"a":1,"e":"Kerberos はタイムスタンプ付きオーセンティケータでリプレイを防ぐため、クライアントと KDC の時刻ずれ（既定で 5 分以内）が許容範囲を超えると認証が失敗する。NTP は Kerberos 環境の必須要件。","src":"x1","i":"q0424"},{"d":"d5","s":"sso","l":2,"q":"Kerberos の単一障害点（SPOF）はどれか。","o":["クライアント端末","KDC（鍵配布センター）","アプリケーションサーバ","ネットワークスイッチ"],"a":1,"e":"KDC が停止すると誰も新規チケットを取得できず、全体が認証不能になる。また KDC はすべての秘密鍵を保持するため、侵害されれば全ドメインが陥落する。冗長化と厳格な保護が必須。","src":"x1","i":"q0425"},{"d":"d5","s":"sso","l":2,"q":"SSO 導入の最大のセキュリティ上のトレードオフはどれか。","o":["ログイン回数が減り監査が困難になる","1つの資格情報で全システムが侵害される","パスワードポリシーが適用できない","ユーザ登録ができなくなる"],"a":1,"e":"利便性と引き換えに「鍵の集中」が起きる。だから SSO は必ず強力な MFA・条件付きアクセス・セッション管理とセットで設計する。監査はむしろ一元化されて容易になる。","src":"x1","i":"q0426"},{"d":"d5","s":"federation","l":2,"q":"SAML において「アイデンティティプロバイダ（IdP）」の役割はどれか。","o":["リソースを保有し、アクセス可否を最終決定する","利用者を認証し、アサーションを発行する","証明書を失効させる","属性を暗号化して保存する"],"a":1,"e":"IdP が認証しアサーション（署名付き XML）を発行、SP（サービスプロバイダ）がそれを検証してアクセスを許可する。SP は認証情報そのものを持たない点が федерации の要点。","src":"x1","i":"q0427"},{"d":"d5","s":"federation","l":3,"q":"OAuth 2.0 と OpenID Connect の関係として最も正確なものはどれか。","o":["OAuth 2.0 は認証、OIDC は認可のプロトコルである","OAuth は認可、OIDC はその上の認証層","両者は互換性がない別系統である","OIDC は SAML の別名である"],"a":1,"e":"OAuth 単体は「このアプリに私の代わりに API を叩く権限を与える」という認可の仕組みであり、認証には設計されていない。OIDC が id_token（JWT）を追加して認証を標準化した。「OAuth を認証に流用する」のはアンチパターン。","src":"x1","i":"q0428"},{"d":"d5","s":"federation","l":2,"q":"クラウドサービス群への認証・認可を仲介し、ポリシー適用や可視化を行う仕組みはどれか。","o":["CASB／IDaaS","HIDS","DLP エージェント","SIEM"],"a":0,"e":"CASB はクラウド利用の可視化・制御を担い、IDaaS は ID 連携を仲介する。SIEM はログ相関分析、DLP はデータ流出防止、HIDS はホスト侵入検知で役割が異なる。","src":"x1","i":"q0429"},{"d":"d5","s":"models","l":2,"q":"RBAC が大規模組織で好まれる理由として最も適切なものはどれか。","o":["ユーザ個別に権限を細かく設定できるから","職務に権限を紐づけ、異動時に一括変更できる","データ所有者が自由に共有できるから","ラベルによる強制制御ができるから"],"a":1,"e":"RBAC は「人ではなく職務に権限を付ける」ため、管理コストと権限の付与ミスを大きく減らせる。DAC は所有者裁量、MAC はラベルによる強制、ABAC は属性による動的判定。","src":"x1","i":"q0430"},{"d":"d5","s":"models","l":3,"q":"「取引時間内は本社ネットワークからのみ、管理者ロールで、かつ会社支給端末から」という条件で許可を判断したい。最も適したアクセス制御モデルはどれか。","o":["DAC","MAC","RBAC","ABAC"],"a":3,"e":"ABAC（属性ベース）は主体・客体・環境（時刻・場所・端末状態）の属性を組み合わせて動的に判定できる。ゼロトラストの条件付きアクセスは実質 ABAC。RBAC だけでは環境条件を表現できない。","src":"x1","i":"q0431"},{"d":"d5","s":"models","l":2,"q":"MAC（強制アクセス制御）の特徴として正しいものはどれか。","o":["データ所有者が権限を委譲できる","ラベルとクリアランスで強制的に判定する","ロールを介して権限を割り当てる","属性の組み合わせで動的に判定する"],"a":1,"e":"MAC は軍事・政府など機密区分が明確な環境で使われる。所有者の裁量が入らないため最も厳格だが、柔軟性は低い。SELinux が実装例。","src":"x1","i":"q0432"},{"d":"d5","s":"lifecycle","l":2,"q":"アカウント管理で「特権クリープ（privilege creep）」を防ぐ最も効果的な統制はどれか。","o":["パスワードの定期的な強制変更","定期的なアクセスレビューと権限の再設定","試行失敗時のアカウントロックアウト","多要素認証の全社的な導入"],"a":1,"e":"異動を繰り返すと旧職務の権限が残り、最小権限が崩れる。これを是正するのはアクセスレビュー（recertification）。MFA は認証の強化であって認可の是正にはならない。","src":"x1","i":"q0433"},{"d":"d5","s":"lifecycle","l":3,"q":"従業員が退職する際、セキュリティ上最も優先度が高い措置はどれか。","o":["人事ファイルと組織図の更新","アカウントの即時無効化","在職中の功績に対する表彰の実施","私物端末に残るデータの初期化"],"a":1,"e":"退職・解雇時はアクセス剥奪が最優先。特に非自発的離職では、面談と同時、あるいは面談前に無効化するのが実務。アカウントは削除ではなくまず無効化し、証跡とデータ所有権の移管を済ませてから削除する。","src":"x1","i":"q0434"},{"d":"d5","s":"lifecycle","l":2,"q":"特権アクセス管理（PAM）における「Just-in-Time（JIT）アクセス」の目的はどれか。","o":["特権を常時付与して運用を効率化する","必要な時だけ付与し、使用後に自動剥奪する","特権アカウントを共有して管理を簡単にする","特権のログ取得を省略する"],"a":1,"e":"常設の管理者権限は侵害時の被害を最大化する。JIT は「立っている特権をなくす（zero standing privilege）」考え方で、承認・時間制限・セッション記録とセットで運用する。","src":"x1","i":"q0435"},{"d":"d6","s":"strategy","l":2,"q":"第三者による監査で、監査人に求められる最も重要な資質はどれか。","o":["対象システムの開発経験があること","独立性と客観性","経営層との親密な関係","最新ツールの保有"],"a":1,"e":"監査人が自分の作ったものを監査すれば職務分掌が崩れる。独立性がないと結論の信頼性が失われる。内部監査は取締役会／監査委員会へ直接報告するラインを持つのが原則。","src":"x1","i":"q0436"},{"d":"d6","s":"vavp","l":3,"q":"ペネトレーションテスト中に、テスト範囲外のシステムへ到達できる経路を発見した。最も適切な行動はどれか。","o":["範囲外なので無視して報告しない","中断して依頼者に報告し、指示を仰ぐ","範囲外だが有用なので侵入して確認する","テスト終了後に最終報告書へ記載するだけにする"],"a":1,"e":"ROE の範囲を独断で超えてはならない。ただし重大な発見を黙殺するのも不適切なので、いったん止めて依頼者に判断を委ねるのが正解。CISSP では「権限の範囲」と「誠実な開示」の両立が問われる。","src":"x1","i":"q0437"},{"d":"d6","s":"vavp","l":2,"q":"ブラックボックステストの特徴として正しいものはどれか。","o":["内部構造の知識を前提に網羅的に検証する","事前情報なしで攻撃者の視点を再現する","ソースコードを静的に解析する","開発者自身が実施する"],"a":1,"e":"ブラック＝情報なし（現実性が高いが時間がかかり網羅性が落ちる）、ホワイト＝完全情報（網羅的・効率的）、グレー＝部分情報。目的が「現実の攻撃再現」か「網羅的な弱点洗い出し」かで選ぶ。","src":"x1","i":"q0438"},{"d":"d6","s":"testtypes","l":2,"q":"SAST と DAST の違いとして最も正確なものはどれか。","o":["SAST は実行時に外部から検査し、DAST はソースコードを解析する","SAST は実行せず解析、DAST は実行中を検査","両者とも実行時解析である","DAST は設定ファイルのみを検査する"],"a":1,"e":"SAST は開発早期に適用でき修正コストが安いが誤検知が多い。DAST は実際の挙動を見るので誤検知が少ないが、コード上の位置特定が難しく後工程になる。IAST は両者を組み合わせる。","src":"x1","i":"q0439"},{"d":"d6","s":"testtypes","l":3,"q":"新規 API に想定外の入力を大量投入し、クラッシュや例外から脆弱性を探る手法はどれか。","o":["回帰テスト","ファジング（Fuzzing）","ミスユースケーステスト","インタフェーステスト"],"a":1,"e":"ファジングは変異型（既存データを改変）と生成型（仕様から生成）に分かれる。境界値・異常系の未処理を発見するのに有効で、バッファオーバーフローや入力検証不備の検出に使われる。","src":"x1","i":"q0440"},{"d":"d6","s":"testtypes","l":2,"q":"コードの何割が実行されたかを測る指標を何と呼ぶか。","o":["コードカバレッジ","サイクロマティック複雑度","技術的負債","欠陥密度"],"a":0,"e":"カバレッジには文（statement）、分岐（branch）、条件、パス、ループなどの種類がある。カバレッジが高い＝品質が高い、とは限らない点に注意（テストの質は別問題）。","src":"x1","i":"q0441"},{"d":"d6","s":"testtypes","l":2,"q":"「ミスユースケース（misuse case）」テストの目的はどれか。","o":["正常系の機能要件が満たされるかを確認する","攻撃者による悪用経路をモデル化し検証する","高負荷時の性能限界と劣化点を測定する","利用者にとっての使いやすさを評価する"],"a":1,"e":"ユースケースの裏返しで、脅威モデリングとテストを接続する手法。設計段階でセキュリティ要件を引き出すのに使われる。","src":"x1","i":"q0442"},{"d":"d6","s":"logs","l":2,"q":"合成トランザクション（synthetic transaction）による監視の利点はどれか。","o":["実ユーザのトラフィックのみを分析できる","利用者がいない時間帯でも能動的に確認できる","ログ容量を削減できる","暗号化通信を復号できる"],"a":1,"e":"合成監視はスクリプト化した擬似操作を定期実行する能動的手法。対して RUM（実ユーザ監視）は受動的に実トラフィックを観測する。両者は補完関係。","src":"x1","i":"q0443"},{"d":"d6","s":"logs","l":3,"q":"SIEM に大量のログを集約したが、アナリストがアラート疲れを起こしている。最も適切な改善策はどれか。","o":["収集するログの範囲を絞り件数を減らす","資産の重要度に基づき相関ルールを調整する","通知先を増やして担当者を分散させる","ログの保持期間を短縮して負荷を下げる"],"a":1,"e":"検知の質は「何を検知したいか」の定義から決まる。収集量を増やすだけでは信号対雑音比は改善しない。ベースライン確立、相関ルールの見直し、重大度の階層化が本筋。","src":"x1","i":"q0444"},{"d":"d6","s":"processdata","l":2,"q":"KPI と KRI の違いとして最も適切なものはどれか。","o":["KPI は将来のリスク兆候、KRI は過去の成果を示す","KPI は達成度、KRI は増大の予兆","両者は同義である","KRI は財務指標のみを指す"],"a":1,"e":"KPI は「どれだけうまくやれているか（後追い・lagging）」、KRI は「どれだけ危険が高まっているか（先行・leading）」。経営報告では両方を組み合わせる。","src":"x1","i":"q0445"},{"d":"d6","s":"processdata","l":2,"q":"バックアップの検証として最も信頼できる方法はどれか。","o":["バックアップジョブの成功ログを確認する","実際にリストアして整合性を確認する","メディアの本数を数える","保管庫の温度を確認する"],"a":1,"e":"「取れている」と「戻せる」は別問題。ジョブ成功でも、復旧手順の不備・鍵の紛失・媒体の劣化で戻せないことがある。定期的なリストア演習が唯一の証明。","src":"x1","i":"q0446"},{"d":"d6","s":"audit","l":3,"q":"クラウド事業者から SOC 2 Type II 報告書を受領した。Type I との本質的な違いはどれか。","o":["Type II は財務諸表監査である","Type II は一定期間の運用有効性を検証する","Type I の方が範囲が広い","Type II は公開が義務付けられている"],"a":1,"e":"設計（Type I）と運用（Type II）の差。ベンダー評価では原則 Type II を求める。SOC 1 は財務報告に関わる統制、SOC 2 はセキュリティ等のトラストサービス基準、SOC 3 は SOC 2 の一般公開向け要約。","src":"x1","i":"q0447"},{"d":"d6","s":"audit","l":2,"q":"内部監査部門が経営陣ではなく取締役会（監査委員会）に報告すべき理由はどれか。","o":["報告書の作成が容易になるため","被監査側からの独立性を確保するため","法律で報告先が1つに限定されているため","コストを削減するため"],"a":1,"e":"被監査部門に報告ラインが従属すると、不都合な指摘が抑圧される。独立性はガバナンス構造で担保する。","src":"x1","i":"q0448"},{"d":"d6","s":"audit","l":2,"q":"監査で「証拠（evidence）」として最も証明力が高いものはどれか。","o":["被監査部門の担当者による口頭説明","監査人が直接取得した記録や抽出データ","過去の監査報告書からの引用と要約","ベンダーが提供する製品パンフレット"],"a":1,"e":"証拠力は「直接・客観・第三者由来」が高い。口頭説明（inquiry）は最も弱く、必ず裏付け（inspection / observation / reperformance）と突合する。","src":"x1","i":"q0449"},{"d":"d6","s":"strategy","l":3,"q":"限られた予算でセキュリティテスト計画を立てる。最も適切な優先順位付けの根拠はどれか。","o":["直近に公表された攻撃トレンドの順","資産価値と脅威と統制の弱さの積","経営層からの関心が高いものの順","前年度の監査で指摘を受けた順"],"a":1,"e":"リスクベースが原則。規制要件（PCI DSS の年次ペンテスト等）は最低ラインとして満たしつつ、残りの資源をリスクの高い領域に配分する。","src":"x1","i":"q0450"},{"d":"d6","s":"vavp","l":2,"q":"脆弱性スキャンで検出された「誤検知（false positive）」を放置した場合の最大の問題はどれか。","o":["スキャンの所要時間が延びてしまう","対応資源が浪費され、真の脆弱性が埋もれる","ツールのライセンス費用が増加する","スキャン時の帯域が枯渇してしまう"],"a":1,"e":"誤検知の放置は運用の信頼性を損ない、やがてレポート全体が無視される。検証と抑制（tuning）を回すことが前提。より危険なのは false negative（見逃し）であり、複数手法の併用で補う。","src":"x1","i":"q0451"},{"d":"d6","s":"logs","l":2,"q":"ログを改ざんから守るために最も有効な仕組みはどれか。","o":["ログをローカルサーバのみに保存する","集中サーバへの即時転送と WORM 保護","管理者権限を全員に付与する","ログを毎日削除する"],"a":1,"e":"侵害者が最初に狙うのはログの消去。ホストから切り離した場所へ即時転送し、追記のみ（WORM）や署名で完全性を保証する。これはフォレンジックでの証拠能力にも直結する。","src":"x1","i":"q0452"},{"d":"d2","s":"classify","l":3,"q":"データ分類制度を新規導入する。最初に行うべきことはどれか。","o":["利用する分類ラベルの色と表記を決める","資産の棚卸しと分類基準の定義","検知に用いる DLP 製品を選定する","全社員向けの分類研修を実施する"],"a":1,"e":"何があるか分からないものは守れない。資産インベントリと分類基準の策定が起点で、ツール導入や研修はその後。区分は3〜4段階に絞るのが実務上の定石（多すぎると運用が破綻する）。","src":"x2","i":"q0453"},{"d":"d2","s":"roles","l":2,"q":"データオーナー（Data Owner）の責任として最も適切なものはどれか。","o":["日々のバックアップ運用を実施する","分類の決定とアクセス権の承認","暗号鍵をハードウェアに格納する","監査ログを分析する"],"a":1,"e":"オーナーは経営／業務側の責任者で「決める人」。カストディアン（Custodian）は IT 側で「守る人」＝日常運用。この役割分離は繰り返し問われる。","src":"x2","i":"q0454"},{"d":"d2","s":"roles","l":2,"q":"GDPR における「データ処理者（Processor）」の説明として正しいものはどれか。","o":["処理の目的と手段を決定する主体","管理者の指示に基づいて処理する主体","監督機関に所属する監査人","データ主体本人"],"a":1,"e":"目的と手段を決めるのが Controller、その指示で処理するのが Processor。クラウド事業者は通常 Processor。両者の責任範囲は契約（DPA）で明確化する必要がある。","src":"x2","i":"q0455"},{"d":"d2","s":"lifecycle","l":2,"q":"データライフサイクルにおいて、保護要件が最も見落とされやすいフェーズはどれか。","o":["作成","保存","共有／転送","廃棄"],"a":3,"e":"廃棄は「終わったこと」として軽視されやすいが、不適切な廃棄は最も直接的な漏えい原因になる。中古機器・複合機の HDD・クラウド上の残存コピーが典型的な事故要因。","src":"x2","i":"q0456"},{"d":"d2","s":"states","l":2,"q":"「使用中のデータ（Data in Use）」を保護する技術として最も適切なものはどれか。","o":["TLS による通信路の暗号化","ディスク全体の暗号化","セキュアエンクレーブと機密計算","保管庫での媒体の施錠管理"],"a":2,"e":"保存時＝FDE／DB 暗号、転送時＝TLS/IPsec、使用時＝メモリ上で復号されるため守りにくく、TEE（SGX、SEV）や準同型暗号が該当する。3状態と対策の対応は頻出。","src":"x2","i":"q0457"},{"d":"d2","s":"remanence","l":3,"q":"SSD を再利用せず廃棄する。機密度が最高レベルの場合、最も確実な方法はどれか。","o":["複数回の上書き（オーバーライト）","消磁（デガウス）","物理破壊（シュレッド／溶解）","クイックフォーマット"],"a":2,"e":"SSD はウェアレベリングにより上書きが全セルに届かず、磁気媒体でないため消磁も効かない。暗号化消去（Crypto-Erase）は有効だが、最高機密では物理破壊が唯一確実。媒体種別で正解が変わる点が要注意。","src":"x2","i":"q0458"},{"d":"d2","s":"remanence","l":2,"q":"「Purging」と「Clearing」の違いとして正しいものはどれか。","o":["Clearing はラボレベルの攻撃にも耐える","Purging はより強く、復元不能にする","両者は同義である","Purging は媒体を再利用できない"],"a":1,"e":"Clearing は通常の手段（OS の API 等）による復元を防ぐレベル、Purging は高度な研究室レベルの手段にも耐えるレベル、Destruction は物理破壊。NIST 800-88 の Clear / Purge / Destroy の階層。","src":"x2","i":"q0459"},{"d":"d2","s":"protect","l":2,"q":"DLP を導入する際、最も効果を左右する前提条件はどれか。","o":["導入するエージェントが軽量であること","データ分類とポリシー定義が済んでいること","十分なネットワーク帯域があること","ベンダーの市場シェアが高いこと"],"a":1,"e":"DLP は「何が機密か」を知らなければ何も検知できない。分類が未整備のまま導入すると誤検知の山になり、運用が止まる。分類 → ラベリング → ポリシー → DLP の順。","src":"x2","i":"q0460"},{"d":"d2","s":"protect","l":2,"q":"トークナイゼーションと暗号化の違いとして最も正確なものはどれか。","o":["トークナイゼーションは鍵で復号できる","元データは保管庫に置き、無関係な値に置換する","暗号化は元データを保持しない","両者は同一技術である"],"a":1,"e":"暗号文は鍵があれば復号できるが、トークンは元データとの数学的関係を持たないため、トークン単体からは復元できない。PCI DSS のスコープ削減に使われる。","src":"x2","i":"q0461"},{"d":"d2","s":"retention","l":3,"q":"訴訟が予見される状況で、通常の保持ポリシーに基づくデータ削除を続けた場合の問題はどれか。","o":["保管に要するストレージ費用が増える","証拠隠滅とみなされ制裁を受け得る","バックアップ処理が失敗しやすくなる","データの分類区分が変わってしまう"],"a":1,"e":"訴訟ホールド（リティゲーションホールド）が発動したら、自動削除を停止して関連データを保全する義務が生じる。保持ポリシーは「短すぎても長すぎてもリスク」であり、法務との連携が必須。","src":"x2","i":"q0462"},{"d":"d2","s":"retention","l":2,"q":"データ保持期間を必要以上に長く設定することのリスクはどれか。","o":["障害時の復元処理が速くなる","漏えい被害と保管コストが増大する","分類の作業そのものが不要になる","監査対応が容易になり負荷が減る"],"a":1,"e":"持っているデータは守る責任と開示リスクを伴う。GDPR の記憶域制限（storage limitation）原則も「目的達成に必要な期間のみ」。最小化はプライバシー保護の基本原則。","src":"x2","i":"q0463"},{"d":"d2","s":"classify","l":2,"q":"民間企業の一般的な分類区分として、最も高い機密度に当たるものはどれか。","o":["Public（公開）","Sensitive（要注意）","Private（私的）","Confidential（機密）"],"a":3,"e":"民間は Public < Sensitive < Private < Confidential/Proprietary、政府は Unclassified < (SBU) < Confidential < Secret < Top Secret。どちらの体系かを見極める。","src":"x2","i":"q0464"},{"d":"d3","s":"principles","l":2,"q":"「Fail secure（フェイルセキュア）」と「Fail safe（フェイルセーフ）」の違いとして正しいものはどれか。","o":["両者は同義である","障害時に閉鎖か開放か、優先するものが違う","Fail safe は常にロックする","Fail secure は人命を優先する"],"a":1,"e":"データセンターの扉は fail secure（施錠）、非常口は fail safe（解錠）。CISSP では常に「人命が最優先」という原則があり、状況に応じて設計が変わることを理解しているかが問われる。","src":"x2","i":"q0465"},{"d":"d3","s":"principles","l":2,"q":"「Secure defaults（安全な初期設定）」の考え方に合致するものはどれか。","o":["新規機能は既定で有効にし、不要なら無効化させる","既定で無効にし、必要な場合のみ有効化する","初期パスワードを全機器で共通にする","ログを既定で無効にする"],"a":1,"e":"既定は最も安全な状態にする。ユーザが何もしなくても安全であることが要件。これは deny by default（暗黙の拒否）とも通じる。","src":"x2","i":"q0466"},{"d":"d3","s":"models","l":2,"q":"Clark-Wilson モデルの中核概念はどれか。","o":["格子構造による機密ラベルの制御","正しく作られた手続きと職務分掌","利益相反を避ける中国の壁の原則","情報フローの数学的な非干渉検証"],"a":1,"e":"Clark-Wilson は商用環境向けの完全性モデルで、利用者は制約付きの手続き（TP）を通してのみデータ（CDI）を操作でき、職務分掌と監査で完全性を保つ。Brewer-Nash が中国の壁。","src":"x2","i":"q0467"},{"d":"d3","s":"crypto","l":2,"q":"完全前方秘匿性（PFS）が提供するものはどれか。","o":["鍵長が短くても十分な強度を得られる","長期鍵が漏れても過去の通信は守られる","暗号化と復号の処理速度が向上する","サーバ証明書が不要になり運用が簡素化する"],"a":1,"e":"セッションごとに一時鍵を生成（DHE／ECDHE）することで実現する。RSA 鍵交換では秘密鍵の漏えいで過去の通信が全て復号され得るため、TLS 1.3 は PFS のある鍵交換のみを許可する。","src":"x2","i":"q0468"},{"d":"d3","s":"crypto","l":2,"q":"同じ平文ブロックが同じ暗号文になり、パターンが露出してしまう暗号利用モードはどれか。","o":["CBC","ECB","CTR","GCM"],"a":1,"e":"ECB は各ブロックを独立に暗号化するためパターンが残る（有名なペンギン画像の例）。実務では使用禁止。CBC は前ブロックと XOR、CTR はカウンタをストリーム化、GCM は CTR＋認証（AEAD）。","src":"x2","i":"q0469"},{"d":"d3","s":"crypto","l":3,"q":"データの機密性・完全性・認証を1つの処理で同時に得たい。最も適切な選択はどれか。","o":["AES-ECB モード","AES-GCM などの AEAD","MD5 によるハッシュ","Base64 エンコード"],"a":1,"e":"AEAD（Authenticated Encryption with Associated Data）は暗号化と完全性・認証を統合する。別々に実装すると順序ミス（MAC-then-Encrypt 等）で脆弱性が生まれるため、統合モードが推奨される。","src":"x2","i":"q0470"},{"d":"d3","s":"crypto","l":2,"q":"鍵長 128 ビットの対称鍵暗号と同等の強度を得るために、RSA が必要とする概算の鍵長はどれか。","o":["256 ビット","1024 ビット","3072 ビット","10 万ビット"],"a":2,"e":"対称128 ≒ RSA/DH 3072 ≒ ECC 256。非対称は数学的問題の困難性に依るため、同等強度に必要な鍵長がはるかに長い。ECC が組込み・モバイルで好まれる理由でもある。","src":"x2","i":"q0471"},{"d":"d3","s":"pki","l":2,"q":"証明書の失効状態を確認する仕組みで、リアルタイム性に優れるものはどれか。","o":["CRL","OCSP","CSR","CPS"],"a":1,"e":"CRL は失効リストを定期配布するためタイムラグと肥大化の問題がある。OCSP はレスポンダに個別問い合わせする。OCSP ステープリングはサーバが応答をキャッシュして提示し、プライバシーと性能を改善する。","src":"x2","i":"q0472"},{"d":"d3","s":"pki","l":3,"q":"電子署名が提供しないものはどれか。","o":["完全性","送信者認証","否認防止","機密性"],"a":3,"e":"署名は「送信者の秘密鍵でハッシュを暗号化」する処理であり、内容は隠さない。機密性が必要なら受信者の公開鍵で本文を暗号化する（実際はハイブリッド暗号でセッション鍵を包む）。","src":"x2","i":"q0473"},{"d":"d3","s":"attacks","l":2,"q":"暗号システムに対する「サイドチャネル攻撃」の例はどれか。","o":["鍵空間を総当たりする攻撃","消費電力や処理時間の観測による推定","事前計算テーブルによる逆引き","通信経路上での中間者攻撃"],"a":1,"e":"アルゴリズムの数学的弱点ではなく実装・物理特性を突く。対策は定数時間実装、ノイズ付加、シールド。タイミング攻撃、電力解析（SPA/DPA）、音響解析などが該当。","src":"x2","i":"q0474"},{"d":"d3","s":"attacks","l":2,"q":"パスワードハッシュに対するレインボーテーブル攻撃を無効化する最も直接的な対策はどれか。","o":["ハッシュを2回かける","ユーザごとにランダムなソルトを付与する","パスワードを長くする","MD5 から SHA-1 に変える"],"a":1,"e":"ソルトは事前計算テーブルを無意味にする。さらにストレッチング（bcrypt / scrypt / Argon2 / PBKDF2）で総当たりコストを上げるのが現代の標準。ペッパーはソルトと別に秘密として保管する追加値。","src":"x2","i":"q0475"},{"d":"d3","s":"archvuln","l":3,"q":"Meltdown / Spectre のような投機的実行の脆弱性が示す本質的な教訓はどれか。","o":["ソフトウェアのパッチだけで完全に解決できる","性能最適化が漏えい経路になり得ること","仮想化は使うべきでない","暗号は無意味である"],"a":1,"e":"共有ハードウェア上のマルチテナント（クラウド）では、CPU キャッシュ経由で他テナントの情報が漏れ得る。緩和には性能低下が伴い、リスクとコストのトレードオフ判断が必要になる典型例。","src":"x2","i":"q0476"},{"d":"d3","s":"physical","l":2,"q":"データセンターの消火設備として、機器へのダメージが最も小さいものはどれか。","o":["湿式の水スプリンクラー設備","不活性ガスや清浄剤による消火","薬剤を発泡させる泡消火設備","粉末を散布する乾燥粉末消火"],"a":1,"e":"清浄剤は残渣を残さず電子機器を傷めない。ハロンはオゾン層破壊のため段階的廃止。ただし人がいる区画では酸素濃度低下に配慮し、退避時間と警報を設計する（人命優先）。","src":"x2","i":"q0477"},{"d":"d3","s":"physical","l":2,"q":"サーバ室の電源で「短時間の完全停電」を指す用語はどれか。","o":["Sag","Brownout","Fault","Blackout"],"a":2,"e":"Fault＝瞬間的な停電、Blackout＝長時間の停電、Sag/Dip＝瞬間的な電圧低下、Brownout＝長時間の電圧低下、Spike＝瞬間的な過電圧、Surge＝長時間の過電圧。UPS は短時間、発電機は長時間を担う。","src":"x2","i":"q0478"},{"d":"d7","s":"incident","l":3,"q":"ランサムウェアの感染が疑われる端末を発見した。最初に取るべき行動はどれか。","o":["端末の電源を切る","ネットワークから隔離し、証拠を保全する","バックアップから即座に復元する","身代金の支払いを検討する"],"a":1,"e":"封じ込め（Containment）が最優先だが、電源断はメモリ上の証拠（暗号鍵が残ることもある）を失う。したがって「電源は落とさずネットワーク隔離」が定石。復元は根本原因の除去後。","src":"x2","i":"q0479"},{"d":"d7","s":"incident","l":2,"q":"インシデント対応で「Lessons Learned（教訓）」フェーズの主目的はどれか。","o":["原因を作った責任者を特定し処分する","統制の改善点を抽出し再発を防ぐ","法的手続きのため報告書を提出する","調査に用いた証拠を安全に破棄する"],"a":1,"e":"非難ではなく改善が目的（blameless postmortem）。犯人捜しの文化はインシデントの隠蔽を招き、結果として組織を危険にする。改善は正式な変更管理を通じて実装する。","src":"x2","i":"q0480"},{"d":"d7","s":"incident","l":2,"q":"証拠保全における「Chain of Custody（証拠保全の連鎖）」が記録すべき内容はどれか。","o":["証拠となった機器の資産価値と残存簿価","誰がいつ何をどう扱ったかの継続的な記録","攻撃者の氏名と所在に関する調査結果","復旧作業に要した費用と工数の集計"],"a":1,"e":"連鎖が途切れると法廷で証拠能力が否定され得る。取得・移動・保管・分析の全過程で署名入りの記録を残し、ハッシュ値で完全性を証明する。原本ではなくビットイメージのコピーを解析するのも原則。","src":"x2","i":"q0481"},{"d":"d7","s":"incident","l":3,"q":"フォレンジックで証拠を収集する際の「揮発性の順序（Order of Volatility）」に従うと、最初に取得すべきものはどれか。","o":["ハードディスクの完全イメージ","レジスタ・キャッシュ・メモリの内容","遠隔地保管のバックアップテープ","印刷済みの設定資料と手順書"],"a":1,"e":"揮発しやすいものから順に取得する：レジスタ／キャッシュ → メモリ → ネットワーク状態・実行中プロセス → ディスク → リモートログ → アーカイブ媒体。順序を誤ると回復不能な証拠を失う。","src":"x2","i":"q0482"},{"d":"d7","s":"monitoring","l":2,"q":"UEBA（利用者・エンティティ行動分析）が従来のシグネチャ型検知より優れる点はどれか。","o":["解析処理が軽く、負荷を抑えられる","ベースラインからの逸脱で未知の脅威も捉える","誤検知がまったく発生しなくなる","ログを収集せずに検知できる"],"a":1,"e":"既知パターンに依存しないため、正規アカウントを悪用する内部不正やラテラルムーブメントを検出できる。ただし正常なベースラインの確立に時間を要し、環境変化で誤検知が増える。","src":"x2","i":"q0483"},{"d":"d7","s":"monitoring","l":2,"q":"ハニーポットを設置する主な目的はどれか。","o":["本番系の負荷を分散して受け止める","攻撃者を誘引し、手法を観測する","バックアップの保管先として使う","通信帯域の使用量を制御する"],"a":1,"e":"ハニーポットは早期警戒と脅威インテリジェンス取得の手段。設置側から積極的に誘い込み過ぎるとエントラップメント（違法な誘導）の問題が生じ得るため、法務確認が必要。ハニーネットは複数機のネットワーク版。","src":"x2","i":"q0484"},{"d":"d7","s":"foundations","l":3,"q":"職務分掌（Separation of Duties）が実現できない小規模組織で、代替として最も適切な補償統制はどれか。","o":["統制の実装を断念し、リスクを受容する","監視の強化と強制休暇・職務ローテーション","全員に管理者権限を与えて相互に監視する","外部監査を毎日実施して補う"],"a":1,"e":"職務分掌が構造的に不可能な場合、発見的統制で補う。強制休暇（mandatory vacation）は不正の継続的な隠蔽を破る古典的手法で、ローテーションも同様の効果を持つ。","src":"x2","i":"q0485"},{"d":"d7","s":"foundations","l":2,"q":"「Need to Know」と「Least Privilege」の関係として最も正確なものはどれか。","o":["同義である","情報の必要性と、操作権限の最小化","Least Privilege は情報のみに適用される","Need to Know は技術的統制である"],"a":1,"e":"クリアランスがあっても「知る必要」がなければアクセスさせない（Need to Know）。加えて、与える権限は職務遂行に必要な最小限にとどめる（Least Privilege）。両者は重なるが同一ではない。","src":"x2","i":"q0486"},{"d":"d7","s":"change","l":3,"q":"緊急のセキュリティパッチを本番へ適用する必要がある。最も適切な進め方はどれか。","o":["変更管理を省略して即時適用する","緊急変更手続きに従い、事後に記録する","次回の定期メンテナンスまで待つ","テスト環境のみに適用する"],"a":1,"e":"緊急でもプロセスを飛ばすのではなく、緊急用の簡略プロセスを使う。事後承認と記録が抜けると構成情報が実態と乖離し、次の障害の温床になる。ロールバック計画も必須。","src":"x2","i":"q0487"},{"d":"d7","s":"change","l":2,"q":"構成管理（Configuration Management）におけるベースラインの役割はどれか。","o":["最新機能を常に導入するための基準","承認済みの構成を定め、逸脱検出の基準とする","ユーザの利用状況を測る指標","予算配分の基準"],"a":1,"e":"ベースラインがあるからこそ「変わったこと」が分かる。逸脱検出（configuration drift）と、インシデント後の既知の正常状態への復元を可能にする。","src":"x2","i":"q0488"},{"d":"d7","s":"backup","l":2,"q":"差分バックアップ（Differential）の特徴として正しいものはどれか。","o":["前回のバックアップ以降の変更のみを保存し、アーカイブビットをクリアする","前回のフルバックアップ以降の変更をすべて保存し、アーカイブビットをクリアしない","毎回すべてを保存する","スナップショットと同義である"],"a":1,"e":"増分（Incremental）は前回の任意のバックアップ以降＝取得は速いが復元にフル＋全増分が必要。差分は前回フル以降＝取得は遅くなるが復元はフル＋最新の差分1つで済む。「取得時間 vs 復旧時間」のトレードオフ。","src":"x2","i":"q0489"},{"d":"d7","s":"backup","l":3,"q":"ランサムウェア対策としてバックアップに求められる最重要の性質はどれか。","o":["保管効率が高く、圧縮率に優れること","本番から分離され、改変・削除できないこと","毎時取得され、復旧点が細かいこと","クラウド上に保管されていること"],"a":1,"e":"近年のランサムウェアはバックアップを最初に破壊する。3-2-1 ルール（3コピー・2媒体・1オフサイト）に加え、エアギャップまたはイミュータブルストレージ、そしてリストア試験が要点。","src":"x2","i":"q0490"},{"d":"d7","s":"dr","l":2,"q":"ホットサイト・ウォームサイト・コールドサイトを復旧の速い順に並べたものはどれか。","o":["コールド → ウォーム → ホット","ホット → ウォーム → コールド","ウォーム → ホット → コールド","三者に差はない"],"a":1,"e":"ホット＝機器・データ同期済みで数時間以内、ウォーム＝機器はあるがデータ投入が必要で数日、コールド＝空間と電源のみで数週間。速いほど高コストで、RTO/RPO の要求から選定する。","src":"x2","i":"q0491"},{"d":"d7","s":"dr","l":3,"q":"DR テストのうち、実際に本番処理を代替サイトへ切り替えるため最もリスクが高いものはどれか。","o":["チェックリストレビュー","構造化ウォークスルー","シミュレーション","フルインタラプションテスト"],"a":3,"e":"強度は チェックリスト → ウォークスルー（机上）→ シミュレーション → パラレル（本番と並行稼働）→ フルインタラプション（本番停止）の順。フル中断は最も現実的だが業務停止リスクがあるため、経営承認と入念な準備が必要。","src":"x2","i":"q0492"},{"d":"d7","s":"dr","l":2,"q":"BIA で決定した RPO が 4 時間である。これが意味することはどれか。","o":["4 時間以内に復旧しなければならない","失ってよいデータが最大4時間分ということ","4 時間ごとにテストする","4 時間分の予備電源が必要である"],"a":1,"e":"RPO＝失ってよいデータ量（時間で表現）＝バックアップ頻度を規定する。RTO＝復旧までの許容時間＝復旧手段（サイト種別）を規定する。MTD/MAD が上限で、RTO＋WRT ≦ MTD。","src":"x2","i":"q0493"},{"d":"d7","s":"foundations","l":2,"q":"特権アカウントの操作を記録・監視する「セッション録画」が主に提供する統制の種類はどれか。","o":["予防的統制（Preventive）","発見的統制および抑止的統制","是正的統制（Corrective）","補償的統制（Compensating）"],"a":1,"e":"記録は事後に検出する発見的統制であり、同時に「見られている」という認識が不正を思いとどまらせる抑止効果を持つ。実際の操作を止めるわけではないので予防的ではない。","src":"x2","i":"q0494"},{"d":"d8","s":"sdlc","l":3,"q":"脆弱性の修正コストが最も低いのは、SDLC のどのフェーズで発見された場合か。","o":["要件定義・設計","実装","テスト","本番リリース後"],"a":0,"e":"上流ほど修正コストが低い（後工程になるほど指数的に増大する）。だから脅威モデリングやセキュア設計レビューを要件・設計段階に組み込む＝シフトレフト。","src":"x2","i":"q0495"},{"d":"d8","s":"sdlc","l":2,"q":"ソフトウェアを本番へ移行する際の職務分掌として最も適切なものはどれか。","o":["開発者が本番へ直接デプロイする","デプロイ権限を分離し、承認記録を残す","テスターが開発も行う","運用担当がコードを書き換える"],"a":1,"e":"開発者が本番に直接触れられると、未承認コードの混入や不正な変更を検出できない。CI/CD でも「パイプラインが唯一の経路」とし、人の直接アクセスを排除する形で分掌を実現する。","src":"x2","i":"q0496"},{"d":"d8","s":"methods","l":2,"q":"DevSecOps における「シフトレフト」の意味として最も適切なものはどれか。","o":["リリース予定日そのものを前倒しする","セキュリティ活動を開発の早期に組み込む","テストを本番リリース後に移動する","開発チームの人員規模を縮小する"],"a":1,"e":"SAST、依存関係スキャン、IaC スキャン、脅威モデリングを CI に組み込み、開発者のフィードバックループ内で問題を潰す。「品質保証を最後の関門にしない」という思想。","src":"x2","i":"q0497"},{"d":"d8","s":"methods","l":2,"q":"アジャイル開発でセキュリティを担保する現実的な方法はどれか。","o":["受入基準に含め、担当をチームに置く","開発完了後にまとめて監査する","アジャイルではセキュリティは適用できない","ドキュメントを廃止する"],"a":0,"e":"反復ごとに小さく検証するのがアジャイルの利点。セキュリティを外部のゲートにすると反復速度と衝突するため、Definition of Done に組み込む。ウォーターフォールは段階的ゲートで担保する。","src":"x2","i":"q0498"},{"d":"d8","s":"maturity","l":2,"q":"CMMI のレベル 3（Defined）を最も適切に説明しているものはどれか。","o":["場当たり的で個人に依存する","プロジェクト単位で管理されている","組織標準が定義され一貫して適用される","定量的に測定・管理されている"],"a":2,"e":"1=Initial（場当たり）、2=Repeatable/Managed（プロジェクト単位）、3=Defined（組織標準）、4=Quantitatively Managed（定量管理）、5=Optimizing（継続的改善）。「組織全体で標準化されたか」が 3 の分岐点。","src":"x2","i":"q0499"},{"d":"d8","s":"owasp","l":3,"q":"ユーザ入力をそのまま SQL 文に連結している箇所が見つかった。最も根本的な対策はどれか。","o":["WAF を導入して通信経路で遮断する","パラメータ化クエリを使用する","エラーメッセージの詳細を隠蔽する","データベースの保存領域を暗号化する"],"a":1,"e":"パラメータ化はコードとデータを構造的に分離するため、注入を原理的に成立させない。WAF は多層防御としては有効だが回避されうる補償統制であり、根本対策ではない。","src":"x2","i":"q0500"},{"d":"d8","s":"owasp","l":2,"q":"格納型 XSS（Stored XSS）が反射型より危険とされる理由はどれか。","o":["スクリプトの実行速度が速く、検知が難しいため","サーバに保存され、閲覧者全員に配信されるため","通信の暗号を解読して盗聴できるため","認証を回避して管理者権限を取得できるため"],"a":1,"e":"反射型は被害者を誘導する必要があるが、格納型は正規の閲覧だけで発火する。対策は出力エンコーディング（文脈に応じたエスケープ）と CSP、入力検証の組み合わせ。","src":"x2","i":"q0501"},{"d":"d8","s":"owasp","l":2,"q":"CSRF 対策として最も有効なものはどれか。","o":["入力値の長さと文字種を制限する","CSRF トークンの検証","パスワードの複雑性要件を強化する","通信経路を HTTPS で暗号化する"],"a":1,"e":"CSRF はブラウザが自動送信する Cookie を悪用するため、リクエストが正規画面由来であることを証明する仕組みが必要。SameSite=Lax/Strict はクロスサイト送信を抑止する。","src":"x2","i":"q0502"},{"d":"d8","s":"coding","l":2,"q":"バッファオーバーフローを防ぐ最も根本的なプログラミング上の対策はどれか。","o":["境界チェックと安全な関数の使用","スタックを大きくする","コンパイラの最適化を無効化する","変数名を長くする"],"a":0,"e":"根本は入力長の検証。加えて DEP/NX（データ領域の実行禁止）、ASLR（配置のランダム化）、スタックカナリアが多層で緩和する。メモリ安全な言語（Rust 等）の採用も戦略的対策。","src":"x2","i":"q0503"},{"d":"d8","s":"coding","l":2,"q":"TOC/TOU（Time of Check to Time of Use）攻撃の本質はどれか。","o":["暗号鍵の時刻同期のずれ","検査時と使用時の間で状態が変わること","タイムスタンプの偽造","セッションタイムアウトの延長"],"a":1,"e":"レースコンディションの一種。対策はアトミックな操作、ロック、ファイルディスクリプタの再利用など、「検査と使用を不可分にする」設計。","src":"x2","i":"q0504"},{"d":"d8","s":"coding","l":3,"q":"CI/CD パイプラインのセキュリティで最も見落とされやすく、かつ影響が大きいリスクはどれか。","o":["ビルド時間が長く、リリース頻度が上がらないこと","格納された資格情報の漏えいと依存パッケージの汚染","ビルドログが肥大化し、保管コストが増えること","テストカバレッジが低く、不具合が流出すること"],"a":1,"e":"パイプラインは本番への直通経路であり、極めて高い権限を持つ。シークレット管理（Vault 等）、依存関係の固定と検証（SBOM、署名）、ビルド環境の分離が要点。SolarWinds が代表事例。","src":"x2","i":"q0505"},{"d":"d8","s":"acquired","l":2,"q":"オープンソースコンポーネントを利用する際に SBOM を整備する最大の利点はどれか。","o":["調達するライセンスの費用が下がる","脆弱性の公表時に影響範囲を即座に特定できる","実装されたコードの品質が向上する","開発の速度と生産性が高まる"],"a":1,"e":"Log4Shell で明らかになった課題そのもの。「どこで何を使っているか」が分からなければ対応の起点に立てない。ライセンス管理や調達要件（大統領令 14028 等）の観点でも重要。","src":"x2","i":"q0506"},{"d":"d8","s":"acquired","l":3,"q":"SaaS を導入する際、責任共有モデルにおいて利用者側の責任として残るものはどれか。","o":["物理データセンターの設備管理","データ分類とアクセス権の設定","ハイパーバイザへのパッチ適用","ネットワーク機器の冗長化"],"a":1,"e":"SaaS では事業者がインフラからアプリまで担うが、「データと ID」は常に利用者責任。IaaS→PaaS→SaaS の順に事業者責任が増えるが、データの所有と分類、アクセス制御は移らない。","src":"x2","i":"q0507"},{"d":"d8","s":"acquired","l":2,"q":"サードパーティ製ソフトウェアを調達する際、セキュリティ観点で契約に含めるべき条項はどれか。","o":["契約期間中の価格据え置きの保証","脆弱性通知義務と監査権、EOL 方針","開発に用いるプログラミング言語の指定","自社ロゴの使用に関する許諾範囲"],"a":1,"e":"調達時点でしか交渉力はない。導入後に「脆弱性を知らせてもらえない」「サポートが切れた」となっても手段がない。エスクロー条項（事業者破綻時のソース開示）も検討対象。","src":"x2","i":"q0508"}],"cards":[{"d":"d1","g":"基本概念・倫理","f
