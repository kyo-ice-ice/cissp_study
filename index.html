演習（tabletop）","パラレルテスト","フルインタラプション（本番停止）"],"a":3,"e":"本番停止を伴い最も厳格・高リスク。通常は軽いテストから段階的に実施する。","src":"base","i":"q0104"},{"d":"d8","s":"sdlc","l":1,"q":"セキュリティ上の欠陥を「できるだけ早い工程で発見・対策する」考え方を何というか。","o":["シフトレフト","ビッグバンリリース","ウォーターフォール","後付けパッチ主義"],"a":0,"e":"早期対策ほど低コスト・高効果。設計段階の脅威モデリングが代表例。","src":"base","i":"q0105"},{"d":"d8","s":"methods","l":1,"q":"CI/CD による高速リリースの中に、セキュリティを全工程へ自動的に組み込む文化・手法は？","o":["ウォーターフォール","ビッグバン統合","DevSecOps","手動デプロイ"],"a":2,"e":"DevSecOps は DevOps にセキュリティを組み込み自動化する。","src":"base","i":"q0106"},{"d":"d8","s":"methods","l":1,"q":"要件が頻繁に変わるプロジェクトで、短い反復で漸進的に開発するのに適した手法は？","o":["ウォーターフォール","アジャイル","一括納品","凍結開発"],"a":1,"e":"アジャイルは反復で変化に強い。ウォーターフォールは要件固定向き。","src":"base","i":"q0107"},{"d":"d8","s":"maturity","l":1,"q":"CMMI の最上位（レベル5）で示されるプロセスの状態は？","o":["場当たり的（Initial）","定義された（Defined）","管理された（Managed）","最適化（Optimizing）"],"a":3,"e":"レベル5は継続的改善（Optimizing）。レベル1は場当たり的（Initial）。","src":"base","i":"q0108"},{"d":"d8","s":"maturity","l":1,"q":"ソフトウェアセキュリティに特化した成熟度モデルの組み合わせとして正しいのは？","o":["RAID と RPO","OWASP SAMM と BSIMM","TLS と IPsec","SOC 1 と SOC 2"],"a":1,"e":"SAMM・BSIMM はソフトウェアセキュリティ成熟度の代表。CMMI は開発プロセス全般の成熟度。","src":"base","i":"q0109"},{"d":"d8","s":"owasp","l":1,"q":"SQL インジェクションに対する最も効果的な対策はどれか。","o":["エラーメッセージを詳細に表示する","パラメータ化クエリの使用","管理者権限でDB接続する","入力をそのままSQLに連結する"],"a":1,"e":"入力検証＋パラメータ化クエリでコードとデータを分離。最小権限のDB接続も有効。","src":"base","i":"q0110"},{"d":"d8","s":"owasp","l":1,"q":"利用者のブラウザ上で悪意あるスクリプトを実行させる攻撃で、出力エンコードが主な対策となるのは？","o":["総当たり攻撃","SYN フラッド攻撃","クロスサイトスクリプティング","セッションハイジャック"],"a":2,"e":"XSS は出力エンコード（エスケープ）と入力検証、CSP で対策する。","src":"base","i":"q0111"},{"d":"d8","s":"coding","l":1,"q":"入力検証で最も安全とされる方式はどれか。","o":["許可リスト（allowlist）方式","拒否リスト（denylist）だけに頼る","クライアント側のみで検証","検証しない"],"a":0,"e":"許可リスト（想定する正当な値だけ通す）が安全。クライアント側検証は回避可能なのでサーバ側必須。","src":"base","i":"q0112"},{"d":"d8","s":"acquired","l":1,"q":"オープンソースのライブラリを採用する際、脆弱性追跡のために整備すべき成果物は？","o":["SLA","SBOM","RTO","CER"],"a":1,"e":"SBOM で依存コンポーネントを可視化し、脆弱性（A06）を追跡する。","src":"base","i":"q0113"},{"d":"d8","s":"acquired","l":1,"q":"データベーストランザクションが満たすべき性質「ACID」に含まれないものは？","o":["Atomicity（原子性）","Consistency（一貫性）","Durability（永続性）","Availability（可用性）"],"a":3,"e":"ACID は Atomicity/Consistency/Isolation/Durability。Availability は含まれない（CIA の方）。","src":"base","i":"q0114"},{"d":"d1","s":"ethics","l":2,"q":"あなたは顧客企業の監査中に、その企業が顧客データを違法に第三者へ販売している証拠を発見した。ISC2 倫理綱領に照らして最も適切な行動はどれか。","o":["守秘義務があるため何もしない","まず経営層に報告する","匿名でメディアにリークする","証拠を削除して関与を避ける"],"a":1,"e":"カノン1「社会・公共を守る」がカノン3「依頼者に勤勉に奉仕する」より優先される。ただし優先順位＝いきなり暴露ではなく、まず適切な組織内チャネルで是正を求め、それでも解決しないなら法令上の報告義務に従うのが正道。C はデュープロセスを飛ばしており不適切、D は隠蔽で違法。","src":"d1","i":"q0115"},{"d":"d1","s":"ethics","l":1,"q":"ISC2 倫理綱領のカノンの順序として正しいものはどれか。","o":["依頼者 → 社会 → 職業 → 名誉ある行動","社会 → 名誉ある行動 → 依頼者 → 職業","名誉ある行動 → 社会 → 職業 → 依頼者","職業 → 依頼者 → 社会 → 名誉ある行動"],"a":1,"e":"順序は Society（社会）→ Act honorably（名誉ある行動）→ Principals（依頼者）→ Profession（職業）。この順序自体が優先順位であり、衝突時は番号が小さい方を優先する。試験では「社会 > 依頼者」の対立で問われることが多い。","src":"d1","i":"q0116"},{"d":"d1","s":"ethics","l":2,"q":"ある CISSP 保持者が、実際には保有していない他の資格を履歴書に記載していた。これはどのカノンに最も直接的に違反するか。","o":["カノン1（社会を守る）","カノン2（名誉・誠実・公正に行動する）","カノン3（依頼者に勤勉に奉仕する）","カノン4（職業を発展させ守る）"],"a":1,"e":"資格詐称は誠実さ（honestly）の欠如であり、カノン2 の直接的違反。結果として職業の信用も傷つける（カノン4）が、最も直接的なのはカノン2。","src":"d1","i":"q0117"},{"d":"d1","s":"concepts","l":1,"q":"ハッシュ値を用いてファイルが改ざんされていないことを検証する仕組みは、CIA のどの特性を主に支えるか。","o":["機密性","完全性","可用性","真正性"],"a":1,"e":"ハッシュによる検証は Integrity（完全性）の代表的な統制。機密性は暗号化、可用性は冗長化やバックアップ、真正性は署名や認証で支える。","src":"d1","i":"q0118"},{"d":"d1","s":"concepts","l":2,"q":"送信者が「そのメッセージを送っていない」と後から否認できないようにする性質はどれか。","o":["Confidentiality","Non-repudiation","Availability","Authorization"],"a":1,"e":"Non-repudiation（否認防止）。デジタル署名は署名者だけが持つ秘密鍵を使うため、否認防止と真正性・完全性を同時に提供する。共有鍵の MAC は完全性と真正性は出せるが、鍵を両者が持つため否認防止にはならない点が頻出。","src":"d1","i":"q0119"},{"d":"d1","s":"concepts","l":2,"q":"AAA（Authentication, Authorization, Accounting）のうち、「監査証跡を残し、後から誰が何をしたかを追跡できるようにする」要素はどれか。","o":["Authentication","Authorization","Accounting（説明責任）","Identification"],"a":2,"e":"Accounting/Accountability はログ記録と追跡。Identification（主張）→ Authentication（証明）→ Authorization（権限付与）→ Accounting（記録）の流れで覚える。","src":"d1","i":"q0120"},{"d":"d1","s":"concepts","l":3,"q":"組織が「機密性」を最優先する場合と「可用性」を最優先する場合がある。株式取引システムのリアルタイム価格配信で最優先されるのは一般にどれか。","o":["機密性","完全性","可用性","否認防止"],"a":2,"e":"価格配信は公開情報であり、止まることが最大の損失になるため可用性優先。CISSP では「業務の性質から CIA の優先順位を判断させる」問題が頻出。医療記録なら完全性・機密性、軍事情報なら機密性が優先されやすい。","src":"d1","i":"q0121"},{"d":"d1","s":"concepts","l":2,"q":"Defense in Depth（多層防御）の考え方を最もよく表しているのはどれか。","o":["最も強力な単一の統制に投資を集中する","予防・検知・是正を複数層に重ねる","すべての統制を技術的統制で実装する","統制を減らして運用負荷を下げる"],"a":1,"e":"多層防御は「単一障害点をなくす」発想。管理的・技術的・物理的統制を、予防・検知・是正の役割で重ねる。A は単一障害点そのもの。","src":"d1","i":"q0122"},{"d":"d1","s":"governance","l":2,"q":"情報セキュリティ方針（Security Policy）を最終的に承認する責任を負うのは誰か。","o":["最高情報セキュリティ責任者（CISO）","上級経営層（Senior Management）","情報システム部門長","内部監査部門の責任者"],"a":1,"e":"方針の承認と、リスクを受容する最終責任（accountability）は上級経営層にある。CISO は策定・推進の責任者（responsible）だが、組織としての最終責任は経営層。CISSP では「責任は委譲できるが説明責任は委譲できない」が原則。","src":"d1","i":"q0123"},{"d":"d1","s":"governance","l":2,"q":"Due Care と Due Diligence の違いとして正しいものはどれか。","o":["Due Care は調査、Due Diligence は実行","Due Care は実行、Due Diligence は継続的な調査","両者は同義である","Due Diligence は事故後の対応のみを指す"],"a":1,"e":"Due Diligence＝調べる（do detect / research）、Due Care＝実際に手を打つ（do correct / act）。覚え方：Diligence の「D」は Discover、Care の「C」は Correct。監査ではこの両方の証跡が問われる。","src":"d1","i":"q0124"},{"d":"d1","s":"governance","l":3,"q":"新任の CISO が、セキュリティプログラムの立ち上げで最初に行うべきことはどれか。","o":["次世代ファイアウォールの導入","組織の事業目標と現行のリスク／資産の把握","侵入テストの実施","セキュリティ意識向上研修の開始"],"a":1,"e":"CISSP のマネージャ視点では、常に「まず理解・整合（align）してから統制」。事業目標と資産・リスクを把握しないまま技術導入すると投資が的外れになる。技術的施策はすべてその後。","src":"d1","i":"q0125"},{"d":"d1","s":"governance","l":2,"q":"ISO/IEC 27001 と ISO/IEC 27002 の関係として正しいものはどれか。","o":["27001 が管理策の実装ガイド、27002 が認証要件","27001 が ISMS 要求事項、27002 が実践規範","両方とも認証を取得できる","27002 はリスクアセスメント手法のみを規定する"],"a":1,"e":"27001＝ISMS の要求事項で第三者認証の対象。27002＝管理策の実践規範（ガイダンス）で認証対象ではない。27005 はリスクマネジメント、27701 はプライバシー拡張。","src":"d1","i":"q0126"},{"d":"d1","s":"governance","l":2,"q":"COBIT が主に扱う領域はどれか。","o":["暗号アルゴリズムの選定基準","IT ガバナンスの枠組み","ネットワーク機器の設定標準","ソフトウェア開発の成熟度測定"],"a":1,"e":"COBIT（ISACA）は IT ガバナンス／マネジメントのフレームワークで、事業目標と IT 統制の整合が主眼。NIST CSF はサイバーリスク管理、SABSA はビジネス駆動のセキュリティアーキテクチャ、CMMI は開発成熟度。","src":"d1","i":"q0127"},{"d":"d1","s":"governance","l":3,"q":"企業買収（acquisition）に伴うセキュリティ上の最大の懸念として、統合前に最も優先して行うべきことはどれか。","o":["被買収企業の全社員にセキュリティ研修を実施する","既知の侵害と統制状況をデューデリジェンスで評価する","両社のネットワークを直ちに接続して統合効率を上げる","被買収企業のセキュリティ製品を自社標準に置き換える"],"a":1,"e":"統合前のセキュリティ・デューデリジェンスが最優先。未検知の侵害や法令違反をそのまま自社に引き込むリスクがあるため。C は評価前の接続で、侵害の水平展開を招く典型的な誤り。","src":"d1","i":"q0128"},{"d":"d1","s":"governance","l":2,"q":"Security Steering Committee（セキュリティ運営委員会）の主な役割はどれか。","o":["インシデントの技術的封じ込めを指揮する","施策の優先順位と予算配分を事業目標に沿って決める","ファイアウォールルールの承認を行う","脆弱性スキャンの結果を分析する"],"a":1,"e":"運営委員会は「事業とセキュリティの整合を取る意思決定体」。技術的な作業やインシデント指揮は別組織（SOC/CSIRT）の役割。","src":"d1","i":"q0129"},{"d":"d1","s":"compliance","l":2,"q":"GDPR において、個人データの「処理の目的と手段を決定する」主体はどれか。","o":["Data Processor","Data Controller","Data Subject","Data Protection Officer"],"a":1,"e":"Controller が目的と手段を決定し、法的責任の中心を担う。Processor は Controller の指示で処理する（例：クラウド事業者）。DPO は監督・助言を行う役職で、決定主体ではない。","src":"d1","i":"q0130"},{"d":"d1","s":"compliance","l":2,"q":"GDPR で規定されている個人データ侵害の監督機関への通知期限はどれか。","o":["認識から24時間以内","認識から72時間以内","認識から30日以内","四半期報告で足りる"],"a":1,"e":"GDPR 第33条は「認識から72時間以内」に監督機関へ通知することを求める。高いリスクがある場合はデータ主体本人への通知も遅滞なく必要。数字を問う定番問題。","src":"d1","i":"q0131"},{"d":"d1","s":"compliance","l":2,"q":"特許・著作権・商標・営業秘密のうち、「登録なしに保護され、秘密として管理されている限り期限なく保護される」のはどれか。","o":["特許","著作権","商標","営業秘密"],"a":3,"e":"営業秘密は登録不要・期限なしだが、秘密管理性が失われた時点で保護も失う。特許は公開と引き換えに一定期間（一般に20年）の独占、著作権は表現を保護、商標は識別標識を保護する。","src":"d1","i":"q0132"},{"d":"d1","s":"compliance","l":3,"q":"多国籍企業が EU 域内の個人データを日本の自社データセンターへ移転したい。統制として最も適切なものはどれか。","o":["暗号化していれば移転規制は適用されない","SCC や BCR など適法な移転根拠を確保する","データ主体の同意があれば他の要件は不要になる","EU 域内に子会社があれば移転規制は免除される"],"a":1,"e":"越境移転には適法な根拠が必要。日本は EU から十分性認定を受けているが、認定の範囲・条件を確認したうえで SCC や BCR も併用されうる。暗号化は保護策であって移転根拠にはならない。","src":"d1","i":"q0133"},{"d":"d1","s":"compliance","l":2,"q":"PCI DSS はどのような性質の要求事項か。","o":["各国の法律","カード業界の契約に基づく業界標準","ISO による国際規格","米国連邦政府の調達基準"],"a":1,"e":"PCI DSS は法律ではなく、カードブランドとの契約に基づく業界標準（contractual obligation）。違反時は罰金や加盟契約の停止という契約上の制裁を受ける。","src":"d1","i":"q0134"},{"d":"d1","s":"compliance","l":3,"q":"米国の法制度で「重過失を問わず、被害の事実と因果関係のみで責任を負う」考え方に最も近いのはどれか。","o":["Prudent Person Rule","Strict Liability（厳格責任）","Due Diligence","Negligence per se"],"a":1,"e":"Strict Liability は過失の有無を問わない責任。CISSP では、経営層が「合理的な人（prudent person）が取るべき措置」を怠った場合に過失責任を問われうる、という文脈と対比して問われる。","src":"d1","i":"q0135"},{"d":"d1","s":"investigation","l":2,"q":"民事訴訟（civil）における立証基準として一般的なものはどれか。","o":["合理的な疑いを超える証明（beyond a reasonable doubt）","証拠の優越（preponderance of the evidence）","明白かつ説得力のある証拠（clear and convincing）のみ","立証責任は存在しない"],"a":1,"e":"刑事は beyond a reasonable doubt（最も厳格）、民事は preponderance of the evidence（51%の心証）。行政・規制調査はさらに緩やかな基準が用いられることが多い。","src":"d1","i":"q0136"},{"d":"d1","s":"investigation","l":2,"q":"デジタル証拠が法廷で採用されるために最も重要な手続きはどれか。","o":["証拠を原本のまま解析すること","Chain of Custody の維持","証拠を圧縮して保管すること","調査担当者が単独で作業すること"],"a":1,"e":"誰が・いつ・何を・どこで扱ったかを途切れなく記録する Chain of Custody が採否を左右する。解析は原本ではなくビット単位のイメージ複製に対して行い、ハッシュで同一性を証明する。","src":"d1","i":"q0137"},{"d":"d1","s":"investigation","l":3,"q":"証拠の「最良証拠の原則（Best Evidence Rule）」に照らして、デジタルフォレンジックで通常行われるのはどれか。","o":["原本ディスクを直接マウントして解析する","書き込み防止下でイメージを取得し複製を解析する","スクリーンショットのみを証拠とする","ログをテキストに書き写して提出する"],"a":1,"e":"デジタル領域では、検証可能なハッシュを伴うビットイメージが原本と同等に扱われる。原本を直接操作するとタイムスタンプ等が変化し、証拠能力を損なう。","src":"d1","i":"q0138"},{"d":"d1","s":"docs","l":1,"q":"「特定の OS のパスワード最小長は14文字とする」という文書は、方針体系のどれに当たるか。","o":["Policy（方針）","Standard（標準）","Guideline（ガイドライン）","Procedure（手順）"],"a":1,"e":"具体的で強制力のある技術要件は Standard。Policy は「認証を強固にする」といった高レベルの意思、Procedure は手順の step-by-step、Guideline は推奨（任意）。","src":"d1","i":"q0139"},{"d":"d1","s":"docs","l":2,"q":"組織内で「強制力がなく、推奨にとどまる」文書はどれか。","o":["Policy","Standard","Baseline","Guideline"],"a":3,"e":"Guideline のみが任意（should）。Policy / Standard / Baseline / Procedure は原則として強制（must/shall）。Baseline は「これを下回ってはならない最低水準」。","src":"d1","i":"q0140"},{"d":"d1","s":"docs","l":2,"q":"Baseline（ベースライン）の説明として最も適切なものはどれか。","o":["推奨される最善の実践例","満たすべき最低限の水準","経営層による意思の表明","作業の逐次的な手順書"],"a":1,"e":"Baseline は最低水準（minimum level）。CIS Benchmarks のような構成基準が典型で、逸脱には例外承認が必要。","src":"d1","i":"q0141"},{"d":"d1","s":"bcp","l":2,"q":"BIA（事業影響度分析）の主な目的はどれか。","o":["脅威の技術的な詳細を分析すること","重要業務と許容停止時間を特定すること","復旧手順書を作成すること","バックアップサイトを構築すること"],"a":1,"e":"BIA は「何が重要で、どれだけ止められるか」を明らかにする分析であり、MTD/RTO/RPO の根拠になる。復旧戦略の選定や手順作成は BIA の後工程。","src":"d1","i":"q0142"},{"d":"d1","s":"bcp","l":2,"q":"MTD（Maximum Tolerable Downtime）と RTO の関係として正しいものはどれか。","o":["RTO は MTD より長く設定する","RTO は MTD 以下でなければならない","RTO と MTD は常に等しい","MTD は RPO から算出する"],"a":1,"e":"MTD はこれを超えると事業が回復不能になる限界。RTO（復旧目標時間）は必ず MTD 以内に収める必要がある。RTO > MTD の計画は成立しない。","src":"d1","i":"q0143"},{"d":"d1","s":"bcp","l":2,"q":"RPO（Recovery Point Objective）が示すものはどれか。","o":["復旧までに許容できる時間","許容できるデータ損失量（時間換算）","システムの平均故障間隔","代替サイトへの切替所要時間"],"a":1,"e":"RPO は「どの時点まで戻ってよいか」＝許容データ損失。RPO が15分ならバックアップ／レプリケーション間隔も15分以内が必要になる。RTO は時間軸の“復旧まで”、RPO は“さかのぼり”。","src":"d1","i":"q0144"},{"d":"d1","s":"bcp","l":3,"q":"BCP プロジェクトの成功に最も重要な要素はどれか。","o":["最新の DR 専用製品の導入","上級経営層の明確な支持","網羅的な技術手順書の整備","年1回の机上演習の実施"],"a":1,"e":"CISSP では一貫して「経営層の支持」が BCP/セキュリティプログラムの成否を決める最重要因子とされる。予算・権限・部門横断の協力はすべてそこから生まれる。","src":"d1","i":"q0145"},{"d":"d1","s":"bcp","l":2,"q":"MTBF と MTTR の説明として正しい組み合わせはどれか。","o":["MTBF＝修復所要時間、MTTR＝故障間隔","MTBF＝故障間隔、MTTR＝修復時間","両方とも故障率を示す","MTTR は可用性と無関係"],"a":1,"e":"MTBF（Mean Time Between Failures）＝平均故障間隔、MTTR（Mean Time To Repair）＝平均修復時間。可用性 = MTBF /（MTBF + MTTR）。MTTF は交換前提の非修理製品に使う。","src":"d1","i":"q0146"},{"d":"d1","s":"personnel","l":2,"q":"職務分掌（Separation of Duties）の主目的はどれか。","o":["業務プロセス全体の効率を高めること","単独の個人が不正を完遂できないようにすること","必要な人員とコストを削減すること","担当者ごとのスキルを標準化すること"],"a":1,"e":"重要業務を複数人に分割し、共謀（collusion）なしには不正を完遂できなくする。関連統制として Job Rotation（不正の発見）、Mandatory Vacation（不正の露見）、Dual Control（同時実行の要求）がある。","src":"d1","i":"q0147"},{"d":"d1","s":"personnel","l":2,"q":"強制休暇（Mandatory Vacation）が不正防止に有効な理由はどれか。","o":["従業員の健康と定着率を維持するため","不在中に別の者が担当し、隠蔽が露見しやすいため","繁忙期の人件費を平準化できるため","業務手順の文書化を促す効果があるため"],"a":1,"e":"継続的な隠蔽を必要とする不正は、担当者が業務から離れると発覚しやすい。Job Rotation も同じ「検知」目的の統制。","src":"d1","i":"q0148"},{"d":"d1","s":"personnel","l":2,"q":"退職手続き（オフボーディング）で最も優先すべき統制はどれか。","o":["退職者インタビューの実施","アクセス権の即時無効化と資産の回収","健康保険の手続き","業務引き継ぎ資料の作成"],"a":1,"e":"セキュリティ観点では、アクセス権の即時失効（特に特権アカウント）と資産回収が最優先。非自発的退職では、通知と同時、または通知前に無効化するのが原則。","src":"d1","i":"q0149"},{"d":"d1","s":"personnel","l":3,"q":"業務委託先（サードパーティ）に対して、サービス水準を法的拘束力を持って定める文書はどれか。","o":["MOU（Memorandum of Understanding）","SLA（Service Level Agreement）","NDA（Non-Disclosure Agreement）","RFP（Request for Proposal）"],"a":1,"e":"SLA は測定可能なサービス水準と是正措置を定める契約。MOU は意向表明で拘束力が弱い。NDA は秘密保持、RFP は提案依頼。委託先の情報保護要件は契約（SLA/DPA）に落とし込むのが原則。","src":"d1","i":"q0150"},{"d":"d1","s":"risk","l":1,"q":"リスクの構成要素として正しい関係はどれか。","o":["リスク = 脅威 × 対策","リスク = 脅威 × 脆弱性 × 影響","リスク = 脆弱性 ÷ 資産価値","リスク = 発生確率 − 影響"],"a":1,"e":"リスクは脅威（threat）が脆弱性（vulnerability）を突いて資産に影響（impact）を与える可能性。脅威だけ、脆弱性だけではリスクにならない点が重要。","src":"d1","i":"q0151"},{"d":"d1","s":"risk","l":2,"q":"SLE（Single Loss Expectancy）の計算式はどれか。","o":["SLE = AV × EF","SLE = ARO × AV","SLE = ALE × ARO","SLE = EF ÷ AV"],"a":0,"e":"SLE = 資産価値（AV）× 暴露係数（EF）。年間損失予測 ALE = SLE × ARO（年間発生率）。対策の投資判断は「ALE(対策前) − ALE(対策後) − 対策の年間コスト」が正なら合理的。","src":"d1","i":"q0152"},{"d":"d1","s":"risk","l":3,"q":"資産価値200万円のサーバがあり、火災時に60%が損なわれると見積もられる。火災は10年に1回発生すると想定される。ALE はいくらか。","o":["12万円","120万円","20万円","200万円"],"a":0,"e":"SLE = 200万 × 0.6 = 120万円。ARO = 1/10 = 0.1。ALE = 120万 × 0.1 = 12万円。年間で12万円を超える対策コストは、この単一リスクだけを見れば正当化しにくい。","src":"d1","i":"q0153"},{"d":"d1","s":"risk","l":2,"q":"「サイバー保険に加入する」というリスク対応はどれに分類されるか。","o":["リスク低減（Mitigation）","リスク移転（Transfer）","リスク受容（Acceptance）","リスク回避（Avoidance）"],"a":1,"e":"保険や業務委託は移転（共有）。ただし移転しても説明責任（accountability）は移転しない点が試験の頻出ポイント。回避は活動そのものをやめること。","src":"d1","i":"q0154"},{"d":"d1","s":"risk","l":2,"q":"対策を実施した後に残るリスクを何と呼ぶか。","o":["固有リスク（Inherent Risk）","残存リスク（Residual Risk）","総リスク（Total Risk）","二次リスク（Secondary Risk）"],"a":1,"e":"Residual Risk = Total Risk − 統制による低減分。残存リスクを受容するかどうかを決めるのは経営層であり、その受容の記録（risk acceptance）が監査対象になる。","src":"d1","i":"q0155"},{"d":"d1","s":"risk","l":3,"q":"定性的リスク分析と定量的リスク分析の比較として正しいものはどれか。","o":["定量的分析は主観的で高速、定性的分析は客観的で低速","定性的は主観的で迅速、定量的は金額換算で客観的","定性的分析でのみ ALE を算出できる","定量的分析には資産価値の把握は不要"],"a":1,"e":"実務では両者を組み合わせる。定量は費用対効果の議論に強く、定性は無形資産（評判など）を扱いやすい。ALE は定量分析の産物。","src":"d1","i":"q0156"},{"d":"d1","s":"risk","l":2,"q":"NIST RMF（Risk Management Framework）における最初のステップはどれか。","o":["Select（管理策の選定）","Categorize（分類）","Assess（評価）","Authorize（運用認可）"],"a":1,"e":"RMF は Prepare → Categorize → Select → Implement → Assess → Authorize → Monitor。まず情報とシステムの重要度を分類しないと、適切な管理策ベースラインを選べない。","src":"d1","i":"q0157"},{"d":"d1","s":"risk","l":2,"q":"次のうち「検知的統制（Detective Control）」はどれか。","o":["ファイアウォール","監視カメラの録画とログレビュー","バックアップからの復旧","入退室の施錠"],"a":1,"e":"検知的統制は事象が起きたことを気づかせる（IDS、ログレビュー、監視カメラ、監査）。予防は FW・施錠・暗号化、是正はバックアップ復旧・パッチ適用、抑止は警告表示・掲示。","src":"d1","i":"q0158"},{"d":"d1","s":"risk","l":3,"q":"侵入者を思いとどまらせる目的で設置する「WARNING: 監視中」の看板はどの統制タイプか。","o":["予防的統制（Preventive）","抑止的統制（Deterrent）","是正的統制（Corrective）","補償的統制（Compensating）"],"a":1,"e":"抑止的統制は「やる気をなくさせる」もの。物理的に防ぐわけではないので予防的統制とは区別される。補償的統制（Compensating）は本来の統制が実装できない場合の代替。","src":"d1","i":"q0159"},{"d":"d1","s":"risk","l":3,"q":"職務分掌が人員不足で実現できない小規模組織が取るべき現実的な対応はどれか。","o":["リスクを無視して運用する","補償的統制で補い、残存リスクを文書化する","業務そのものを停止する","従業員全員に管理者権限を付与する"],"a":1,"e":"本来の統制が実装できない場合は補償的統制で代替し、残るリスクを明示して受容判断を仰ぐ。CISSP のマネージャ視点では「文書化」と「経営層の受容」がセットで問われる。","src":"d1","i":"q0160"},{"d":"d1","s":"risk","l":2,"q":"KRI（Key Risk Indicator）と KPI（Key Performance Indicator）の違いとして正しいものはどれか。","o":["KRI は過去の成果、KPI は将来のリスクを示す","KRI は将来の予兆、KPI は目標の達成度","両者は同一の指標である","KPI はセキュリティ専用の指標である"],"a":1,"e":"KRI は先行指標（例：未適用の重大パッチ数の増加）、KPI は成果指標（例：平均パッチ適用時間）。経営報告では両方を組み合わせる。","src":"d1","i":"q0161"},{"d":"d1","s":"threatmodel","l":2,"q":"STRIDE の 'R' が指すものはどれか。","o":["Risk","Repudiation（否認）","Recovery","Resilience"],"a":1,"e":"STRIDE は Spoofing / Tampering / Repudiation / Information Disclosure / Denial of Service / Elevation of Privilege。それぞれ 真正性 / 完全性 / 否認防止 / 機密性 / 可用性 / 認可 に対応する。","src":"d1","i":"q0162"},{"d":"d1","s":"threatmodel","l":2,"q":"攻撃者視点でビジネスへの影響からリスクを分析する、7段階のリスク中心型脅威モデリング手法はどれか。","o":["STRIDE","PASTA","DREAD","VAST"],"a":1,"e":"PASTA（Process for Attack Simulation and Threat Analysis）はビジネス目標から始まる7段階のリスク中心手法。STRIDE は脅威分類、DREAD は評価スコアリング、VAST は大規模組織向けのアジャイル指向。","src":"d1","i":"q0163"},{"d":"d1","s":"threatmodel","l":3,"q":"脅威モデリングを実施するのに最も効果的なタイミングはどれか。","o":["本番リリース後の運用フェーズ","設計フェーズ（できるだけ早期）","侵入テスト実施後","インシデント発生後"],"a":1,"e":"設計段階で行うほど手戻りコストが小さい（Shift Left）。後工程で見つかる欠陥ほど修正コストが指数的に増える、というのは D8 とも共通する CISSP の基本思想。","src":"d1","i":"q0164"},{"d":"d1","s":"scrm","l":2,"q":"サプライチェーンリスク管理において、ソフトウェア構成要素の透明性を高めるために用いられるものはどれか。","o":["SLA","SBOM","MOU","SOC 2 Type I"],"a":1,"e":"SBOM は依存ライブラリの一覧で、脆弱性公表時に影響範囲を即座に特定できる。Log4Shell 以降、政府調達要件にも組み込まれている。","src":"d1","i":"q0165"},{"d":"d1","s":"scrm","l":3,"q":"クラウドサービス事業者の内部統制の「設計と運用有効性を一定期間にわたり」評価した報告書はどれか。","o":["SOC 1 Type I","SOC 2 Type I","SOC 2 Type II","SOC 3"],"a":2,"e":"Type I は「ある時点の設計」、Type II は「一定期間（通常6〜12か月）の運用有効性」。SOC 1 は財務報告関連、SOC 2 は Trust Services 基準（セキュリティ等）、SOC 3 は一般公開向けの要約。","src":"d1","i":"q0166"},{"d":"d1","s":"scrm","l":2,"q":"第三者ベンダーとの契約でセキュリティ上最も重要な条項はどれか。","o":["支払条件と料金改定の上限を明記すること","監査権・インシデント通知義務・データ返却／破棄の要件","契約期間の自動更新と解約予告期間の定め","納品物の仕様と検収の基準を細かく定めること"],"a":1,"e":"委託しても説明責任は残るため、監査権・通知義務・データ処理条件を契約に明記する。契約終了時のデータ返却／確実な破棄の規定も必須。","src":"d1","i":"q0167"},{"d":"d1","s":"awareness","l":2,"q":"Awareness / Training / Education の違いとして正しいものはどれか。","o":["Awareness は専門技能の習得、Education は注意喚起","What / How / Why の違い","3つとも同義","Training は経営層のみを対象とする"],"a":1,"e":"Awareness＝認識の変化（短時間・全員）、Training＝スキル（職務別）、Education＝洞察・原理（管理職や専門職、学位課程レベル）。目的と対象の粒度で区別する。","src":"d1","i":"q0168"},{"d":"d1","s":"awareness","l":3,"q":"フィッシング訓練の結果、クリック率が高い部署が判明した。次に取るべき最も適切な行動はどれか。","o":["該当部署の従業員を懲戒処分にする","追加教育と技術的統制を組み合わせる","訓練を中止する","全社に個人名を公表して注意喚起する"],"a":1,"e":"訓練は罰ではなく改善のための指標。個人名の公表は心理的安全性を損ない、報告文化（インシデントの早期申告）を破壊する。教育と技術的統制の併用が正解。","src":"d1","i":"q0169"},{"d":"d1","s":"awareness","l":2,"q":"セキュリティ意識向上プログラムの有効性を測る指標として最も適切なものはどれか。","o":["研修の実施回数","訓練の報告率・クリック率の推移","研修資料のページ数","参加者の満足度アンケートのみ"],"a":1,"e":"実施回数や満足度は活動量の指標（output）にすぎない。行動が変わったかどうか（outcome）を測る指標を選ぶのが CISSP 的な正解。","src":"d1","i":"q0170"},{"d":"d2","s":"classify","l":2,"q":"データ分類を行う最大の目的はどれか。","o":["すべてのデータを同じ強度で保護するため","重要度に応じて保護レベルとコストを配分するため","ストレージ容量を削減するため","監査を不要にするため"],"a":1,"e":"分類は「守るべきものに、守るべきだけの資源を割く」ための仕組み。すべてを最高レベルで守るのは非現実的で、逆に重要データの保護が薄くなる。","src":"d23","i":"q0171"},{"d":"d2","s":"classify","l":2,"q":"米国政府の情報分類で、開示された場合に「exceptionally grave damage（極めて重大な損害）」をもたらすとされる区分はどれか。","o":["Confidential","Secret","Top Secret","Sensitive but Unclassified"],"a":2,"e":"Top Secret＝exceptionally grave damage、Secret＝serious damage、Confidential＝damage。この3語の対応は暗記事項。民間は Confidential/Proprietary > Private > Sensitive > Public の順が一般的。","src":"d23","i":"q0172"},{"d":"d2","s":"classify","l":3,"q":"データ分類プロジェクトを開始する際、最初に行うべきことはどれか。","o":["暗号化製品を選定する","資産目録を作成し、所在を把握する","全社員に分類ラベルの使い方を研修する","DLP を導入する"],"a":1,"e":"「持っているものを知らずに守ることはできない」。インベントリとデータディスカバリが起点で、分類基準の定義→ラベル付け→統制の適用と進む。","src":"d23","i":"q0173"},{"d":"d2","s":"roles","l":2,"q":"クラウド事業者にデータ処理を委託した場合でも、データ保護の最終的な説明責任を負うのは誰か。","o":["クラウド事業者（Processor）","委託元組織（Controller）","監督機関","エンドユーザー"],"a":1,"e":"責任（responsibility）は委譲できても説明責任（accountability）は委譲できない。GDPR でも Controller が主たる義務主体であり、Processor 選定と契約が Controller の義務になる。","src":"d23","i":"q0174"},{"d":"d2","s":"roles","l":2,"q":"データカストディアン（Data Custodian）の典型的な職務はどれか。","o":["データの分類レベルを決定する","バックアップとアクセス権の設定","データ処理の目的を決定する","規制当局への報告"],"a":1,"e":"カストディアンはオーナーの指示に従って技術的に守る役割。分類の決定はオーナー、目的の決定は Controller。","src":"d23","i":"q0175"},{"d":"d2","s":"lifecycle","l":2,"q":"データライフサイクルにおいて、最も見落とされやすくリスクが高いフェーズはどれか。","o":["作成（Create）","利用（Use）","保管（Store）","破棄（Destroy）"],"a":3,"e":"破棄は「終わったこと」として管理から漏れやすいが、残存データからの漏えいは頻発する。保持期限の管理と検証可能な破棄（証明書の取得を含む）が重要。","src":"d23","i":"q0176"},{"d":"d2","s":"states","l":2,"q":"Data in Use（利用中データ）を保護する技術として最も適切なものはどれか。","o":["TLS による通信路の暗号化","AES によるフルディスク暗号化","TEE（セキュアエンクレーブ）や準同型暗号","施錠された保管庫での媒体管理"],"a":2,"e":"in transit は TLS/IPsec、at rest は FDE/DB 暗号化、in use はメモリ上で平文になるため TEE（Intel SGX 等）や機密コンピューティング、準同型暗号が対象。","src":"d23","i":"q0177"},{"d":"d2","s":"states","l":1,"q":"Data at Rest の保護に最も直接的に対応する技術はどれか。","o":["IPsec による経路暗号化","フルディスク暗号化（FDE）","SRTP による音声暗号化","802.1X によるポート認証"],"a":1,"e":"at rest＝保管中。FDE、ファイル／DB 暗号化、テープ暗号化が該当。IPsec と SRTP は in transit、802.1X はネットワークアクセス制御。","src":"d23","i":"q0178"},{"d":"d2","s":"remanence","l":2,"q":"磁気テープ／HDD を再利用せず完全に廃棄する場合、最も確実なサニタイズ手法はどれか。","o":["ファイルの完全削除とゴミ箱の消去","OS 標準機能によるフォーマット","消磁（degaussing）または物理破壊","ランダムデータによる1回の上書き"],"a":2,"e":"Clear（上書き）< Purge（消磁・暗号消去）< Destroy（物理破壊）の順に強い。SSD は磁気ではないため消磁が効かず、暗号消去（Crypto Erase）または物理破壊が推奨される点に注意。","src":"d23","i":"q0179"},{"d":"d2","s":"remanence","l":3,"q":"SSD に保存された機密データを廃棄する。最も適切な方法はどれか。","o":["Degaussing（消磁）","複数回のランダム上書き","暗号消去または物理破壊","クイックフォーマット"],"a":2,"e":"SSD はウェアレベリングにより上書きが全セルに届かず、また磁気媒体ではないため消磁は無効。最初から暗号化して鍵を破棄する Crypto Erase か、シュレッド／破砕が確実。","src":"d23","i":"q0180"},{"d":"d2","s":"remanence","l":2,"q":"「データ残存（Data Remanence）」とは何か。","o":["データが複数拠点に複製されている状態","削除後も媒体上に情報が残っている状態","データが暗号化されている状態","バックアップが世代管理されている状態"],"a":1,"e":"論理削除はインデックスを消すだけで実体は残る。媒体の再利用・廃棄・返却（リース機器やクラウド）時の主要リスク。","src":"d23","i":"q0181"},{"d":"d2","s":"protect","l":2,"q":"DLP（Data Loss Prevention）が最も効果を発揮する前提条件はどれか。","o":["全ユーザーが管理者権限を持つこと","データが分類され、検知ルールが実態に合うこと","ネットワークが単一セグメントであること","ログを保存しないこと"],"a":1,"e":"DLP は「何を守るか」が定義されて初めて機能する。分類・ラベルなしで導入すると誤検知が多発し、運用が破綻して結局無効化されるのが典型的な失敗。","src":"d23","i":"q0182"},{"d":"d2","s":"protect","l":3,"q":"クレジットカード番号を、業務で使える形式を保ちながら不可逆に置き換え、元の値は安全な保管庫で管理する手法はどれか。","o":["共通鍵による可逆な暗号化","トークナイゼーション","ソルト付きハッシュ化","画面表示時の動的マスキング"],"a":1,"e":"トークナイゼーションは値をトークンに置換し、対応表を Vault に保持する。PCI DSS のスコープ縮小に有効。マスキングは表示制御、ハッシュは不可逆だが元に戻せないため決済処理には使えない。","src":"d23","i":"q0183"},{"d":"d2","s":"retention","l":2,"q":"データ保持方針を定めるうえで、保持期間を「必要以上に長く」設定することのリスクはどれか。","o":["保管に要するストレージ費用のみが増える","漏えい被害と開示対応コストが増大する","証跡が揃うため監査には有利にはたらく","保持しているだけならリスクは生じない"],"a":1,"e":"「持っていないデータは漏れない」。法令上の保持義務を満たしつつ、期限到来後は確実に破棄するのが原則。訴訟ホールド（litigation hold）が掛かっている間は例外的に破棄を停止する。","src":"d23","i":"q0184"},{"d":"d2","s":"retention","l":2,"q":"EOL（End of Life）と EOS（End of Support）のうち、セキュリティ上より深刻なのはどちらか、またその理由は。","o":["EOL。新規の販売と調達ができなくなるため","EOS。パッチが提供されず脆弱性が残るため","両者に実質的な差はなく同時に訪れる","EOL。保守費用の単価が上昇するため"],"a":1,"e":"EOS 後は新規の脆弱性が公表されても修正されない。継続利用する場合はネットワーク隔離、仮想パッチ、補償的統制で残存リスクを管理し、経営層に受容させる。","src":"d23","i":"q0185"},{"d":"d3","s":"principles","l":2,"q":"「Fail Secure（Fail Closed）」の設計が適切な場面はどれか。","o":["非常口の電気錠","データセンターのファイアウォール","火災時の避難経路の扉","病院の生命維持装置の電源"],"a":1,"e":"人命が関わる場面では Fail Safe（安全側＝開放）、機密性が最優先の場面では Fail Secure（閉鎖）。CISSP では「人命 > 資産」が絶対原則で、避難経路は必ず Fail Safe。","src":"d23","i":"q0186"},{"d":"d3","s":"principles","l":2,"q":"Least Privilege と Need to Know の違いとして正しいものはどれか。","o":["両者は同義である","操作の最小化と、情報の限定","Need to Know は技術的統制のみを指す","Least Privilege は管理者にのみ適用される"],"a":1,"e":"権限（できること）の最小化が Least Privilege、情報（知ってよいこと）の限定が Need to Know。実務では両方を組み合わせる。","src":"d23","i":"q0187"},{"d":"d3","s":"principles","l":3,"q":"Open Design（Kerckhoffs の原理）が主張することはどれか。","o":["アルゴリズムを秘密にすることでセキュリティを高める","安全性はアルゴリズムでなく鍵の秘匿に依存すべき","ソースコードを必ず公開すべきである","暗号は使用すべきでない"],"a":1,"e":"「アルゴリズムが公知でも鍵さえ守られていれば安全」であるべき。Security through Obscurity（秘匿による安全）に依存する設計は CISSP では一貫して否定される。","src":"d23","i":"q0188"},{"d":"d3","s":"principles","l":2,"q":"Secure Defaults（安全な初期値）の考え方に沿った実装はどれか。","o":["初期状態で全機能を有効にし、不要なものを利用者が無効化する","初期状態で最小限の機能のみを有効にし、必要なものを明示的に有効化する","初期パスワードを全機器で共通にする","ログ機能を初期状態で無効にする"],"a":1,"e":"デフォルト拒否（deny by default）が原則。攻撃対象面の最小化（reduce attack surface）とも直結する。","src":"d23","i":"q0189"},{"d":"d3","s":"models","l":2,"q":"Bell-LaPadula モデルの「*（スター）プロパティ」が禁止するのはどれか。","o":["上位レベルの読み取り","下位レベルへの書き込み","同一レベルの読み書き","監査ログの記録"],"a":1,"e":"BLP は機密性モデル。Simple Security Property＝No Read Up、*-property＝No Write Down（下位への書き込み禁止＝情報の下方漏えい防止）。","src":"d23","i":"q0190"},{"d":"d3","s":"models","l":2,"q":"Biba モデルが保護する主な特性はどれか。","o":["機密性","完全性","可用性","否認防止"],"a":1,"e":"Biba は完全性モデルで、BLP の逆。Simple Integrity＝No Read Down（汚染された下位を読まない）、*-Integrity＝No Write Up（上位を汚染しない）。","src":"d23","i":"q0191"},{"d":"d3","s":"models","l":3,"q":"Clark-Wilson モデルの中核概念として正しいものはどれか。","o":["Read Up / Write Down の制御","正しく作られた手続き経由でのみデータを操作させる","格子（lattice）による多層機密ラベル","情報フローの非干渉"],"a":1,"e":"Clark-Wilson は商用完全性モデル。主体は CDI（制約付きデータ項目）に直接触れず、TP（変換手続き）を介する access triple（subject-program-object）が特徴。職務分掌と監査を明示的に含む。","src":"d23","i":"q0192"},{"d":"d3","s":"models","l":3,"q":"Brewer-Nash（Chinese Wall）モデルが対処する主な問題はどれか。","o":["多層に分かれた機密区分の階層的な制御","利益相反 — 競合他社の情報への同時アクセス防止","改ざんを防ぐためのデータ完全性の維持","障害時にも処理を継続させる可用性の確保"],"a":1,"e":"コンサルティング会社などで、ある企業の情報にアクセスした主体は競合企業の情報にアクセスできなくなる。アクセス制御が「過去の行動」に動的に依存する点が特徴。","src":"d23","i":"q0193"},{"d":"d3","s":"eval","l":2,"q":"Common Criteria における「評価対象が満たすべきセキュリティ要件を、製品カテゴリ単位で定義した文書」はどれか。","o":["TOE（Target of Evaluation）","PP（Protection Profile）","ST（Security Target）","EAL"],"a":1,"e":"PP は「顧客側が定義する要求仕様（〜のような製品はこうあるべき）」、ST は「ベンダが自製品について宣言する仕様」、TOE は評価対象そのもの、EAL は保証レベル（EAL1〜EAL7）。","src":"d23","i":"q0194"},{"d":"d3","s":"eval","l":2,"q":"Common Criteria の EAL が示すものはどれか。","o":["暗号鍵の長さ","セキュリティ機能の強さ","評価・検証の厳格さ（保証レベル）","製品の販売価格帯"],"a":2,"e":"EAL は「どれだけ厳密に検証したか」であって「どれだけ安全か」ではない。EAL7 の製品でも ST の記述範囲が狭ければ実務上の安全性は限定的、という点が頻出の引っかけ。","src":"d23","i":"q0195"},{"d":"d3","s":"crypto","l":1,"q":"対称鍵暗号と非対称鍵暗号の比較として正しいものはどれか。","o":["対称鍵は低速で鍵配送が容易","対称鍵は高速だが鍵配送が課題","非対称鍵は大量データの暗号化に最適","両者は同じ鍵長で同じ強度を持つ"],"a":1,"e":"実務ではハイブリッド方式：非対称鍵でセッション鍵を安全に配送し、本体データは対称鍵（AES）で高速に暗号化する。TLS がまさにこの構造。","src":"d23","i":"q0196"},{"d":"d3","s":"crypto","l":2,"q":"n 人が対称鍵暗号で相互に通信する場合に必要な鍵の総数はどれか。","o":["n 本","2n 本","n(n−1)/2 本","n の2乗 本"],"a":2,"e":"対称鍵はペアごとに必要なので n(n−1)/2。10人なら45本、100人なら4950本と爆発する。これが公開鍵暗号（2n 本）や KDC（Kerberos）が必要になる理由。","src":"d23","i":"q0197"},{"d":"d3","s":"crypto","l":2,"q":"AES の説明として正しいものはどれか。","o":["ストリーム暗号で鍵長は56ビット","ブロック長128ビットの共通鍵ブロック暗号","公開鍵暗号で素因数分解の困難性に依存","ハッシュ関数の一種"],"a":1,"e":"AES（Rijndael）はブロック長128固定、鍵長128/192/256。ラウンド数は鍵長に応じて10/12/14。DES は鍵56ビットで既に危殆化、3DES も非推奨。","src":"d23","i":"q0198"},{"d":"d3","s":"crypto","l":3,"q":"ブロック暗号の動作モードのうち、同じ平文ブロックが常に同じ暗号文ブロックになるためパターンが露見し、単独利用が推奨されないものはどれか。","o":["CBC","ECB","CTR","GCM"],"a":1,"e":"ECB は各ブロックを独立に暗号化するためパターンが残る（有名な「ペンギン画像」）。CBC は前ブロックと XOR、CTR はカウンタでストリーム化、GCM は CTR に認証（AEAD）を付与した現在の推奨モード。","src":"d23","i":"q0199"},{"d":"d3","s":"crypto","l":3,"q":"機密性と完全性・真正性を同時に提供する認証付き暗号（AEAD）モードはどれか。","o":["ECB","CBC","GCM","OFB"],"a":2,"e":"GCM（および ChaCha20-Poly1305）は暗号化と認証タグを同時に生成する AEAD。CBC 単独では改ざん検知ができず、別途 HMAC が必要（かつ実装順序を誤ると padding oracle 攻撃を招く）。","src":"d23","i":"q0200"},{"d":"d3","s":"crypto","l":2,"q":"ハッシュ関数に求められる「衝突耐性（collision resistance）」とは何か。","o":["同じ入力から常に同じ出力が得られること","同じ値になる2入力を見つけるのが困難であること","ハッシュ値から入力を復元できないこと","出力長が可変であること"],"a":1,"e":"原像計算困難性（一方向性）、第二原像計算困難性、衝突耐性の3つを区別する。MD5・SHA-1 は衝突が実証済みで署名用途には使用禁止。SHA-256 以上を使う。","src":"d23","i":"q0201"},{"d":"d3","s":"crypto","l":3,"q":"パスワードをデータベースに保存する際の最も適切な方法はどれか。","o":["AES で暗号化して保存","SHA-256 でハッシュ化して保存","ソルト付き bcrypt を使う","Base64 でエンコードして保存"],"a":2,"e":"高速ハッシュ（SHA-256）は GPU による総当たりに弱い。ソルト（レインボーテーブル対策）＋意図的に遅い鍵導出関数（Argon2id が現在の推奨）を使う。可逆な暗号化は鍵漏えいで全滅するため不適。","src":"d23","i":"q0202"},{"d":"d3","s":"crypto","l":2,"q":"Perfect Forward Secrecy（PFS）が提供する保証はどれか。","o":["暗号アルゴリズムが未来永劫破られない","長期鍵が漏れても過去の通信を復号できない","鍵長が自動的に伸びる","証明書の有効期限が無期限になる"],"a":1,"e":"セッションごとに使い捨ての鍵を Diffie-Hellman（DHE/ECDHE）で生成し、長期鍵は認証にのみ使う。RSA 鍵交換には PFS がないため TLS 1.3 では廃止された。","src":"d23","i":"q0203"},{"d":"d3","s":"crypto","l":3,"q":"共通鍵を安全でない通信路上で共有するための鍵合意アルゴリズムはどれか。","o":["RSA による電子署名","Diffie-Hellman 鍵合意","SHA-3 によるハッシュ計算","HMAC メッセージ認証"],"a":1,"e":"DH は離散対数問題に基づく鍵合意。ただし認証がないため中間者攻撃に弱く、証明書や署名による相手認証と併用する必要がある（Authenticated DH）。","src":"d23","i":"q0204"},{"d":"d3","s":"pki","l":2,"q":"デジタル署名の生成手順として正しいものはどれか。","o":["メッセージを送信者の公開鍵で暗号化する","メッセージのハッシュ値を送信者の秘密鍵で暗号化する","メッセージを受信者の公開鍵で暗号化する","メッセージのハッシュ値を受信者の秘密鍵で暗号化する"],"a":1,"e":"署名＝ハッシュを自分の秘密鍵で処理。検証は送信者の公開鍵で行う。機密性を得るなら「受信者の公開鍵で暗号化」で、署名とは鍵の使い方が逆になる点が最頻出の引っかけ。","src":"d23","i":"q0205"},{"d":"d3","s":"pki","l":2,"q":"証明書の失効状態をリアルタイムに問い合わせるプロトコルはどれか。","o":["CRL","OCSP","SCEP","CMP"],"a":1,"e":"OCSP（Online Certificate Status Protocol）はリアルタイム照会。CRL は失効リストの定期配布で鮮度とサイズに難がある。OCSP Stapling はサーバが応答を添付してプライバシーと性能を改善する方式。","src":"d23","i":"q0206"},{"d":"d3","s":"pki","l":3,"q":"CA の秘密鍵が漏えいした場合の影響として最も深刻なものはどれか。","o":["その CA が発行した既存証明書の有効期限が短くなる","任意ドメインの偽証明書を発行され信頼が崩壊する","OCSP レスポンダが停止する","CRL のサイズが増大する"],"a":1,"e":"ルート CA 鍵の漏えいは信頼の起点の崩壊を意味し、全証明書の再発行と信頼ストアからの削除が必要になる。だからこそルート CA はオフライン運用（offline root）＋HSM 保管が原則。","src":"d23","i":"q0207"},{"d":"d3","s":"attacks","l":2,"q":"暗号処理にかかる時間や消費電力の差から鍵を推測する攻撃はどれか。","o":["Birthday attack","Side-channel attack","Chosen plaintext attack","Rainbow table attack"],"a":1,"e":"サイドチャネル攻撃はタイミング・電力・電磁波・音響などの物理的漏えいを利用する。対策は定数時間実装、ブラインディング、ノイズ付加。","src":"d23","i":"q0208"},{"d":"d3","s":"attacks","l":3,"q":"ハッシュの衝突を「誕生日のパラドックス」を利用して効率的に探索する攻撃はどれか。","o":["Birthday attack","Meet-in-the-middle attack","Replay attack","Downgrade attack"],"a":0,"e":"n ビットのハッシュに対して約 2^(n/2) の試行で衝突が見つかる。SHA-256 の衝突耐性が実質128ビットとされるのはこのため。ハッシュ長を選ぶ際の基準になる。","src":"d23","i":"q0209"},{"d":"d3","s":"attacks","l":3,"q":"TLS ハンドシェイクで、攻撃者が古く脆弱な暗号スイートを強制的に選ばせる攻撃はどれか。","o":["Replay attack","Downgrade attack","Birthday attack","Padding oracle attack"],"a":1,"e":"ダウングレード攻撃（POODLE, FREAK 等）。対策はサーバ側で脆弱なバージョン／スイートを無効化すること、TLS_FALLBACK_SCSV、TLS 1.3 の採用。","src":"d23","i":"q0210"},{"d":"d3","s":"archvuln","l":3,"q":"クライアントが検証した後、実際に使用されるまでの間に値が書き換えられる競合状態の脆弱性を何と呼ぶか。","o":["Buffer overflow","TOCTOU（検査時と使用時の競合）","Covert channel","Object reuse"],"a":1,"e":"TOCTOU は代表的な race condition。対策はアトミックな操作、ロック、検証と使用の間に窓を作らない設計。","src":"d23","i":"q0211"},{"d":"d3","s":"archvuln","l":3,"q":"正規の通信経路以外を使って情報を漏えいさせる経路を何と呼ぶか。","o":["Covert channel","Side channel","Trapdoor","Maintenance hook"],"a":0,"e":"Covert channel には Storage channel（共有リソースの状態で伝達）と Timing channel（処理時間で伝達）がある。多層セキュリティ環境（MLS）で特に問題視される。","src":"d23","i":"q0212"},{"d":"d3","s":"physical","l":2,"q":"データセンターの入退室でタングリング（piggybacking / tailgating）を防ぐ最も効果的な物理統制はどれか。","o":["死角のない監視カメラの設置","マントラップ","共連れ禁止の警告掲示と啓発","入退室ログの事後レビュー"],"a":1,"e":"マントラップは二重扉で一度に一人しか通れない構造。カメラとログは検知的統制で、その場での侵入は防げない。ターンスタイルも同様の予防的統制。","src":"d23","i":"q0213"},{"d":"d3","s":"physical","l":3,"q":"サーバルームの消火設備として、機器への損傷が最も少ないのはどれか。","o":["湿式の水スプリンクラー設備","不活性ガス系の消火剤","発泡による泡消火設備","粉末を散布する消火設備"],"a":1,"e":"クリーンエージェント（ガス系）は残渣を残さず機器を損傷しない。ただし人命が最優先で、避難と酸素濃度への配慮が必要。ハロンはオゾン層破壊のため新規使用は禁止されている。","src":"d23","i":"q0214"},{"d":"d3","s":"physical","l":2,"q":"火災の分類で「電気設備の火災」に該当するのはどれか（米国分類）。","o":["Class A","Class B","Class C","Class D"],"a":2,"e":"Class A＝普通可燃物（木・紙）、B＝可燃性液体、C＝電気設備、D＝可燃性金属、K（欧州は F）＝厨房油脂。電気火災に水は使えない。","src":"d23","i":"q0215"},{"d":"d3","s":"physical","l":3,"q":"CPTED（Crime Prevention Through Environmental Design）の基本原則に含まれないものはどれか。","o":["自然な監視（Natural Surveillance）","自然なアクセス制御（Natural Access Control）","領域性の強化（Territorial Reinforcement）","侵入検知システムの導入"],"a":3,"e":"CPTED は環境デザインによって犯罪を抑止する考え方で、3原則は自然監視・自然アクセス制御・領域性の強化。技術的な IDS 導入は CPTED の原則そのものではない。","src":"d23","i":"q0216"},{"d":"d4","s":"osi","l":1,"q":"OSI 参照モデルで、ルーティングと論理アドレス（IP）を扱う層はどれか。","o":["第2層（データリンク層）","第3層（ネットワーク層）","第4層（トランスポート層）","第5層（セッション層）"],"a":1,"e":"L3＝ルーティング／IP。L2 は MAC アドレスとスイッチング、L4 は TCP/UDP とポート、L5 はセッション確立・管理。層と機器・プロトコルの対応は必ず暗記する。","src":"d45","i":"q0217"},{"d":"d4","s":"osi","l":2,"q":"次のうち、OSI 第2層で動作する機器はどれか。","o":["ルータ","スイッチ（ブリッジ）","リピータ／ハブ","アプリケーションプロキシ"],"a":1,"e":"L1＝リピータ・ハブ、L2＝スイッチ・ブリッジ、L3＝ルータ・L3スイッチ、L7＝プロキシ・WAF。「衝突ドメインを分割するのは L2、ブロードキャストドメインを分割するのは L3」もセットで覚える。","src":"d45","i":"q0218"},{"d":"d4","s":"osi","l":3,"q":"暗号化・データ形式変換・文字コード変換を担当する OSI 層はどれか。","o":["第5層（セッション層）","第6層（プレゼンテーション層）","第7層（アプリケーション層）","第4層（トランスポート層）"],"a":1,"e":"プレゼンテーション層＝翻訳者。暗号化・圧縮・フォーマット変換（JPEG, ASCII, EBCDIC）を担う。試験では「暗号化はどの層か」が繰り返し問われる。","src":"d45","i":"q0219"},{"d":"d4","s":"osi","l":2,"q":"TCP の3ウェイハンドシェイクの順序として正しいものはどれか。","o":["SYN → ACK → SYN/ACK","SYN → SYN/ACK → ACK","ACK → SYN → SYN/ACK","SYN/ACK → SYN → ACK"],"a":1,"e":"SYN → SYN/ACK → ACK。SYN Flood はこのハンドシェイクを未完了のまま大量に送り、接続キューを枯渇させる攻撃。対策は SYN Cookie。","src":"d45","i":"q0220"},{"d":"d4","s":"ip","l":1,"q":"HTTPS が既定で使用するポート番号はどれか。","o":["21","80","443","3389"],"a":2,"e":"443/TCP。20/21＝FTP、22＝SSH/SFTP、23＝Telnet、25＝SMTP、53＝DNS、80＝HTTP、110＝POP3、143＝IMAP、161/162＝SNMP、389＝LDAP、636＝LDAPS、445＝SMB、3389＝RDP。","src":"d45","i":"q0221"},{"d":"d4","s":"ip","l":2,"q":"Telnet の代わりに SSH を使うべき最大の理由はどれか。","o":["SSH の方が高速だから","認証情報を含む通信が平文で流れるから","Telnet はポート番号が固定できないから","SSH は圧縮できるから"],"a":1,"e":"Telnet(23)、FTP(21)、HTTP(80)、SNMPv1/v2c、POP3、IMAP は平文。それぞれ SSH(22)、SFTP/FTPS、HTTPS、SNMPv3、POP3S/IMAPS に置き換える。","src":"d45","i":"q0222"},{"d":"d4","s":"ip","l":2,"q":"UDP の特徴として正しいものはどれか。","o":["コネクション型で順序保証がある","コネクションレスでオーバーヘッドが小さい","必ず暗号化される","ポート番号を使わない"],"a":1,"e":"UDP は best-effort。DNS、DHCP、SNMP、VoIP、ストリーミングで使われる。コネクションレスゆえに送信元 IP 偽装が容易で、DNS/NTP/memcached を悪用した増幅型 DDoS の踏み台になる。","src":"d45","i":"q0223"},{"d":"d4","s":"ip","l":3,"q":"DNS の応答を偽装してユーザーを不正サイトへ誘導する攻撃への根本的な対策はどれか。","o":["DNS サーバの冗長化と負荷分散","DNSSEC による応答の完全性検証","既定ポートの変更による隠蔽","キャッシュ TTL の延長"],"a":1,"e":"DNSSEC は署名により応答の真正性と完全性を保証する（機密性は提供しない点に注意）。機密性が必要なら DoH/DoT を併用する。","src":"d45","i":"q0224"},{"d":"d4","s":"secure-proto","l":2,"q":"IPsec の AH（Authentication Header）と ESP（Encapsulating Security Payload）の違いとして正しいものはどれか。","o":["AH は暗号化を提供し、ESP は認証のみ","AH は完全性のみ、ESP は機密性も提供する","両者は同一機能","ESP は NAT を通過できない"],"a":1,"e":"AH は暗号化しないため機密性がなく、NAT でヘッダが変わると検証に失敗する（NAT 非透過）。実運用では ESP（+NAT-T）が主流。トンネルモードは元 IP ヘッダごと保護、トランスポートモードはペイロードのみ。","src":"d45","i":"q0225"},{"d":"d4","s":"secure-proto","l":2,"q":"SNMP でセキュリティ上 v3 が推奨される理由はどれか。","o":["v3 のみがトラップに対応するため","v3 のみ認証と暗号化を備えるため","v3 の方が MIB が多いため","v3 は UDP を使わないため"],"a":1,"e":"v1/v2c のコミュニティ文字列は実質的な平文パスワード。v3 は USM による認証（HMAC）と暗号化（AES）を備える。既定の public/private は必ず変更する。","src":"d45","i":"q0226"},{"d":"d4","s":"devices","l":2,"q":"ステートフルインスペクション型ファイアウォールの特徴はどれか。","o":["パケットのヘッダのみを個別に判定する","接続の状態を保持し、文脈で判定する","アプリケーションのペイロードを完全に解析する","レイヤ1で動作する"],"a":1,"e":"ステートレス（パケットフィルタ）は各パケットを独立に判定するため戻りトラフィックの制御が難しい。ステートフルは状態表を持つ。さらに上位に アプリケーションプロキシ／NGFW／WAF がある。","src":"d45","i":"q0227"},{"d":"d4","s":"devices","l":3,"q":"Web アプリケーションへの SQL インジェクションを通信経路上で防ぐのに最も適した機器はどれか。","o":["ステートレスパケットフィルタ","WAF（Web アプリケーションFW）","L2 スイッチ","ロードバランサ"],"a":1,"e":"WAF は HTTP のペイロードを解析する L7 の統制。ただし根本対策はパラメタライズドクエリ等の安全なコーディングで、WAF は多層防御の一枚（仮想パッチ）と位置づける。","src":"d45","i":"q0228"},{"d":"d4","s":"segmentation","l":2,"q":"DMZ を設ける主な目的はどれか。","o":["インターネット回線を高速化する","公開サーバを分離し、内部への侵入を防ぐ","IP アドレスを節約する","ログの量を減らす"],"a":1,"e":"DMZ は境界のバッファ。公開サーバから内部への通信は原則禁止（または厳格に限定）にする。三脚型ファイアウォールやスクリーンドサブネットで構成する。","src":"d45","i":"q0229"},{"d":"d4","s":"segmentation","l":3,"q":"VLAN によるセグメンテーションのセキュリティ上の限界として正しいものはどれか。","o":["暗号化は提供されず、VLAN ホッピングの余地が残る","VLAN は物理分離と完全に同等である","VLAN はブロードキャストドメインを分割しない","VLAN は L3 で動作する"],"a":0,"e":"VLAN は論理分離であり暗号化はしない。ダブルタギングやスイッチスプーフィングによる VLAN ホッピングの対策として、未使用ポートのシャットダウン、ネイティブ VLAN の変更、DTP 無効化を行う。","src":"d45","i":"q0230"},{"d":"d4","s":"segmentation","l":2,"q":"802.1X が提供する機能はどれか。","o":["無線通信の暗号化アルゴリズム","ポートベースのアクセス制御","IP アドレスの自動割り当て","経路情報を交換するプロトコル"],"a":1,"e":"802.1X は Supplicant / Authenticator / Authentication Server（RADIUS）の3者構成で、認証されるまでポートを開かない。NAC の中核技術。","src":"d45","i":"q0231"},{"d":"d4","s":"segmentation","l":3,"q":"ゼロトラストアーキテクチャの中心的な考え方はどれか。","o":["社内ネットワークは信頼できるので内部通信の検査は不要","位置による暗黙の信頼を排し、都度検証する","VPN を全社員に配布すれば実現できる","ファイアウォールを多段に配置すること"],"a":1,"e":"「Never trust, always verify」。NIST SP 800-207 が参照モデル。ポリシー決定点（PDP）／実施点（PEP）、マイクロセグメンテーション、継続的な認可が要素。境界防御の否定ではなく、境界に依存しない設計。","src":"d45","i":"q0232"},{"d":"d4","s":"wireless","l":2,"q":"WPA2 に対する WPA3 の主な改善点はどれか。","o":["SSID を隠せるようになった","SAE によりオフライン辞書攻撃に耐性を持つ","WEP との互換性を確保した","MAC アドレスフィルタを必須にした"],"a":1,"e":"WPA3-Personal は PSK を SAE（Dragonfly）に置き換え、弱いパスワードでもオフライン攻撃を困難にし、PFS も提供する。WEP は RC4 と IV 再利用により完全に破られており使用禁止。","src":"d45","i":"q0233"},{"d":"d4","s":"wireless","l":2,"q":"SSID の非表示（SSID ステルス）と MAC アドレスフィルタリングの評価として正しいものはどれか。","o":["いずれも強固な認証手段である","いずれも容易に回避でき、代替にならない","SSID 非表示は暗号化と同等の効果がある","MAC フィルタは偽装できない"],"a":1,"e":"SSID はプローブ応答から取得でき、MAC は容易に偽装できる。どちらも Security through Obscurity にすぎず、WPA2/WPA3-Enterprise（802.1X）による認証・暗号化が本質的な対策。","src":"d45","i":"q0234"},{"d":"d4","s":"channels","l":2,"q":"IPsec VPN と TLS/SSL VPN の使い分けとして適切なものはどれか。","o":["IPsec は L7 でブラウザから利用、TLS VPN は L3 で全通信をトンネル","IPsec は L3 のサイト間、TLS VPN は L7 のリモート","両者に機能差はない","TLS VPN は暗号化しない"],"a":1,"e":"IPsec は OS レベルで全トラフィックを保護でき拠点間接続に強い。TLS VPN はクライアントレスで導入が容易だが対象がアプリケーション単位になりやすい。","src":"d45","i":"q0235"},{"d":"d4","s":"channels","l":3,"q":"スプリットトンネリングを許可した場合のセキュリティ上の懸念はどれか。","o":["VPN 装置の帯域が不足し、速度が低下する","感染端末が社内への侵入経路になりうる","トンネルの暗号強度が実質的に低下する","多要素認証を適用できなくなる"],"a":1,"e":"スプリットトンネルは利便性・帯域では有利だが、社内向け通信だけがトンネルを通るため、社外側の通信は組織の検査を受けない。高機密環境ではフルトンネルを選ぶのが原則。","src":"d45","i":"q0236"},{"d":"d4","s":"channels","l":3,"q":"VoIP 通信の盗聴を防ぐために用いるプロトコルはどれか。","o":["RTP","SRTP","SIP","H.323"],"a":1,"e":"SRTP（Secure RTP）がメディアストリームを暗号化・認証する。シグナリング（SIP）は SIPS/TLS で保護する。VoIP は音声・シグナリングの両方を守る必要がある。","src":"d45","i":"q0237"},{"d":"d5","s":"iaaa","l":1,"q":"Identification と Authentication の違いとして正しいものはどれか。","o":["Identification は本人性の証明、Authentication は主張","「私は誰か」の主張と、その証明","両者は同義","Authentication は権限の付与を含む"],"a":1,"e":"ID の提示（Identification）→ 資格情報による証明（Authentication）→ 権限付与（Authorization）→ 記録（Accounting）。ID は一意でなければならず、共有アカウントは Accountability を破壊する。","src":"d45","i":"q0238"},{"d":"d5","s":"iaaa","l":2,"q":"共有アカウント（例：admin を複数人で使用）の最大の問題はどれか。","o":["設定するパスワードが長くなりがちである","誰が何をしたか追跡できず説明責任が崩れる","同時ログイン時に処理が遅くなる","利用者数に応じた費用が増える"],"a":1,"e":"個人に紐づく一意の ID がなければ監査証跡が意味をなさない。特権作業は個人 ID でログインしてから昇格する（sudo, PAM による払い出し）のが原則。","src":"d45","i":"q0239"},{"d":"d5","s":"factors","l":1,"q":"多要素認証（MFA）として成立している組み合わせはどれか。","o":["パスワードと秘密の質問","パスワードとワンタイムコード","指紋と網膜スキャンの併用","PIN とパスワードの併用"],"a":1,"e":"Type1＝知識（something you know）、Type2＝所持（something you have）、Type3＝生体（something you are）。異なるタイプの組み合わせが MFA。A と D は知識×知識、C は生体×生体で多要素ではない。","src":"d45","i":"q0240"},{"d":"d5","s":"factors","l":2,"q":"「Somewhere you are」に該当する認証要素はどれか。","o":["スマートカードの提示","位置情報（GPS／IP）","声紋による本人照合","長いパスフレーズ"],"a":1,"e":"拡張要素として Somewhere you are（位置）、Something you do（署名の筆跡・タイピングリズム）がある。単独では弱いが、リスクベース認証の文脈情報として有効。","src":"d45","i":"q0241"},{"d":"d5","s":"factors","l":3,"q":"リスクベース認証（適応型認証）の説明として正しいものはどれか。","o":["常に全ユーザーに同じ認証を要求する","高リスク時のみ追加認証を求める","認証を完全に廃止する","パスワードの複雑性要件を上げる"],"a":1,"e":"利便性とセキュリティのバランスを取る手法。通常と異なる国からのログインや不審な端末で MFA を追加要求する。ゼロトラストの「継続的な検証」とも整合する。","src":"d45","i":"q0242"},{"d":"d5","s":"biometric","l":2,"q":"生体認証システムで、正当な利用者を誤って拒否する率を何と呼ぶか。","o":["FAR（Type II エラー）","FRR（Type I エラー）","CER","EER の逆数"],"a":1,"e":"FRR＝False Rejection Rate＝Type I エラー（本人を拒否／利便性の問題）。FAR＝False Acceptance Rate＝Type II エラー（他人を受入／セキュリティの問題）。セキュリティ上より深刻なのは FAR。","src":"d45","i":"q0243"},{"d":"d5","s":"biometric","l":2,"q":"複数の生体認証製品の精度を比較する際に最も適した単一指標はどれか。","o":["FAR（他人受入率）のみ","FRR（本人拒否率）のみ","CER（両者が等しくなる点）","登録に要する所要時間"],"a":2,"e":"CER（Crossover Error Rate）＝EER。値が低いほど高精度。ただし実運用では用途に応じて感度を調整し、高セキュリティ環境では FAR を下げる（＝FRR は上がる）方向にチューニングする。","src":"d45","i":"q0244"},{"d":"d5","s":"biometric","l":3,"q":"生体認証の導入で、利用者の受容性に最も影響しやすい要素はどれか。","o":["装置のCER が示す精度の高さ","所要時間と身体的・心理的な抵抗感","テンプレートを保持するDBの規模","採用したベンダーの知名度"],"a":1,"e":"技術的精度が高くても、利用者が使わなければ統制は機能しない。網膜スキャンは精度が非常に高い一方、接触や健康情報の露見が懸念され受容性が低いとされる典型例。","src":"d45","i":"q0245"},{"d":"d5","s":"sso","l":2,"q":"Kerberos において、ユーザーが最初に取得するチケットはどれか。","o":["サービスチケット（ST）","チケット認可チケット（TGT）","セッション鍵のみ","証明書"],"a":1,"e":"AS（認証サービス）から TGT を取得 → TGS（チケット認可サービス）へ TGT を提示してサービスチケットを取得 → サービスへ提示。KDC は AS と TGS を含む。","src":"d45","i":"q0246"},{"d":"d5","s":"sso","l":3,"q":"Kerberos がリプレイ攻撃を防ぐために利用する仕組みはどれか。","o":["公開鍵証明書","タイムスタンプによる鮮度検証","IP アドレスのホワイトリスト","パスワードの定期変更"],"a":1,"e":"Kerberos はタイムスタンプに強く依存するため、クライアントと KDC の時刻同期（既定で5分以内）が必須。NTP のずれは Kerberos 障害の典型原因。","src":"d45","i":"q0247"},{"d":"d5","s":"sso","l":3,"q":"Kerberos の構成上の弱点として最も重要なものはどれか。","o":["チケットが平文のまま送信される","KDC が単一障害点であり信頼の要になる","対称鍵暗号を利用していない","時刻同期を前提としていない"],"a":1,"e":"KDC は全主体の鍵を保持するため、可用性の面でも機密性の面でも単一障害点。冗長化と厳格な保護が必須。Golden Ticket 攻撃は KRBTGT アカウントの鍵を奪う攻撃。","src":"d45","i":"q0248"},{"d":"d5","s":"federation","l":2,"q":"SAML の主な用途はどれか。","o":["API へのアクセス権の委譲","組織間の認証情報の受け渡し","パスワードの安全な保管","通信経路そのものの暗号化"],"a":1,"e":"SAML は XML ベースで、IdP が発行するアサーションを SP が信頼する。エンタープライズの Web SSO で広く使われる。OAuth 2.0 は認可委譲、OIDC は OAuth 2.0 上に構築された認証層。","src":"d45","i":"q0249"},{"d":"d5","s":"federation","l":3,"q":"OAuth 2.0 と OpenID Connect の関係として正しいものはどれか。","o":["OAuth 2.0 は認証、OIDC は認可のプロトコル","OAuth は認可、OIDC がその上に認証を足す","両者は競合する別系統の規格","OIDC は SAML の別名"],"a":1,"e":"「OAuth は認証プロトコルではない」が定番の論点。ID トークン（JWT）で本人性を伝えるのが OIDC。アクセストークンだけで本人確認をする実装はアンチパターン。","src":"d45","i":"q0250"},{"d":"d5","s":"federation","l":3,"q":"フェデレーションにおける「信頼の推移（transitive trust）」のリスクはどれか。","o":["認証の往復が増え、応答時間が悪化すること","評価していない第三者の IdP まで信頼が及ぶこと","証明書の有効期限切れで連携が突然停止すること","監査ログが分散し、追跡が困難になること"],"a":1,"e":"A が B を信頼し、B が C を信頼すると、A は間接的に C を信頼しうる。フェデレーション参加時は信頼の境界を明示し、契約と技術（属性フィルタ等）で範囲を限定する。","src":"d45","i":"q0251"},{"d":"d5","s":"models","l":2,"q":"組織内の職務（役割）に権限をひも付け、ユーザーを役割に割り当てるアクセス制御モデルはどれか。","o":["DAC","MAC","RBAC","ABAC"],"a":2,"e":"RBAC は役割ベース。異動時の権限整理が容易で大規模組織に適する。DAC は所有者裁量（Windows の ACL）、MAC はラベルによる強制（軍事）、ABAC は属性と文脈で動的に判断（最も柔軟）。","src":"d45","i":"q0252"},{"d":"d5","s":"models","l":3,"q":"「部署＝経理」かつ「時刻＝業務時間内」かつ「端末＝管理対象」の場合のみアクセスを許可する制御はどのモデルに該当するか。","o":["DAC","MAC","RBAC","ABAC"],"a":3,"e":"複数の属性と環境条件を組み合わせて動的に判断するのは ABAC（属性ベース）。ゼロトラストの実装で中心的な役割を果たす。RBAC は役割のみで、時刻や端末状態は扱えない。","src":"d45","i":"q0253"},{"d":"d5","s":"models","l":2,"q":"MAC（Mandatory Access Control）の特徴はどれか。","o":["データの所有者が自由に権限を付与できる","ラベルに基づき所有者でも変更できない","役割に基づいて権限が決まる","ルールセットは存在しない"],"a":1,"e":"MAC は最も厳格で、軍事・政府の多層セキュリティ環境で用いられる。SELinux も MAC の実装。DAC は所有者裁量のため、マルウェアがユーザー権限で動くと同じ権限で拡散できるという弱点がある。","src":"d45","i":"q0254"},{"d":"d5","s":"lifecycle","l":2,"q":"アクセス権の棚卸し（User Access Review）を定期的に行う主な目的はどれか。","o":["パスワードを強制変更するため","不要な権限の蓄積を是正するため","ログの容量を削減するため","MFA を無効化するため"],"a":1,"e":"Privilege Creep（権限クリープ）は監査指摘の定番。レビューは業務部門の管理者（データオーナー）が実施し、その承認記録を証跡として残す。","src":"d45","i":"q0255"},{"d":"d5","s":"lifecycle","l":3,"q":"特権アクセス管理（PAM）で最も重要な統制はどれか。","o":["特権アカウントのパスワードを全員で共有する","必要時のみ払い出し、使用後に自動失効させる","特権アカウントを監査対象外にする","特権アカウントにパスワードを設定しない"],"a":1,"e":"JIT 昇格、パスワードの自動ローテーション、セッション録画、承認ワークフローが PAM の中核。常時付与された永続的特権（standing privilege）の削減が目標。","src":"d45","i":"q0256"},{"d":"d5","s":"lifecycle","l":3,"q":"ID プロビジョニングを人事システムと連携させる最大の利点はどれか。","o":["利用者のパスワード管理が不要になる","人事イベントを起点に権限が自動で反映される","定期的なアクセス権の監査が不要になる","多要素認証を廃止できるようになる"],"a":1,"e":"HR-driven provisioning（authoritative source）は、退職者アカウントの残存という最頻出の指摘事項を構造的に解消する。SCIM は自動プロビジョニングの標準プロトコル。","src":"d45","i":"q0257"},{"d":"d6","s":"strategy","l":2,"q":"セキュリティ評価戦略を策定する際、テスト対象と頻度を決める最も適切な基準はどれか。","o":["予算の残額","資産の重要度とリスク評価の結果","ベンダーの推奨サイクル","前年と同じ内容"],"a":1,"e":"リスクベースが原則。重要資産・高リスク領域には高頻度かつ深いテストを、低リスク領域には軽量な検証を割り当てる。規制要件（PCI DSS の年次ペンテスト等）は最低ラインとして考慮する。","src":"d678","i":"q0258"},{"d":"d6","s":"strategy","l":3,"q":"外部の第三者による評価が内部評価より価値を持つ主な理由はどれか。","o":["外部の方が安価だから","独立性が確保され、利害から自由であるため","外部はツールを多く持っているから","外部は報告義務がないから"],"a":1,"e":"独立性（independence）と客観性が本質。内部監査も独立性を保つため経営層や監査委員会に直接報告する体制を取る。","src":"d678","i":"q0259"},{"d":"d6","s":"vavp","l":2,"q":"脆弱性スキャンとペネトレーションテストの違いとして正しいものはどれか。","o":["脆弱性スキャンは実際に侵入を試み、ペンテストは検出のみ行う","スキャンは網羅的な検出、ペンテストは悪用の実証","両者は同義","ペンテストは自動ツールのみで行う"],"a":1,"e":"スキャンは広く浅く（検出）、ペンテストは狭く深く（実証）。ペンテストには必ず書面による許可（Rules of Engagement／get-out-of-jail letter）とスコープ定義が必要。","src":"d678","i":"q0260"},{"d":"d6","s":"vavp","l":3,"q":"ペネトレーションテストの実施前に必ず取得すべきものはどれか。","o":["最新の脆弱性データベースの入手","経営層による書面での実施承認","使用する攻撃ツールのライセンス","サイバー保険の付保証明"],"a":1,"e":"無許可のテストは不正アクセスであり犯罪になりうる。承認範囲・対象 IP・実施時間帯・禁止行為・緊急連絡先・報告方法を Rules of Engagement に明記する。","src":"d678","i":"q0261"},{"d":"d6","s":"vavp","l":2,"q":"テスターに対象システムの内部情報を一切与えずに行うテストはどれか。","o":["ホワイトボックステスト","ブラックボックステスト","グレーボックステスト","静的解析"],"a":1,"e":"ブラックボックス（ゼロナレッジ）は外部攻撃者の視点を再現するが時間がかかる。ホワイトボックス（フルナレッジ）は網羅性に優れ効率的。グレーボックスは部分的情報を与える中間形態。","src":"d678","i":"q0262"},{"d":"d6","s":"vavp","l":3,"q":"防御側（ブルーチーム）に事前通知せずに攻撃側（レッドチーム）が演習を行う目的はどれか。","o":["防御側の練度を評価し人事に反映するため","検知・対応が実戦で機能するか評価するため","演習にかかる費用を最小化するため","未修正の脆弱性を表面化させないため"],"a":1,"e":"レッドチーム演習は「脆弱性の列挙」ではなく「検知・対応能力の測定」が目的。パープルチームは攻守が協働して改善サイクルを回す形態。","src":"d678","i":"q0263"},{"d":"d6","s":"testtypes","l":2,"q":"SAST（静的アプリケーションセキュリティテスト）の特徴はどれか。","o":["実行中のアプリに対して外部から攻撃を試みる","実行せずに解析し、開発初期に検出できる","本番環境でのみ実施できる","誤検知が発生しない"],"a":1,"e":"SAST は早期に発見できコード行まで特定できるが、誤検知（false positive）が多く実行時の文脈を見られない。DAST は実行時に外部から検査し誤検知は少ないが後工程になる。IAST は両者の中間。","src":"d678","i":"q0264"},{"d":"d6","s":"testtypes","l":3,"q":"入力欄に大量の異常データ・境界値・ランダムデータを送り込み、異常終了や想定外挙動を探す手法はどれか。","o":["回帰テスト","ファジング","ユニットテスト","受入テスト"],"a":1,"e":"ファジングは入力バリデーションの不備やメモリ破壊を発見するのに有効。Mutation（既存データを変異）と Generation（仕様から生成）の方式がある。","src":"d678","i":"q0265"},{"d":"d6","s":"testtypes","l":2,"q":"コードカバレッジ分析の目的はどれか。","o":["実行時のメモリ使用量を測定する","テストが到達したコードの割合を測る","検出した脆弱性を自動で修正する","本番環境の応答時間を計測する"],"a":1,"e":"分岐・条件・パスなどの網羅率を測る。カバレッジが高い＝バグがないではないが、低いカバレッジは「テストされていない領域がある」ことの明確な証拠になる。","src":"d678","i":"q0266"},{"d":"d6","s":"testtypes","l":3,"q":"変更を加えた後、既存の機能が壊れていないことを確認するテストはどれか。","o":["受入テスト","回帰テスト","負荷テスト","侵入テスト"],"a":1,"e":"回帰テストは変更管理と密接に関わる。セキュリティパッチ適用後にも必要で、これを省略するとパッチ適用が別の障害を生む。","src":"d678","i":"q0267"},{"d":"d6","s":"testtypes","l":3,"q":"アプリケーションのミスユース（悪用）シナリオを定義して検証する手法を何と呼ぶか。","o":["ユースケーステスト","ミスユースケーステスト","ユーザビリティテスト","ストレステスト"],"a":1,"e":"ミスユースケースは「攻撃者が何をしうるか」をユースケースの裏返しとして記述し、対応する統制を設計・検証する。脅威モデリングと要件定義をつなぐ実務的な手法。","src":"d678","i":"q0268"},{"d":"d6","s":"logs","l":2,"q":"合成トランザクション（Synthetic Transaction）モニタリングの説明として正しいものはどれか。","o":["実ユーザーの操作ログを収集する","擬似操作を定期実行し、能動的に検証する","ネットワークパケットを傍受する","ソースコードを解析する"],"a":1,"e":"合成監視は能動的（active）で、実ユーザーがいない時間帯でも問題を先に検知できる。RUM（Real User Monitoring）は受動的で実際の体感を測る。両者は補完関係。","src":"d678","i":"q0269"},{"d":"d6","s":"logs","l":3,"q":"ログレビューの実効性を高めるうえで最も重要な前提はどれか。","o":["ログをできるだけ長期間保存すること","全システムで時刻同期が取れていること","ログを暗号化すること","ログを紙に印刷すること"],"a":1,"e":"時刻がずれていると事象の順序が再構成できず、フォレンジックも相関分析も破綻する。加えてログの完全性保護（追記専用・改ざん検知）と集中管理が前提になる。","src":"d678","i":"q0270"},{"d":"d6","s":"processdata","l":2,"q":"アカウント管理レビューで検出すべき典型的な問題はどれか。","o":["設定されたパスワードの文字数と有効期限","退職者アカウントの残存や未承認の特権付与","サーバのCPU 使用率の推移","ネットワーク帯域の使用状況"],"a":1,"e":"アカウント管理は監査の中心領域。孤児アカウント（orphaned account）、権限クリープ、承認証跡の欠落が典型的な指摘事項。","src":"d678","i":"q0271"},{"d":"d6","s":"processdata","l":3,"q":"バックアップ検証の一環として最も重要な活動はどれか。","o":["バックアップジョブの成功ログを確認する","実際にリストアして復元可能性を確認する","バックアップ媒体の本数を数える","バックアップソフトのバージョンを確認する"],"a":1,"e":"「バックアップは取れているがリストアできない」は現実に頻発する。復旧テストなしのバックアップは検証されていない仮定にすぎない。DR テストと合わせて定期実施する。","src":"d678","i":"q0272"},{"d":"d6","s":"audit","l":3,"q":"組織が自社のセキュリティ統制について、顧客と NDA を結んだうえで詳細な報告書を提供したい。最も適切なものはどれか。","o":["SOC 1 Type I","SOC 2 Type II","SOC 3","PCI ROC"],"a":1,"e":"SOC 2 Type II は Trust Services 基準に基づき一定期間の運用有効性を評価した詳細報告で、通常 NDA 付きで限定配布される。SOC 3 は一般公開用の要約版、SOC 1 は財務報告に関する内部統制。","src":"d678","i":"q0273"},{"d":"d6","s":"audit","l":2,"q":"監査における「Audit Trail（監査証跡）」の役割として正しいものはどれか。","o":["攻撃そのものを未然に防ぐこと","事象を時系列で再構成し追跡を可能にする","システムの処理性能を改善すること","バックアップの代替手段となること"],"a":1,"e":"監査証跡は検知的統制であり、予防はしない。証跡自体が改ざんされないよう、書き込み専用媒体や集中ログ基盤、アクセス制限で保護する必要がある。","src":"d678","i":"q0274"},{"d":"d7","s":"incident","l":2,"q":"インシデント対応の一般的なフェーズで、「被害の拡大を止める」段階はどれか。","o":["Detection（検知）","Containment（封じ込め）","Eradication（根絶）","Recovery（復旧）"],"a":1,"e":"Preparation → Detection & Analysis → Containment → Eradication → Recovery → Lessons Learned。封じ込めは拡大阻止、根絶は原因の除去、復旧は通常運用への回帰。","src":"d678","i":"q0275"},{"d":"d7","s":"incident","l":3,"q":"ランサムウェア感染が疑われる端末を発見した。最初に取るべき行動はどれか。","o":["直ちに電源を落として暗号化を止める","ネットワークから隔離し、証拠を保全する","業務復旧のため身代金の支払いを検討する","端末を初期化して速やかに再配布する"],"a":1,"e":"拡散阻止（封じ込め）が最優先。ただし電源断はメモリ上の証拠（暗号鍵・プロセス情報）を失うため、証拠保全の観点ではネットワーク隔離が優先される。証拠の揮発性順序（レジスタ→メモリ→ディスク）を意識する。","src":"d678","i":"q0276"},{"d":"d7","s":"incident","l":3,"q":"インシデント対応で「Lessons Learned（教訓）」フェーズが重要な理由はどれか。","o":["責任者を特定して処分するため","根本原因を分析し、統制を改善するため","報告書のページ数を増やすため","法的責任を回避するため"],"a":1,"e":"非難ではなく改善が目的（blameless postmortem）。処分を目的にすると報告が遅れ、検知が遅れるという逆効果を招く。改善はプロセス・技術・教育の各面に反映する。","src":"d678","i":"q0277"},{"d":"d7","s":"incident","l":2,"q":"CSIRT を事前に組成しておくことの最大の利点はどれか。","o":["インシデントの発生件数が減る","役割と連絡経路が事前に定まること","ログの保存量が減る","監査が免除される"],"a":1,"e":"Preparation フェーズの中心。手順・連絡網・エスカレーション基準・外部連絡先（法務・広報・法執行機関）を平時に整備しておくことが、対応時間を決定的に左右する。","src":"d678","i":"q0278"},{"d":"d7","s":"monitoring","l":2,"q":"IDS と IPS の違いとして正しいものはどれか。","o":["IDS はインラインで遮断し、IPS は検知のみ","IDS は検知のみ、IPS は遮断できる","両者は同じ製品カテゴリ","IPS はホストにのみ配置される"],"a":1,"e":"IPS は遮断できる反面、誤検知（false positive）が正常通信を止めるリスクがある。導入初期は検知モードで運用してチューニングし、段階的に遮断へ移行するのが定石。","src":"d678","i":"q0279"},{"d":"d7","s":"monitoring","l":3,"q":"シグネチャベース検知とアノマリ（振る舞い）ベース検知の比較として正しいものはどれか。","o":["シグネチャは未知の攻撃に強く、アノマリは既知の攻撃にしか対応できない","シグネチャは既知に強く、アノマリは未知に強い","両者とも誤検知は発生しない","アノマリ検知にはベースラインは不要"],"a":1,"e":"アノマリ検知は正常状態のベースライン学習が前提。学習期間中に侵害されていると異常が正常として学習されてしまう点も論点になる。","src":"d678","i":"q0280"},{"d":"d7","s":"monitoring","l":3,"q":"SIEM を導入したが、アラートが多すぎて運用が回らない。最も適切な対応はどれか。","o":["ノイズの多いアラートを一括で無効化する","資産の重要度に基づき相関ルールを調整する","SIEM を撤去し、個別ツールの監視に戻す","収集対象のログを絞り、流量そのものを減らす"],"a":1,"e":"アラート疲れ（alert fatigue）は SOC の最大の失敗要因。ユースケース駆動でルールを設計し、誤検知を継続的に抑制する運用プロセスがなければ SIEM は機能しない。","src":"d678","i":"q0281"},{"d":"d7","s":"foundations","l":2,"q":"Need to Know と Least Privilege に加えて、特権作業で「2人以上の同時操作を必須にする」統制を何と呼ぶか。","o":["Job Rotation","Dual Control（二人制御）","Mandatory Vacation","Separation of Duties"],"a":1,"e":"Dual Control は同一作業を単独で完了できなくする（核兵器の二重鍵が典型）。Separation of Duties は工程を分割して別々の人に割り当てる点で異なる。","src":"d678","i":"q0282"},{"d":"d7","s":"foundations","l":3,"q":"サービスレベルの観点で、可用性99.9%（スリーナイン）が意味する年間の停止許容時間はおよそどれか。","o":["約53分","約8.8時間","約4.4日","約1時間"],"a":1,"e":"99.9%＝年間約8.76時間。99.99%＝約52.6分、99.999%＝約5.26分、99%＝約3.65日。SLA の議論でこの換算は必須。","src":"d678","i":"q0283"},{"d":"d7","s":"change","l":2,"q":"変更管理プロセスにおいて、本番適用前に必ず定義しておくべきものはどれか。","o":["作業担当者の勤務時間と交代要員","切り戻し手順と成功判定の基準","変更によって見込まれる削減額","ベンダー側の担当窓口と連絡先"],"a":1,"e":"変更が失敗した場合に確実に元へ戻せることが前提。加えて影響分析、テスト結果、CAB による承認、実施後レビューが標準的な要素。","src":"d678","i":"q0284"},{"d":"d7","s":"change","l":3,"q":"緊急パッチを適用する必要があるが、通常の変更管理プロセスでは間に合わない。最も適切な対応はどれか。","o":["プロセスを無視して即座に適用する","緊急変更手順に従い、事後に記録する","次回の定期メンテナンスまで待つ","パッチを適用せず受容する"],"a":1,"e":"緊急変更の手順自体を平時に定義しておくのが正解。プロセスの完全な回避は統制の破綻であり、事後の記録・レビューによって説明責任を確保する。","src":"d678","i":"q0285"},{"d":"d7","s":"change","l":2,"q":"構成管理（Configuration Management）の主目的はどれか。","o":["変更内容の妥当性を審査し承認する","構成を既知の正しい状態として維持する","異常を検知して警報を発報する","定期的にバックアップを取得する"],"a":1,"e":"構成管理＝「今どうなっているか」を正確に知る仕組み。変更管理＝「どう変えるかを統制する」仕組み。両者は補完関係で、構成のドリフト検知は監査でも重視される。","src":"d678","i":"q0286"},{"d":"d7","s":"backup","l":2,"q":"前回のフルバックアップ以降に変更されたファイルをすべて取得し、アーカイブビットをクリアしない方式はどれか。","o":["フルバックアップ","差分バックアップ（Differential）","増分バックアップ（Incremental）","スナップショット"],"a":1,"e":"差分はフル以降の全変更を毎回取得（バックアップ時間は増えるが復旧はフル＋最新差分の2本で速い）。増分は前回バックアップ以降のみ（取得は速いがフル＋全増分が必要で復旧が遅い）。","src":"d678","i":"q0287"},{"d":"d7","s":"backup","l":3,"q":"RAID 5 の特徴として正しいものはどれか。","o":["ミラーリングのみで冗長性を確保する","パリティを分散し、1本の障害まで耐える","冗長性を持たずストライピングのみ行う","ディスク2本の同時障害に耐えられる"],"a":1,"e":"RAID 0＝ストライピング（冗長性なし）、1＝ミラーリング、5＝分散パリティ（1本まで）、6＝ダブルパリティ（2本まで）、10＝ミラー＋ストライプ。RAID はバックアップの代替にはならない（論理削除やランサムには無力）。","src":"d678","i":"q0288"},{"d":"d7","s":"backup","l":2,"q":"3-2-1 バックアップルールの内容として正しいものはどれか。","o":["3世代を2週間、1か所に保管する","3コピーを2媒体に、1つは遠隔地へ","3人が2回確認し1回テストする","3日ごとに2回取得し1回検証する"],"a":1,"e":"ランサムウェア対策としては、さらにオフライン（エアギャップ）または改変不可（immutable）なコピーを1本持つ「3-2-1-1-0」が推奨される。0 はエラーゼロ＝復旧検証済みの意味。","src":"d678","i":"q0289"},{"d":"d7","s":"dr","l":2,"q":"復旧サイトのうち、機器・回線・最新データが揃い、数分〜数時間で切替可能なものはどれか。","o":["コールドサイト","ウォームサイト","ホットサイト","モバイルサイト"],"a":2,"e":"コールド＝設備のみ（数週間、最安）、ウォーム＝機器と回線はあるがデータは最新でない（数日〜数時間）、ホット＝即時切替可能（最も高価）。ミラーサイトは完全な二重化。","src":"d678","i":"q0290"},{"d":"d7","s":"dr","l":3,"q":"DR テストの種類のうち、実際に本番処理を代替サイトへ切り替えて実施し、最も現実的だがリスクも高いものはどれか。","o":["Checklist Test","Structured Walk-through","Parallel Test","Full Interruption Test"],"a":3,"e":"強度順に Checklist → Structured Walk-through（机上）→ ェクションに対する最も根本的な対策はどれか。","o":["WAF による通信経路上での遮断","パラメタライズドクエリの使用","詳細なエラーメッセージの非表示","保存データの暗号化"],"a":1,"e":"入力値をデータとして扱い、コードとして解釈させないのが根本対策。入力検証（許可リスト）と最小権限の DB アカウントを併用する。WAF は多層防御の補助。","src":"d678","i":"q0298"},{"d":"d8","s":"owasp","l":3,"q":"XSS（クロスサイトスクリプティング）の対策として最も適切な組み合わせはどれか。","o":["入力値を検証し、危険な文字を一律に除去する","出力先の文脈に応じたエスケープと CSP の適用","データベースの保存データを暗号化する","通信経路を HTTPS で暗号化する"],"a":1,"e":"XSS は「出力時のエスケープ」が中心。HTML 本文・属性・JavaScript・URL でエスケープ方法が異なるため、コンテキストを意識する。CSP は多層防御としてインラインスクリプトの実行を制限する。","src":"d678","i":"q0299"},{"d":"d8","s":"owasp","l":3,"q":"CSRF（クロスサイトリクエストフォージェリ）の対策として有効なものはどれか。","o":["パスワードの長さと複雑性の要件を高める","CSRF トークンの検証","出力時の HTML エスケープの徹底","送信元 IP アドレスによる制限"],"a":1,"e":"CSRF は「認証済みのブラウザに意図しないリクエストを送らせる」攻撃。リクエストの正当性を検証するトークンと SameSite=Lax/Strict が有効。XSS があると CSRF 対策は迂回されうる点も重要。","src":"d678","i":"q0300"},{"d":"d8","s":"owasp","l":2,"q":"バッファオーバーフローの根本原因として最も適切なものはどれか。","o":["暗号アルゴリズムの選択を誤ったこと","入力長の検証不足で領域を超えて書き込むこと","ネットワーク帯域が不足していること","データベース設計が正規化されていないこと"],"a":1,"e":"境界チェックの欠如が原因。対策は安全な関数の使用、入力検証、コンパイラ保護（スタックカナリア）、ASLR、DEP/NX。C/C++ のような手動メモリ管理言語で特に問題になる。","src":"d678","i":"q0301"},{"d":"d8","s":"coding","l":3,"q":"ソースコード中に API キーやパスワードを直接記述すること（ハードコード）の問題はどれか。","o":["処理が増えて実行速度が低下する","閲覧者全員に露出し、履歴からも消しにくい","ソースコードの行数が無駄に増える","環境によってはコンパイルが通らない"],"a":1,"e":"Git 履歴に残るとリポジトリを削除しても復元されうる。シークレット管理サービス（Vault、クラウドのシークレットマネージャ）と、パイプラインでのシークレットスキャンが対策。","src":"d678","i":"q0302"},{"d":"d8","s":"coding","l":2,"q":"コードレビューを人手で行うことの、自動ツールにない利点はどれか。","o":["解析の実行速度が圧倒的に速い","認可の抜けなど文脈依存の欠陥を発見できる","夜間も含めて24時間稼働できる","誤検知がまったく発生しない"],"a":1,"e":"SAST は構文パターンには強いが「この処理は本来管理者だけが実行すべき」といった業務文脈は判定できない。自動ツールと人手レビューは補完関係にある。","src":"d678","i":"q0303"},{"d":"d8","s":"coding","l":3,"q":"CI/CD パイプライン自体を保護するために最も重要な統制はどれか。","o":["ビルド時間を短縮する","認証情報と権限を最小化し、変更に承認を要する","テストを省略する","すべての開発者に本番デプロイ権限を与える"],"a":1,"e":"パイプラインは本番への特権経路であり、侵害されればコード署名済みのマルウェアを正規経路で配布されうる（SolarWinds 型）。ビルド環境の分離、成果物の署名、依存関係の検証も必要。","src":"d678","i":"q0304"},{"d":"d8","s":"acquired","l":3,"q":"サードパーティ製ライブラリを利用する際のリスク管理として最も適切なものはどれか。","o":["最新版を使っていれば個別の検証は不要である","SCA で依存と既知脆弱性を把握し、SBOM を維持する","外部ライブラリの利用を禁止し、自前実装に統一する","ライセンス適合性のみを調達時に確認する"],"a":1,"e":"依存の推移的な深さ（transitive dependency）まで含めた可視化が要点。Log4Shell では「どこで使われているか分からない」ことが最大の障害になった。ライセンス適合性も SCA の対象。","src":"d678","i":"q0305"},{"d":"d8","s":"acquired","l":2,"q":"SaaS を導入する際、セキュリティ責任の分担を確認するために参照すべき考え方はどれか。","o":["責任共有モデル","CMMI","OWASP Top 10","ITIL"],"a":0,"e":"IaaS/PaaS/SaaS で利用者側の責任範囲が変わる。SaaS でも「データの分類、アクセス管理、利用者の行動」は常に利用者の責任として残る点が頻出。","src":"d678","i":"q0306"},{"d":"d8","s":"acquired","l":3,"q":"ローコード／ノーコード基盤や生成 AI が生成したコードを本番導入する際に、最も重要な統制はどれか。","o":["生成物は自動的に安全とみなす","通常の SDLC 統制を同等に適用する","開発者にのみ利用を許可する","生成物のライセンスのみ確認する"],"a":1,"e":"生成元が何であれ、本番で動くコードには同一の統制を適用するのが原則。加えて学習データ由来のライセンス問題、シークレットの混入、既知の脆弱パターンの再生産に注意する。","src":"d678","i":"q0307"},{"d":"d8","s":"acquired","l":3,"q":"アプリケーションが依存する外部 API の可用性が事業継続に直結する場合、最も適切な対策はどれか。","o":["提供元の SLA を確認し、水準を満たすことを確認する","リトライや縮退運転を設計に組み込み、代替手段を用意する","外部 API への依存をやめ、自前実装に切り替える","呼び出しの成否を監視し、異常時に通知を出す"],"a":1,"e":"サードパーティ障害は自社の統制外にあるため、設計で耐えるしかない。ベンダーロックインと出口戦略（データポータビリティ）も調達時に評価する。","src":"d678","i":"q0308"},{"d":"d1","s":"risk","l":3,"q":"取締役会が「セキュリティ投資の効果を数値で示せ」と要求している。CISO が提示すべき最も説得力のある材料はどれか。","o":["導入したセキュリティ製品の一覧と価格","対策前後の ALE の差から算出した費用対効果","検知したマルウェアの総数","セキュリティ担当者の人数"],"a":1,"e":"経営層は「いくらのリスクをいくらで下げたか」で判断する。ALE(前) − ALE(後) − 対策の年間コストが正であれば経済合理性がある。製品一覧や検知数は活動量の指標にすぎず、リスクの言語になっていない。","src":"scn","i":"q0309"},{"d":"d1","s":"risk","l":3,"q":"リスク評価の結果、ある業務に極めて高いリスクがあり、対策コストが期待損失を大きく上回ることが判明した。事業部門はその業務の継続を強く望んでいる。CISO が取るべき行動はどれか。","o":["独断で業務を停止させる","受容の可否をリスクオーナーに判断させる","リスク評価をやり直して数値を下げる","対策コストを無視して実装を強行する"],"a":1,"e":"リスクを受容する権限は経営層／リスクオーナーにあり、セキュリティ部門ではない。CISO の役割は正確な情報提供と選択肢の提示、そして決定の記録。これが CISSP の一貫した立場。","src":"scn","i":"q0310"},{"d":"d1","s":"governance","l":3,"q":"新しいセキュリティ方針を全社展開したが、現場でほとんど守られていない。最も効果的な是正はどれか。","o":["違反者への罰則を強化し、遵守状況を人事評価に反映する","方針を業務実態に合う形へ見直し、経営層の後ろ盾と教育で定着させる","実効性がないため方針を撤回し、現場の判断に委ねる","遵守状況を自動監視するツールを追加導入する"],"a":1,"e":"遵守されない方針は、方針自体が非現実的であるか、周知・支援が不足していることが多い。罰則の強化は回避行動（シャドー IT）を生みやすい。CISSP では常に「経営層の支持＋現場実態への適合＋教育」が答えになる。","src":"scn","i":"q0311"},{"d":"d1","s":"bcp","l":3,"q":"BIA の結果、ある基幹システムの MTD が4時間と判明した。現行の DR 計画では復旧に18時間かかる。最初に取るべき行動はどれか。","o":["BIA の前提を見直し、MTD を18時間に修正する","ギャップを経営層に報告し、投資か代替手順かを判断してもらう","現行の DR 計画を維持し、次回の見直し時期まで様子を見る","BIA をやり直し、より正確な MTD を算出する"],"a":1,"e":"MTD は事業側の要求であり、技術側の都合で書き換えるものではない。ギャップは「投資で埋める」か「業務手順で緩和する」かの経営判断。判断材料を提示するのがセキュリティ部門の役割。","src":"scn","i":"q0312"},{"d":"d1","s":"compliance","l":3,"q":"海外子会社が現地法に従ってデータを保持しているが、その方法が本社の方針より緩い。最も適切な対応はどれか。","o":["本社の方針を一律に適用して統一する","両者を満たす統制を設計し、例外は文書化する","現地法を優先し本社方針は適用しない","子会社を監査の対象から除外する"],"a":1,"e":"法令は方針に優先し、かつ最も厳しい要求に合わせるのが原則。両立できない場合は法務と協議し、例外承認と補償的統制で管理する。「一律強制」も「無視」も現実的な統制にならない。","src":"scn","i":"q0313"},{"d":"d2","s":"classify","l":3,"q":"データ分類ポリシーを導入したが、現場が分類作業を負担に感じて既定値（最低区分）ばかりを選んでいる。最も効果的な改善はどれか。","o":["分類区分の数を10種類に増やす","区分を簡素化し、自動分類を併用する","分類を廃止する","違反者を処分する"],"a":1,"e":"分類は現場が使えるだけ簡潔でなければ機能しない。区分が多すぎると誤分類と放棄を招く。自動分類・既定値の適正化・教育の組み合わせが実務解。","src":"scn","i":"q0314"},{"d":"d2","s":"protect","l":3,"q":"営業部門から「顧客リストを個人のクラウドストレージに置いて外出先で使いたい」と要望が出た。最も適切な対応はどれか。","o":["要望を却下して終わりにする","承認済みの管理下にある手段を提供する","個人のクラウドストレージを許可する","要望を無視する"],"a":1,"e":"単なる禁止はシャドー IT を生み、可視性を失う。CISSP では「業務を可能にする（enable the business）」姿勢が重視される。安全な代替手段の提供が正解。","src":"scn","i":"q0315"},{"d":"d2","s":"remanence","l":3,"q":"リース契約が終了したサーバを返却する。ディスクには機密データが保存されていた。最も適切な対応はどれか。","o":["そのまま返却する","承認手順でサニタイズし証明書を得る","クイックフォーマットして返却する","データを削除して返却する"],"a":1,"e":"論理削除やクイックフォーマットではデータ残存が残る。返却前提の機器は、そもそも導入時から全ディスクを暗号化しておき、暗号消去できるようにしておくのが設計上の最善策。","src":"scn","i":"q0316"},{"d":"d3","s":"crypto","l":3,"q":"社内システムで長年 3DES を使用している。移行を検討する際に最も適切な判断はどれか。","o":["3DES は今も推奨されているので継続する","AES への移行計画を立てる","独自開発の暗号アルゴリズムに置き換える","暗号化をやめる"],"a":1,"e":"3DES は実効鍵長とブロック長（64ビット、Sweet32 攻撃）の問題で非推奨。独自暗号は Kerckhoffs の原理に反し、検証を経ていないため最悪の選択。","src":"scn","i":"q0317"},{"d":"d3","s":"pki","l":3,"q":"社内の複数システムで証明書の期限切れによる障害が繰り返し発生している。最も根本的な対策はどれか。","o":["証明書の有効期限を10年にする","棚卸しと自動更新の導入","自己署名証明書に切り替える","障害のたびに手動更新する"],"a":1,"e":"長期有効な証明書は漏えい時の影響が長期化するため業界は短期化に向かっている。答えは「有効期限を延ばす」ではなく「管理を自動化する」。可視化されていない証明書が最大のリスク。","src":"scn","i":"q0318"},{"d":"d3","s":"physical","l":3,"q":"データセンターの入退室記録を確認したところ、ある委託先要員が業務時間外に頻繁に入室していた。最初に取るべき行動はどれか。","o":["直ちに要員を解雇するよう委託先に要求する","証跡を保全しつつ事実関係の調査を開始する","記録を削除する","何もしない"],"a":1,"e":"正当な業務理由がある可能性もあるため、決めつけずに調査する。ただし調査中のリスク低減としてアクセスの一時停止は妥当。証拠保全（chain of custody）を忘れない。","src":"scn","i":"q0319"},{"d":"d4","s":"segmentation","l":3,"q":"工場の制御システム（OT/ICS）が社内 IT ネットワークと同一セグメントで運用されていることが判明した。最も優先すべき対策はどれか。","o":["OT 機器に最新パッチを即時適用する","IT と OT を分離して制御する","OT 機器をインターネットに直接接続する","OT 機器にウイルス対策ソフトを導入する"],"a":1,"e":"OT は可用性最優先でパッチ適用が困難、稼働停止の影響が甚大。まず分離（Purdue モデル的な階層化）と通信制御で攻撃到達性を断つのが定石。無停止でのパッチ適用は現実的でないことが多い。","src":"scn","i":"q0320"},{"d":"d4","s":"devices","l":3,"q":"リモートワーク増加に伴い、全通信を本社経由にする構成で回線が逼迫している。セキュリティを維持しつつ改善する案として最も適切なものはどれか。","o":["スプリットトンネリングを無条件に許可する","ZTNA でアプリ単位に最小権限のアクセスを与える","VPN を廃止して直接接続を許可する","帯域を増やすだけで対応する"],"a":1,"e":"検査点をクラウドへ移し、ネットワーク到達性ではなくアイデンティティと文脈で認可する。ゼロトラストの実務適用例。無条件のスプリットトンネルは検査の空白を作る。","src":"scn","i":"q0321"},{"d":"d5","s":"lifecycle","l":3,"q":"監査で「退職後3か月経過した従業員のアカウントが有効なまま残っている」と指摘された。再発防止として最も効果的なものはどれか。","o":["月次でアカウント一覧を目視確認する","人事システムと連携し、退職で自動失効させる","パスワードの有効期限を短くする","アカウント数の上限を設ける"],"a":1,"e":"手作業のレビューは漏れが構造的に発生する。自動プロビジョニング／デプロビジョニング（SCIM 等）で根本解決し、定期レビューは検知的統制として併用する。","src":"scn","i":"q0322"},{"d":"d5","s":"sso","l":3,"q":"SSO を導入した結果、1つの資格情報が漏えいすると全システムにアクセスされる懸念が指摘された。最も適切な緩和策はどれか。","o":["SSO を廃止して個別パスワードに戻す","入口に MFA と条件付きアクセスを適用する","パスワードの文字数を増やす","ログを増やす"],"a":1,"e":"SSO は利便性と統制の集中をもたらす一方、鍵の集中というリスクも生む。対策は入口の強化（MFA、条件付きアクセス）と、高リスク操作へのステップアップ認証。個別パスワードへの回帰は全体のリスクを上げる。","src":"scn","i":"q0323"},{"d":"d5","s":"models","l":3,"q":"新しく着任した従業員に、前任者と同じアカウントをそのまま引き継がせたいと依頼された。最も適切な対応はどれか。","o":["依頼どおり引き継がせる","一意の ID を発行し直す","前任者のパスワードだけ変更する","アカウントを共有する"],"a":1,"e":"ID の一意性は Accountability の前提。「同じ権限が必要」なら役割を通じて付与する。アカウントの引き継ぎは監査証跡を汚染し、権限クリープの温床にもなる。","src":"scn","i":"q0324"},{"d":"d6","s":"vavp","l":3,"q":"ペネトレーションテストの報告書に高リスクの指摘が20件挙がった。最初に行うべきことはどれか。","o":["すべてを同時に修正する","影響でトリアージし計画を作る","報告書を保管して終了する","ペンテストベンダーを変更する"],"a":1,"e":"資源は有限であり、CVSS スコアだけでなく資産の重要度・到達可能性・既存の補償的統制を加味してリスクベースで優先順位を決める。是正の追跡（責任者・期限・検証）まで含めて初めて統制になる。","src":"scn","i":"q0325"},{"d":"d6","s":"audit","l":3,"q":"内部監査部門から「セキュリティ部門が自ら実施したテスト結果は監査証拠として弱い」と指摘された。この指摘の根拠は何か。","o":["採用しているテスト手法が旧式であるため","評価対象と評価者が同一で独立性を欠くため","外部委託より費用対効果が劣るため","報告書の様式が標準に沿わないため"],"a":1,"e":"自己評価は有用だが、独立性が保証されないため保証（assurance）としては弱い。第三者評価や、監査委員会に直接報告する内部監査による検証が必要になる。","src":"scn","i":"q0326"},{"d":"d6","s":"logs","l":3,"q":"インシデント調査中に、必要な期間のログが保存期間を過ぎて削除されていたことが判明した。再発防止として最も適切なものはどれか。","o":["すべてのログを容量の許す限り永久に保存する","法令と調査要件から保持期間を定め、改ざん防止で保管する","ログレベルを下げて出力量を抑え、保存期間を延ばす","残存する証跡の範囲で調査を継続し、結論をまとめる"],"a":1,"e":"「永久保存」はコストとプライバシー（過剰保持）の両面で不適切。要件から逆算した保持期間の設計が正解。重要ログは WORM／追記専用ストレージで完全性を確保する。","src":"scn","i":"q0327"},{"d":"d7","s":"incident","l":3,"q":"SOC が深夜に重大なアラートを検知したが、エスカレーション先の担当者と連絡が取れず対応が6時間遅れた。最も適切な是正はどれか。","o":["SOC の要員を増やして常時2名体制にする","代理連絡先と自動昇格ルールを定義する","アラートのしきい値を上げて件数を絞る","深夜帯のアラート通知を停止する"],"a":1,"e":"Preparation フェーズの不備が原因。連絡網は「作った」だけでは機能せず、定期的な疎通テストと更新が必要。しきい値の引き上げは検知能力を落とす誤った対応。","src":"scn","i":"q0328"},{"d":"d7","s":"incident","l":3,"q":"従業員が業務用 PC で不審な挙動に気づき、自分でウイルス対策ソフトのフルスキャンと再起動を行った後に報告してきた。この行動の主な問題は何か。","o":["スキャンに時間がかかること","揮発性の証拠が失われること","ライセンス違反になること","ネットワーク帯域を消費すること"],"a":1,"e":"証拠の揮発性順序（レジスタ／キャッシュ → メモリ → ネットワーク状態 → ディスク → バックアップ）を保全する必要がある。教育では「自分で対処せず、隔離して報告する」ことを徹底する。","src":"scn","i":"q0329"},{"d":"d7","s":"dr","l":3,"q":"年1回の DR テストで毎回同じ担当者が対応し、成功している。この状況の潜在的な問題はどれか。","o":["テスト頻度が高く、担当者の負荷が過大である","特定個人への依存があり、その不在時に復旧できない","テストの費用が実態に比べて低く見積もられている","手順書の分量が多く、実行に時間がかかっている"],"a":1,"e":"手順が属人化していないかを検証するのも DR テストの目的。ローテーションや代理要員での実施、手順書だけで実行できるかの検証が必要。","src":"scn","i":"q0330"},{"d":"d7","s":"change","l":3,"q":"本番環境で原因不明の障害が発生した。調査を進めるうえで最初に確認すべき情報はどれか。","o":["ユーザーからの問い合わせ件数","直近の変更履歴と構成管理の記録","サーバの購入年月","ベンダーの営業資料"],"a":1,"e":"障害の大半は直近の変更に起因する。だからこそ変更管理と構成管理が運用の基礎になる。記録がなければ切り分けに膨大な時間がかかる。","src":"scn","i":"q0331"},{"d":"d8","s":"sdlc","l":3,"q":"開発チームが「セキュリティレビューがリリースを遅らせる」と不満を訴えている。最も建設的な対応はどれか。","o":["高リスク案件を除きレビューを免除する","検査を CI へ自動化し、人手は高リスクに絞る","リリース頻度を下げて余裕を確保する","レビュー担当を別チームへ交代させる"],"a":1,"e":"対立の原因は「遅い・遅い段階で来る」ことにある。自動化とリスクベースの絞り込みで、速度を落とさずに統制を効かせるのが DevSecOps の実務解。","src":"scn","i":"q0332"},{"d":"d8","s":"acquired","l":3,"q":"利用中の OSS ライブラリに重大な脆弱性が公表された。最初に行うべきことはどれか。","o":["直ちにライブラリを最新版に置き換える","SBOM で影響範囲を特定する","OSS の使用を全面禁止する","公表が誤りであることを確認する"],"a":1,"e":"まず影響範囲の把握（scoping）。どこで使われているか分からなければ、修正も優先順位付けもできない。検証なしの一斉更新は別の障害を招く。","src":"scn","i":"q0333"},{"d":"d8","s":"owasp","l":3,"q":"Web アプリケーションで「他人の注文番号を URL に入力すると他人の注文が見える」問題が見つかった。分類として最も適切なものはどれか。","o":["クロスサイトスクリプティング（XSS）","アクセス制御の不備（IDOR）","SQL インジェクション","クロスサイトリクエストフォージェリ（CSRF）"],"a":1,"e":"IDOR（安全でない直接オブジェクト参照）は Broken Access Control の代表例で OWASP Top 10 の上位常連。対策はサーバ側で「そのユーザーがそのリソースにアクセスしてよいか」を毎回検証すること。ID の推測困難化だけでは不十分。","src":"scn","i":"q0334"},{"d":"d1","s":"personnel","l":3,"q":"重要システムの管理者が突然退職を申し出た。当日中に取るべき最も適切な対応はどれか。","o":["退職日まで通常どおり業務を続けさせる","特権を速やかに見直し、引き継ぎは監督下で行う","何も変更しない","全社にメールで通知する"],"a":1,"e":"非自発的／突発的な離職では特権の即時見直しが原則。ただし業務を止めないため、監督付きの引き継ぎと段階的な権限縮小を組み合わせる。秘密保持義務の再確認（exit interview）も忘れない。","src":"scn","i":"q0335"},{"d":"d1","s":"scrm","l":3,"q":"主要な SaaS ベンダーが侵害を公表した。自社は同サービスに顧客データを預けている。最初に行うべきことはどれか。","o":["契約を即時解除し、別ベンダーへの移行を開始する","契約上の通知義務に基づき自社データへの影響範囲を照会する","ベンダーの正式な公表と詳細報告を待ってから動き出す","自社の全ユーザーアカウントを直ちに停止する"],"a":1,"e":"自社の説明責任は残るため、能動的に情報を求め、自社側でできる封じ込め（トークン失効、パスワードリセット、ログ精査）を並行する。契約解除は影響評価の後の選択肢。","src":"scn","i":"q0336"},{"d":"d3","s":"models","l":3,"q":"高機密の研究データを扱う環境で、利用者が自分の判断でファイル共有権限を変更できてしまう。最も適切な是正はどれか。","o":["利用者教育を強化し、共有時の確認手順を徹底する","ラベルベースの MAC を導入し、裁量を排除する","ファイル共有機能そのものを全面的に停止する","共有操作の監査ログを増やし、定期レビューを行う"],"a":1,"e":"DAC（所有者裁量）の弱点そのもの。高機密環境では、システムが強制するアクセス制御へ移行する。教育やログは補助であり、構造的な解決にはならない。","src":"scn","i":"q0337"},{"d":"d4","s":"wireless","l":3,"q":"社内で正規と同じ SSID を持つ不正アクセスポイントが検出された。最も適切な対応はどれか。","o":["正規 AP の SSID を変更し、利用者に再設定を案内する","WIPS で封じ込めて撤去し、802.1X の相互認証で再発を防ぐ","調査が終わるまで社内の無線 LAN を全面停止する","該当 AP の MAC アドレスをフィルタで拒否する"],"a":1,"e":"Evil Twin／Rogue AP 対策は、検知（WIPS）＋物理的排除＋クライアント側の相互認証（EAP-TLS 等でサーバ証明書を検証）の三段構え。SSID 変更は攻撃者も追従できるため無意味。","src":"scn","i":"q0338"},{"d":"d6","s":"strategy","l":3,"q":"経営層から「当社のセキュリティレベルは同業他社と比べてどうか」と問われた。最も適切な回答方法はどれか。","o":["同業他社の担当者に聞き取り、相対的な印象として答える","NIST CSF 等で評価し、成熟度とギャップを可視化する","導入済みセキュリティ製品の数と投資額の推移を示す","過去1年のインシデント件数がゼロであることを示す"],"a":1,"e":"共通の物差しがなければ比較にならない。フレームワークによる成熟度評価は経営層への説明に適し、そのままロードマップの根拠にもなる。インシデント件数ゼロは「検知できていない」可能性も含む危うい指標。","src":"scn","i":"q0339"},{"d":"d7","s":"monitoring","l":3,"q":"新しい EDR を導入したところ、正規の業務ツールが誤ってブロックされ、業務が停止した。今後の導入で改善すべき点はどれか。","o":["EDR を使わない","検知モードで試験運用する","全社一斉に遮断モードで導入する","業務ツールの使用を禁止する"],"a":1,"e":"変更管理の基本（影響分析・段階展開・ロールバック手順）をセキュリティ製品にも適用する。可用性もセキュリティ目標の一部であり、統制が業務を止めれば統制の失敗である。","src":"scn","i":"q0340"},{"d":"d2","s":"lifecycle","l":3,"q":"テスト環境で本番の顧客データがそのまま使われていることが判明した。最も適切な是正はどれか。","o":["テスト環境のアクセス権を本番と同等まで絞り込む","マスキング済みデータか合成データの利用を標準とする","テスト環境を廃止し、本番での検証に一本化する","テスト環境の監査ログ取得と定期レビューを強化する"],"a":1,"e":"テスト環境は本番より統制が緩いことが多く、個人データの目的外利用にも当たりうる。マスキング／トークナイゼーション／合成データが標準解。アクセス制限だけでは根本原因（データそのものの所在）が残る。","src":"scn","i":"q0341"},{"d":"d5","s":"federation","l":3,"q":"買収した会社の従業員に、統合完了前から自社の一部システムを使わせる必要がある。最も適切なアプローチはどれか。","o":["自社のアカウントを一括発行して共有する","フェデレーションで必要なアプリのみ許可する","VPN の共有アカウントを配布する","制限なく相互接続する"],"a":1,"e":"ID の重複管理を避けつつ、信頼の範囲をアプリ単位・属性単位で限定できるのがフェデレーションの利点。統合前の全面的なネットワーク相互接続は、未評価のリスクを取り込む危険な選択。","src":"scn","i":"q0342"},{"d":"d8","s":"methods","l":3,"q":"アジャイル開発でセキュリティ要件が毎回後回しになっている。最も効果的な組み込み方はどれか。","o":["スプリントの最後にまとめてセキュリティテストを行う","受入基準に組み込む","開発をウォーターフォールに戻す","セキュリティ担当者を開発から外す"],"a":1,"e":"アジャイルでは「バックログに載っていない作業は行われない」。受入基準と Definition of Done に組み込むことで、機能要件と同じ優先度で扱われるようになる。","src":"scn","i":"q0343"},{"d":"d2","s":"classify","l":2,"q":"データ分類ラベルを媒体や文書に表示することを何と呼ぶか。","o":["Classification","Labeling / Marking","Handling","Sanitization"],"a":1,"e":"分類（決定）とラベリング（表示）は別工程。ラベルがあって初めて、取扱手順（Handling）を適用できる。電子データではメタデータやヘッダ／フッタとして埋め込む。","src":"fill","i":"q0344"},{"d":"d2","s":"roles","l":3,"q":"GDPR において DPO（Data Protection Officer）の選任が必要になる典型的なケースはどれか。","o":["営利・非営利を問わずすべての企業","公的機関や大規模な体系的監視を行う組織","従業員が10名以上の規模を持つ企業","EU 域外に本社を置く企業のみ"],"a":1,"e":"DPO は独立性を持ち、監督機関との窓口となる。報告経路は最上位の経営層で、業務上の指示を受けてはならない（利益相反の回避）。","src":"fill","i":"q0345"},{"d":"d2","s":"states","l":3,"q":"クラウドに保存するデータについて、事業者側の管理者による閲覧リスクを最小化する方法はどれか。","o":["事業者が提供する保存時暗号化に任せる","利用者側で鍵を管理する暗号化を行う","保存前にデータを圧縮して難読化する","管理者の操作ログを取得し監視する"],"a":1,"e":"事業者が鍵を保持していれば、事業者は復号できる。鍵の管理主体を自社に置く（Hold Your Own Key）ことで、事業者経由の開示要求に対しても一定の統制を保てる。","src":"fill","i":"q0346"},{"d":"d2","s":"protect","l":2,"q":"データマスキングと暗号化の使い分けとして正しいものはどれか。","o":["マスキングは可逆、暗号化は不可逆","マスキングは表示用途、暗号化は機密性確保","両者は同一の技術","マスキングは鍵管理が必要"],"a":1,"e":"静的マスキングはテストデータ生成、動的マスキングは画面表示制御に用いる。暗号化は鍵があれば復元でき、鍵管理が統制の中心になる。","src":"fill","i":"q0347"},{"d":"d2","s":"retention","l":3,"q":"訴訟が予見される状況で、関連データの削除を停止する措置を何と呼ぶか。","o":["Data Retention","Litigation Hold","Data Minimization","Right to Erasure"],"a":1,"e":"訴訟ホールドが掛かった対象は、通常の保持ポリシーによる自動削除より優先して保全する。違反すると証拠隠滅（spoliation）と見なされ、不利な推定を受ける。","src":"fill","i":"q0348"},{"d":"d2","s":"lifecycle","l":2,"q":"データ最小化（Data Minimization）の原則が意味するものはどれか。","o":["保存効率のためデータを圧縮すること","目的に必要な最小限のデータのみ扱うこと","運用するデータベースの数を絞ること","保持するバックアップ世代を減らすこと"],"a":1,"e":"GDPR の基本原則の一つ。収集しないデータは漏えいも管理コストも発生しない。目的の限定（purpose limitation）と保存期間の制限（storage limitation）とセットで理解する。","src":"fill","i":"q0349"},{"d":"d2","s":"remanence","l":2,"q":"NIST SP 800-88 におけるサニタイズの3区分として正しいものはどれか。","o":["Delete / Format / Encrypt","Clear / Purge / Destroy","Hide / Lock / Burn","Backup / Archive / Remove"],"a":1,"e":"Clear（論理的な上書き。同種機器での再利用可）→ Purge（消磁・暗号消去など、実験室レベルの復元も困難に）→ Destroy（物理破壊）。データの分類と機器の再利用先で選択する。","src":"fill","i":"q0350"},{"d":"d2","s":"protect","l":3,"q":"IRM/DRM（Information Rights Management）が提供する統制の特徴はどれか。","o":["ネットワーク境界でのみ機能する","ファイル単位で権限を制御する","バックアップを自動化する","データを圧縮する"],"a":1,"e":"境界の外へ出たデータを守れる数少ない手段。ただし利用者側にクライアントや対応アプリが必要で、運用負荷と互換性が課題になる。","src":"fill","i":"q0351"},{"d":"d6","s":"testtypes","l":2,"q":"IAST（Interactive AST）の位置づけとして正しいものはどれか。","o":["実行せずにソースだけを解析する","実行中にエージェントが内部の挙動を観測する","ネットワークパケットのみを解析する","本番運用中は使用できない"],"a":1,"e":"実行時の文脈を持ちながらコード上の位置も特定できるため誤検知が少ない。RASP は実行時に攻撃を検知・遮断する防御側の技術で、テスト手法ではない点に注意。","src":"fill","i":"q0352"},{"d":"d6","s":"processdata","l":2,"q":"KPI としてセキュリティ運用の改善を測る際、インシデント対応で重視される代表的な指標はどれか。","o":["検知したイベントの総件数の推移","MTTD と MTTR","収集したログの総容量の推移","導入済みセキュリティ製品の数"],"a":1,"e":"攻撃は防ぎきれない前提に立ち、「どれだけ早く気づき、どれだけ早く止めたか」を測る。滞留時間（dwell time）の短縮が被害額に直結する。","src":"fill","i":"q0353"},{"d":"d6","s":"audit","l":3,"q":"監査で「統制は設計されているが有効に運用されていない」と判定された場合、これは何を意味するか。","o":["統制の設計そのものに不備がある","運用の不備で、一貫して実行されていない","監査手続きの選択を誤っている","リスクが存在せず、統制自体が不要である"],"a":1,"e":"設計（design）と運用（operating effectiveness）は別評価。SOC 2 Type I は設計のみ、Type II は運用有効性まで評価する。運用不備は証跡の欠落として現れることが多い。","src":"fill","i":"q0354"},{"d":"d6","s":"vavp","l":2,"q":"バグバウンティ（脆弱性報奨金）プログラムの利点として正しいものはどれか。","o":["社内でのテストが一切不要になること","外部研究者から実環境の報告を継続的に得られる","脆弱性に関する法的責任がなくなること","脆弱性そのものが発生しなくなること"],"a":1,"e":"内部テストの代替ではなく補完。スコープ、セーフハーバー（法的免責）条項、報告手順、報奨基準を明確に定義しないと、トラブルや低品質報告の氾濫を招く。","src":"fill","i":"q0355"},{"d":"d6","s":"strategy","l":2,"q":"「サードパーティのセキュリティ評価」で、実地訪問より軽量かつ多数のベンダーに適用しやすい手法はどれか。","o":["全ベンダーへのオンサイト監査の実施","標準化された質問票と SOC レポートの取得","全ベンダーに対する侵入テストの実施","インシデント発生時のフォレンジック調査"],"a":1,"e":"ベンダーを重要度でティア分けし、高リスクベンダーにのみオンサイト監査やペンテストを適用するのがリスクベースの実務。全ベンダーに同じ深度は現実的でない。","src":"fill","i":"q0356"},{"d":"d6","s":"logs","l":2,"q":"ログの完全性を保証するために有効な仕組みはどれか。","o":["ログを定期的に圧縮する","集中基盤へ即時転送する","ログをローカルのみに保存する","ログレベルを下げる"],"a":1,"e":"侵入者が最初に狙うのはログの削除。ローカル保存のみでは削除される。即時転送＋改ざん検知＋アクセス制限が基本セット。","src":"fill","i":"q0357"},{"d":"d7","s":"incident","l":2,"q":"「イベント（Event）」と「インシデント（Incident）」の違いとして正しいものはどれか。","o":["両者は同義で、呼び分けに実質的な意味はない","イベントは事象一般、インシデントは悪影響を与えるもの","インシデントの方が件数が多く、イベントは例外的である","イベントは必ず攻撃に起因し、インシデントは偶発的である"],"a":1,"e":"すべてのインシデントはイベントだが、逆は成り立たない。トリアージはイベントからインシデントを識別する工程であり、重大度分類（severity）に基づいてエスカレーションする。","src":"fill","i":"q0358"},{"d":"d7","s":"foundations","l":2,"q":"サービス提供を継続しながら、影響を受けた機能のみを縮小して稼働させる運用を何と呼ぶか。","o":["フェイルオープン（開放故障）","縮退運転","フェイルオーバー（系切替）","ロールバック（切り戻し）"],"a":1,"e":"縮退運転は可用性を部分的に維持する設計。全か無かではなく、重要機能を優先して維持する。BIA で定めた重要業務の優先順位が設計の根拠になる。","src":"fill","i":"q0359"},{"d":"d7","s":"monitoring","l":3,"q":"UEBA（User and Entity Behavior Analytics）が有効な脅威はどれか。","o":["既知のマルウェアのシグネチャ検知","正規の資格情報を悪用する内部不正など","ネットワーク帯域の不足","ハードウェア故障"],"a":1,"e":"正規の認証を通過している以上、従来型の境界防御やシグネチャでは検知できない。行動のベースラインからの逸脱（普段と違う時間・量・対象へのアクセス）で検知する。","src":"fill","i":"q0360"},{"d":"d7","s":"foundations","l":3,"q":"ハニーポットを設置する際の法的・運用上の注意点はどれか。","o":["設置に際して法務や経営の承認は不要である","おとり捜査と見なされないよう配慮し、隔離環境に設置する","現実性を高めるため本番ネットワークに直結させる","誘引が目的なので詳細なログ取得は必須ではない"],"a":1,"e":"エンティスメント（enticement）は許容されうるがエントラップメント（entrapment、犯意の誘発）は問題になりうる。またハニーポットが踏み台にされないよう厳格に隔離・監視する必要がある。","src":"fill","i":"q0361"},{"d":"d7","s":"backup","l":3,"q":"ランサムウェア対策としてバックアップに求められる最も重要な特性はどれか。","o":["取得に要する時間が短く、業務影響が小さいこと","本番から隔離され、改変不可またはオフラインであること","圧縮率が高く、保管コストを抑えられること","世代数が多く、任意の時点に戻せること"],"a":1,"e":"本番と同じ資格情報でアクセスできるバックアップは、ランサムウェアに同時に暗号化される。エアギャップ／イミュータブルストレージ／別資格情報が必須。復旧テストも定期実施する。","src":"fill","i":"q0362"},{"d":"d7","s":"dr","l":2,"q":"BCP と DRP の関係として正しいものはどれか。","o":["DRP は BCP の上位概念である","BCP が上位、DRP が IT 復旧","両者は同義","BCP は IT のみを扱う"],"a":1,"e":"BCP＞DRP。BCP は代替要員・代替拠点・手作業手順など事業機能全体を扱い、DRP は技術的復旧に焦点を当てる。COOP は政府機関で使われる類似概念。","src":"fill","i":"q0363"},{"d":"d7","s":"change","l":3,"q":"パッチ管理プロセスで、適用前に必ず行うべき工程はどれか。","o":["パッチのファイルサイズ確認","テスト環境での検証と影響分析","全サーバへの一斉適用","パッチのダウンロード履歴の保存"],"a":1,"e":"無検証の一斉適用は自ら障害を起こす。一方で緊急度の高い脆弱性は検証を簡略化してでも早期適用する判断が必要。優先順位はリスクベースで決める。","src":"fill","i":"q0364"},{"d":"d7","s":"foundations","l":2,"q":"クラウド環境における責任共有モデルで、IaaS 利用者の責任範囲に含まれるものはどれか。","o":["物理データセンターの入退室管理","ゲスト OS 以上の管理","ハイパーバイザの保守と更新","電源と空調設備の冗長化"],"a":1,"e":"IaaS では OS より上が利用者責任。PaaS では OS/ミドルウェアが事業者側に移り、SaaS ではアプリまで事業者側。ただしデータ・ID・アクセス制御は常に利用者責任として残る。","src":"fill","i":"q0365"},{"d":"d8","s":"sdlc","l":2,"q":"ソフトウェアのセキュリティ要件を定義する際、最も参照価値が高いものはどれか。","o":["ベンダーが提供する製品カタログ","脅威モデリングの結果と適用される法規制","開発者個人のこれまでの経験則","競合他社製品の機能一覧との比較"],"a":1,"e":"要件は「守るべき資産と想定される脅威」から導く。ASVS のような検証標準を使うと、要件・実装・テストが一貫して追跡可能になる。","src":"fill","i":"q0366"},{"d":"d8","s":"methods","l":2,"q":"継続的インテグレーション（CI）がセキュリティにもたらす主な利点はどれか。","o":["必要な開発要員の数を削減できる","変更のたびに検査が走り、早く小さく検出できる","本番環境での障害が発生しなくなる","人手によるコードレビューが不要になる"],"a":1,"e":"小さな変更を頻繁に統合するほど、問題の切り分けが容易になる。セキュリティ検査を CI に組み込むことで「後で直す」を構造的に減らせる。","src":"fill","i":"q0367"},{"d":"d8","s":"maturity","l":3,"q":"ソフトウェア保証の成熟度をセキュリティ観点で測るために設計されたモデルはどれか。","o":["CMMI 統合成熟度モデル","SAMM / BSIMM","ITIL サービス管理","COBIT ガバナンス"],"a":1,"e":"SAMM は「あるべき姿」を示す規範的モデル、BSIMM は実在組織の活動を観測した記述的モデル。CMMI は開発プロセス全般の成熟度で、セキュリティ専用ではない。","src":"fill","i":"q0368"},{"d":"d8","s":"owasp","l":3,"q":"認証機能の実装で「アカウントが存在するかどうかを攻撃者に教えてしまう」問題を何と呼ぶか。","o":["SQL インジェクション","ユーザー列挙（User Enumeration）","バッファオーバーフロー","権限昇格（Privilege Escalation）"],"a":1,"e":"「ユーザー名が違います／パスワードが違います」と区別する、応答時間が異なる、といった差異から列挙される。エラーメッセージと応答時間を統一するのが対策。","src":"fill","i":"q0369"},{"d":"d8","s":"coding","l":2,"q":"入力検証の実装方針として最も安全なものはどれか。","o":["拒否リスト（ブラックリスト）方式","許可リスト方式で期待する形式のみ受け入れる","クライアント側のみで検証する","検証を行わない"],"a":1,"e":"拒否リストは未知のパターンを取りこぼす。またクライアント側検証は UX 向上のためであり、必ずサーバ側でも検証する（クライアントは改変可能）。","src":"fill","i":"q0370"},{"d":"d8","s":"coding","l":3,"q":"エラーハンドリングにおけるセキュリティ上の原則はどれか。","o":["スタックトレースを画面に表示して調査を容易にする","利用者には一般的な文言のみを返す","エラーを無視する","全エラーをメールで全社に送る"],"a":1,"e":"詳細なエラー（SQL 文、パス、バージョン）は攻撃者への情報提供になる。加えて例外時に安全側で処理を止める（fail securely）ことも重要。","src":"fill","i":"q0371"},{"d":"d8","s":"acquired","l":3,"q":"ソフトウェアエスクロー（Software Escrow）契約の目的はどれか。","o":["ソースコードを一般に公開すること","破綻時に備え第三者へソースを預託すること","開発工程そのものを外部に委託すること","ライセンス費用の総額を抑えること"],"a":1,"e":"ベンダーロックインと事業継続リスクへの対処。エスクローは「預けてある」だけでは不十分で、預託物が最新かつビルド可能かを定期検証する条項が重要。","src":"fill","i":"q0372"},{"d":"d8","s":"sdlc","l":3,"q":"廃棄（Disposal）フェーズでソフトウェアに関して行うべきことはどれか。","o":["特段の作業は不要で、稼働停止をもって完了とする","データの安全な破棄と、アクセス権の失効","資産化のためソースコードを社外へ公開する","保管中のバックアップをすべて削除する"],"a":1,"e":"廃棄は最も
