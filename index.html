 stroke-width=\"2\"/><polygon points=\"250,60 238,54 238,66\" fill=\"var(--muted)\"/> <rect x=\"160\" y=\"92\" width=\"60\" height=\"26\" rx=\"6\" fill=\"#1f6feb\"/><text x=\"190\" y=\"110\" text-anchor=\"middle\" class=\"kc\">同じ鍵<\/text> <line x1=\"190\" y1=\"80\" x2=\"190\" y2=\"92\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/> <text x=\"190\" y=\"150\" text-anchor=\"middle\" class=\"s\">高速・鍵配送が課題・例: AES, 3DES<\/text> <text x=\"570\" y=\"22\" text-anchor=\"middle\" class=\"t\">非対称鍵（Asymmetric）<\/text> <rect x=\"420\" y=\"40\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\"/><text x=\"465\" y=\"65\" text-anchor=\"middle\" class=\"s\">平文<\/text> <rect x=\"630\" y=\"40\" width=\"90\" height=\"40\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line)\"/><text x=\"675\" y=\"65\" text-anchor=\"middle\" class=\"s\">暗号文<\/text> <line x1=\"510\" y1=\"60\" x2=\"630\" y2=\"60\" stroke=\"var(--muted)\" stroke-width=\"2\"/><polygon points=\"630,60 618,54 618,66\" fill=\"var(--muted)\"/> <rect x=\"430\" y=\"92\" width=\"100\" height=\"26\" rx=\"6\" fill=\"#0e9f6e\"/><text x=\"480\" y=\"110\" text-anchor=\"middle\" class=\"kc\">公開鍵で暗号化<\/text> <rect x=\"600\" y=\"92\" width=\"100\" height=\"26\" rx=\"6\" fill=\"#b54708\"/><text x=\"650\" y=\"110\" text-anchor=\"middle\" class=\"kc\">秘密鍵で復号<\/text> <text x=\"570\" y=\"150\" text-anchor=\"middle\" class=\"s\">低速・鍵配送を解決・署名可・例: RSA, ECC<\/text> <text x=\"380\" y=\"186\" text-anchor=\"middle\" class=\"s\">実務では「非対称で鍵交換 → 対称で本文暗号化」のハイブリッド方式が一般的（例: TLS）。<\/text> <\/svg> <figcaption>図2：対称鍵 vs 非対称鍵（自作）。<\/figcaption> <\/figure> <div class=\"tablewrap\"> <table> <thead><tr><th>種類<\/th><th>鍵<\/th><th>提供する特性<\/th><th>例<\/th><\/tr><\/thead> <tbody> <tr><td><strong>対称鍵<\/strong><\/td><td>暗号化・復号に同じ鍵<\/td><td>機密性（高速）<\/td><td>AES, 3DES, ChaCha20<\/td><\/tr> <tr><td><strong>非対称鍵<\/strong><\/td><td>公開鍵/秘密鍵のペア<\/td><td>機密性・鍵交換・署名（真正性/否認防止）<\/td><td>RSA, ECC, Diffie-Hellman<\/td><\/tr> <tr><td><strong>ハッシュ<\/strong><\/td><td>鍵なし（一方向）<\/td><td>完全性<\/td><td>SHA-256, SHA-3<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">鍵の数<\/span> 対称鍵は参加者が増えると鍵が爆発的に増える：n人なら <strong>n(n-1)/2<\/strong> 鍵が必要（鍵配送問題）。非対称鍵はこれを解決する。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Symmetric / Asymmetric<\/dt><dd>対称／非対称。同じ鍵か、公開鍵・秘密鍵のペアか。<\/dd> <dt>Hashing<\/dt><dd>ハッシュ化。一方向関数で固定長の値を生成。完全性の確認に使う。<\/dd> <dt>Plaintext / Ciphertext<\/dt><dd>平文／暗号文。<\/dd> <dt>Key Exchange<\/dt><dd>鍵交換。安全に共通鍵を共有する（例: Diffie-Hellman）。<\/dd> <dt>Nonrepudiation<\/dt><dd>否認防止。秘密鍵による署名で実現。<\/dd> <\/dl> <\/div>"},{"id":"pki","n":"5","t":"PKI・電子署名","en":"PKI & Digital Signature","h":"<p><strong class=\"k\">電子署名<\/strong>は「データのハッシュを<strong>送信者の秘密鍵で暗号化<\/strong>」したもの。受信者は送信者の公開鍵で検証します。 これにより<strong class=\"k\">完全性・真正性・否認防止<\/strong>が得られます（※機密性は別途暗号化が必要）。<\/p> <p>公開鍵が「本物の持ち主のものか」を保証するのが<strong class=\"k\">PKI（公開鍵基盤）<\/strong>です。<\/p> <ul> <li><strong class=\"k\">CA（認証局）<\/strong>：証明書を発行・署名する信頼の起点。<\/li> <li><strong class=\"k\">RA（登録局）<\/strong>：申請者の本人確認を行う。<\/li> <li><strong class=\"k\">証明書（X.509）<\/strong>：公開鍵と所有者情報を CA が署名で結びつけたもの。<\/li> <li><strong class=\"k\">失効確認<\/strong>：CRL（失効リスト）または OCSP（オンライン確認）。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 「署名＝秘密鍵、検証＝公開鍵」「暗号化（機密性）＝相手の公開鍵、復号＝自分の秘密鍵」。<strong>どの鍵をどの目的で使うか<\/strong>の取り違えを狙う問題が頻出。<\/div>"},{"id":"attacks","n":"6","t":"暗号への攻撃","en":"Cryptanalytic Attacks","h":"<div class=\"tablewrap\"> <table> <thead><tr><th>攻撃<\/th><th>概要<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Brute Force<\/strong>（総当たり）<\/td><td>全鍵を試す。鍵長を長くすると非現実的に。<\/td><\/tr> <tr><td><strong>Ciphertext-only<\/strong><\/td><td>暗号文だけから解読を試みる（最も難しい）。<\/td><\/tr> <tr><td><strong>Known-plaintext<\/strong><\/td><td>平文と暗号文のペアを既知として解析。<\/td><\/tr> <tr><td><strong>Chosen-plaintext / -ciphertext<\/strong><\/td><td>任意の平文/暗号文を選んで解析。<\/td><\/tr> <tr><td><strong>Birthday Attack<\/strong><\/td><td>ハッシュの衝突を確率的に突く（誕生日のパラドックス）。<\/td><\/tr> <tr><td><strong>Side-channel<\/strong><\/td><td>消費電力・処理時間・電磁波など物理的副次情報から鍵を推定。<\/td><\/tr> <tr><td><strong>Rainbow Table<\/strong><\/td><td>事前計算したハッシュ表でパスワードを逆引き。<strong>ソルト<\/strong>で対策。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">対策キーワード<\/span> <span class=\"pill\">十分な鍵長<\/span><span class=\"pill\">ソルト(salt)<\/span><span class=\"pill\">鍵ストレッチング<\/span><span class=\"pill\">最新アルゴリズム<\/span> — MD5/SHA-1 や DES は危殆化（deprecated）。<\/div>"},{"id":"archvuln","n":"7","t":"アーキテクチャの脆弱性","en":"","h":"<p>システム形態ごとに固有のリスクがあります。代表例：<\/p> <ul> <li><strong class=\"k\">クラウド<\/strong>：責任共有モデルの誤解、設定ミス（misconfiguration）、マルチテナント分離。<\/li> <li><strong class=\"k\">IoT / 組込み<\/strong>：弱い既定パスワード、更新困難、長寿命。<\/li> <li><strong class=\"k\">ICS / SCADA<\/strong>：制御系。可用性最優先・レガシー・パッチ困難。<\/li> <li><strong class=\"k\">コンテナ / サーバーレス / マイクロサービス<\/strong>：イメージの脆弱性、過剰権限、API 露出。<\/li> <li><strong class=\"k\">仮想化<\/strong>：ハイパーバイザの脆弱性、VM エスケープ。<\/li> <\/ul> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> ハードウェアの保護機構も出題範囲：<strong>TPM<\/strong>（鍵保管・計測ブート）、<strong>HSM<\/strong>（鍵管理専用機器）、メモリ保護、TEE。<\/div>"},{"id":"physical","n":"8","t":"物理・施設セキュリティ","en":"","h":"<p>設計段階から防犯・環境対策を組み込みます（<strong class=\"k\">CPTED<\/strong>：環境設計による犯罪防止 等）。代表的トピック：<\/p> <ul> <li><strong class=\"k\">電源<\/strong>：UPS・発電機で停電対策。用語：sag/brownout（電圧低下）、surge/spike（過電圧）、blackout（停電）。<\/li> <li><strong class=\"k\">空調（HVAC）<\/strong>：温湿度管理、正圧（positive pressure）で汚染防止。<\/li> <li><strong class=\"k\">消火<\/strong>：水(wet/dry pipe, preaction)・ガス系（FM-200、不活性ガス）。<strong>Halon はオゾン層破壊でモントリオール議定書により全廃<\/strong>。 データセンターは機器を傷めにくいガス系やプリアクション式が好まれる。<\/li> <li><strong class=\"k\">入退管理<\/strong>：マントラップ（mantrap/access control vestibule）、バッジ、監視カメラ、警備。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>Halon は全廃済み<\/strong>（代替＝FM-200等）。電源用語（brownout＝電圧低下が継続、spike＝瞬間的過電圧）の区別。 人命優先（safety first）— 物理対策は常に人命を最優先する点も問われる。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 3 の超要点<\/h3> <ul> <li><strong>BLP＝機密性<\/strong>（no read up / no write down）、<strong>Biba＝完全性<\/strong>（逆）、Clark-Wilson＝完全性＋職務分掌。<\/li> <li>暗号3種：対称（高速・機密性）／非対称（署名・鍵交換）／ハッシュ（完全性）。対称鍵数＝n(n-1)/2。<\/li> <li>署名＝<strong>秘密鍵<\/strong>、検証＝公開鍵。署名は機密性を提供しない。<\/li> <li>EAL は「検証の厳格さ（保証）」。PP=買い手要件、ST=売り手宣言。<\/li> <li>物理：Halon は全廃。電源・消火・マントラップ・<strong>人命優先<\/strong>。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>ISO/IEC 15408（Common Criteria）概要 — <a href=\"https://www.commoncriteriaportal.org/\" target=\"_blank\" rel=\"noopener\">commoncriteriaportal.org<\/a><\/li> <li>NIST, <em>FIPS 140-3<\/em>（暗号モジュールの要件）— <a href=\"https://csrc.nist.gov/pubs/fips/140-3/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-57<\/em>（鍵管理）／<em>SP 800-175B<\/em>（暗号の利用指針）— <a href=\"https://csrc.nist.gov/\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>UNEP, モントリオール議定書（Halon 全廃の根拠）— <a href=\"https://www.unep.org/ozonaction/who-we-are/about-montreal-protocol\" target=\"_blank\" rel=\"noopener\">unep.org<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報・一般的な暗号/モデルの定義を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。 ISO/IEC 規格は本文を転載せず概念の要約のみ。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d4","n":4,"t":"通信とネットワークのセキュリティ","en":"Communication and Network Security","w":13,"lead":"Domain 4 はネットワークの仕組みと、その安全な設計・運用を扱います。土台は OSI 参照モデル（7層）。各層で何が起きるか、どの機器・プロトコルがどの層で働くかを理解すれば、 攻撃と防御の位置づけが見えてきます。安全なプロトコルへの置き換えと、セグメンテーションが実務の要です。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 4 の主要トピック（公式 Outline 4.1〜4.3 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#osi\" style=\"--c:#1f6feb\"><div class=\"ic\">🪜<\/div><h4>OSI / TCP-IP<\/h4><small>7層・4層モデル<\/small><\/a> <a class=\"topic\" href=\"#ip\" style=\"--c:#0e9f6e\"><div class=\"ic\">🔢<\/div><h4>IP・ポート<\/h4><small>IPv4/6・代表ポート<\/small><\/a> <a class=\"topic\" href=\"#secure-proto\" style=\"--c:#7c3aed\"><div class=\"ic\">🔒<\/div><h4>セキュアプロトコル<\/h4><small>TLS/IPsec/SSH<\/small><\/a> <a class=\"topic\" href=\"#devices\" style=\"--c:#b54708\"><div class=\"ic\">🧱<\/div><h4>機器・FW<\/h4><small>ルータ/スイッチ/FW<\/small><\/a> <a class=\"topic\" href=\"#segmentation\" style=\"--c:#0e9f6e\"><div class=\"ic\">🗂️<\/div><h4>分離・NAC<\/h4><small>VLAN/SDN/802.1X<\/small><\/a> <a class=\"topic\" href=\"#wireless\" style=\"--c:#b42318\"><div class=\"ic\">📶<\/div><h4>無線<\/h4><small>WPA2/WPA3<\/small><\/a> <\/div>"},{"id":"osi","n":"1","t":"OSI 参照モデルと TCP/IP","en":"","h":"<p><strong class=\"k\">OSI 7層モデル<\/strong>はネットワーク通信を7つの層に分けた概念図。各層の役割・代表プロトコル・対応機器を結びつけて覚えます。<\/p> <figure> <svg id=\"dg-d4-10\" class=\"diagram\" viewBox=\"0 0 760 340\" role=\"img\" aria-label=\"OSI 7層モデル：各層の番号・名称・例・対応機器\"> <text x=\"120\" y=\"20\" text-anchor=\"middle\" class=\"hh\">層<\/text> <text x=\"430\" y=\"20\" text-anchor=\"middle\" class=\"hh\">例（プロトコル/機器）<\/text> <g> <rect x=\"20\" y=\"28\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#1f6feb\"/><text x=\"130\" y=\"51\" text-anchor=\"middle\" class=\"t\">7 アプリケーション<\/text><text x=\"260\" y=\"51\" class=\"e\">HTTP, DNS, SMTP<\/text> <rect x=\"20\" y=\"68\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#2a7de1\"/><text x=\"130\" y=\"91\" text-anchor=\"middle\" class=\"t\">6 プレゼンテーション<\/text><text x=\"260\" y=\"91\" class=\"e\">暗号化・符号化(TLS表現)<\/text> <rect x=\"20\" y=\"108\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#3b86e6\"/><text x=\"130\" y=\"131\" text-anchor=\"middle\" class=\"t\">5 セッション<\/text><text x=\"260\" y=\"131\" class=\"e\">セッション確立/維持<\/text> <rect x=\"20\" y=\"148\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#0e9f6e\"/><text x=\"130\" y=\"171\" text-anchor=\"middle\" class=\"t\">4 トランスポート<\/text><text x=\"260\" y=\"171\" class=\"e\">TCP / UDP（ポート）<\/text> <rect x=\"20\" y=\"188\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#19a772\"/><text x=\"130\" y=\"211\" text-anchor=\"middle\" class=\"t\">3 ネットワーク<\/text><text x=\"260\" y=\"211\" class=\"e\">IP・ルータ（ルーティング）<\/text> <rect x=\"20\" y=\"228\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#b54708\"/><text x=\"130\" y=\"251\" text-anchor=\"middle\" class=\"t\">2 データリンク<\/text><text x=\"260\" y=\"251\" class=\"e\">MAC・スイッチ・ARP<\/text> <rect x=\"20\" y=\"268\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#7c3aed\"/><text x=\"130\" y=\"291\" text-anchor=\"middle\" class=\"t\">1 物理<\/text><text x=\"260\" y=\"291\" class=\"e\">ケーブル・ハブ・電気信号<\/text> <\/g> <text x=\"40\" y=\"328\" class=\"hh\">暗記: 下→上「Please Do Not Throw Sausage Pizza Away」<\/text> <\/svg> <figcaption>図1：OSI 7層モデル（自作）。各層の代表例と対応機器を併記。<\/figcaption> <\/figure> <div class=\"callout tip\"><span class=\"lab\">TCP/IP モデル（実装寄り・4層）<\/span> Application（OSI 5-7）／Transport（4）／Internet（3）／Link・Network Access（1-2）。実務の通信は TCP/IP で動く。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Encapsulation <span class=\"ipa\">/ɪnˌkæpsjuˈleɪʃn/<\/span><\/dt><dd>カプセル化。各層でヘッダを付けて下層へ渡す。<\/dd> <dt>Routing / Switching<\/dt><dd>ルーティング（L3, IP）／スイッチング（L2, MAC）。<\/dd> <dt>Segmentation<\/dt><dd>セグメンテーション。ネットワークを分割し被害拡大を防ぐ。<\/dd> <dt>Throughput / Latency<\/dt><dd>スループット（処理量）／レイテンシ（遅延）。<\/dd> <\/dl> <\/div>"},{"id":"ip","n":"2","t":"IP・ポート・基本プロトコル","en":"","h":"<p>代表的なポート番号と、対応する「安全でない／安全な」プロトコルの置き換えは頻出です。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>用途<\/th><th>安全でない（ポート）<\/th><th>安全な代替（ポート）<\/th><\/tr><\/thead> <tbody> <tr><td>Web<\/td><td>HTTP (80)<\/td><td>HTTPS / TLS (443)<\/td><\/tr> <tr><td>遠隔ログイン<\/td><td>Telnet (23)<\/td><td>SSH (22)<\/td><\/tr> <tr><td>ファイル転送<\/td><td>FTP (20/21)<\/td><td>SFTP (22) / FTPS<\/td><\/tr> <tr><td>メール送信<\/td><td>SMTP (25)<\/td><td>SMTPS / STARTTLS (587/465)<\/td><\/tr> <tr><td>名前解決<\/td><td>DNS (53)<\/td><td>DNSSEC / DoH / DoT<\/td><\/tr> <tr><td>機器管理<\/td><td>SNMP v1/v2 (161)<\/td><td>SNMP v3 (161)<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> IPv4 はアドレス枯渇のため NAT を多用。IPv6 は広大なアドレス空間と IPsec 親和性が特徴。 TCP は3ウェイハンドシェイク（SYN→SYN/ACK→ACK）で接続を確立する信頼通信、UDP はコネクションレス・高速。<\/div>"},{"id":"secure-proto","n":"3","t":"セキュアプロトコル","en":"Secure Protocols","h":"<ul> <li><strong class=\"k\">TLS<\/strong>（Transport Layer Security）：Web/メール等を暗号化。SSL の後継（SSL は危殆化・非推奨）。<\/li> <li><strong class=\"k\">IPsec<\/strong>：L3 で IP パケットを保護。<strong>AH<\/strong>（完全性・認証）と <strong>ESP<\/strong>（暗号化＋完全性）。 <strong>トンネルモード<\/strong>（VPN、IPヘッダごと暗号化）と<strong>トランスポートモード<\/strong>（ペイロードのみ）。<\/li> <li><strong class=\"k\">SSH<\/strong>：暗号化された遠隔操作・トンネリング。<\/li> <li><strong class=\"k\">DNSSEC<\/strong>：DNS 応答に署名し改ざん（DNS スプーフィング）を防ぐ。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> IPsec の <strong>AH と ESP の違い<\/strong>（AH は暗号化しない・ESP は暗号化する）と、<strong>トンネル/トランスポートモード<\/strong>の違いは頻出。 VPN は通常 ESP のトンネルモード。<\/div>"},{"id":"devices","n":"4","t":"ネットワーク機器とファイアウォール","en":"","h":"<p>ファイアウォールは「どの層で何を見るか」で世代が分かれます。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>種類<\/th><th>判断材料<\/th><th>層<\/th><\/tr><\/thead> <tbody> <tr><td><strong>パケットフィルタ<\/strong><\/td><td>送信元/宛先IP・ポート（単発）<\/td><td>L3/L4<\/td><\/tr> <tr><td><strong>ステートフルインスペクション<\/strong><\/td><td>接続の状態（セッション）を追跡<\/td><td>L4<\/td><\/tr> <tr><td><strong>プロキシ/アプリケーション<\/strong><\/td><td>アプリ内容を検査・代理<\/td><td>L7<\/td><\/tr> <tr><td><strong>次世代FW（NGFW）<\/strong><\/td><td>アプリ識別＋IPS＋脅威情報<\/td><td>L3-L7<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">関連機器<\/span> <span class=\"pill\">ルータ(L3)<\/span><span class=\"pill\">スイッチ(L2)<\/span><span class=\"pill\">ハブ(L1)<\/span> <span class=\"pill\">IDS/IPS<\/span><span class=\"pill\">プロキシ<\/span><span class=\"pill\">ロードバランサ<\/span><\/div>"},{"id":"segmentation","n":"5","t":"セグメンテーションと NAC","en":"","h":"<p>ネットワークを分割（セグメント化）すると、侵害時の<strong class=\"k\">横展開（lateral movement）<\/strong>を抑えられます。<\/p> <ul> <li><strong class=\"k\">VLAN<\/strong>：スイッチ上で論理的にネットワークを分割。<\/li> <li><strong class=\"k\">DMZ<\/strong>：公開サーバを内部 LAN から隔離する緩衝地帯。<\/li> <li><strong class=\"k\">マイクロセグメンテーション<\/strong>：ワークロード単位で細かく分割（ゼロトラストの実装）。<\/li> <li><strong class=\"k\">SDN / SD-WAN<\/strong>：ソフトウェアで制御を集中管理。<\/li> <li><strong class=\"k\">NAC（Network Access Control）<\/strong>：接続端末の認証・健全性確認（<strong>802.1X<\/strong>）。<\/li> <\/ul> <figure> <svg id=\"dg-d4-11\" class=\"diagram\" viewBox=\"0 0 760 200\" role=\"img\" aria-label=\"DMZ構成：インターネット→外側FW→DMZ(公開サーバ)→内側FW→内部LANの二重防御\"> <rect x=\"14\" y=\"70\" width=\"120\" height=\"56\" rx=\"10\" fill=\"#475467\"/><text x=\"74\" y=\"96\" text-anchor=\"middle\" class=\"t\">インターネット<\/text><text x=\"74\" y=\"114\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">（信頼できない）<\/text> <rect x=\"172\" y=\"74\" width=\"44\" height=\"48\" rx=\"8\" fill=\"#b42318\"/><text x=\"194\" y=\"103\" text-anchor=\"middle\" class=\"fw\">FW<\/text> <rect x=\"252\" y=\"62\" width=\"200\" height=\"74\" rx=\"10\" fill=\"var(--surface-2)\" stroke=\"#b54708\" stroke-width=\"2\"/> <text x=\"352\" y=\"86\" text-anchor=\"middle\" class=\"s\" style=\"font-weight:800; fill:#b54708\">DMZ（非武装地帯）<\/text> <text x=\"352\" y=\"108\" text-anchor=\"middle\" class=\"s\">公開Web・メール・DNS<\/text> <text x=\"352\" y=\"126\" text-anchor=\"middle\" class=\"s\" style=\"font-size:10px\">外部公開するサーバだけを置く<\/text> <rect x=\"490\" y=\"74\" width=\"44\" height=\"48\" rx=\"8\" fill=\"#b42318\"/><text x=\"512\" y=\"103\" text-anchor=\"middle\" class=\"fw\">FW<\/text> <rect x=\"572\" y=\"70\" width=\"174\" height=\"56\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"659\" y=\"96\" text-anchor=\"middle\" class=\"t\">内部LAN<\/text><text x=\"659\" y=\"114\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">（守るべき資産）<\/text> <g stroke=\"var(--muted)\" stroke-width=\"2\"> <line x1=\"134\" y1=\"98\" x2=\"172\" y2=\"98\"/><line x1=\"216\" y1=\"98\" x2=\"252\" y2=\"98\"/> <line x1=\"452\" y1=\"98\" x2=\"490\" y2=\"98\"/><line x1=\"534\" y1=\"98\" x2=\"572\" y2=\"98\"/> <\/g> <text x=\"380\" y=\"170\" text-anchor=\"middle\" class=\"s\">2つのFWで挟むことで、DMZが破られても内部LANへ直接到達させない（多層防御）。<\/text> <\/svg> <figcaption>図2：DMZ による境界防御（自作）。公開サーバを緩衝地帯に隔離し、内部LANを二重のFWで守る。<\/figcaption> <\/figure> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Lateral Movement<\/dt><dd>横展開。侵入後に内部を移動して被害を広げる動き。分離で抑止。<\/dd> <dt>DMZ (Demilitarized Zone)<\/dt><dd>非武装地帯。公開サーバ用の緩衝ネットワーク。<\/dd> <dt>Micro-segmentation<\/dt><dd>マイクロセグメンテーション。ワークロード単位の細分化。<\/dd> <dt>802.1X / NAC<\/dt><dd>ポートベース認証／ネットワークアクセス制御。<\/dd> <\/dl> <\/div>"},{"id":"wireless","n":"6","t":"無線・モバイル","en":"","h":"<p>無線 LAN（Wi-Fi, IEEE 802.11）のセキュリティは規格の世代を区別します。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>規格<\/th><th>状態<\/th><th>要点<\/th><\/tr><\/thead> <tbody> <tr><td><strong>WEP<\/strong><\/td><td>危殆化（使用禁止）<\/td><td>脆弱なRC4・短いIV。容易に解読される。<\/td><\/tr> <tr><td><strong>WPA<\/strong><\/td><td>旧式<\/td><td>TKIP。暫定対策で現在は非推奨。<\/td><\/tr> <tr><td><strong>WPA2<\/strong><\/td><td>広く利用<\/td><td>AES-CCMP。現実的な標準。<\/td><\/tr> <tr><td><strong>WPA3<\/strong><\/td><td>最新<\/td><td>SAE による強固な鍵交換、前方秘匿性。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>WEP は解読容易で使用禁止<\/strong>。WPA2(AES) 以上を使う。WPA3 は SAE（Dragonfly）でオフライン辞書攻撃に耐性。 SSID 非表示や MAC フィルタは<strong>気休め程度<\/strong>（容易に回避される）という出題も。<\/div>"},{"id":"channels","n":"7","t":"セキュア通信路（VPN・リモートアクセス等）","en":"","h":"<ul> <li><strong class=\"k\">VPN<\/strong>：公衆網上に暗号化トンネルを構築。<strong>IPsec VPN<\/strong>（L3）と<strong>TLS/SSL VPN<\/strong>（L7、ブラウザ）。<\/li> <li><strong class=\"k\">リモートアクセス<\/strong>：多要素認証＋デバイス健全性確認が前提。<\/li> <li><strong class=\"k\">VoIP / 多地点コラボ<\/strong>：通話の盗聴・なりすまし対策（SRTP, TLS）。<\/li> <li><strong class=\"k\">第三者接続<\/strong>：取引先との接続は契約・最小権限・監視で管理。<\/li> <\/ul>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 4 の超要点<\/h3> <ul> <li>OSI 7層：ルータ=L3、スイッチ=L2、TCP/UDP・ポート=L4。<\/li> <li>安全な代替へ：Telnet→SSH、HTTP→HTTPS、FTP→SFTP、SNMPv1/2→v3。<\/li> <li>IPsec：AH=認証のみ／ESP=暗号化＋完全性。VPN は ESP トンネルモード。<\/li> <li>FW 世代：パケットフィルタ→ステートフル→プロキシ(L7)→NGFW。<\/li> <li>分離で横展開抑止（VLAN/DMZ/マイクロセグメンテーション）。無線は WPA2/3、WEP 禁止。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>ISO/IEC 7498-1（OSI 参照モデル）概要 — <a href=\"https://www.iso.org/standard/20269.html\" target=\"_blank\" rel=\"noopener\">iso.org<\/a><\/li> <li>IETF RFC 4301（IPsec アーキテクチャ）, RFC 8446（TLS 1.3）— <a href=\"https://www.rfc-editor.org/\" target=\"_blank\" rel=\"noopener\">rfc-editor.org<\/a><\/li> <li>Wi-Fi Alliance（WPA2/WPA3）— <a href=\"https://www.wi-fi.org/discover-wi-fi/security\" target=\"_blank\" rel=\"noopener\">wi-fi.org<\/a><\/li> <li>NIST, <em>SP 800-77 / 800-52<\/em>（IPsec/TLS の指針）— <a href=\"https://csrc.nist.gov/\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（OSI/プロトコルの一般的定義を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。ISO/IEC・IETF は概念の要約のみ。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d5","n":5,"t":"アイデンティティおよびアクセス管理（IAM）","en":"Identity and Access Management","w":13,"lead":"Domain 5 は「誰が・何に・どこまでアクセスできるか」を管理する章。 IAAA（識別・認証・認可・アカウンタビリティ）を軸に、認証要素、SSO・フェデレーション（Kerberos / SAML / OAuth / OIDC）、 アクセス制御モデル（DAC/MAC/RBAC/ABAC）、そしてアカウントのライフサイクル管理を学びます。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 5 の主要トピック（公式 Outline 5.1〜5.6 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#iaaa\" style=\"--c:#1f6feb\"><div class=\"ic\">🪪<\/div><h4>IAAA<\/h4><small>識別/認証/認可/記録<\/small><\/a> <a class=\"topic\" href=\"#factors\" style=\"--c:#0e9f6e\"><div class=\"ic\">🔑<\/div><h4>認証要素<\/h4><small>知識/所持/生体<\/small><\/a> <a class=\"topic\" href=\"#biometric\" style=\"--c:#b54708\"><div class=\"ic\">🫆<\/div><h4>生体指標<\/h4><small>FAR/FRR/CER<\/small><\/a> <a class=\"topic\" href=\"#sso\" style=\"--c:#7c3aed\"><div class=\"ic\">🎫<\/div><h4>SSO/Kerberos<\/h4><small>TGT・KDC<\/small><\/a> <a class=\"topic\" href=\"#federation\" style=\"--c:#0e9f6e\"><div class=\"ic\">🤝<\/div><h4>フェデレーション<\/h4><small>SAML/OAuth/OIDC<\/small><\/a> <a class=\"topic\" href=\"#models\" style=\"--c:#b42318\"><div class=\"ic\">🧭<\/div><h4>制御モデル<\/h4><small>DAC/MAC/RBAC/ABAC<\/small><\/a> <\/div>"},{"id":"iaaa","n":"1","t":"IAAA の4ステップ","en":"","h":"<p>アクセス管理は4つの段階で考えます。混同しやすいので順序と意味を固めましょう。<\/p> <figure> <svg id=\"dg-d5-12\" class=\"diagram\" viewBox=\"0 0 760 150\" role=\"img\" aria-label=\"IAAA：識別→認証→認可→アカウンタビリティの流れ\"> <rect x=\"10\" y=\"40\" width=\"170\" height=\"56\" rx=\"10\" fill=\"#1f6feb\"/><text x=\"95\" y=\"64\" text-anchor=\"middle\" class=\"t\">識別 Identification<\/text><text x=\"95\" y=\"84\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">「私はAです」ID提示<\/text> <rect x=\"200\" y=\"40\" width=\"170\" height=\"56\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"285\" y=\"64\" text-anchor=\"middle\" class=\"t\">認証 Authentication<\/text><text x=\"285\" y=\"84\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">「本人だ」と証明<\/text> <rect x=\"390\" y=\"40\" width=\"170\" height=\"56\" rx=\"10\" fill=\"#b54708\"/><text x=\"475\" y=\"64\" text-anchor=\"middle\" class=\"t\">認可 Authorization<\/text><text x=\"475\" y=\"84\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">「何ができるか」付与<\/text> <rect x=\"580\" y=\"40\" width=\"170\" height=\"56\" rx=\"10\" fill=\"#7c3aed\"/><text x=\"665\" y=\"64\" text-anchor=\"middle\" class=\"t\">記録 Accountability<\/text><text x=\"665\" y=\"84\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">ログで追跡・説明責任<\/text> <g fill=\"var(--muted)\"><polygon points=\"180,68 200,68 190,60 190,76\"/><polygon points=\"370,68 390,68 380,60 380,76\"/><polygon points=\"560,68 580,68 570,60 570,76\"/><\/g> <text x=\"380\" y=\"128\" text-anchor=\"middle\" class=\"s\">識別で「主張」し、認証で「証明」、認可で「権限」、記録で「追跡」。順序が大事。<\/text> <\/svg> <figcaption>図1：IAAA（自作）。Identification → Authentication → Authorization → Accountability。<\/figcaption> <\/figure> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 識別（ID 主張）と認証（本人証明）の違い、認可（権限付与）とアカウンタビリティ（ログによる追跡・説明責任）の違いを問う設問が多い。 <strong>記録（ログ）があるからこそ否認防止とアカウンタビリティが成立<\/strong>する。<\/div>"},{"id":"factors","n":"2","t":"認証要素（Type 1/2/3）","en":"","h":"<p>認証の「要素」は3種類。<strong class=\"k\">異なる種類を2つ以上組み合わせる<\/strong>のが多要素認証（MFA）です（同種を2つ重ねても MFA ではない）。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>分類<\/th><th>意味<\/th><th>例<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Type 1<\/strong> 知識<\/td><td>something you <strong>know<\/strong><\/td><td>パスワード・PIN・秘密の質問<\/td><\/tr> <tr><td><strong>Type 2<\/strong> 所持<\/td><td>something you <strong>have<\/strong><\/td><td>トークン・スマホ・スマートカード<\/td><\/tr> <tr><td><strong>Type 3<\/strong> 生体<\/td><td>something you <strong>are<\/strong><\/td><td>指紋・顔・虹彩<\/td><\/tr> <tr><td>補助<\/td><td>場所 / 行動<\/td><td>somewhere you are（位置）/ something you do（署名の癖）<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 「パスワード＋秘密の質問」は<strong>どちらも Type 1（知識）なので MFA ではない<\/strong>。「パスワード＋スマホのワンタイム」なら知識＋所持で MFA。<\/div>"},{"id":"biometric","n":"3","t":"バイオメトリクスの指標","en":"","h":"<p>生体認証の精度は<strong class=\"k\">2種類のエラー<\/strong>で測ります。試験では「どちらがセキュリティ上危険か」が問われます。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>指標<\/th><th>意味<\/th><th>別名<\/th><\/tr><\/thead> <tbody> <tr><td><strong>FRR<\/strong><\/td><td>本人を誤って拒否する率<\/td><td>Type I エラー（利便性の問題）<\/td><\/tr> <tr><td><strong>FAR<\/strong><\/td><td>他人を誤って受け入れる率<\/td><td>Type II エラー（<strong>セキュリティ上より危険<\/strong>）<\/td><\/tr> <tr><td><strong>CER / EER<\/strong><\/td><td>FAR と FRR が等しくなる点<\/td><td>精度の総合指標（<strong>低いほど良い<\/strong>）<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">覚え方<\/span> <strong>FAR（他人を通す）＝ Type II ＝ 危険<\/strong>。閾値を厳しくすると FAR↓だが FRR↑（本人が弾かれる）。バランス点が CER。製品比較では CER が低いほど高精度。<\/div>"},{"id":"sso","n":"4","t":"SSO と Kerberos","en":"","h":"<p><strong class=\"k\">SSO（シングルサインオン）<\/strong>は一度の認証で複数サービスを使える仕組み。利便性が上がる一方、 認証情報が漏れると影響範囲が大きい（<strong class=\"k\">single point of failure<\/strong>）ため MFA と組み合わせます。<\/p> <p>代表的な SSO 技術が <strong class=\"k\">Kerberos<\/strong>（社内 AD で広く利用）。対称鍵暗号と<strong class=\"k\">チケット<\/strong>を使い、 時刻同期に依存します。<\/p> <figure> <svg id=\"dg-d5-13\" class=\"diagram\" viewBox=\"0 0 760 200\" role=\"img\" aria-label=\"Kerberos：クライアントがKDC(AS/TGS)からTGT・サービスチケットを得てサービスにアクセスする流れ\"> <rect x=\"20\" y=\"80\" width=\"130\" height=\"50\" rx=\"10\" fill=\"#1f6feb\"/><text x=\"85\" y=\"110\" text-anchor=\"middle\" class=\"t\">クライアント<\/text> <rect x=\"315\" y=\"20\" width=\"170\" height=\"50\" rx=\"10\" fill=\"#7c3aed\"/><text x=\"400\" y=\"42\" text-anchor=\"middle\" class=\"t\">KDC（AS + TGS）<\/text><text x=\"400\" y=\"60\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">鍵配布センター<\/text> <rect x=\"610\" y=\"80\" width=\"130\" height=\"50\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"675\" y=\"110\" text-anchor=\"middle\" class=\"t\">サービス<\/text> <line x1=\"150\" y1=\"95\" x2=\"315\" y2=\"55\" stroke=\"var(--muted)\" stroke-width=\"2\"/><polygon points=\"315,55 301,55 309,64\" fill=\"var(--muted)\"/> <text x=\"200\" y=\"62\" class=\"s\">① 認証→TGT 取得<\/text> <line x1=\"315\" y1=\"60\" x2=\"160\" y2=\"100\" stroke=\"var(--muted)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/> <text x=\"190\" y=\"120\" class=\"s\">② TGT 提示→サービスチケット<\/text> <line x1=\"150\" y1=\"110\" x2=\"610\" y2=\"110\" stroke=\"var(--muted)\" stroke-width=\"2\"/><polygon points=\"610,110 596,104 596,116\" fill=\"var(--muted)\"/> <text x=\"360\" y=\"135\" text-anchor=\"middle\" class=\"s\">③ サービスチケットを提示してアクセス<\/text> <text x=\"380\" y=\"175\" text-anchor=\"middle\" class=\"s\">※ チケットは時間制限付き → 時刻同期(NTP)が必須。KDC は単一障害点になり得る。<\/text> <\/svg> <figcaption>図2：Kerberos の概略（自作）。AS＝認証サーバ、TGS＝チケット発行サーバ、TGT＝チケット発行チケット。<\/figcaption> <\/figure> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> Kerberos の特徴：<strong>対称鍵<\/strong>、<strong>チケット（TGT/サービスチケット）<\/strong>、<strong>時刻同期に依存<\/strong>（リプレイ対策のタイムスタンプ）、 <strong>KDC が単一障害点<\/strong>。これらの組み合わせがよく問われる。<\/div>"},{"id":"federation","n":"5","t":"フェデレーション（SAML / OAuth / OIDC）","en":"","h":"<p>組織をまたいで ID を共有する仕組みが<strong class=\"k\">フェデレーション<\/strong>。3つの規格の役割分担が頻出です。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>規格<\/th><th>主目的<\/th><th>要点<\/th><\/tr><\/thead> <tbody> <tr><td><strong>SAML<\/strong><\/td><td>認証（SSO）<\/td><td>XML ベース。IdP（認証側）と SP（サービス側）が「アサーション」を交換。企業の Web SSO で主流。<\/td><\/tr> <tr><td><strong>OAuth 2.0<\/strong><\/td><td>認可（委譲）<\/td><td>「このアプリに私のデータへのアクセスを許可」。アクセストークンを発行。<strong>認証用ではない<\/strong>。<\/td><\/tr> <tr><td><strong>OIDC<\/strong><\/td><td>認証<\/td><td>OAuth 2.0 の上に乗る認証層。ID トークン（JWT）を発行。現代の「ソーシャルログイン」。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>OAuth＝認可（authorization）／OIDC＝認証（authentication）<\/strong>の区別が定番のひっかけ。 SAML は XML・企業 SSO、OIDC は OAuth 上の認証で JWT、と紐づける。IdP（Identity Provider）と SP（Service Provider）の役割も。<\/div>"},{"id":"models","n":"6","t":"アクセス制御モデル","en":"Access Control Models","h":"<div class=\"tablewrap\"> <table> <thead><tr><th>モデル<\/th><th>誰が権限を決めるか<\/th><th>特徴・例<\/th><\/tr><\/thead> <tbody> <tr><td><strong>DAC<\/strong>（任意）<\/td><td>データの<strong>所有者<\/strong><\/td><td>ACL で柔軟に付与。一般的な OS。所有者裁量＝統制は緩め。<\/td><\/tr> <tr><td><strong>MAC<\/strong>（強制）<\/td><td><strong>システム<\/strong>（ラベル）<\/td><td>機密ラベルで強制。軍事・高機密。柔軟性は低いが強固。<\/td><\/tr> <tr><td><strong>RBAC<\/strong>（ロール）<\/td><td><strong>役割<\/strong>に基づき付与<\/td><td>「役職・職務」に権限を紐づけ。大規模組織で効率的。<\/td><\/tr> <tr><td><strong>ABAC<\/strong>（属性）<\/td><td><strong>属性・ポリシー<\/strong><\/td><td>ユーザ/資源/環境の属性で動的判定。きめ細かい。<\/td><\/tr> <tr><td><strong>Rule-based<\/strong><\/td><td>ルール<\/td><td>条件（例：時間帯・IP）で一律適用。FW など。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>DAC＝所有者が決める（裁量的）／MAC＝システムがラベルで強制<\/strong>が最頻出の対比。RBAC は「役割」、ABAC は「属性で動的」。 MAC は Bell-LaPadula（D3）と結びつく。<\/div>"},{"id":"lifecycle","n":"7","t":"プロビジョニングのライフサイクル","en":"","h":"<p>アカウントは<strong class=\"k\">作成 → 棚卸し（レビュー）→ 削除<\/strong>の流れで管理します。各段階の漏れが不正の温床になります。<\/p> <ul> <li><strong class=\"k\">Provisioning（払い出し）<\/strong>：入社・配属時に最小権限で付与。<\/li> <li><strong class=\"k\">Access Review（棚卸し）<\/strong>：定期的に権限を見直し、過剰な権限（<strong>privilege creep<\/strong>）を是正。<\/li> <li><strong class=\"k\">Deprovisioning（削除）<\/strong>：異動・退職で速やかに権限剥奪。<\/li> <li><strong class=\"k\">特権アクセス管理（PAM）<\/strong>：管理者権限は厳格に管理。<strong>Just-In-Time<\/strong>（必要時のみ一時付与）が有効。<\/li> <\/ul> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Provisioning / Deprovisioning<\/dt><dd>払い出し／剥奪。アカウント発行と無効化。<\/dd> <dt>Privilege Creep<\/dt><dd>権限の肥大化。異動を重ね不要な権限が溜まる状態。棚卸しで是正。<\/dd> <dt>Least Privilege / Need to Know<\/dt><dd>最小権限／知る必要。必要最小限のみ与える。<\/dd> <dt>PAM (Privileged Access Management)<\/dt><dd>特権アクセス管理。管理者権限を厳格管理。<\/dd> <dt>Just-In-Time (JIT) Access<\/dt><dd>必要なときだけ一時的に権限を付与。<\/dd> <\/dl> <\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 5 の超要点<\/h3> <ul> <li>IAAA：識別（主張）→認証（証明）→認可（権限）→記録（追跡）。<\/li> <li>要素：Type1 知識／Type2 所持／Type3 生体。<strong>異種2つで MFA<\/strong>。<\/li> <li>生体：<strong>FAR=Type II＝危険<\/strong>、CER は低いほど良い。<\/li> <li>Kerberos：対称鍵・チケット・<strong>時刻同期<\/strong>・KDC は単一障害点。<\/li> <li><strong>OAuth＝認可／OIDC＝認証／SAML＝XML企業SSO<\/strong>。DAC（所有者）vs MAC（強制ラベル）。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>NIST, <em>SP 800-63 Digital Identity Guidelines<\/em>（認証・要素・保証レベル）— <a href=\"https://pages.nist.gov/800-63-3/\" target=\"_blank\" rel=\"noopener\">pages.nist.gov<\/a><\/li> <li>MIT, <em>Kerberos<\/em>（プロトコル概要）— <a href=\"https://web.mit.edu/kerberos/\" target=\"_blank\" rel=\"noopener\">web.mit.edu/kerberos<\/a><\/li> <li>OASIS <em>SAML 2.0<\/em> / OpenID Foundation <em>OIDC<\/em> / IETF <em>RFC 6749 (OAuth 2.0)<\/em> — <a href=\"https://openid.net/connect/\" target=\"_blank\" rel=\"noopener\">openid.net<\/a><\/li> <li>NIST, <em>SP 800-162 ABAC<\/em> — <a href=\"https://csrc.nist.gov/pubs/sp/800/162/upd1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（各規格・プロトコルの一般的定義を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d6","n":6,"t":"セキュリティの評価とテスト","en":"Security Assessment and Testing","w":12,"lead":"Domain 6 は「導入した対策が本当に効いているかを確かめる」章。 脆弱性診断とペネトレーションテストの違い、SAST/DAST などのコードテスト、ログレビュー、 そして監査（SOC レポート、Type I/II）を学びます。「測定・検証して改善する」という PDCA の Check に当たります。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 6 の主要トピック（公式 Outline 6.1〜6.5 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#strategy\" style=\"--c:#1f6feb\"><div class=\"ic\">🗺️<\/div><h4>戦略<\/h4><small>評価/テスト/監査の設計<\/small><\/a> <a class=\"topic\" href=\"#vavp\" style=\"--c:#b42318\"><div class=\"ic\">🎯<\/div><h4>診断vsペンテスト<\/h4><small>列挙 vs 実証<\/small><\/a> <a class=\"topic\" href=\"#testtypes\" style=\"--c:#7c3aed\"><div class=\"ic\">🧪<\/div><h4>テスト手法<\/h4><small>SAST/DAST/box<\/small><\/a> <a class=\"topic\" href=\"#logs\" style=\"--c:#0e9f6e\"><div class=\"ic\">📑<\/div><h4>ログ・合成監視<\/h4><small>log review/synthetic<\/small><\/a> <a class=\"topic\" href=\"#processdata\" style=\"--c:#b54708\"><div class=\"ic\">📈<\/div><h4>プロセスデータ<\/h4><small>KPI/KRI/棚卸し<\/small><\/a> <a class=\"topic\" href=\"#audit\" style=\"--c:#475467\"><div class=\"ic\">🔍<\/div><h4>監査<\/h4><small>SOC 1/2/3・Type I/II<\/small><\/a> <\/div>"},{"id":"strategy","n":"1","t":"評価・テスト戦略","en":"","h":"<p>まず「何を・誰が・どの頻度で・どの独立性で」検証するかを設計します。重要なのは<strong class=\"k\">独立性（independence）<\/strong>と <strong class=\"k\">客観性（objectivity）<\/strong>です。自分の作ったものを自分だけで評価しても説得力が乏しいため、第三者性が重視されます。<\/p> <ul> <li>対象：システム・プロセス・人（教育の効果含む）。<\/li> <li>頻度：リスクに応じて（高リスク資産は高頻度）。<\/li> <li>独立性：内部監査 → 外部監査 → 第三者監査の順に独立性・信頼性が高い。<\/li> <\/ul>"},{"id":"vavp","n":"2","t":"脆弱性診断 vs ペネトレーションテスト","en":"","h":"<p>最頻出の対比です。一言でいうと<strong class=\"k\">「列挙（広く浅く）」と「実証（狭く深く）」<\/strong>の違いです。<\/p> <figure> <svg id=\"dg-d6-14\" class=\"diagram\" viewBox=\"0 0 760 190\" role=\"img\" aria-label=\"脆弱性診断は広く脆弱性を列挙、ペンテストは実際に悪用して影響を実証\"> <rect x=\"20\" y=\"30\" width=\"340\" height=\"120\" rx=\"12\" fill=\"#1f6feb\"/> <text x=\"190\" y=\"58\" text-anchor=\"middle\" class=\"t\">脆弱性診断 Vulnerability Assessment<\/text> <text x=\"190\" y=\"86\" text-anchor=\"middle\" class=\"s\" fill=\"#eaf2ff\">脆弱性を「列挙」する（広く・浅く）<\/text> <text x=\"190\" y=\"108\" text-anchor=\"middle\" class=\"s\" fill=\"#eaf2ff\">自動スキャン中心・悪用はしない<\/text> <text x=\"190\" y=\"130\" text-anchor=\"middle\" class=\"s\" fill=\"#eaf2ff\">定期的に網羅的に実施<\/text> <rect x=\"400\" y=\"30\" width=\"340\" height=\"120\" rx=\"12\" fill=\"#b42318\"/> <text x=\"570\" y=\"58\" text-anchor=\"middle\" class=\"t\">ペネトレーションテスト<\/text> <text x=\"570\" y=\"86\" text-anchor=\"middle\" class=\"s\" fill=\"#ffeae8\">実際に「悪用」して影響を実証（深く）<\/text> <text x=\"570\" y=\"108\" text-anchor=\"middle\" class=\"s\" fill=\"#ffeae8\">手動主体・事前の許可(scope)が必須<\/text> <text x=\"570\" y=\"130\" text-anchor=\"middle\" class=\"s\" fill=\"#ffeae8\">攻撃者目線で侵入可否を検証<\/text> <\/svg> <figcaption>図1：脆弱性診断とペネトレーションテストの違い（自作）。<\/figcaption> <\/figure> <p>ペンテストは知識量で分類します：<\/p> <ul> <li><strong class=\"k\">ブラックボックス<\/strong>：内部情報なし（外部攻撃者視点）。<\/li> <li><strong class=\"k\">ホワイトボックス<\/strong>：内部情報フル開示（網羅的・効率的）。<\/li> <li><strong class=\"k\">グレーボックス<\/strong>：部分的な情報あり。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> ペンテストは<strong>必ず事前承認（rules of engagement / scope）<\/strong>を得る。無許可の侵入は犯罪。 「脆弱性が存在するか」を知るだけなら診断、「本当に侵入・悪用できるか」を示すならペンテスト。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Vulnerability Assessment<\/dt><dd>脆弱性診断。脆弱性を「列挙」する（悪用しない）。<\/dd> <dt>Penetration Testing<\/dt><dd>侵入テスト。実際に悪用して影響を「実証」する。<\/dd> <dt>Rules of Engagement (RoE) / Scope<\/dt><dd>実施範囲・条件の事前合意。無許可テストは違法。<\/dd> <dt>Black / White / Gray Box<\/dt><dd>内部情報なし／全開示／部分開示でのテスト。<\/dd> <\/dl> <\/div>"},{"id":"testtypes","n":"3","t":"テスト手法（SAST / DAST 等）","en":"","h":"<div class=\"tablewrap\"> <table> <thead><tr><th>手法<\/th><th>内容<\/th><th>視点<\/th><\/tr><\/thead> <tbody> <tr><td><strong>SAST<\/strong>（静的）<\/td><td>ソースコードを実行せず解析<\/td><td>ホワイトボックス（内部）<\/td><\/tr> <tr><td><strong>DAST<\/strong>（動的）<\/td><td>稼働中のアプリを外部から検査<\/td><td>ブラックボックス（外部）<\/td><\/tr> <tr><td><strong>IAST<\/strong><\/td><td>実行時にコード内部も観測（両者の中間）<\/td><td>ハイブリッド<\/td><\/tr> <tr><td><strong>Fuzzing<\/strong><\/td><td>無効・予期せぬ入力を大量投入し異常を探す<\/td><td>動的<\/td><\/tr> <tr><td><strong>Code Review<\/strong><\/td><td>人手でソースをレビュー<\/td><td>静的<\/td><\/tr> <tr><td><strong>Misuse Case Testing<\/strong><\/td><td>悪用シナリオを想定したテスト<\/td><td>設計検証<\/td><\/tr> <\/tbody> <\/table> <\/div> <figure> <svg id=\"dg-d6-15\" class=\"diagram\" viewBox=\"0 0 760 180\" role=\"img\" aria-label=\"SASTはソースコードを実行せず内部から解析、DASTは稼働アプリを外部から検査する違い\"> <rect x=\"20\" y=\"30\" width=\"340\" height=\"118\" rx=\"12\" fill=\"#0e9f6e\"/> <text x=\"190\" y=\"58\" text-anchor=\"middle\" class=\"t\">SAST（静的・白箱）<\/text> <text x=\"190\" y=\"84\" text-anchor=\"middle\" class=\"s\">ソースコードを「読む」（実行しない）<\/text> <text x=\"190\" y=\"106\" text-anchor=\"middle\" class=\"s\">内部構造が見える・早期に発見できる<\/text> <text x=\"190\" y=\"128\" text-anchor=\"middle\" class=\"s\">開発の早い段階で実施（shift left）<\/text> <rect x=\"400\" y=\"30\" width=\"340\" height=\"118\" rx=\"12\" fill=\"#1f6feb\"/> <text x=\"570\" y=\"58\" text-anchor=\"middle\" class=\"t\">DAST（動的・黒箱）<\/text> <text x=\"570\" y=\"84\" text-anchor=\"middle\" class=\"s\">稼働中のアプリを外部から「試す」<\/text> <text x=\"570\" y=\"106\" text-anchor=\"middle\" class=\"s\">実行時の挙動・設定不備を検出<\/text> <text x=\"570\" y=\"128\" text-anchor=\"middle\" class=\"s\">テスト〜運用段階で実施<\/text> <\/svg> <figcaption>図2：SAST と DAST の違い（自作）。両者は補完関係（中間が IAST）。<\/figcaption> <\/figure> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> <strong>テストカバレッジ（test coverage）<\/strong>は「どれだけ網羅したか」。インターフェーステストは API/連携部の検証。 合成トランザクション（synthetic transaction）は擬似的な操作を流して可用性・性能を継続監視する。<\/div> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>SAST / DAST<\/dt><dd>静的／動的アプリケーションセキュリティテスト。コードを「読む」／「動かして試す」。<\/dd> <dt>Fuzzing<\/dt><dd>ファジング。異常入力を大量に与えて欠陥を発見。<\/dd> <dt>Test Coverage<\/dt><dd>テスト網羅率。どこまで検証できたか。<\/dd> <dt>Regression Testing<\/dt><dd>回帰テスト。変更で既存機能が壊れていないか確認。<\/dd> <\/dl> <\/div>"},{"id":"logs","n":"4","t":"ログレビューと合成監視","en":"","h":"<p>収集したログは見直してこそ価値があります。手作業では限界があるため <strong class=\"k\">SIEM<\/strong>（D7 で詳述）で集約・相関分析します。<\/p> <ul> <li><strong class=\"k\">ログレビュー<\/strong>：認証失敗・権限変更・異常アクセスを点検。<\/li> <li><strong class=\"k\">合成トランザクション<\/strong>：擬似的な操作を定期実行し、実ユーザーに影響が出る前に劣化を検知。<\/li> <li><strong class=\"k\">RUM（実ユーザー監視）<\/strong>：実際の利用状況を測定。<\/li> <\/ul>"},{"id":"processdata","n":"5","t":"プロセスデータの収集","en":"","h":"<p>セキュリティ運用が機能している証跡を集めます。代表例：<\/p> <ul> <li><strong class=\"k\">アカウント管理<\/strong>：棚卸し結果、孤立アカウントの有無。<\/li> <li><strong class=\"k\">バックアップ検証<\/strong>：取得だけでなく<strong>復元できること<\/strong>を確認。<\/li> <li><strong class=\"k\">教育・訓練<\/strong>：受講率、フィッシング訓練のクリック率推移。<\/li> <li><strong class=\"k\">KPI / KRI<\/strong>：KPI＝パフォーマンス指標、KRI＝リスク指標（しきい値超過の予兆把握）。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> バックアップは<strong>「復元テスト」まで行って初めて有効<\/strong>。取得済み＝復旧できる、ではない。KPI（成果）と KRI（リスク）の区別も問われる。<\/div>"},{"id":"audit","n":"6","t":"監査と SOC レポート","en":"","h":"<p>監査は独立性で分類します：<strong class=\"k\">内部監査<\/strong>（社内）／<strong class=\"k\">外部監査<\/strong>（外部機関）／ <strong class=\"k\">第三者監査<\/strong>（取引先のために第三者が実施）。サービス事業者の統制を示す代表が <strong class=\"k\">SOC レポート<\/strong>です。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>レポート<\/th><th>対象<\/th><th>用途<\/th><\/tr><\/thead> <tbody> <tr><td><strong>SOC 1<\/strong><\/td><td>財務報告に関わる統制（ICFR）<\/td><td>顧客の財務監査向け<\/td><\/tr> <tr><td><strong>SOC 2<\/strong><\/td><td>セキュリティ等の Trust Services Criteria（機密性・可用性・処理の完全性・プライバシー）<\/td><td>取引先への保証（詳細・非公開）<\/td><\/tr> <tr><td><strong>SOC 3<\/strong><\/td><td>SOC 2 の要約<\/td><td>一般公開向けの簡易版<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>Type I＝ある時点の「設計」の妥当性<\/strong>、<strong>Type II＝一定期間にわたる「運用の有効性」<\/strong>。 Type II の方が証拠力が強い。SOC 2 は詳細・限定配布、SOC 3 は公開用の要約、と区別する。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 6 の超要点<\/h3> <ul> <li>脆弱性診断＝<strong>列挙<\/strong>（悪用しない）／ペンテスト＝<strong>実証<\/strong>（事前承認必須）。<\/li> <li>SAST＝静的・白箱／DAST＝動的・黒箱。ファジングは異常入力。<\/li> <li>バックアップは<strong>復元テスト<\/strong>まで。KPI＝成果、KRI＝リスク。<\/li> <li>SOC 1＝財務、SOC 2＝詳細(限定)、SOC 3＝公開要約。<\/li> <li><strong>Type I＝設計／Type II＝運用有効性<\/strong>（II が強い）。評価は独立性が命。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>NIST, <em>SP 800-115 Technical Guide to Information Security Testing and Assessment<\/em> — <a href=\"https://csrc.nist.gov/pubs/sp/800/115/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>AICPA, <em>SOC for Service Organizations（SOC 1/2/3, Type I/II）<\/em> — <a href=\"https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-for-service-organizations\" target=\"_blank\" rel=\"noopener\">aicpa-cima.com<\/a><\/li> <li>OWASP, <em>Web Security Testing Guide<\/em> — <a href=\"https://owasp.org/www-project-web-security-testing-guide/\" target=\"_blank\" rel=\"noopener\">owasp.org<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報・一般的なテスト/監査の定義を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d7","n":7,"t":"セキュリティの運用","en":"Security Operations","w":13,"lead":"Domain 7 は日々の運用と「いざ」というときの対応を扱う、実務色の濃い章です。 インシデント対応、ログ監視（SIEM/IDS/IPS）、運用の基礎（need-to-know・SoD）、変更/構成管理、 そしてバックアップ・災害復旧（DR）まで。出題範囲が広く、用語の正確な区別が得点を分けます。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 7 の主要トピック（公式 Outline 7.1〜7.15 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#incident\" style=\"--c:#b42318\"><div class=\"ic\">🚨<\/div><h4>インシデント対応<\/h4><small>検知→封じ込め→復旧→教訓<\/small><\/a> <a class=\"topic\" href=\"#monitoring\" style=\"--c:#1f6feb\"><div class=\"ic\">📡<\/div><h4>ログ監視<\/h4><small>SIEM/IDS/IPS/SOAR<\/small><\/a> <a class=\"topic\" href=\"#foundations\" style=\"--c:#0e9f6e\"><div class=\"ic\">🧰<\/div><h4>運用基礎<\/h4><small>need-to-know/SoD/PAM<\/small><\/a> <a class=\"topic\" href=\"#change\" style=\"--c:#b54708\"><div class=\"ic\">🔧<\/div><h4>変更・構成管理<\/h4><small>change/config/patch<\/small><\/a> <a class=\"topic\" href=\"#backup\" style=\"--c:#7c3aed\"><div class=\"ic\">💾<\/div><h4>バックアップ<\/h4><small>full/incr/diff・RAID<\/small><\/a> <a class=\"topic\" href=\"#dr\" style=\"--c:#475467\"><div class=\"ic\">🏛️<\/div><h4>DR<\/h4><small>hot/warm/cold・DRテスト<\/small><\/a> <\/div>"},{"id":"incident","n":"1","t":"インシデント対応","en":"Incident Response","h":"<p>インシデント対応は決められた手順（IR プラン）に沿って行います。NIST SP 800-61 は<strong class=\"k\">4フェーズの循環<\/strong>で示します。<\/p> <figure> <svg id=\"dg-d7-16\" class=\"diagram\" viewBox=\"0 0 760 180\" role=\"img\" aria-label=\"インシデント対応4フェーズ：準備→検知と分析→封じ込め・根絶・復旧→事後活動が循環\"> <rect x=\"12\" y=\"44\" width=\"160\" height=\"56\" rx=\"10\" fill=\"#475467\"/><text x=\"92\" y=\"68\" text-anchor=\"middle\" class=\"t\">① 準備<\/text><text x=\"92\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">Preparation<\/text> <rect x=\"204\" y=\"44\" width=\"170\" height=\"56\" rx=\"10\" fill=\"#1f6feb\"/><text x=\"289\" y=\"68\" text-anchor=\"middle\" class=\"t\">② 検知と分析<\/text><text x=\"289\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">Detection &amp; Analysis<\/text> <rect x=\"406\" y=\"44\" width=\"190\" height=\"56\" rx=\"10\" fill=\"#b54708\"/><text x=\"501\" y=\"66\" text-anchor=\"middle\" class=\"t\">③ 封じ込め・根絶・復旧<\/text><text x=\"501\" y=\"84\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">Containment/Eradication/Recovery<\/text> <rect x=\"628\" y=\"44\" width=\"120\" height=\"56\" rx=\"10\" fill=\"#0e9f6e\"/><text x=\"688\" y=\"68\" text-anchor=\"middle\" class=\"t\">④ 事後活動<\/text><text x=\"688\" y=\"86\" text-anchor=\"middle\" class=\"t\" style=\"font-size:10px\">Post-Incident<\/text> <g fill=\"var(--muted)\"><polygon points=\"172,72 204,72 192,64 192,80\"/><polygon points=\"374,72 406,72 394,64 394,80\"/><polygon points=\"596,72 628,72 616,64 616,80\"/><\/g> <path d=\"M688 100 V140 H92 V100\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"2\"/><polygon points=\"92,100 86,112 98,112\" fill=\"var(--line)\"/> <text x=\"390\" y=\"162\" text-anchor=\"middle\" class=\"s\">④の「教訓（lessons learned）」を①にフィードバックして循環する<\/text> <\/svg> <figcaption>図1：インシデント対応ライフサイクル（自作）。出典：NIST SP 800-61（米国政府著作物＝パブリックドメイン）。<\/figcaption> <\/figure> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 検知後の最優先はしばしば<strong>封じ込め（containment）＝被害拡大の停止<\/strong>。根絶（eradication）は原因除去、復旧（recovery）は正常化、 最後に<strong>教訓（lessons learned）<\/strong>で再発防止。順序の入れ替えや「最初にやることは？」型の出題が多い。<\/div>"},{"id":"monitoring","n":"2","t":"ログ監視（SIEM / IDS / IPS）","en":"","h":"<ul> <li><strong class=\"k\">SIEM<\/strong>：各種ログを集約・相関分析し、アラートを上げる。運用監視の中核。<\/li> <li><strong class=\"k\">IDS（検知）/ IPS（防御）<\/strong>：IDS は検知して通知、IPS はインラインで遮断。 検知方式は<strong>シグネチャ型<\/strong>（既知パターン）と<strong>アノマリ型<\/strong>（異常検知、未知に強いが誤検知も）。<\/li> <li><strong class=\"k\">SOAR<\/strong>：対応を自動化・オーケストレーション。<\/li> <li><strong class=\"k\">UEBA<\/strong>：ユーザー/エンティティの行動分析で異常を検知。<\/li> <li><strong class=\"k\">ハニーポット<\/strong>：おとりで攻撃者を誘導・観測。<\/li> <li><strong class=\"k\">脅威インテリジェンス<\/strong>：外部の攻撃情報を取り込み防御に活かす。<\/li> <\/ul> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>SIEM<\/dt><dd>セキュリティ情報イベント管理。ログ集約・相関・アラート。<\/dd> <dt>IDS / IPS<\/dt><dd>侵入検知／防止。検知のみ／インラインで遮断。<\/dd> <dt>False Positive / Negative<\/dt><dd>誤検知（正常を異常と判定）／検知漏れ（脅威を見逃す）。<\/dd> <dt>SOAR<\/dt><dd>対応の自動化・オーケストレーション。<\/dd> <dt>Egress Monitoring<\/dt><dd>外向き通信の監視。情報持ち出し検知。<\/dd> <\/dl> <\/div>"},{"id":"foundations","n":"3","t":"運用の基礎概念","en":"","h":"<ul> <li><strong class=\"k\">Need to Know<\/strong>：業務に必要な情報だけ知らせる（最小権限と対）。<\/li> <li><strong class=\"k\">Least Privilege<\/strong>：必要最小限の権限のみ。<\/li> <li><strong class=\"k\">Separation of Duties<\/strong>：1人で重要業務を完結させない。<\/li> <li><strong class=\"k\">Job Rotation / Mandatory Vacation<\/strong>：不正の検知・抑止。<\/li> <li><strong class=\"k\">特権アクセス管理（PAM）<\/strong>：管理者権限の厳格管理。<\/li> <li><strong class=\"k\">SLA<\/strong>：サービス品質の合意（可用性等の指標）。<\/li> <\/ul>"},{"id":"change","n":"4","t":"変更管理・構成管理・パッチ","en":"","h":"<ul> <li><strong class=\"k\">変更管理（Change Management）<\/strong>：変更を申請→評価→承認→実装→検証→記録。<strong>必ず切り戻し（rollback）計画<\/strong>を持つ。<\/li> <li><strong class=\"k\">構成管理（Configuration Management）<\/strong>：標準構成（ベースライン）を定義・維持し、逸脱を検知。<\/li> <li><strong class=\"k\">パッチ・脆弱性管理<\/strong>：検証環境でテスト → 計画的に適用。緊急パッチはリスクに応じて。<\/li> <\/ul> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 変更は<strong>正式な承認<\/strong>と<strong>ロールバック計画<\/strong>が必須。無許可の「その場変更」はインシデントの主因。緊急変更も事後に正式記録する。<\/div>"},{"id":"backup","n":"5","t":"バックアップと RAID","en":"","h":"<p>バックアップ方式は<strong class=\"k\">バックアップ時間と復元時間のトレードオフ<\/strong>で理解します。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>方式<\/th><th>対象<\/th><th>バックアップ<\/th><th>復元<\/th><\/tr><\/thead> <tbody> <tr><td><strong>フル<\/strong><\/td><td>全データ<\/td><td>遅い<\/td><td>速い（1つで済む）<\/td><\/tr> <tr><td><strong>増分（Incremental）<\/strong><\/td><td>前回（フルor増分）以降の変更<\/td><td>速い<\/td><td>遅い（フル＋全増分が必要）<\/td><\/tr> <tr><td><strong>差分（Differential）<\/strong><\/td><td>前回フル以降の変更<\/td><td>中<\/td><td>速い（フル＋最新差分のみ）<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">RAID（可用性・性能）<\/span> <span class=\"pill\">RAID 0＝ストライピング(冗長なし)<\/span><span class=\"pill\">RAID 1＝ミラーリング<\/span> <span class=\"pill\">RAID 5＝分散パリティ(1台故障耐性)<\/span><span class=\"pill\">RAID 6＝二重パリティ<\/span><span class=\"pill\">RAID 10＝1+0<\/span> — RAID はバックアップの代替ではない（論理破損・削除には無力）。<\/div>"},{"id":"dr","n":"6","t":"復旧サイトと DR テスト","en":"","h":"<p>災害復旧（DR）では代替拠点を用意します。<strong class=\"k\">準備度とコストはトレードオフ<\/strong>です。<\/p> <figure> <svg id=\"dg-d7-17\" class=\"diagram\" viewBox=\"0 0 760 170\" role=\"img\" aria-label=\"復旧サイト：cold(安い・遅い)→warm→hot(高い・速い)の比較\"> <rect x=\"20\" y=\"40\" width=\"220\" height=\"76\" rx=\"12\" fill=\"#475467\"/><text x=\"130\" y=\"70\" text-anchor=\"middle\" class=\"t\">コールド Cold<\/text><text x=\"130\" y=\"92\" text-anchor=\"middle\" class=\"s\">空間のみ・安い・復旧数週間<\/text> <rect x=\"270\" y=\"40\" width=\"220\" height=\"76\" rx=\"12\" fill=\"#b54708\"/><text x=\"380\" y=\"70\" text-anchor=\"middle\" class=\"t\">ウォーム Warm<\/text><text x=\"380\" y=\"92\" text-anchor=\"middle\" class=\"s\">機器一部・中間・数時間〜日<\/text> <rect x=\"520\" y=\"40\" width=\"220\" height=\"76\" rx=\"12\" fill=\"#0e9f6e\"/><text x=\"630\" y=\"70\" text-anchor=\"middle\" class=\"t\">ホット Hot<\/text><text x=\"630\" y=\"92\" text-anchor=\"middle\" class=\"s\">即稼働・高い・数分<\/text> <line x1=\"20\" y1=\"138\" x2=\"740\" y2=\"138\" stroke=\"var(--muted)\" stroke-width=\"2\"/><polygon points=\"742,138 728,131 728,145\" fill=\"var(--muted)\"/> <text x=\"40\" y=\"160\" class=\"t\" fill=\"var(--muted)\" style=\"font-size:11px\">コスト安・復旧遅い<\/text> <text x=\"660\" y=\"160\" class=\"t\" fill=\"var(--muted)\" style=\"font-size:11px\">コスト高・復旧速い<\/text> <\/svg> <figcaption>図2：復旧サイトの比較（自作）。ほかにモバイルサイト・クラウドDR・相互援助協定もある。<\/figcaption> <\/figure> <p><strong class=\"k\">DR テスト<\/strong>は影響の小さい順に段階的に行います（左ほど低負荷・低リスク）：<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>テスト<\/th><th>内容<\/th><\/tr><\/thead> <tbody> <tr><td><strong>Read-through / Checklist<\/strong><\/td><td>計画書を読み合わせ・チェック（最も軽い）<\/td><\/tr> <tr><td><strong>Walk-through / Tabletop<\/strong><\/td><td>関係者が机上でシナリオを討議<\/td><\/tr> <tr><td><strong>Simulation<\/strong><\/td><td>模擬災害でロールプレイ<\/td><\/tr> <tr><td><strong>Parallel<\/strong><\/td><td>代替サイトを実際に稼働（本番は止めない）<\/td><\/tr> <tr><td><strong>Full Interruption<\/strong><\/td><td>本番を止めて切替（最も厳格・高リスク）<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> DR テストは「軽い→重い」の順序が頻出：<strong>read-through → walk-through → simulation → parallel → full interruption<\/strong>。 full interruption は最も現実的だが業務停止リスクが高く、慎重に行う。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 7 の超要点<\/h3> <ul> <li>IR：準備→検知分析→<strong>封じ込め<\/strong>/根絶/復旧→<strong>教訓<\/strong>（循環）。検知直後は封じ込め優先。<\/li> <li>IDS＝検知／IPS＝遮断。誤検知=FP、見逃し=FN。SIEM が集約の中核。<\/li> <li>変更は<strong>承認＋ロールバック計画<\/strong>。構成管理はベースライン維持。<\/li> <li>差分＝復元速い（フル＋最新1）／増分＝バックアップ速い。RAID は冗長化でバックアップ代替不可。<\/li> <li>復旧サイト hot/warm/cold（速さ↔コスト）。DR テストは軽い→<strong>full interruption<\/strong> へ段階的。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>NIST, <em>SP 800-61 Computer Security Incident Handling Guide<\/em>（IR 4フェーズ）— <a href=\"https://csrc.nist.gov/pubs/sp/800/61/r2/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-34 Rev.1 Contingency Planning<\/em>（復旧サイト・DRテスト）— <a href=\"https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-128 Configuration Management<\/em> — <a href=\"https://csrc.nist.gov/pubs/sp/800/128/upd1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報の構造を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。 ※NIST SP 800-61 は Rev.3（2025）で CSF 連動の枠組みに更新されたが、本書では CISSP で定着した4フェーズモデルを用いた。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]},{"id":"d8","n":8,"t":"ソフトウェア開発セキュリティ","en":"Software Development Security","w":10,"lead":"Domain 8 は「安全なソフトウェアをどう作り、どう調達するか」。 SDLC にセキュリティを組み込む（シフトレフト / DevSecOps）考え方を軸に、開発手法、成熟度モデル、 OWASP Top 10 などの代表的脆弱性、セキュアコーディング、そして取得ソフト・クラウドのリスクを学びます。","secs":[{"id":"overview","n":"0","t":"ドメイン全体像","en":"","h":"<p>Domain 8 の主要トピック（公式 Outline 8.1〜8.5 に対応）。タップで該当節へ。<\/p> <div class=\"info-grid\"> <a class=\"topic\" href=\"#sdlc\" style=\"--c:#1f6feb\"><div class=\"ic\">🔁<\/div><h4>SDLC<\/h4><small>開発工程に組込む<\/small><\/a> <a class=\"topic\" href=\"#methods\" style=\"--c:#0e9f6e\"><div class=\"ic\">🛠️<\/div><h4>開発手法<\/h4><small>Waterfall/Agile/DevSecOps<\/small><\/a> <a class=\"topic\" href=\"#maturity\" style=\"--c:#475467\"><div class=\"ic\">📶<\/div><h4>成熟度<\/h4><small>CMMI/SAMM<\/small><\/a> <a class=\"topic\" href=\"#owasp\" style=\"--c:#b42318\"><div class=\"ic\">🐛<\/div><h4>OWASP Top 10<\/h4><small>SQLi/XSS等<\/small><\/a> <a class=\"topic\" href=\"#coding\" style=\"--c:#7c3aed\"><div class=\"ic\">⌨️<\/div><h4>セキュアコーディング<\/h4><small>入力検証/CI-CD<\/small><\/a> <a class=\"topic\" href=\"#acquired\" style=\"--c:#b54708\"><div class=\"ic\">📦<\/div><h4>取得ソフト<\/h4><small>OSS/SaaS/PaaS/IaaS<\/small><\/a> <\/div>"},{"id":"sdlc","n":"1","t":"SDLC とセキュリティの統合","en":"","h":"<p><strong class=\"k\">SDLC（ソフトウェア開発ライフサイクル）<\/strong>の各工程にセキュリティを組み込みます。 重要な原則は<strong class=\"k\">シフトレフト<\/strong>＝「早い段階（左側）で対策するほど安く・効果的」。要件・設計段階での欠陥は後ほど直すほど高コストになります。<\/p> <figure> <svg id=\"dg-d8-18\" class=\"diagram\" viewBox=\"0 0 760 160\" role=\"img\" aria-label=\"SDLC：要件→設計→実装→テスト→デプロイ→運用保守。各工程でセキュリティ活動を実施\"> <g> <rect x=\"8\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#1f6feb\"/><text x=\"66\" y=\"70\" text-anchor=\"middle\" class=\"t\">要件<\/text> <rect x=\"134\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#2a7de1\"/><text x=\"192\" y=\"70\" text-anchor=\"middle\" class=\"t\">設計<\/text> <rect x=\"260\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#0e9f6e\"/><text x=\"318\" y=\"70\" text-anchor=\"middle\" class=\"t\">実装<\/text> <rect x=\"386\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#19a772\"/><text x=\"444\" y=\"70\" text-anchor=\"middle\" class=\"t\">テスト<\/text> <rect x=\"512\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#b54708\"/><text x=\"570\" y=\"70\" text-anchor=\"middle\" class=\"t\">デプロイ<\/text> <rect x=\"638\" y=\"40\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#7c3aed\"/><text x=\"696\" y=\"70\" text-anchor=\"middle\" class=\"t\">運用・保守<\/text> <\/g> <g fill=\"var(--muted)\"><polygon points=\"124,65 134,65 129,59 129,71\"/><polygon points=\"250,65 260,65 255,59 255,71\"/><polygon points=\"376,65 386,65 381,59 381,71\"/><polygon points=\"502,65 512,65 507,59 507,71\"/><polygon points=\"628,65 638,65 633,59 633,71\"/><\/g> <text x=\"66\" y=\"115\" text-anchor=\"middle\" class=\"s\">脅威モデリング<\/text> <text x=\"192\" y=\"115\" text-anchor=\"middle\" class=\"s\">セキュア設計<\/text> <text x=\"318\" y=\"115\" text-anchor=\"middle\" class=\"s\">セキュアコーディング<\/text> <text x=\"444\" y=\"115\" text-anchor=\"middle\" class=\"s\">SAST/DAST<\/text> <text x=\"570\" y=\"115\" text-anchor=\"middle\" class=\"s\">設定堅牢化<\/text> <text x=\"696\" y=\"115\" text-anchor=\"middle\" class=\"s\">監視・パッチ<\/text> <text x=\"380\" y=\"142\" text-anchor=\"middle\" class=\"s\" style=\"font-size:11px\">← シフトレフト：早い工程ほど低コストで欠陥を防げる<\/text> <\/svg> <figcaption>図1：SDLC とセキュリティ活動（自作）。工程名は手法により異なるが、各段階に対策を組み込む点は共通。<\/figcaption> <\/figure> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> 「欠陥の修正コストは工程が進むほど増大する」＝<strong>要件・設計段階での作り込みが最重要<\/strong>。 テストやリリース後に見つかるバグは高コスト。これが<strong>シフトレフト<\/strong>と<strong>脅威モデリングを早期に<\/strong>行う根拠。<\/div>"},{"id":"methods","n":"2","t":"開発手法と DevSecOps","en":"","h":"<div class=\"tablewrap\"> <table> <thead><tr><th>手法<\/th><th>特徴<\/th><\/tr><\/thead> <tbody> <tr><td><strong>ウォーターフォール<\/strong><\/td><td>工程を順に進める。前工程に戻りにくい。要件が固定的な案件向き。<\/td><\/tr> <tr><td><strong>アジャイル<\/strong><\/td><td>短い反復（スプリント）で漸進的に開発。変化に強い。<\/td><\/tr> <tr><td><strong>DevOps<\/strong><\/td><td>開発と運用を統合し、CI/CD で頻繁にリリース。<\/td><\/tr> <tr><td><strong>DevSecOps<\/strong><\/td><td>DevOps に<strong>セキュリティを全工程へ組込む<\/strong>（自動テスト・自動化）。<\/td><\/tr> <\/tbody> <\/table> <\/div> <figure> <svg id=\"dg-d8-19\" class=\"diagram\" viewBox=\"0 0 760 190\" role=\"img\" aria-label=\"ウォーターフォールは一方向、アジャイルは短い反復、DevSecOpsは反復に自動セキュリティを組込む\"> <!-- waterfall --> <text x=\"120\" y=\"24\" text-anchor=\"middle\" class=\"s\" style=\"font-weight:800\">ウォーターフォール<\/text> <rect x=\"40\" y=\"36\" width=\"60\" height=\"22\" rx=\"5\" fill=\"#475467\"/><text x=\"70\" y=\"51\" text-anchor=\"middle\" class=\"lp\">要件<\/text> <rect x=\"100\" y=\"58\" width=\"60\" height=\"22\" rx=\"5\" fill=\"#475467\"/><text x=\"130\" y=\"73\" text-anchor=\"middle\" class=\"lp\">設計<\/text> <rect x=\"160\" y=\"80\" width=\"60\" height=\"22\" rx=\"5\" fill=\"#475467\"/><text x=\"190\" y=\"95\" text-anchor=\"middle\" class=\"lp\">実装→<\/text> <text x=\"120\" y=\"120\" text-anchor=\"middle\" class=\"s\" style=\"font-size:10px\">順に下る・戻りにくい<\/text> <!-- agile --> <text x=\"400\" y=\"24\" text-anchor=\"middle\" class=\"s\" style=\"font-weight:800\">アジャイル<\/text> <circle cx=\"360\" cy=\"70\" r=\"26\" fill=\"none\" stroke=\"#0e9f6e\" stroke-width=\"6\"/><polygon points=\"360,44 352,52 368,52\" fill=\"#0e9f6e\"/> <circle cx=\"430\" cy=\"70\" r=\"26\" fill=\"none\" stroke=\"#0e9f6e\" stroke-width=\"6\"/><polygon points=\"430,44 422,52 438,52\" fill=\"#0e9f6e\"/> <text x=\"400\" y=\"120\" text-anchor=\"middle\" class=\"s\" style=\"font-size:10px\">短い反復（スプリント）<\/text> <!-- devsecops --> <text x=\"640\" y=\"24\" text-anchor=\"middle\" class=\"s\" style=\"font-weight:800\">DevSecOps<\/text> <path d=\"M600 70 a40 25 0 1 0 80 0 a40 25 0 1 0 -80 0\" fill=\"none\" stroke=\"#1f6feb\" stroke-width=\"6\"/> <text x=\"640\" y=\"74\" text-anchor=\"middle\" class=\"s\" style=\"font-size:10px; fill:#1f6feb\">🔒自動<\/text> <text x=\"640\" y=\"120\" text-anchor=\"middle\" class=\"s\" style=\"font-size:10px\">反復＋セキュリティ自動化<\/text> <text x=\"380\" y=\"160\" text-anchor=\"middle\" class=\"s\">要件が固定なら左、変化に強くしたいほど右へ。右ほどセキュリティを自動で組込む。<\/text> <\/svg> <figcaption>図2：開発手法の比較（自作）。<\/figcaption> <\/figure> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> DevSecOps は「セキュリティは全員の責任（everyone's responsibility）」「自動化でゲートを設ける」がキーワード。 速いリリースサイクルでも品質・安全性を担保する。<\/div>"},{"id":"maturity","n":"3","t":"成熟度モデル（CMMI）","en":"","h":"<p>開発プロセスの成熟度を測るのが <strong class=\"k\">CMMI<\/strong>。5段階で、上に行くほどプロセスが定義・測定・最適化されています。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>レベル<\/th><th>名称<\/th><th>状態<\/th><\/tr><\/thead> <tbody> <tr><td>1<\/td><td>Initial（初期）<\/td><td>場当たり的・属人的<\/td><\/tr> <tr><td>2<\/td><td>Managed（管理された）<\/td><td>プロジェクト単位で管理<\/td><\/tr> <tr><td>3<\/td><td>Defined（定義された）<\/td><td>標準プロセスが組織で定義<\/td><\/tr> <tr><td>4<\/td><td>Quantitatively Managed（定量管理）<\/td><td>定量的に測定・管理<\/td><\/tr> <tr><td>5<\/td><td>Optimizing（最適化）<\/td><td>継続的にプロセス改善<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout tip\"><span class=\"lab\">補足<\/span> ソフトウェアセキュリティに特化した成熟度モデルとして <strong>OWASP SAMM<\/strong> や <strong>BSIMM<\/strong> もある。<\/div>"},{"id":"owasp","n":"4","t":"代表的脆弱性（OWASP Top 10）","en":"","h":"<p><strong class=\"k\">OWASP Top 10<\/strong> は Web アプリの重大リスク上位10件をまとめたもの（最新は <strong>2021 年版<\/strong>）。代表的な脆弱性を押さえます。<\/p> <div class=\"tablewrap\"> <table> <thead><tr><th>カテゴリ（2021）<\/th><th>概要<\/th><\/tr><\/thead> <tbody> <tr><td>A01 アクセス制御の不備<\/td><td>権限チェック漏れ。最も多い。<\/td><\/tr> <tr><td>A02 暗号化の不備<\/td><td>機微データの保護不足（旧 Sensitive Data Exposure）。<\/td><\/tr> <tr><td>A03 インジェクション<\/td><td>SQLi / XSS など。入力を信頼して実行してしまう。<\/td><\/tr> <tr><td>A04 安全でない設計<\/td><td>設計レベルの欠陥（脅威モデリング不足）。<\/td><\/tr> <tr><td>A05 セキュリティ設定ミス<\/td><td>既定設定・不要機能の放置。<\/td><\/tr> <tr><td>A06 脆弱で古いコンポーネント<\/td><td>未更新の OSS/ライブラリ（→ SBOM）。<\/td><\/tr> <tr><td>A08 ソフトウェア/データ完全性の不備<\/td><td>署名なし更新・改ざんされた依存。<\/td><\/tr> <tr><td>A10 SSRF<\/td><td>サーバを踏み台に内部へリクエスト。<\/td><\/tr> <\/tbody> <\/table> <\/div> <div class=\"callout exam\"><span class=\"lab\">試験での狙われ方<\/span> <strong>インジェクション（SQLi/XSS）の対策＝入力検証・パラメータ化クエリ・出力エンコード<\/strong>。 「ユーザー入力を信頼しない（never trust user input）」が大原則。2021 版で1位は<strong>アクセス制御の不備<\/strong>になった点も問われ得る。<\/div>"},{"id":"coding","n":"5","t":"セキュアコーディングと CI/CD","en":"","h":"<ul> <li><strong class=\"k\">入力検証（input validation）<\/strong>：許可リスト方式（allowlist）でサーバ側でも必ず検証。<\/li> <li><strong class=\"k\">出力エンコード<\/strong>：表示時にエスケープして XSS を防ぐ。<\/li> <li><strong class=\"k\">パラメータ化クエリ<\/strong>：SQLi 対策。コードとデータを分離。<\/li> <li><strong class=\"k\">秘密情報の管理<\/strong>：ソースに鍵を埋め込まない（secrets management）。<\/li> <li><strong class=\"k\">CI/CD パイプラインのセキュリティ<\/strong>：SAST/DAST/依存スキャンを自動ゲート化。SCM（バージョン管理）のアクセス制御。<\/li> <\/ul> <div class=\"callout vocab\"><span class=\"lab\">🔤 重要英単語<\/span> <dl> <dt>Input Validation<\/dt><dd>入力検証。allowlist でサーバ側検証が原則。<\/dd> <dt>Output Encoding<\/dt><dd>出力エンコード。XSS 対策のエスケープ。<\/dd> <dt>Parameterized Query<\/dt><dd>パラメータ化クエリ。SQLi 対策。<\/dd> <dt>CI/CD Pipeline<\/dt><dd>継続的統合・デリバリ。自動ビルド・テスト・配信。<\/dd> <dt>SBOM<\/dt><dd>ソフトウェア部品表。依存の脆弱性追跡（A06 対策）。<\/dd> <\/dl> <\/div>"},{"id":"acquired","n":"6","t":"取得ソフト・クラウドのリスク","en":"","h":"<p>自社開発だけでなく、購入・OSS・委託・クラウドの<strong class=\"k\">調達ソフトのセキュリティ<\/strong>も評価対象です。<\/p> <ul> <li><strong class=\"k\">商用 / OSS / 第三者製<\/strong>：ライセンス・サポート・脆弱性対応・<strong>SBOM<\/strong> を確認。<\/li> <li><strong class=\"k\">マネージドサービス（SaaS/PaaS/IaaS）<\/strong>：責任共有モデルで分界点が変わる（D3 参照）。<\/li> <li><strong class=\"k\">API セキュリティ<\/strong>：認証・認可・レート制限・入力検証。<\/li> <\/ul> <div class=\"callout tip\"><span class=\"lab\">補足（DB の基礎）<\/span> データベースのトランザクションは <strong>ACID<\/strong>（Atomicity 原子性 / Consistency 一貫性 / Isolation 独立性 / Durability 永続性）を満たすべき、という概念も出題範囲。<\/div>"},{"id":"summary","n":"","t":"まとめ・出典","en":"","h":"<div class=\"card\"> <h3 style=\"margin-top:0\">Domain 8 の超要点<\/h3> <ul> <li>SDLC 全工程に組込み、<strong>シフトレフト<\/strong>（早期対策ほど低コスト）。<\/li> <li>ウォーターフォール（固定要件）／アジャイル（反復）／<strong>DevSecOps<\/strong>（自動でセキュリティ）。<\/li> <li>CMMI は1初期→5最適化。SAMM/BSIMM はセキュリティ特化。<\/li> <li>OWASP Top 10（2021）1位は<strong>アクセス制御の不備<\/strong>。SQLi/XSS は<strong>入力を信頼しない<\/strong>で対策。<\/li> <li>調達ソフトは <strong>SBOM<\/strong> で依存を追跡。DB は <strong>ACID<\/strong>。<\/li> <\/ul> <\/div> <footer> <h2>出典 / References<\/h2> <ul> <li>ISC2, <em>CISSP Certification Exam Outline<\/em>（Effective April 15, 2024）— <a href=\"https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline\" target=\"_blank\" rel=\"noopener\">isc2.org<\/a><\/li> <li>OWASP, <em>Top 10:2021<\/em> — <a href=\"https://owasp.org/Top10/2021/\" target=\"_blank\" rel=\"noopener\">owasp.org/Top10<\/a><\/li> <li>OWASP, <em>SAMM<\/em> / <em>Web Security Testing Guide<\/em> — <a href=\"https://owaspsamm.org/\" target=\"_blank\" rel=\"noopener\">owaspsamm.org<\/a><\/li> <li>NIST, <em>SP 800-218 Secure Software Development Framework (SSDF)<\/em> — <a href=\"https://csrc.nist.gov/pubs/sp/800/218/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <li>NIST, <em>SP 800-161 Supply Chain Risk Management<\/em>（SBOM 文脈）— <a href=\"https://csrc.nist.gov/pubs/sp/800/161/r1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov<\/a><\/li> <\/ul> <p>図はすべて本資料のための自作（上記一次情報・一般的な開発/脆弱性の定義を参考）。NIST 刊行物は米国政府著作物＝パブリックドメイン。 OWASP は CC ライセンスの公開プロジェクト。最新の OWASP Top 10 は 2021 年版。<\/p> <p class=\"lead\">※学習用の二次資料です。正確な出題範囲は ISC2 公式 Exam Outline で確認してください。<\/p> <a class=\"backtop\" href=\"#overview\">↑ 全体像へ戻る<\/a> <\/footer>"}]}],"questions":[{"d":"d1","s":"ethics","l":1,"q":"ISC2 Code of Ethics の4カノンで「最も優先される（first canon）」のはどれか。","o":["依頼者（principals）に勤勉なサービスを提供する","職業を発展させ、守る","社会・公共の利益・公共の信頼・インフラを守る","名誉・誠実・公正・責任・合法に行動する"],"a":2,"e":"カノンは記載順＝優先順位で、第1カノンは「Protect society…（社会を守る）」。 順番は 社会 → 名誉ある行動 → 依頼者 → 職業。衝突時は上位を優先する。","src":"base","i":"q0001"},{"d":"d1","s":"ethics","l":1,"q":"あるCISSP保持者が、顧客に頼まれて脆弱性の事実を公的機関への報告から隠そうとしている。社会に重大な被害が及ぶ可能性が高い。最も適切な行動は？","o":["顧客は依頼者なので、その意向（カノン3）を最優先して隠す","社会の安全（カノン1）が上位のため、隠蔽に加担せず適切に対処する","判断できないので何もしない","職業の評判（カノン4）が下がるので公表だけはしない"],"a":1,"e":"依頼者への義務（カノン3）より、社会・公共を守る義務（カノン1）が上位。 倫理問題は「より上位のカノン」「より公共的な選択」を選ぶのが定石。","src":"base","i":"q0002"},{"d":"d1","s":"concepts","l":1,"q":"電子署名（digital signature）が「送信者が後で送信を否定できない」性質を提供する。これは主にどの特性を支えるか。","o":["可用性（Availability）","否認防止（Nonrepudiation）","機密性（Confidentiality）","冗長性（Redundancy）"],"a":1,"e":"署名は「本人が確かに署名した」ことを証明し、後からの否認を防ぐ＝否認防止。 同時に真正性・完全性も支えるが、「否定できない」という記述のキーワードは Nonrepudiation。","src":"base","i":"q0003"},{"d":"d1","s":"concepts","l":1,"q":"ランサムウェアでファイルが暗号化され業務が停止した。最も直接的に侵害された特性は？","o":["機密性 — 内容を読み取られた","真正性 — 送信元が偽装された","否認防止 — 実行の否認を許した","可用性 — データが使えない"],"a":3,"e":"データにアクセスできず業務停止＝可用性の侵害が最も直接的。 （情報を窃取・暴露する二重恐喝型なら機密性も侵害されるが、設問は「業務停止」に焦点）。","src":"base","i":"q0004"},{"d":"d1","s":"governance","l":1,"q":"「リスクを調査・特定し、継続的に評価・把握する」活動を最もよく表すのは？","o":["Due Diligence（相当の勤勉さ）","Due Care（相当の注意）","Separation of Duties","Least Privilege"],"a":0,"e":"「調べる・継続的に把握」が Due Diligence。実際に対策を「実行」するのが Due Care。 CISSP頻出の対比なので必ず区別する。","src":"base","i":"q0005"},{"d":"d1","s":"governance","l":1,"q":"ISMS の「認証（certification）」を取得する際に、組織が満たすべき要求事項を定めた規格は？","o":["ISO/IEC 27002","PCI DSS","ISO/IEC 27001","COBIT"],"a":2,"e":"27001＝ISMS の要求事項（認証規格）。27002 は管理策の実装ガイド（認証対象ではない）。 COBIT は IT ガバナンス、PCI DSS はカード業界の契約上の標準。","src":"base","i":"q0006"},{"d":"d1","s":"governance","l":1,"q":"データの分類と保護方針を決める最終的な責任を負うのは誰か（CISSPの考え方）。","o":["Data Custodian（保守担当）","Data Owner（事業部門の管理職）","エンドユーザー","外部監査人"],"a":1,"e":"分類・保護の責任は Data Owner。実際の保守・バックアップ運用は Custodian が担うが、 責任（accountability）はオーナー／経営層にあり委任できない。","src":"base","i":"q0007"},{"d":"d1","s":"compliance","l":1,"q":"GDPR において「個人データを処理する目的と手段を決定する主体」を指す用語は？","o":["Data Subject","Data Processor","Data Controller","Data Custodian"],"a":2,"e":"目的・手段を決めるのが Controller、委託されて実処理するのが Processor、本人が Data Subject。","src":"base","i":"q0008"},{"d":"d1","s":"compliance","l":1,"q":"登録なしに保護され、「秘密として管理していること」自体が保護の要件となる知的財産は？","o":["営業秘密（Trade Secret）","特許（Patent）","商標（Trademark）","著作権（Copyright）"],"a":0,"e":"営業秘密は登録不要だが、秘密として管理されている限り保護される（公開すると保護を失う）。 特許は公開と引き換えに独占権、著作権は表現、商標は識別標識を保護。","src":"base","i":"q0009"},{"d":"d1","s":"investigation","l":1,"q":"刑事事件で要求される、最も厳格な立証基準はどれか。","o":["Preponderance of the evidence（証拠の優越）","Beyond a reasonable doubt（合理的疑いを超える）","More likely than not","Due diligence standard"],"a":1,"e":"刑事は最も厳格な「合理的疑いを超える」。民事は「証拠の優越」、行政は比較的緩い基準。","src":"base","i":"q0010"},{"d":"d1","s":"investigation","l":1,"q":"デジタル証拠を法廷で採用可能にするうえで、取得から提出まで「誰がいつどう扱ったか」を途切れなく記録することを何というか。","o":["Due care","Hashing","Separation of duties","Chain of custody（証拠保全の連鎖）"],"a":3,"e":"Chain of custody。途切れると証拠能力が否定され得る。ハッシュは完全性の証明に使う補助手段。","src":"base","i":"q0011"},{"d":"d1","s":"docs","l":1,"q":"次のうち「強制ではなく推奨（任意）」の位置づけの文書はどれか。","o":["ポリシー（Policy）","標準（Standard）","ガイドライン（Guideline）","手順（Procedure）"],"a":2,"e":"ガイドラインのみ推奨（任意）。ポリシー・標準・ベースライン・手順は必須（mandatory）。","src":"base","i":"q0012"},{"d":"d1","s":"docs","l":1,"q":"「全社の方向性と経営の意思を示す最上位の文書」はどれか。","o":["ポリシー（Policy）","ベースライン（Baseline）","手順（Procedure）","ガイドライン（Guideline）"],"a":0,"e":"ポリシーが最上位で抽象的・安定的。下位ほど具体的になる。","src":"base","i":"q0013"},{"d":"d1","s":"bcp","l":1,"q":"「許容できるデータ損失の最大量（どの時点まで遡れればよいか）」を表す指標は？","o":["RTO","RPO","MTD","MTBF"],"a":1,"e":"RPO＝許容データ損失量（時間で表す）。RTO は「いつまでに復旧するか」の目標時間で別物。","src":"base","i":"q0014"},{"d":"d1","s":"bcp","l":1,"q":"事業継続計画の最初のステップとして、重要業務とその停止による影響・優先順位を特定する分析は？","o":["ペネトレーションテスト","リスク受容（Risk acceptance）","BIA（事業影響度分析）","SOC 2 監査"],"a":2,"e":"BIA で重要業務・依存関係・許容停止時間（MTD等）を特定し、これが RTO/RPO 設定の根拠になる。","src":"base","i":"q0015"},{"d":"d1","s":"personnel","l":1,"q":"1人で重要業務を完結できないよう、権限・作業を複数人に分割する管理策はどれか。","o":["Least Privilege（最小権限）","Separation of Duties（職務分掌）","Job Rotation（職務ローテーション）","Mandatory Vacation（強制休暇）"],"a":1,"e":"職務分掌は1人での不正完結を防ぐ。最小権限は「必要最小限の権限のみ付与」で別概念。 強制休暇・ローテーションは不正の「検知」に寄与。","src":"base","i":"q0016"},{"d":"d1","s":"personnel","l":1,"q":"退職者（特に非自発的退職）に対するセキュリティ上、最も優先すべき初動は？","o":["退職面談のアンケートを実施する","後任の採用を始める","パフォーマンス評価を完了する","アクセス権を速やかに無効化する"],"a":3,"e":"報復リスクを抑えるため、アクセス無効化と資産回収を最優先（理想は通知と同時）。","src":"base","i":"q0017"},{"d":"d1","s":"risk","l":1,"q":"資産価値500万円、暴露係数（EF）0.6、年間発生率（ARO）0.2 のとき、ALE はいくらか。","o":["30万円","60万円","100万円","300万円"],"a":1,"e":"SLE＝AV×EF＝500万×0.6＝300万。ALE＝SLE×ARO＝300万×0.2＝60万円。","src":"base","i":"q0018"},{"d":"d1","s":"risk","l":1,"q":"利用可能なすべての対策を講じた後にも残るリスクを何と呼ぶか。また最終的に誰が「受容」を判断するか。","o":["固有リスク ／ 内部監査人","移転リスク ／ 保険会社","残留リスク ／ 上級経営層","総リスク ／ エンドユーザー"],"a":2,"e":"対策後に残るのが残留リスク。受容（accept）の最終判断・承認は経営層の責任。","src":"base","i":"q0019"},{"d":"d1","s":"risk","l":1,"q":"本来の管理策が実装できない場合に、代わりに導入する管理策の分類はどれか。","o":["代替的（Compensating）","抑止的（Deterrent）","是正的（Corrective）","検知的（Detective）"],"a":0,"e":"Compensating control は、主たる管理策が使えないときの代替。是正は被害後に状態を直す、検知は発見、抑止は思いとどまらせる。","src":"base","i":"q0020"},{"d":"d1","s":"threatmodel","l":1,"q":"STRIDE の \"T\" が表す脅威と、対応して損なわれる特性の組み合わせとして正しいのは？","o":["なりすまし（Spoofing）— 可用性","改ざん（Tampering）— 完全性","情報漏えい（Info Disclosure）— 完全性","権限昇格（Elevation of Privilege）— 可用性"],"a":1,"e":"T＝Tampering（改ざん）で完全性を損なう。Spoofing↔真正性、Info Disclosure↔機密性、 DoS↔可用性、Elevation of Privilege↔認可、Repudiation↔否認防止。","src":"base","i":"q0021"},{"d":"d1","s":"threatmodel","l":1,"q":"7段階から成る「攻撃者視点・リスク中心」の脅威モデリング手法はどれか。","o":["STRIDE","DREAD","Attack Tree のみ","PASTA"],"a":3,"e":"PASTA は7段階のリスク中心手法。STRIDE は脅威分類、DREAD は深刻度評点。","src":"base","i":"q0022"},{"d":"d1","s":"scrm","l":1,"q":"ソフトウェアに含まれる構成要素・依存関係を一覧化し、脆弱性管理を支える成果物はどれか。","o":["RACI チャート","RTO 表","SBOM","DRP"],"a":2,"e":"SBOM は OSS を含む部品表で、脆弱性（例：Log4j のような）追跡に有効。サプライチェーン透明性の中核。","src":"base","i":"q0023"},{"d":"d1","s":"scrm","l":1,"q":"重要なベンダーと契約する際、CISSP の観点で最初に確立すべきものとして最も適切なのは？","o":["ベンダーの財務健全性と株価の推移を確認する","最低限のセキュリティ要件と監査権を契約で定める","運用を円滑にするため広範な権限を付与する","導入後の監視項目を運用開始後に取り決める"],"a":1,"e":"契約段階でセキュリティ要件・SLA・right to audit を定め、継続的に監視するのが定石。","src":"base","i":"q0024"},{"d":"d1","s":"awareness","l":1,"q":"全従業員に「フィッシングに注意する」という行動変容・注意喚起を狙う取り組みの段階はどれか。","o":["Awareness（意識向上）","Training（訓練）","Education（教育）","Certification（認定）"],"a":0,"e":"Awareness は注意喚起・行動変容（What）。スキル習得は Training（How）、体系理解は Education（Why）。","src":"base","i":"q0025"},{"d":"d1","s":"awareness","l":1,"q":"セキュリティ教育プログラムについて、運用上の正しい記述はどれか。","o":["一度作れば内容の見直しは不要","全員に同一内容で十分、役割別は不要","定期的に内容を見直し、有効性を測定する","効果測定は無意味なので行わない"],"a":2,"e":"脅威環境の変化に合わせて定期見直しし、効果（クリック率等）を測る。役割別が望ましい。","src":"base","i":"q0026"},{"d":"d2","s":"classify","l":1,"q":"データの分類レベルを決定する責任を負うのは誰か。","o":["データカストディアン（保守担当）","データオーナー（業務部門の責任者）","エンドユーザー","外部監査人"],"a":1,"e":"分類はデータオーナーの責任。実際の保護運用はカストディアンが担う。","src":"base","i":"q0027"},{"d":"d2","s":"classify","l":1,"q":"民間企業の分類で「最も機密性が高い」区分として一般的なのは？","o":["Public（公開）","Sensitive（要注意）","Confidential（機密）","Unclassified（非区分）"],"a":2,"e":"民間では Confidential/Proprietary が最高位。Unclassified/Top Secret は政府区分。","src":"base","i":"q0028"},{"d":"d2","s":"roles","l":1,"q":"データのバックアップ取得やパッチ適用など、日々の保護運用を担うロールは？","o":["Data Custodian","Data Owner","Data Subject","Data Controller"],"a":0,"e":"実運用＝Custodian。方針決定・責任＝Owner。","src":"base","i":"q0029"},{"d":"d2","s":"lifecycle","l":1,"q":"「業務に必要なデータだけを収集・保持する」考え方を何というか。","o":["データ冗長化","データ分類","データ最小化","データ残存"],"a":2,"e":"最小化はプライバシー保護の基本。持たないデータは漏えいしない。","src":"base","i":"q0030"},{"d":"d2","s":"lifecycle","l":1,"q":"保持期間を過ぎた個人データを削除せず大量に保持し続けることのリスクとして最も適切なのは？","o":["検索性が下がり、可用性が損なわれる","漏えい時の被害と法令違反のリスクが増える","保管しているだけなのでリスクはない","履歴が揃うため完全性が高まる"],"a":1,"e":"過剰保持は攻撃対象面と法的責任を増やす。保持方針に沿って破棄する。","src":"base","i":"q0031"},{"d":"d2","s":"states","l":1,
